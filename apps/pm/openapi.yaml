openapi: 3.0.1
info:
  title: PM Platform API
  description: Requirements + Knowledge Base + LLM-assisted analysis.
  license:
    name: Internal — Kudi Coder Platform
    url: https://kudi.repos
  version: 0.1.0
servers:
- url: http://127.0.0.1:8088/pm-api
  description: Generated server url
security:
- bearerAuth: []
tags:
- name: stories
  description: User stories grouped under a requirement
- name: criteria
  description: Acceptance criteria (Given/When/Then) under a story
- name: projects
  description: PM project lifecycle
- name: requirements
  description: PM requirement lifecycle
- name: llm
  description: LLM-assisted requirement analysis
- name: kb-spaces
  description: Knowledge base space lifecycle
- name: kb-documents
  description: Knowledge-base document lifecycle
- name: tasks
  description: PM task management (Phase D4)
- name: kb-document-versions
  description: Read-only version history + rollback
paths:
  /v1/stories/{storyId}/criteria:
    get:
      tags:
      - criteria
      summary: List criteria for story
      operationId: list
      parameters:
      - name: storyId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AcceptanceCriteria"
    post:
      tags:
      - criteria
      summary: Append acceptance criterion to story
      operationId: create
      parameters:
      - name: storyId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAcceptanceRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AcceptanceCriteria"
  /v1/spaces:
    get:
      tags:
      - kb-spaces
      summary: Paged KB space list
      operationId: list_1
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      - name: projectId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: visibility
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: object
    post:
      tags:
      - kb-spaces
      summary: Create a KB space
      operationId: create_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSpaceRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/KbSpace"
  /v1/spaces/{spaceId}/documents:
    get:
      tags:
      - kb-documents
      summary: List documents in space (?parentId optional)
      operationId: list_2
      parameters:
      - name: spaceId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: parentId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KbDocument"
    post:
      tags:
      - kb-documents
      summary: Create document + seed v1 markdown
      operationId: create_2
      parameters:
      - name: spaceId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDocumentRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/KbDocument"
  /v1/requirements/{requirementId}/stories:
    get:
      tags:
      - stories
      summary: List stories for requirement
      operationId: list_3
      parameters:
      - name: requirementId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserStory"
    post:
      tags:
      - stories
      summary: Append story to requirement
      operationId: create_3
      parameters:
      - name: requirementId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStoryRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserStory"
  /v1/projects:
    get:
      tags:
      - projects
      summary: Paged project list
      operationId: list_4
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      - name: status
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: object
    post:
      tags:
      - projects
      summary: Create a project
      operationId: create_4
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Project"
  /v1/projects/{projectId}/tasks:
    get:
      tags:
      - tasks
      summary: Paged tasks for project
      operationId: list_5
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: priority
        in: query
        required: false
        schema:
          type: string
      - name: assigneeId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: object
    post:
      tags:
      - tasks
      summary: Create task in project
      operationId: create_5
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Task"
  /v1/projects/{projectId}/requirements:
    get:
      tags:
      - requirements
      summary: Paged requirements for project
      operationId: list_6
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: type
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: object
    post:
      tags:
      - requirements
      summary: Create requirement in project
      operationId: create_6
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRequirementRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Requirement"
  /v1/llm/requirements/{id}/refine:
    post:
      tags:
      - llm
      summary: Rewrite a requirement's description for clarity
      operationId: refine
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: provider
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CompletionResponse"
  /v1/llm/requirements/{id}/decompose:
    post:
      tags:
      - llm
      summary: Decompose a requirement into user stories + acceptance criteria
      operationId: decompose
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: provider
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CompletionResponse"
  /v1/documents/{id}/rollback/{n}:
    post:
      tags:
      - kb-document-versions
      summary: "Rollback: copy version n's content as a new latest version"
      operationId: rollback
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: "n"
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: editorId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/KbDocumentVersion"
  /v1/documents/{id}/content:
    post:
      tags:
      - kb-documents
      summary: Update markdown content; appends new version
      operationId: updateContent
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateContentRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: object
  /v1/criteria/{id}/check:
    post:
      tags:
      - criteria
      summary: Toggle checked status
      operationId: check
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AcceptanceCriteria"
  /v1/tasks/{id}:
    get:
      tags:
      - tasks
      summary: Task detail
      operationId: detail
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Task"
    delete:
      tags:
      - tasks
      summary: Soft-delete task
      operationId: delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
    patch:
      tags:
      - tasks
      summary: Patch task fields
      operationId: patch
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Task"
  /v1/stories/{id}:
    get:
      tags:
      - stories
      summary: Story detail
      operationId: detail_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserStory"
    patch:
      tags:
      - stories
      summary: Patch story fields
      operationId: patch_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStoryRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserStory"
  /v1/spaces/{id}:
    get:
      tags:
      - kb-spaces
      summary: KB space detail
      operationId: detail_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/KbSpace"
    delete:
      tags:
      - kb-spaces
      summary: Soft-delete KB space
      operationId: delete_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
    patch:
      tags:
      - kb-spaces
      summary: Patch KB space
      operationId: patch_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSpaceRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/KbSpace"
  /v1/requirements/{id}:
    get:
      tags:
      - requirements
      summary: Requirement detail
      operationId: detail_3
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Requirement"
    delete:
      tags:
      - requirements
      summary: Soft-delete requirement
      operationId: delete_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
    patch:
      tags:
      - requirements
      summary: Patch requirement fields
      operationId: patch_3
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRequirementRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Requirement"
  /v1/projects/{id}:
    get:
      tags:
      - projects
      summary: Project detail
      operationId: detail_4
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      tags:
      - projects
      summary: Archive (soft-delete) project
      operationId: archive
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
    patch:
      tags:
      - projects
      summary: Patch project fields
      operationId: patch_4
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Project"
  /v1/documents/{id}:
    get:
      tags:
      - kb-documents
      summary: Document detail (current version id embedded)
      operationId: detail_5
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/KbDocument"
    delete:
      tags:
      - kb-documents
      summary: Soft-delete document
      operationId: delete_3
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
    patch:
      tags:
      - kb-documents
      summary: Patch document metadata (does not create new version)
      operationId: patchMeta
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDocumentRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/KbDocument"
  /v1/criteria/{id}:
    patch:
      tags:
      - criteria
      summary: Patch criterion fields
      operationId: patch_5
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAcceptanceRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AcceptanceCriteria"
  /v1/llm/providers:
    get:
      tags:
      - llm
      summary: List registered LLM provider names
      operationId: providers
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  type: string
  /v1/health:
    get:
      tags:
      - health-controller
      operationId: liveness
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
  /v1/health/ready:
    get:
      tags:
      - health-controller
      operationId: readiness
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
  /v1/documents/{id}/versions:
    get:
      tags:
      - kb-document-versions
      summary: List all versions (newest first)
      operationId: list_7
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KbDocumentVersion"
  /v1/documents/{id}/versions/{n}:
    get:
      tags:
      - kb-document-versions
      summary: Specific historical version
      operationId: specific
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: "n"
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/KbDocumentVersion"
  /v1/documents/{id}/versions/latest:
    get:
      tags:
      - kb-document-versions
      summary: Latest version (the canonical content)
      operationId: latest
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/KbDocumentVersion"
components:
  schemas:
    CreateAcceptanceRequest:
      type: object
      properties:
        givenText:
          type: string
        whenText:
          type: string
        thenText:
          type: string
        checked:
          type: boolean
        sortOrder:
          type: integer
          format: int32
    AcceptanceCriteria:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userStoryId:
          type: integer
          format: int64
        givenText:
          type: string
        whenText:
          type: string
        thenText:
          type: string
        checked:
          type: boolean
        sortOrder:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateSpaceRequest:
      required:
      - name
      type: object
      properties:
        projectId:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        visibility:
          type: string
    KbSpace:
      type: object
      properties:
        id:
          type: integer
          format: int64
        projectId:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        visibility:
          type: string
        createdBy:
          type: integer
          format: int64
        deletedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateDocumentRequest:
      required:
      - title
      type: object
      properties:
        title:
          type: string
        parentId:
          type: integer
          format: int64
        docType:
          type: string
        markdown:
          type: string
        editorId:
          type: integer
          format: int64
    KbDocument:
      type: object
      properties:
        id:
          type: integer
          format: int64
        spaceId:
          type: integer
          format: int64
        parentId:
          type: integer
          format: int64
        title:
          type: string
        currentVersionId:
          type: integer
          format: int64
        docType:
          type: string
        createdBy:
          type: integer
          format: int64
        updatedBy:
          type: integer
          format: int64
        deletedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateStoryRequest:
      type: object
      properties:
        asA:
          type: string
        iWant:
          type: string
        soThat:
          type: string
        storyPoints:
          type: integer
          format: int32
        status:
          type: string
        sortOrder:
          type: integer
          format: int32
    UserStory:
      type: object
      properties:
        id:
          type: integer
          format: int64
        requirementId:
          type: integer
