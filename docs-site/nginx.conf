# docs-site nginx 配置
# VitePress cleanUrls=true：URL 不带 .html 后缀，需 try_files 兜底 .html 与目录 index.html

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/xml+rss text/javascript application/manifest+json image/svg+xml;

    # cleanUrls 兜底：依次尝试 uri、目录、uri.html、目录/index.html
    location / {
        try_files $uri $uri/ $uri.html $uri/index.html =404;
    }

    # 带哈希的静态资源长期缓存（VitePress 输出 /assets/*.hash.js）
    location ~* ^/assets/.*\.(js|css|woff2?|ttf|eot|png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 不带哈希的静态资源（public/ 下 logo 等）短缓存
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # 安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 自定义 404 页面（VitePress 默认生成 404.html）
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
