[source.crates-io]
replace-with = "coder-mirror"

[source.coder-mirror]
registry = "sparse+https://rsproxy.cn/index/"

# 私有 crate registry - 托管 libs/* 和 sdk/rust/* 发布的 crate
# cargo publish --registry kellnr  发布到此处
# cargo add <crate> --registry kellnr  从此处拉取
[source.kellnr]
registry = "sparse+http://192.168.2.12:16444/api/v1/crates/"

[net]
git-fetch-with-cli = true

# 编译缓存加速 - 要求本机装有 sccache 且在 PATH, 没有的机器删掉本节即可
[build]
# rustc-wrapper = "sccache"  # Docker 构建容器内无 sccache，COPY .cargo 会带进去导致编译挂；宿主机需要时手动启用
