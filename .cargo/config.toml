# crates.io is the default source for public Rust dependencies.
# Private crates are published to kellnr and can be selected explicitly with
# cargo publish --registry kellnr or cargo add/update --registry kellnr.

[registries.kellnr]
index = "sparse+http://192.168.2.12:16444/api/v1/crates/"
protocol = "sparse"

[source.kellnr]
registry = "sparse+http://192.168.2.12:16444/api/v1/crates/"

[net]
git-fetch-with-cli = true

# Compile cache acceleration - requires sccache on PATH.
[build]
# rustc-wrapper = "sccache"  # Enable manually on hosts that have sccache installed.
