# 工具层错误码字典（coder CLI）
#
# 与 contracts/error-codes.yaml 职责分离：
#   - error-codes.yaml  → 业务 API 错误码，进 Rust 侧 digua_common_error
#   - tool-codes.yaml   → 工具链错误码，进 packages/cli/lib/tool-codes.js
#
# 格式：<CATEGORY>_<SUBJECT>，全大写下划线。
# kind 决定退出码，两者是强绑定关系（由测试强制）：
#   Usage   → 2  用法错误（未知命令/未知 flag/缺参数/缺上下文）
#   Guard   → 3  守卫未通过（前置状态不满足 / 校验发现 error 级问题）
#   External→ 4  外部命令失败（cargo / docker / mvn 非零退出）
#   Failure → 1  未分类失败
#
# message 是给 agent 看的稳定文案（英文，与业务码一致）。

version: "1.0.0"

codes:
  # === 用法错误 (exit 2) ===
  UNKNOWN_COMMAND:
    message: "unknown command"
    kind: Usage
    exit: 2
  UNKNOWN_FLAG:
    message: "unknown flag"
    kind: Usage
    exit: 2
  MISSING_FLAG_VALUE:
    message: "flag requires a value"
    kind: Usage
    exit: 2
  MISSING_POSITIONAL:
    message: "missing required argument"
    kind: Usage
    exit: 2
  TOO_MANY_POSITIONAL:
    message: "too many arguments"
    kind: Usage
    exit: 2
  NO_REPO_CONTEXT:
    message: "command requires a repo context (--cwd)"
    kind: Usage
    exit: 2
  MAVEN_CREDENTIALS_PARTIAL:
    message: "maven credentials partially configured"
    kind: Usage
    exit: 2
  MAVEN_PROFILE_INVALID:
    message: "invalid maven profile"
    kind: Usage
    exit: 2
  MAVEN_VERSION_NOT_SNAPSHOT:
    message: "version is not a snapshot version"
    kind: Usage
    exit: 2
  MAVEN_VERSION_REQUIRED:
    message: "maven version is required"
    kind: Usage
    exit: 2
  MAVEN_VERSION_SNAPSHOT:
    message: "snapshot version requires the snapshot kind"
    kind: Usage
    exit: 2
  RUST_VERSION_REQUIRED:
    message: "rust publish version is required"
    kind: Usage
    exit: 2
  NPM_VERSION_REQUIRED:
    message: "npm publish version is required"
    kind: Usage
    exit: 2

  # === 守卫未通过 (exit 3) ===
  DIRTY_WORKTREE:
    message: "worktree is not clean"
    kind: Guard
    exit: 3
  VERSION_DRIFT:
    message: "version ledger drifted"
    kind: Guard
    exit: 3
  NO_BASELINE:
    message: "no version baseline found"
    kind: Guard
    exit: 3
  TAG_EXISTS:
    message: "tag already exists"
    kind: Guard
    exit: 3
  ASSET_MISSING:
    message: "required asset is missing"
    kind: Guard
    exit: 3
  ASSET_SHA_MISMATCH:
    message: "asset checksum mismatch"
    kind: Guard
    exit: 3
  CRATE_FIELD_MISSING:
    message: "crate metadata field is missing"
    kind: Guard
    exit: 3
  CRATE_ORDER_VIOLATION:
    message: "publish order violates crate dependency direction"
    kind: Guard
    exit: 3
  CRATE_TOML_MISSING:
    message: "crate Cargo.toml is missing"
    kind: Guard
    exit: 3
  CRATE_VERSION_MISMATCH:
    message: "crate version mismatch"
    kind: Guard
    exit: 3
  CRATE_VERSION_MISSING:
    message: "crate version cannot be resolved"
    kind: Guard
    exit: 3
  SERVICE_MANIFEST_MISSING:
    message: "a service Cargo.toml is missing"
    kind: Guard
    exit: 3
  VERSION_SPLIT:
    message: "service versions do not agree; release refused"
    kind: Guard
    exit: 3
  MAVEN_BINARY_MISSING:
    message: "maven binary not found"
    kind: Guard
    exit: 3
  MAVEN_CREDENTIALS_MISSING:
    message: "maven credentials are missing"
    kind: Guard
    exit: 3
  MAVEN_NO_ARTIFACTS:
    message: "no maven artifacts to publish"
    kind: Guard
    exit: 3
  MAVEN_POM_MALFORMED:
    message: "maven pom is malformed"
    kind: Guard
    exit: 3
  MAVEN_POM_MISSING:
    message: "maven pom is missing"
    kind: Guard
    exit: 3
  NPM_BUILD_FAILED:
    message: "npm package build failed"
    kind: Guard
    exit: 3
  NPM_PACKAGES_CHECK_FAILED:
    message: "npm packages pre-publish check failed"
    kind: Guard
    exit: 3
  NPM_PUBLISH_FAILED:
    message: "npm publish failed"
    kind: Guard
    exit: 3
  NPM_VERSION_FAILED:
    message: "npm version bump failed"
    kind: Guard
    exit: 3
  RUST_CARGO_MISSING:
    message: "cargo binary not found"
    kind: Guard
    exit: 3

  # === 外部命令失败 (exit 4) ===
  EXTERNAL_COMMAND_FAILED:
    message: "external command failed"
    kind: External
    exit: 4

  # === 未分类失败 (exit 1) ===
  UNEXPECTED:
    message: "unexpected failure"
    kind: Failure
    exit: 1
