# 领域事件名（预留）
# 格式：<SERVICE>_<ENTITY>_<EVENT>
# 用于后续事件驱动架构 / 消息队列集成

version: "1.0.0"
events:
  # === 用户事件 ===
  IAM_USER_CREATED:
    description: "用户创建"
  IAM_USER_UPDATED:
    description: "用户更新"
  IAM_USER_DELETED:
    description: "用户删除"
  IAM_USER_LOGIN:
    description: "用户登录"
  IAM_USER_LOGOUT:
    description: "用户登出"

  # === 角色事件 ===
  IAM_ROLE_CREATED:
    description: "角色创建"
  IAM_ROLE_UPDATED:
    description: "角色更新"
  IAM_ROLE_DELETED:
    description: "角色删除"

  # === 配置事件 ===
  CFG_CONFIG_CHANGED:
    description: "配置变更"