# 领域事件 schema 定义
# 由 contracts/codegen/gen-rust-events.js 编译为 Rust struct + routing-key 常量
# 由 services 在业务事务中通过 OutboxRepo::enqueue 写入 iam_<svc>_outbox_events
# routing-key 格式：<service>.<resource>.<action>  （小写，下划线转点）

version: "1.0.0"

# 默认 schema_version，新事件可覆盖
default_schema_version: 1

events:
  # === 用户事件（iam-service 产出） ===
  iam.user.created:
    schema_version: 1
    description: "用户创建"
    payload:
      user_id:     { type: string,  required: true }
      username:    { type: string,  required: true }
      email:       { type: string,  required: false }
      org_unit_id: { type: string,  required: false }

  iam.user.deleted:
    schema_version: 1
    description: "用户删除（软删或硬删）"
    payload:
      user_id:    { type: string, required: true }
      deleted_by: { type: string, required: true }   # 操作者 user_id

  iam.login.succeeded:
    schema_version: 1
    description: "登录成功"
    payload:
      user_id:    { type: string, required: true }
      ip:         { type: string, required: true }
      user_agent: { type: string, required: false }
      method:     { type: string, required: true }   # password | sso | refresh

  iam.login.failed:
    schema_version: 1
    description: "登录失败"
    payload:
      username:   { type: string, required: true }
      user_id:    { type: string, required: false }
      ip:         { type: string, required: true }
      user_agent: { type: string, required: false }
      reason:     { type: string, required: true }   # bad_password | user_disabled | password_expired | user_not_found

  notification.announcement.published:
    schema_version: 1
    description: "公告已发布（触发 WS 推送扇出）"
    payload:
      announcement_id: { type: int,    required: true }
      title:           { type: string, required: true }
      pinned:          { type: bool,   required: true }
      popover:         { type: bool,   required: true }
      user_ids:        { type: json,   required: true }   # Vec<String>