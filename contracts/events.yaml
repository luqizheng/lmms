# 领域事件 schema 定义
# 由 contracts/codegen/gen-rust-events.js 编译为 Rust struct + routing-key 常量
# 由 services 在业务事务中通过 OutboxRepo::enqueue 写入 iam_<svc>_outbox_events
# routing-key 格式：<service>.<resource>.<action>  （小写，下划线转点）

version: "1.0.0"

# 默认 schema_version，新事件可覆盖
default_schema_version: 1

events:
  # === 用户事件（iam-service 产出） ===
  iam.user.created:
    schema_version: 1
    description: "用户创建"
    payload:
      user_id:     { type: string,  required: true }
      username:    { type: string,  required: true }
      email:       { type: string,  required: false }
      org_unit_id: { type: string,  required: false }

  iam.user.deleted:
    schema_version: 1
    description: "用户删除（软删或硬删）"
    payload:
      user_id:    { type: string, required: true }
      deleted_by: { type: string, required: true }   # 操作者 user_id

  # Phase 5B-fu3: membership 事件（替代 notification → iam 同步 HTTP）
  iam.user.role.assigned:
    schema_version: 1
    description: "用户被授予角色（覆盖：创建用户 role seed、assign_user_roles、tenant admin seed、role 重启用 iam_user_roles 重建）"
    payload:
      user_id:   { type: string, required: true }
      role_id:   { type: string, required: true }
      tenant_id: { type: int,    required: true }
      actor_id:  { type: string, required: false }
      ts:        { type: int,    required: true }   # Unix 秒，server-side（用于 out-of-order 兜底）

  iam.user.role.unassigned:
    schema_version: 1
    description: "用户被撤销角色（覆盖：assign_user_roles 替换、role 禁删 cascades DELETE、tenant 注销）"
    payload:
      user_id:   { type: string, required: true }
      role_id:   { type: string, required: true }
      tenant_id: { type: int,    required: true }
      actor_id:  { type: string, required: false }
      ts:        { type: int,    required: true }

  iam.user.dept.changed:
    schema_version: 1
    description: "用户所属组织单元变更（PUT /iam/org-units/:id 或 create user 改 org_unit_id）"
    payload:
      user_id:   { type: string, required: true }
      dept_id:   { type: string, required: false }   # null = 移除
      tenant_id: { type: int,    required: true }
      actor_id:  { type: string, required: false }
      ts:        { type: int,    required: true }

  iam.login.succeeded:
    schema_version: 1
    description: "登录成功"
    payload:
      user_id:    { type: string, required: true }
      ip:         { type: string, required: true }
      user_agent: { type: string, required: false }
      method:     { type: string, required: true }   # password | sso | refresh

  iam.login.failed:
    schema_version: 1
    description: "登录失败"
    payload:
      username:   { type: string, required: true }
      user_id:    { type: string, required: false }
      ip:         { type: string, required: true }
      user_agent: { type: string, required: false }
      reason:     { type: string, required: true }   # bad_password | user_disabled | password_expired | user_not_found

  notification.announcement.published:
    schema_version: 1
    description: "公告已发布（触发 WS 推送扇出）"
    payload:
      announcement_id: { type: int,    required: true }
      title:           { type: string, required: true }
      pinned:          { type: bool,   required: true }
      popover:         { type: bool,   required: true }
      user_ids:        { type: json,   required: true }   # Vec<String>

  iam.permission.changed:
    schema_version: 1
    description: "用户有效权限变更（角色授权/角色禁删/权限禁删）→ 触发令牌失效"
    payload:
      user_ids: { type: json,   required: true }
      reason:   { type: string, required: true }
      actor_id: { type: string, required: false }

  iam.tenant.created:
    schema_version: 1
    description: "租户创建（自助注册）"
    payload:
      tenant_id:     { type: string, required: true }
      slug:          { type: string, required: true }
      display_name:  { type: string, required: true }
      admin_user_id: { type: string, required: true }

  # === 文件事件（file-service 产出，2026-07-01 补） ===
  # 注：iam.user.roles_assigned 不新增 — 该场景沿用
  # iam.permission.changed（services/iam-service/src/service/perm_change.rs:21，
  # assign_permissions / assign_user_roles 共用同一事件）。
  file.uploaded:
    schema_version: 1
    description: "文件上传完成"
    payload:
      file_id:           { type: string, required: true }
      filename:          { type: string, required: true }
      content_type:      { type: string, required: false }
      size:              { type: int,    required: true }
      uploader_user_id:  { type: string, required: true }

  file.deleted:
    schema_version: 1
    description: "文件删除"
    payload:
      file_id:        { type: string, required: true }
      deleted_by:     { type: string, required: true }

  # === 配置事件（config-service 产出，2026-07-01 补） ===
  config.item.changed:
    schema_version: 1
    description: "配置项变更（创建/更新/删除），下游 SSE 订阅"
    payload:
      namespace_id:  { type: string, required: true }
      item_id:       { type: string, required: true }
      key:           { type: string, required: true }
      action:        { type: string, required: true }   # created | updated | deleted
      actor_id:      { type: string, required: false }

  # === 项目管理事件（project-service 产出，Phase 9） ===
  # routing-key 命名空间 `pmd.`；audit-service `audit.pmd-events` 队列订阅 `pmd.#`
  pmd.project.created:
    schema_version: 1
    description: "项目创建"
    payload:
      tenant_id:    { type: int,    required: true }
      project_id:   { type: string, required: true }
      code:         { type: string, required: true }
      name:         { type: string, required: true }
      owner_id:     { type: string, required: true }
      actor_id:     { type: string, required: false }
      ts:           { type: int,    required: true }

  pmd.project.archived:
    schema_version: 1
    description: "项目归档（软删，status='archived'）"
    payload:
      tenant_id:   { type: int,    required: true }
      project_id:  { type: string, required: true }
      actor_id:    { type: string, required: true }
      ts:          { type: int,    required: true }

  pmd.task.status_changed:
    schema_version: 1
    description: "任务状态机转移（由 tryTransition 校验合法后写入）"
    payload:
      tenant_id:   { type: int,    required: true }
      project_id:  { type: string, required: true }
      task_id:     { type: string, required: true }
      from_status: { type: string, required: true }
      to_status:   { type: string, required: true }
      actor_id:    { type: string, required: false }
      ts:          { type: int,    required: true }

  pmd.llm.refinement.requested:
    schema_version: 1
    description: "调用 LLM 细化需求（占位 provider 由 project-service 触发）"
    payload:
      tenant_id:        { type: int,    required: true }
      project_id:       { type: string, required: false }
      task_id:          { type: string, required: false }
      caller_user_id:   { type: string, required: true }
      provider:         { type: string, required: true }   # placeholder | http (TODO)
      prompt_summary:   { type: string, required: true }   # ≤120 字符
      ts:               { type: int,    required: true }

  pmd.llm.refinement.completed:
    schema_version: 1
    description: "LLM 细化完成（provider 响应后异步发；MVP 由 placeholder 返回固定响应同事务写）"
    payload:
      tenant_id:        { type: int,    required: true }
      project_id:       { type: string, required: false }
      task_id:          { type: string, required: false }
      caller_user_id:   { type: string, required: true }
      provider:         { type: string, required: true }
      items_count:      { type: int,    required: true }
      ts:               { type: int,    required: true }