# 全局错误码字典
# 格式：<SERVICE>_<CATEGORY>_<NUMBER>
# 服务前缀：IAM / CFG / AUD / NTF / FILE / GW / SYS
# 类别：AUTH / VALID / DB / EXT / INTERNAL

version: "1.0.0"
codes:
  # === 系统级 ===
  SYS_INTERNAL_0001:
    message: "internal server error"
    kind: Internal
  SYS_DB_0001:
    message: "database error"
    kind: Internal
  SYS_DB_0002:
    message: "row not found"
    kind: NotFound
  SYS_HTTP_0001:
    message: "http client error"
    kind: External

  # === 认证 ===
  IAM_AUTH_1001:
    message: "invalid credentials"
    kind: Unauthorized
  IAM_AUTH_1002:
    message: "token expired"
    kind: Unauthorized
  IAM_AUTH_1003:
    message: "token revoked"
    kind: Unauthorized
  IAM_AUTH_1004:
    message: "invalid token"
    kind: Unauthorized
  IAM_AUTH_1005:
    message: "missing token"
    kind: Unauthorized
  IAM_AUTH_1006:
    message: "password too weak"
    kind: BadRequest
  IAM_AUTH_1007:
    message: "username already exists"
    kind: Conflict
  IAM_AUTH_1008:
    message: "email already exists"
    kind: Conflict

  # === 校验 ===
  VALID_2001:
    message: "invalid input"
    kind: BadRequest
  VALID_2002:
    message: "missing required field"
    kind: BadRequest
  VALID_2003:
    message: "invalid phone format"
    kind: BadRequest
  VALID_2004:
    message: "invalid email format"
    kind: BadRequest

  # === 权限 ===
  IAM_PERM_3001:
    message: "permission denied"
    kind: Forbidden
  IAM_PERM_3002:
    message: "role not found"
    kind: NotFound

  # === 配置 ===
  CFG_ITEM_1001:
    message: "config item not found"
    kind: NotFound
  CFG_NS_2001:
    message: "namespace not found"
    kind: NotFound
  CFG_VALID_3001:
    message: "validation failed"
    kind: BadRequest
  CFG_VALID_4001:
    message: "config key not found"
    kind: NotFound
  CFG_VALID_4002:
    message: "config parse error"
    kind: Internal

  # === 网关 ===
  GW_ROUTE_5001:
    message: "route not found"
    kind: NotFound
  GW_ROUTE_5002:
    message: "service unavailable"
    kind: External
  GW_RATE_5003:
    message: "rate limit exceeded"
    kind: TooManyRequests

  # === 审计日志 ===
  AUD_LOG_6001:
    message: "audit log not found"
    kind: NotFound
  AUD_LOG_6002:
    message: "export format not supported"
    kind: BadRequest
  AUD_LOG_6003:
    message: "export generation failed"
    kind: Internal

  # === 文件服务 ===
  FILE_ITEM_1001:
    message: "file not found"
    kind: NotFound
  FILE_UPLOAD_2001:
    message: "file upload failed"
    kind: Internal
  FILE_UPLOAD_2002:
    message: "file too large"
    kind: BadRequest
  FILE_PRESIGN_3001:
    message: "presign url expired"
    kind: Unauthorized
  FILE_READ_4001:
    message: "file read failed"
    kind: Internal
  FILE_DELETE_4002:
    message: "file delete failed"
    kind: Internal

  # === 项目管理服务（project-service, Phase 9） ===
  # 类别 1xxx = NotFound / 3xxx = Conflict / 4xxx = Validation / 5xxx = Forbidden
  PMD_PROJECT_1001:
    message: "project not found"
    kind: NotFound
  PMD_MILESTONE_1002:
    message: "milestone not found"
    kind: NotFound
  PMD_TASK_1003:
    message: "task not found"
    kind: NotFound
  PMD_PROJECT_3001:
    message: "project code already exists"
    kind: Conflict
  PMD_TASK_4001:
    message: "invalid task state transition"
    kind: BadRequest
  PMD_LLM_REFINE_5001:
    message: "refine forbidden for caller"
    kind: Forbidden