# 权限码字典
# 格式：<SERVICE>_<RESOURCE>_<ACTION>
# 命名规则：大写，下划线分隔，动作后缀 CREATE / READ / UPDATE / DELETE / EXPORT / IMPORT

version: "1.0.0"
permissions:
  # === 用户管理 ===
  IAM_USER_CREATE:
    description: "创建用户"
  IAM_USER_READ:
    description: "查看用户"
  IAM_USER_UPDATE:
    description: "编辑用户"
  IAM_USER_DELETE:
    description: "删除用户"
  IAM_USER_EXPORT:
    description: "导出用户"
  IAM_USER_IMPORT:
    description: "导入用户"

  # === 角色管理 ===
  IAM_ROLE_CREATE:
    description: "创建角色"
  IAM_ROLE_READ:
    description: "查看角色"
  IAM_ROLE_UPDATE:
    description: "编辑角色"
  IAM_ROLE_DELETE:
    description: "删除角色"

  # === 权限管理 ===
  IAM_PERM_READ:
    description: "查看权限"
  IAM_PERM_ASSIGN:
    description: "分配权限"

  # === 菜单管理 ===
  IAM_MENU_CREATE:
    description: "创建菜单"
  IAM_MENU_READ:
    description: "查看菜单"
  IAM_MENU_UPDATE:
    description: "编辑菜单"
  IAM_MENU_DELETE:
    description: "删除菜单"

  # === 部门管理 ===
  IAM_ORG_CREATE:
    description: "创建部门"
  IAM_ORG_READ:
    description: "查看部门"
  IAM_ORG_UPDATE:
    description: "编辑部门"
  IAM_ORG_DELETE:
    description: "删除部门"

  # === 租户管理 ===
  IAM_TENANT_CREATE:
    description: "注册租户"

  # === 配置管理 ===
  CFG_CONFIG_CREATE:
    description: "创建配置项"
  CFG_CONFIG_READ:
    description: "查看配置项"
  CFG_CONFIG_UPDATE:
    description: "编辑配置项"
  CFG_CONFIG_DELETE:
    description: "删除配置项"
  CFG_CONFIG_REVEAL:
    description: "查看敏感配置项明文"

  # === 配置管理 - 命名空间 ===
  CFG_NAMESPACE_CREATE:
    description: "创建配置命名空间"
  CFG_NAMESPACE_READ:
    description: "查看配置命名空间"
  CFG_NAMESPACE_UPDATE:
    description: "编辑配置命名空间"
  CFG_NAMESPACE_DELETE:
    description: "删除配置命名空间"

  # === 配置管理 - 导入导出 ===
  CFG_NAMESPACE_EXPORT:
    description: "导出命名空间配置"
  CFG_NAMESPACE_IMPORT:
    description: "导入命名空间配置"

  # === 审计日志 ===
  AUD_LOG_READ:
    description: "查看审计日志"
  AUD_LOG_EXPORT:
    description: "导出审计日志"

  # === 通知管理 ===
  NTF_TEMPLATE_CREATE:
    description: "创建通知模板"
  NTF_TEMPLATE_READ:
    description: "查看通知模板"
  NTF_TEMPLATE_UPDATE:
    description: "编辑通知模板"
  NTF_TEMPLATE_DELETE:
    description: "删除通知模板"
  NTF_MESSAGE_READ:
    description: "查看站内信"

  # === 文件管理 ===
  FILE_UPLOAD:
    description: "上传文件"
  FILE_DOWNLOAD:
    description: "下载文件"
  FILE_DELETE:
    description: "删除文件"
  FILE_READ:
    description: "查看文件列表与详情"

  # === 系统管理 ===
  SYS_SETTING_READ:
    description: "查看系统设置"
  SYS_SETTING_UPDATE:
    description: "编辑系统设置"

  # === 服务间凭据管理（bootstrap token / service-jwt）===
  TOKEN_BOOTSTRAP_READ:
    description: "查看 bootstrap token 元数据（不含明文）"
  TOKEN_BOOTSTRAP_CREATE:
    description: "创建 bootstrap token"
  TOKEN_BOOTSTRAP_UPDATE:
    description: "轮换 / 启停 bootstrap token"
  TOKEN_BOOTSTRAP_DELETE:
    description: "删除 bootstrap token"
  TOKEN_SERVICE_JWT_GRANT_READ:
    description: "查看 Service JWT audience 授权关系"
  TOKEN_SERVICE_JWT_GRANT_CREATE:
    description: "创建 Service JWT audience 授权关系"
  TOKEN_SERVICE_JWT_GRANT_UPDATE:
    description: "启用 / 禁用 Service JWT audience 授权关系"
  TOKEN_SERVICE_JWT_GRANT_DELETE:
    description: "删除 Service JWT audience 授权关系"

  # === 项目管理 ===
  PM_PROJECT_CREATE:
    description: "创建项目"
  PM_PROJECT_READ:
    description: "查看项目"
  PM_PROJECT_UPDATE:
    description: "编辑项目"
  PM_PROJECT_DELETE:
    description: "归档项目（软删）"
  # === 里程碑 ===
  PM_MILESTONE_CREATE:
    description: "创建里程碑"
  PM_MILESTONE_READ:
    description: "查看里程碑"
  PM_MILESTONE_UPDATE:
    description: "编辑里程碑"
  PM_MILESTONE_DELETE:
    description: "删除里程碑"
  # === 任务状态机转移 ===
  PM_TASK_UPDATE:
    description: "编辑任务（含状态机转移）"
  # === LLM 辅助 ===
  PM_LLM_ASSIST:
    description: "调用 LLM 细化需求（占位 provider）"

  # === MCP（AI coding 工具接入，spec 2026-10-28-pm-mcp-coding-agent-integration §5.5）===
  PM_MCP_READ:
    description: "通过 MCP 读取任务/需求/文档"
  PM_MCP_DOCUMENT_WRITE:
    description: "通过 MCP 推送文档并建立任务/需求关联"
  PM_MCP_TASK_UPDATE:
    description: "通过 MCP 更新任务状态与工作日志"
