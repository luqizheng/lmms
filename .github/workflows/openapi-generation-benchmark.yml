name: OpenAPI Generation Benchmark

on:
  push:
    branches: [fix/rust-ci-main-blockers]
    paths:
      - '.github/workflows/openapi-generation-benchmark.yml'
      - 'scripts/dump-openapi-specs.js'
      - 'services/*/Cargo.toml'
      - 'services/*/src/bin/dump-openapi.rs'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/openapi-generation-benchmark.yml'
      - 'scripts/dump-openapi-specs.js'
      - 'services/*/Cargo.toml'
      - 'services/*/src/bin/dump-openapi.rs'

permissions:
  contents: read

jobs:
  benchmark:
    name: Compare sequential cargo run with batched cargo build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Benchmark sequential cargo run (clean target)
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/openapi-sequential-target"
          services=(
            'api-gateway:dump_openapi_api_gateway'
            'token-service:dump_openapi_token_service'
            'iam-service:dump_openapi_iam_service'
            'notification-service:dump_openapi_notification_service'
            'audit-service:dump_openapi_audit_service'
            'file-service:dump_openapi_file_service'
            'prue_backend:dump_openapi_prue_backend'
          )
          start=$(date +%s%N)
          for item in "${services[@]}"; do
            dir="${item%%:*}"
            bin="${item##*:}"
            echo "::group::Sequential ${dir}"
            (cd "services/${dir}" && cargo run --locked --manifest-path Cargo.toml --bin "${bin}")
            echo "::endgroup::"
          done
          end=$(date +%s%N)
          elapsed_ms=$(( (end - start) / 1000000 ))
          echo "SEQUENTIAL_OPENAPI_MS=${elapsed_ms}" | tee -a "$GITHUB_ENV"
          echo "Sequential cargo run total: ${elapsed_ms} ms"

      - name: Benchmark batched generator (clean target)
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/openapi-batched-target"
          start=$(date +%s%N)
          node scripts/dump-openapi-specs.js
          end=$(date +%s%N)
          elapsed_ms=$(( (end - start) / 1000000 ))
          echo "BATCHED_OPENAPI_MS=${elapsed_ms}" | tee -a "$GITHUB_ENV"
          echo "Batched cargo build total: ${elapsed_ms} ms"

      - name: Compare results
        shell: bash
        run: |
          echo "Sequential cargo run: ${SEQUENTIAL_OPENAPI_MS} ms"
          echo "Batched cargo build:  ${BATCHED_OPENAPI_MS} ms"
          git diff --exit-code -- 'services/*/openapi.yaml'
