name: Public Release

on:
  pull_request:
    branches: [main]
  # ⚠️ 无 push.tags 触发：内部发布不走 CI —— 在发布机上直接执行
  #   `pnpm run release:sdk:rust / release:sdk:npm / release:images:push`
  #   （目标由 release.toml 指向内部 Registry）。本 workflow 仅保留
  #   workflow_dispatch 手动补发入口，供未来明确的公开发布流程使用；
  #   推送 git tag 不会触发任何自动发布。
  # 手动补发：对已经存在的 tag 指定执行发布（不新建、不移动 tag）。
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish (vMAJOR.MINOR.PATCH)'
        required: true
        type: string
      expected_sha:
        description: 'Expected full commit SHA for the immutable release tag'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('public-release-pr-{0}', github.event.pull_request.number) || 'public-release-tags' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate release candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}
      - name: Resolve target release tag
        id: target
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid release tag: $TAG"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Verify tag points to main history
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.target.outputs.tag }}"
          # 手动补发时本地可能还没有该 tag，显式取一次；不存在则直接失败
          git fetch origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          git fetch origin main
          COMMIT="$(git rev-parse "${TAG}^{commit}")"
          EXPECTED_SHA="${{ inputs.expected_sha }}"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "expected_sha must be a full 40-character SHA"; exit 1; }
          [[ "$COMMIT" == "$EXPECTED_SHA" ]] || { echo "tag SHA mismatch: expected $EXPECTED_SHA, got $COMMIT"; exit 1; }
          git merge-base --is-ancestor "$COMMIT" origin/main
          echo "tag ${TAG} (${COMMIT}) belongs to main history"
      - name: Prepare immutable tag source with current public-release tooling
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          RELEASE_DIR="$RUNNER_TEMP/lmms-release-src"
          git worktree add --detach "$RELEASE_DIR" "$RELEASE_TAG"
          # Public release must resolve against crates.io, not the developer mirror configured in .cargo.
          rm -f "$RELEASE_DIR/.cargo/config.toml"
          mkdir -p "$RELEASE_DIR/packages/cli/commands" "$RELEASE_DIR/packages/cli/lib" "$RELEASE_DIR/scripts"
          cp packages/cli/commands/release.js "$RELEASE_DIR/packages/cli/commands/release.js"
          cp packages/cli/lib/sdk-publish.js "$RELEASE_DIR/packages/cli/lib/sdk-publish.js"
          cp scripts/verify-public-release.js "$RELEASE_DIR/scripts/verify-public-release.js"
      - name: Ensure Cargo uses the public crates.io source
        shell: bash
        working-directory: ${{ github.event_name == 'workflow_dispatch' && format('{0}/lmms-release-src', runner.temp) || github.workspace }}
        run: rm -f .cargo/config.toml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Node dependencies
        working-directory: ${{ github.event_name == 'workflow_dispatch' && format('{0}/lmms-release-src', runner.temp) || github.workspace }}
        run: pnpm install --frozen-lockfile
      - name: Rust formatting
        working-directory: ${{ github.event_name == 'workflow_dispatch' && format('{0}/lmms-release-src', runner.temp) || github.workspace }}
        run: cargo fmt --check --all
      - name: Rust Clippy
        working-directory: ${{ github.event_name == 'workflow_dispatch' && format('{0}/lmms-release-src', runner.temp) || github.workspace }}
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust workspace library tests
        working-directory: ${{ github.event_name == 'workflow_dispatch' && format('{0}/lmms-release-src', runner.temp) || github.workspace }}
        run: cargo test --workspace --lib
      - name: Repository gates
        working-directory: ${{ github.event_name == 'workflow_dispatch' && format('{0}/lmms-release-src', runner.temp) || github.workspace }}
        run: |
          node scripts/check-service-standard.js
          node scripts/check-spec.js
          node scripts/contracts-gen.js --check
          node scripts/check-db-naming.js
          node scripts/check-pg-migrations.js
          node scripts/check-tenant-scope.js
          node scripts/dump-openapi-specs.js
          git diff --exit-code -- 'services/*/openapi.yaml'
      - name: CLI tests
        working-directory: ${{ github.event_name == 'workflow_dispatch' && format('{0}/lmms-release-src', runner.temp) || github.workspace }}
        run: pnpm run test:cli
      - name: Build public npm packages
        working-directory: ${{ github.event_name == 'workflow_dispatch' && format('{0}/lmms-release-src', runner.temp) || github.workspace }}
        run: pnpm run packages:build
      - name: Validate release plans without publishing
        working-directory: ${{ github.event_name == 'workflow_dispatch' && format('{0}/lmms-release-src', runner.temp) || github.workspace }}
        run: |
          node packages/cli/bin/coder.js release sdk rust --dry-run --registry crates-io
          node packages/cli/bin/coder.js release sdk npm --dry-run --registry https://registry.npmjs.org/
          node packages/cli/bin/coder.js release images --dry-run --registry docker.io --repo validation-only

  publish-crates:
    if: github.event_name != 'pull_request'
    name: Publish Rust crates to crates.io
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}
      - name: Prepare immutable tag source with current public-release tooling
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git fetch origin "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          RELEASE_DIR="$RUNNER_TEMP/lmms-release-src"
          git worktree add --detach "$RELEASE_DIR" "$RELEASE_TAG"
          # Public release must resolve against crates.io, not the developer mirror configured in .cargo.
          rm -f "$RELEASE_DIR/.cargo/config.toml"
          mkdir -p "$RELEASE_DIR/packages/cli/commands" "$RELEASE_DIR/packages/cli/lib" "$RELEASE_DIR/scripts"
          cp packages/cli/commands/release.js "$RELEASE_DIR/packages/cli/commands/release.js"
          cp packages/cli/lib/sdk-publish.js "$RELEASE_DIR/packages/cli/lib/sdk-publish.js"
          cp scripts/verify-public-release.js "$RELEASE_DIR/scripts/verify-public-release.js"
          echo "RELEASE_DIR=$RELEASE_DIR" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Node dependencies
        working-directory: ${{ runner.temp }}/lmms-release-src
        run: pnpm install --frozen-lockfile
      - name: Publish crates and Rust SDKs
        env:
          CARGO_REGISTRIES_CRATES_IO_TOKEN: ${{ secrets.CRATES }}
        working-directory: ${{ runner.temp }}/lmms-release-src
        run: |
          node packages/cli/bin/coder.js release sdk rust --registry crates-io
          node scripts/verify-public-release.js rust

  publish-npm:
    if: github.event_name != 'pull_request'
    name: Publish TypeScript SDKs to npmjs.org
    needs: publish-crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}
      - name: Prepare immutable tag source with current public-release tooling
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git fetch origin "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          RELEASE_DIR="$RUNNER_TEMP/lmms-release-src"
          git worktree add --detach "$RELEASE_DIR" "$RELEASE_TAG"
          # Public release must resolve against crates.io, not the developer mirror configured in .cargo.
          rm -f "$RELEASE_DIR/.cargo/config.toml"
          mkdir -p "$RELEASE_DIR/packages/cli/commands" "$RELEASE_DIR/packages/cli/lib" "$RELEASE_DIR/scripts"
          cp packages/cli/commands/release.js "$RELEASE_DIR/packages/cli/commands/release.js"
          cp packages/cli/lib/sdk-publish.js "$RELEASE_DIR/packages/cli/lib/sdk-publish.js"
          cp scripts/verify-public-release.js "$RELEASE_DIR/scripts/verify-public-release.js"
          echo "RELEASE_DIR=$RELEASE_DIR" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install dependencies
        working-directory: ${{ runner.temp }}/lmms-release-src
        run: pnpm install --frozen-lockfile
      - name: Publish npm packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMPUBLISHKEY }}
        working-directory: ${{ runner.temp }}/lmms-release-src
        run: |
          node packages/cli/bin/coder.js release sdk npm --registry https://registry.npmjs.org/
          node scripts/verify-public-release.js npm

  publish-docker:
    if: github.event_name != 'pull_request'
    name: Publish service images to Docker Hub
    needs: publish-npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}
      - name: Prepare immutable tag source with current public-release tooling
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git fetch origin "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          RELEASE_DIR="$RUNNER_TEMP/lmms-release-src"
          git worktree add --detach "$RELEASE_DIR" "$RELEASE_TAG"
          # Public release must resolve against crates.io, not the developer mirror configured in .cargo.
          rm -f "$RELEASE_DIR/.cargo/config.toml"
          mkdir -p "$RELEASE_DIR/packages/cli/commands" "$RELEASE_DIR/packages/cli/lib" "$RELEASE_DIR/scripts"
          cp packages/cli/commands/release.js "$RELEASE_DIR/packages/cli/commands/release.js"
          cp packages/cli/lib/sdk-publish.js "$RELEASE_DIR/packages/cli/lib/sdk-publish.js"
          cp scripts/verify-public-release.js "$RELEASE_DIR/scripts/verify-public-release.js"
          echo "RELEASE_DIR=$RELEASE_DIR" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Node dependencies
        working-directory: ${{ runner.temp }}/lmms-release-src
        run: pnpm install --frozen-lockfile
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER_NAME }}
          password: ${{ secrets.DOCKER_KEY }}
      - name: Publish versioned service images
        env:
          DOCKER_USER_NAME: ${{ secrets.DOCKER_USER_NAME }}
        working-directory: ${{ runner.temp }}/lmms-release-src
        run: |
          test -n "$DOCKER_USER_NAME"
          node scripts/verify-public-release.js docker-preflight
          node packages/cli/bin/coder.js release images --push --registry docker.io --repo "$DOCKER_USER_NAME"
          node scripts/verify-public-release.js docker
      - name: Upload generated image pins
        uses: actions/upload-artifact@v4
        with:
          name: docker-hub-image-pins-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          path: |
            ${{ runner.temp }}/lmms-release-src/examples/docker-deploy/.image.env
            ${{ runner.temp }}/lmms-release-src/examples/docker-deploy-full/.image.env
