name: Release Preflight

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tagged release candidate (no publishing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - name: Validate release tag and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Invalid release tag: $TAG (expected vMAJOR.MINOR.PATCH)"
            exit 1
          }
          git fetch origin main --no-tags
          TAG_COMMIT="$(git rev-parse "${TAG}^{commit}")"
          git merge-base --is-ancestor "$TAG_COMMIT" origin/main
          echo "Validated $TAG at $TAG_COMMIT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Rust formatting
        run: cargo fmt --check --all
      - name: Rust Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust workspace library tests
        run: cargo test --workspace --lib
      - name: Repository gates
        run: |
          node scripts/check-service-standard.js
          node scripts/check-spec.js
          node scripts/contracts-gen.js --check
          node scripts/check-db-naming.js
          node scripts/check-pg-migrations.js
          node scripts/check-tenant-scope.js
          node scripts/dump-openapi-specs.js
          git diff --exit-code -- 'services/*/openapi.yaml'
      - name: CLI tests
        run: pnpm run test:cli
      - name: Build public npm packages
        run: pnpm run packages:build
      - name: Validate internal and public release plans (dry-run only)
        run: |
          node packages/cli/bin/coder.js release sdk rust --dry-run
          node packages/cli/bin/coder.js release sdk npm --dry-run
          node packages/cli/bin/coder.js release images --dry-run
          node packages/cli/bin/coder.js release images --dry-run --registry docker.io --repo validation-only
      - name: Publish is intentionally disabled pending dual-registry CLI support
        run: |
          echo "::notice::Preflight only. No registry credentials are used and no artifacts are published."
