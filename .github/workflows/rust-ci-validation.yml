name: Rust CI Validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rust-ci-validation.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'libs/**'
      - 'services/**'
      - 'sdk/rust/**'
      - 'scripts/dump-openapi-specs.js'
      - 'scripts/ci-local-run.js'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rust-ci-validation.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'libs/**'
      - 'services/**'
      - 'sdk/rust/**'
      - 'scripts/dump-openapi-specs.js'
      - 'scripts/ci-local-run.js'

permissions:
  contents: read

concurrency:
  group: rust-ci-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-ci:
    name: Rust fmt, Clippy, OpenAPI drift, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Node scripts and pnpm argument forwarding
        run: |
          set -euo pipefail
          node --check scripts/ci-local-run.js
          node --check scripts/dump-openapi-specs.js
          npm install --prefix /tmp/ci-node-deps --no-package-lock --no-save chalk@4.1.2 ora@5.4.1
          NODE_PATH=/tmp/ci-node-deps/node_modules node scripts/ci-local-run.js -- --help

      - name: Verify formatting
        run: cargo fmt --check --all

      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Regenerate OpenAPI specifications
        run: node scripts/dump-openapi-specs.js

      - name: Verify generated OpenAPI specifications are committed
        run: git diff --exit-code -- 'services/*/openapi.yaml'

      - name: Compile workspace library tests
        run: cargo test --locked --workspace --lib --no-run

      - name: Run workspace library tests
        run: cargo test --locked --workspace --lib

      - name: Benchmark sequential vs batched OpenAPI generation (one-time)
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/rust-ci-main-blockers'
        shell: bash
        run: |
          set -euo pipefail
          services=(
            'api-gateway:dump_openapi_api_gateway'
            'token-service:dump_openapi_token_service'
            'iam-service:dump_openapi_iam_service'
            'notification-service:dump_openapi_notification_service'
            'audit-service:dump_openapi_audit_service'
            'file-service:dump_openapi_file_service'
            'prue_backend:dump_openapi_prue_backend'
          )

          export CARGO_TARGET_DIR="$RUNNER_TEMP/openapi-sequential-target"
          start=$(date +%s%N)
          for item in "${services[@]}"; do
            dir="${item%%:*}"
            bin="${item##*:}"
            (cd "services/${dir}" && cargo run --locked --manifest-path Cargo.toml --bin "${bin}")
          done
          end=$(date +%s%N)
          sequential_ms=$(( (end - start) / 1000000 ))

          export CARGO_TARGET_DIR="$RUNNER_TEMP/openapi-batched-target"
          start=$(date +%s%N)
          node scripts/dump-openapi-specs.js
          end=$(date +%s%N)
          batched_ms=$(( (end - start) / 1000000 ))

          echo "Sequential cargo run: ${sequential_ms} ms"
          echo "Batched cargo build:  ${batched_ms} ms"
          if [ "$batched_ms" -lt "$sequential_ms" ]; then
            echo "Batched generator is faster by $((sequential_ms - batched_ms)) ms"
          else
            echo "Sequential generator is faster by $((batched_ms - sequential_ms)) ms"
          fi
          git diff --exit-code -- 'services/*/openapi.yaml'
