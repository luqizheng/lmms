# 数据库方言兼容矩阵 CI 配置
# 
# 说明：
# - SQLite: PR 级别测试（快速反馈）
# - MySQL: PR 级别测试（标准生产环境）
# - Dameng: 每日定时测试（信创环境）
# - MSSQL: 每日定时测试（Windows 环境）

name: Database Dialect Matrix

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # 每日凌晨 2:00 UTC 运行方言兼容测试
    - cron: '0 2 * * *'

jobs:
  # SQLite 测试 - PR 必跑
  test-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Setup SQLite
        run: sudo apt-get install -y libsqlite3-dev
      - name: Run SQLite tests
        run: cargo test --package digua_common_db --features sqlite

  # MySQL 测试 - PR 必跑
  test-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: test_db
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run MySQL tests
        run: |
          export DATABASE_URL="mysql://root:test@localhost:3306/test_db"
          cargo test --package digua_common_db --features mysql

  # PostgreSQL 测试 - PR 级别（基础方言，2026-10-30）
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: coder
          POSTGRES_DB: coder_test
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run PostgreSQL tests
        run: |
          export TEST_PG_URL="postgres://postgres:coder@localhost:5432/coder_test"
          cargo test --package digua_common_db --features postgres

  # Dameng 测试 - 每日定时（需要 Docker 镜像）
  test-dameng:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[dameng]')
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Start Dameng container
        run: |
          docker pull swr.cn-north-4.myhuaweicloud.com/dm_db/docker_dm
          docker run -d --name dameng -p 5236:5236 \
            -e DM_MODE=INITIAL \
            swr.cn-north-4.myhuaweicloud.com/dm_db/docker_dm
          sleep 60
      - name: Run Dameng dialect tests
        run: |
          export DATABASE_URL="dameng://SYSDBA:SYSDBA@localhost:5236"
          cargo test --package digua_common_db --features mysql

  # MSSQL 测试 - 每日定时
  test-mssql:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[mssql]')
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: TestPass123!
        options: >-
          --health-cmd="/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'TestPass123!' -Q 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install ODBC
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | apt-key add -
          curl https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list | tee /etc/apt/sources.list.d/msprod.list
          apt-get update
          ACCEPT_EULA=Y apt-get install -y msodbcsql18 mssql-tools18
      - name: Run MSSQL tests
        run: |
          export DATABASE_URL="mssql://sa:TestPass123!@localhost:1433/master"
          cargo test --package digua_common_db --features mssql

  # 核心服务集成测试
  test-services:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: test_db
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run service tests
        run: |
          export DATABASE_URL="mysql://root:test@localhost:3306/test_db"
          cargo test --package audit-service --features mysql
          cargo test --package config-service --features mysql
          cargo test --package file-service --features mysql
