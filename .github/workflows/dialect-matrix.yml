# 数据库方言兼容矩阵 CI 配置
#
# 说明：
# - SQLite: PR 级别测试（快速反馈）
# - MySQL: PR 级别测试（标准生产环境）
# - PostgreSQL: PR 级别测试（基础方言）
# 仅支持 MySQL / PostgreSQL / SQLite 三种方言；不支持 Dameng / MSSQL。

name: Database Dialect Matrix

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # SQLite 测试 - PR 必跑
  test-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Setup SQLite
        run: sudo apt-get install -y libsqlite3-dev
      - name: Run SQLite tests
        run: cargo test --package digua_common_db --features sqlite

  # MySQL 测试 - PR 必跑
  test-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: test_db
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Run MySQL tests
        run: |
          export DATABASE_URL="mysql://root:test@localhost:3306/test_db"
          cargo test --package digua_common_db --features mysql

  # PostgreSQL 测试 - PR 级别（基础方言，2026-10-30）
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: coder
          POSTGRES_DB: coder_test
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Run PostgreSQL tests
        run: |
          export TEST_PG_URL="postgres://postgres:coder@localhost:5432/coder_test"
          cargo test --package digua_common_db --features postgres

  # 核心服务集成测试（MySQL 侧）
  # 包名用下划线（workspace 名是 audit_service 等，dash 包名会
  # "package ID specification did not match any packages"——此 job 此前从未真跑过）。
  # 服务测试夹具走 TEST_MYSQL_HOST/PORT 共享容器模式，root 空密码。
  test-services:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Setup SQLite
        run: sudo apt-get install -y libsqlite3-dev
      - name: Run service tests
        run: |
          export TEST_MYSQL_HOST=localhost
          export TEST_MYSQL_PORT=3306
          cargo test --package audit_service --features mysql
          cargo test --package file_service --features mysql

  # 核心服务集成测试（PostgreSQL 侧）—— 服务级 pg_roundtrip（S4，2026-11-03）
  # 同时挂一个 MySQL service container：部分测试（file 的 tenant_isolation、
  # token 的 api_key/admin、notification 的 publish、iam 的 membership bootstrap）
  # 的夹具硬依赖 MySQL 后端；未设 TEST_MYSQL_HOST/PORT 时会回退到 testcontainers
  # 自起 MySQL，在 CI 上出现过 PoolTimedOut（seed 阶段连接池拿不到连接）。
  # 与 test-services job 一样走共享容器模式（root 空密码）更稳定。
  test-services-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: coder
          POSTGRES_DB: coder_test
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 5432:5432
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Setup SQLite
        run: sudo apt-get install -y libsqlite3-dev
      - name: Run service PostgreSQL tests
        run: |
          export TEST_PG_URL="postgres://postgres:coder@localhost:5432/coder_test"
          export TEST_MYSQL_HOST=localhost
          export TEST_MYSQL_PORT=3306
          cargo test --package file_service --features postgres
          cargo test --package token_service --features postgres
          cargo test --package audit_service --features postgres
          cargo test --package prue_backend --features postgres
          cargo test --package notification_service --features postgres
          cargo test --package iam_service --features postgres
