name: Java SDK — Maven Central

on:
  pull_request:
    branches: [main]
    paths:
      - "sdk/java/**"
      - "docs-site/guides/java-sdk-publishing.md"
      - "docs/superpowers/specs/2026-11-27-java-sdk-maven-central-design.md"
      - ".github/workflows/java-sdk-maven-central.yml"
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: java-sdk-central-\${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Java SDK (no publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Check Maven version
        run: |
          set -euo pipefail
          mvn --version
          MVN_VERSION="$(mvn --version | head -1 | awk '{print $3}')"
          if [[ "$(printf '%s\n' 3.9 "$MVN_VERSION" | sort -V | head -1)" != "3.9" ]]; then
            echo "::error::Maven 3.9+ is required; found $MVN_VERSION"
            exit 1
          fi
      - name: Verify tag and Maven project version
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          TAG="\${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Only vMAJOR.MINOR.PATCH tags may publish Java SDK artifacts: $TAG"
            exit 1
          fi
          TAG_VERSION="\${BASH_REMATCH[1]}"
          POM_VERSION="$(mvn -q -f sdk/java/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)"
          if [[ "$POM_VERSION" != "$TAG_VERSION" ]]; then
            echo "::error::Tag version $TAG_VERSION does not match sdk/java/pom.xml version $POM_VERSION"
            exit 1
          fi
          echo "Validated Java SDK release $TAG_VERSION"
      - name: Build, test, attach Sources and Javadoc
        run: mvn -B -ntp -f sdk/java/pom.xml -Pjava8 clean verify

  upload-central:
    name: Upload signed bundle to Sonatype Central (manual publish)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Require Maven Central and GPG credentials
        shell: bash
        env:
          MVN_USERNAME: \${{ secrets.MVN_USERNAME }}
          MVN_PASSWORD: \${{ secrets.MVN_PASSWORD }}
          GPG_PRIVATE_KEY: \${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: \${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          for name in MVN_USERNAME MVN_PASSWORD GPG_PRIVATE_KEY GPG_PASSPHRASE; do
            if [[ -z "\${!name:-}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: \${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Create Maven Central credentials
        env:
          MVN_USERNAME: \${{ secrets.MVN_USERNAME }}
          MVN_PASSWORD: \${{ secrets.MVN_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from xml.sax.saxutils import escape

          settings = Path.home() / ".m2" / "settings.xml"
          settings.parent.mkdir(parents=True, exist_ok=True)
          username = escape(os.environ["MVN_USERNAME"])
          password = escape(os.environ["MVN_PASSWORD"])
          settings.write_text(
              "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n"
              "<settings xmlns=\"http://maven.apache.org/SETTINGS/1.2.0\">\n"
              "  <servers><server><id>central</id>"
              f"<username>{username}</username><password>{password}</password>"
              "</server></servers>\n</settings>\n",
              encoding="utf-8",
          )
          settings.chmod(0o600)
          PY
      - name: Upload signed bundle to Central for validation
        env:
          GPG_PASSPHRASE: \${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -ntp -f sdk/java/pom.xml -Pjava8,central-publishing,central-release clean deploy
      - name: Manual publication reminder
        run: |
          echo "The bundle was uploaded with autoPublish=false."
          echo "Review validation results and click Publish manually at https://central.sonatype.com/."
