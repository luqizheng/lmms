[package]
name = "api-gateway"
version = "0.1.0"
edition = "2021"

[dev-dependencies]
mockall = "0.13"
tokio-test = "0.4"
tower = { version = "0.5", features = ["util"] }
hyper = "1"
tempfile = "3"
bytes.workspace = true

[dependencies]
common = { path = "../../libs/common" }
common-event = { path = "../../libs/common-event" }
common-http = { path = "../../libs/common-http" }
futures.workspace = true
bytes.workspace = true
common-telemetry = { path = "../../libs/common-telemetry", features = ["otlp"] }
common-telemetry-axum = { path = "../../libs/common-telemetry-axum", features = ["otlp"] }
consul-registrar = { path = "../../libs/consul-registrar" }
axum.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
jwt-simple.workspace = true
redis.workspace = true
reqwest.workspace = true
rustls.workspace = true
thiserror.workspace = true
base64.workspace = true
rsa.workspace = true
config.workspace = true
dotenvy.workspace = true
arc-swap = "1"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
glob = "0.3"
prometheus = "0.13"
prometheus_exporter = "0.1"
utoipa = { version = "5", features = ["axum_extras", "yaml"] }
governor = "0.6"
opentelemetry = "0.24"
tracing-opentelemetry = "0.25"
rand.workspace = true

[[bin]]
name = "dump-openapi"
path = "src/bin/dump-openapi.rs"
