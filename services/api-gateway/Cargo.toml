[package]
name = "api_gateway"
version = "0.1.0"
edition = "2021"

[dev-dependencies]
mockall = "0.13"
tokio-test = "0.4"
tower = { version = "0.5", features = ["util"] }
hyper = "1"
tempfile = "3"
bytes.workspace = true
jwt-simple.workspace = true
base64 = "0.22"

[dependencies]
digua_common = { path = "../../libs/common" }
digua_common_event = { path = "../../libs/common-event" }
digua_common_http = { path = "../../libs/common-http" }
uuid = { workspace = true }
futures.workspace = true
bytes.workspace = true
digua_common_telemetry = { path = "../../libs/common-telemetry", features = ["otlp"] }
digua_common_telemetry_axum = { path = "../../libs/common-telemetry-axum", features = ["otlp"] }
axum.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
digua_common_jwt = { path = "../../libs/common-jwt" }
digua_common_ratelimit = { path = "../../libs/common-ratelimit" }
redis.workspace = true
reqwest.workspace = true
rustls.workspace = true
thiserror.workspace = true
config.workspace = true
dotenvy.workspace = true
arc-swap = "1"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
glob = "0.3"
prometheus = "0.13"
utoipa = { version = "5", features = ["axum_extras", "yaml"] }

opentelemetry = "0.24"
tracing-opentelemetry = "0.25"
rand.workspace = true

[[bin]]
name = "dump_openapi"
path = "src/bin/dump-openapi.rs"
