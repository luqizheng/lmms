[package]
name = "audit-service"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
axum.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
csv.workspace = true
prometheus = "0.13"
utoipa = { version = "5", features = ["axum_extras", "chrono", "yaml"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
common-error = { path = "../../libs/common-error" }
common-event = { path = "../../libs/common-event" }
common-db = { path = "../../libs/common-db", features = ["mysql", "sqlite"] }
common-log = { path = "../../libs/common-log" }
common-cache = { path = "../../libs/common-cache" }
common = { path = "../../libs/common" }
common-telemetry = { path = "../../libs/common-telemetry", features = ["otlp"] }
common-telemetry-axum = { path = "../../libs/common-telemetry-axum", features = ["otlp"] }
common-jwt = { path = "../../libs/common-jwt" }
jwt-ctx = { path = "../../libs/jwt-ctx" }
reqwest.workspace = true
opentelemetry = "0.24"
tracing-opentelemetry = "0.25"
redis = { workspace = true, features = ["connection-manager"] }

[[bin]]
name = "dump-openapi"
path = "src/bin/dump-openapi.rs"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
testcontainers = "0.20"
testcontainers-modules = { version = "0.8", features = ["rabbitmq", "redis"] }
