openapi: 3.1.0
info:
  title: audit-service
  description: Audit log and retention
  license:
    name: ''
  version: 1.8.2
paths:
  /audit/export/compliance/login/csv/{user_id}:
    get:
      tags:
      - compliance
      summary: Export login logs as CSV
      operationId: export_login_csv
      parameters:
      - name: user_id
        in: path
        description: User id to export login logs for
        required: true
        schema:
          type: string
      responses:
        '200':
          description: CSV export of login logs
          content:
            text/plain:
              schema:
                type: string
  /audit/export/compliance/operation/csv/{user_id}:
    get:
      tags:
      - compliance
      summary: Export operation logs as CSV
      operationId: export_operation_csv
      parameters:
      - name: user_id
        in: path
        description: User id to export operation logs for
        required: true
        schema:
          type: string
      responses:
        '200':
          description: CSV export of operation logs
          content:
            text/plain:
              schema:
                type: string
  /audit/export/compliance/operation/json/{user_id}:
    get:
      tags:
      - compliance
      summary: Export operation logs as JSON
      operationId: export_operation_json
      parameters:
      - name: user_id
        in: path
        description: User id to export operation logs for
        required: true
        schema:
          type: string
      responses:
        '200':
          description: JSON export of operation logs
          content:
            text/plain:
              schema:
                type: string
  /audit/internal/migrations/state:
    get:
      tags:
      - internal
      summary: Get audit migration state
      operationId: handler
      responses:
        '200':
          description: schema state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationStateResponse'
        '401':
          description: missing or invalid service-jwt
        '503':
          description: db_unreachable
      security:
      - bearer_auth: []
  /audit/login:
    get:
      tags:
      - login
      summary: Query login logs
      operationId: query_login_logs
      parameters:
      - name: username
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: success
        in: query
        required: false
        schema:
          type:
          - boolean
          - 'null'
      - name: start_time
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: end_time
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: page
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      - name: size
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      responses:
        '200':
          description: Paged login logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedLoginLogs'
  /audit/operation:
    get:
      tags:
      - operation
      summary: Query operation logs
      operationId: query_operation_logs
      parameters:
      - name: user_id
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: action
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: resource
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: start_time
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: end_time
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: page
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      - name: size
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      responses:
        '200':
          description: Paged operation logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedOperationLogs'
  /audit/retention/cleanup:
    post:
      tags:
      - retention
      summary: Trigger retention cleanup
      operationId: trigger_cleanup
      responses:
        '200':
          description: Cleanup result
          content:
            application/json:
              schema: {}
  /audit/retention/policy:
    get:
      tags:
      - retention
      summary: Get retention policy
      operationId: get_retention_policy
      responses:
        '200':
          description: Current retention policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionPolicy'
    put:
      tags:
      - retention
      summary: Update retention policy
      operationId: update_retention_policy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetentionPolicy'
        required: true
      responses:
        '200':
          description: Updated retention policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionPolicy'
        '400':
          description: Invalid policy (hot < warm < cold required)
  /audit/retention/stage/{created_at}:
    get:
      tags:
      - retention
      summary: Get data stage classification
      operationId: get_data_stage
      parameters:
      - name: created_at
        in: path
        description: RFC3339 timestamp
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Data stage classification
          content:
            application/json:
              schema: {}
        '400':
          description: Invalid date format
  /audit/retention/stats:
    get:
      tags:
      - retention
      summary: Get retention stats
      operationId: get_retention_stats
      responses:
        '200':
          description: Retention stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionStats'
components:
  schemas:
    DataStage:
      type: string
      enum:
      - Hot
      - Warm
      - Cold
      - Expired
    LoginLog:
      type: object
      required:
      - id
      - username
      - success
      - ip_address
      - request_id
      - created_at
      properties:
        created_at:
          type: string
          format: date-time
        fail_reason:
          type:
          - string
          - 'null'
        id:
          type: integer
          format: int64
        ip_address:
          type: string
        location:
          type:
          - string
          - 'null'
        request_id:
          type: string
        success:
          type: boolean
        user_agent:
          type:
          - string
          - 'null'
        user_id:
          type:
          - string
          - 'null'
        username:
          type: string
    MigrationInfo:
      type: object
      description: JSON 内 `available` 数组元素的形态。
      required:
      - version
      - name
      properties:
        name:
          type: string
        version:
          type: string
    MigrationStateResponse:
      type: object
      description: |-
        端点返回 JSON 的序列化结构。

        字段语义见 spec §2.1。
      required:
      - service
      - dialect
      - available
      - applied
      - in_sync
      - missing
      - extra
      properties:
        applied:
          type: array
          items:
            type: string
        available:
          type: array
          items:
            $ref: '#/components/schemas/MigrationInfo'
        current_version:
          type:
          - string
          - 'null'
        dialect:
          type: string
        extra:
          type: array
          items:
            type: string
        in_sync:
          type: boolean
        missing:
          type: array
          items:
            type: string
        service:
          type: string
    OperationLog:
      type: object
      required:
      - id
      - user_id
      - action
      - resource
      - request_id
      - created_at
      properties:
        action:
          type: string
        after_value:
          type:
          - string
          - 'null'
        before_value:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        id:
          type: integer
          format: int64
        ip_address:
          type:
          - string
          - 'null'
        request_id:
          type: string
        resource:
          type: string
        resource_id:
          type:
          - string
          - 'null'
        user_agent:
          type:
          - string
          - 'null'
        user_id:
          type: string
    PagedLoginLogs:
      type: object
      required:
      - items
      - total
      - page
      - size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LoginLog'
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 0
        total:
          type: integer
          format: int64
    PagedOperationLogs:
      type: object
      required:
      - items
      - total
      - page
      - size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OperationLog'
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 0
        total:
          type: integer
          format: int64
    RetentionPolicy:
      type: object
      required:
      - hot_days
      - warm_days
      - cold_days
      - archive_enabled
      - purge_enabled
      properties:
        archive_enabled:
          type: boolean
        cold_days:
          type: integer
          format: int32
          minimum: 0
        hot_days:
          type: integer
          format: int32
          minimum: 0
        purge_enabled:
          type: boolean
        warm_days:
          type: integer
          format: int32
          minimum: 0
    RetentionStats:
      type: object
      required:
      - hot_count
      - warm_count
      - cold_count
      - expired_count
      - total_size_bytes
      properties:
        cold_count:
          type: integer
          format: int64
        expired_count:
          type: integer
          format: int64
        hot_count:
          type: integer
          format: int64
        last_cleanup:
          type:
          - string
          - 'null'
          format: date-time
        total_size_bytes:
          type: integer
          format: int64
        warm_count:
          type: integer
          format: int64
tags:
- name: operation
  description: Operation logs
- name: login
  description: Login logs
- name: compliance
  description: Compliance export
- name: retention
  description: Retention policy & cleanup
