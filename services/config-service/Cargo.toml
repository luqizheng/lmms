[package]
name = "config-service"
version = "0.1.0"
edition = "2021"

[dependencies]
axum.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sqlx = { workspace = true, features = ["mysql", "chrono", "macros"] }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
prometheus = "0.13"
utoipa = { version = "5", features = ["axum_extras", "chrono", "yaml"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
common-error = { path = "../../libs/common-error" }
common-db = { path = "../../libs/common-db", features = ["mysql"] }
common-log = { path = "../../libs/common-log" }
common-cache = { path = "../../libs/common-cache" }
common-telemetry = { path = "../../libs/common-telemetry", features = ["otlp"] }
common-telemetry-axum = { path = "../../libs/common-telemetry-axum", features = ["otlp"] }
jwt-ctx = { path = "../../libs/jwt-ctx" }
common-jwt = { path = "../../libs/common-jwt" }
reqwest.workspace = true
anyhow = "1"

[[bin]]
name = "dump-openapi"
path = "src/bin/dump-openapi.rs"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
testcontainers = "0.20"
testcontainers-modules = { version = "0.8", features = ["mysql"] }
tower = { workspace = true }
http-body-util = "0.1"
axum = { workspace = true, features = ["json", "query"] }
jwt-simple.workspace = true
