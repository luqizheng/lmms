openapi: 3.1.0
info:
  title: config-service
  description: Dynamic configuration management
  license:
    name: ''
  version: 0.1.0
paths:
  /cfg/internal/migrations/state:
    get:
      tags:
      - internal
      summary: Get config schema migration state
      operationId: handler
      responses:
        '200':
          description: schema state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationStateResponse'
        '401':
          description: missing or invalid service-jwt
        '503':
          description: db_unreachable
      security:
      - bearer_auth: []
  /config/export/{namespace_id}:
    get:
      tags:
      - config-item
      summary: Export config as JSON
      operationId: export_config
      parameters:
      - name: namespace_id
        in: path
        description: Namespace id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Exported config as JSON string
          content:
            text/plain:
              schema:
                type: string
  /config/import/{namespace_id}:
    post:
      tags:
      - config-item
      summary: Import config from JSON
      operationId: import_config
      parameters:
      - name: namespace_id
        in: path
        description: Namespace id
        required: true
        schema:
          type: string
      requestBody:
        content:
          text/plain:
            schema:
              type: string
        required: true
      responses:
        '200':
          description: Import result
          content:
            application/json:
              schema: {}
        '400':
          description: Invalid JSON body
  /config/item:
    get:
      tags:
      - config-item
      summary: List config items
      operationId: query_config_items
      parameters:
      - name: namespace_id
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: key
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: page
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      - name: size
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      responses:
        '200':
          description: Paged config items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedConfigItems'
    post:
      tags:
      - config-item
      summary: Create config item
      operationId: create_config_item
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConfigItem'
        required: true
      responses:
        '200':
          description: Config item created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigItem'
  /config/item/{id}:
    get:
      tags:
      - config-item
      summary: Get config item by id
      operationId: get_config_item
      parameters:
      - name: id
        in: path
        description: Config item id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Config item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigItem'
        '404':
          description: Not found
    put:
      tags:
      - config-item
      summary: Update config item
      operationId: update_config_item
      parameters:
      - name: id
        in: path
        description: Config item id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConfigItem'
        required: true
      responses:
        '200':
          description: Updated config item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigItem'
        '404':
          description: Not found
    delete:
      tags:
      - config-item
      summary: Delete config item
      operationId: delete_config_item
      parameters:
      - name: id
        in: path
        description: Config item id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema: {}
        '404':
          description: Not found
  /config/namespace:
    get:
      tags:
      - namespace
      summary: List config namespaces
      operationId: query_namespaces
      parameters:
      - name: app
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: env
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: page
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      - name: size
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      responses:
        '200':
          description: Paged namespaces
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedNamespaces'
    post:
      tags:
      - namespace
      summary: Create config namespace
      operationId: create_namespace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNamespace'
        required: true
      responses:
        '200':
          description: Namespace created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Namespace'
  /config/namespace/{id}:
    get:
      tags:
      - namespace
      summary: Get config namespace by id
      operationId: get_namespace
      parameters:
      - name: id
        in: path
        description: Namespace id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Namespace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Namespace'
        '404':
          description: Not found
    put:
      tags:
      - namespace
      summary: Update config namespace
      operationId: update_namespace
      parameters:
      - name: id
        in: path
        description: Namespace id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNamespace'
        required: true
      responses:
        '200':
          description: Updated namespace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Namespace'
        '404':
          description: Not found
    delete:
      tags:
      - namespace
      summary: Delete config namespace
      operationId: delete_namespace
      parameters:
      - name: id
        in: path
        description: Namespace id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema: {}
        '404':
          description: Not found
  /config/watch:
    get:
      tags:
      - watch
      summary: Watch config changes (long-poll)
      operationId: watch_config
      parameters:
      - name: namespace_id
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: timeout
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
      responses:
        '200':
          description: Long-poll result
          content:
            application/json:
              schema: {}
components:
  schemas:
    ConfigItem:
      type: object
      required:
      - id
      - namespace_id
      - key
      - value
      - value_type
      - is_secret
      - created_at
      - updated_at
      properties:
        created_at:
          type: string
          format: date-time
        description:
          type:
          - string
          - 'null'
        id:
          type: string
        is_secret:
          type: boolean
        key:
          type: string
        namespace_id:
          type: string
        updated_at:
          type: string
          format: date-time
        value:
          type: string
        value_masked:
          type: boolean
          description: |-
            服务端在 is_secret=true 且调用者无 CFG_CONFIG_REVEAL 时填 true，
            同时把 value 置为 `MASK = "********"`（见 routes/config.rs）。
            客户端据此决定是否走「显示明文」按钮。
            DB SELECT 总是返回 false（手动在 routes 里覆盖）。
            `value_masked` 不存于 cfg_config_items 表，由 routes 层覆盖；
            sqlx 反序列化遇到缺列时用默认 false 兜底，避免 500。
        value_type:
          type: string
    CreateConfigItem:
      type: object
      required:
      - namespace_id
      - key
      - value
      properties:
        description:
          type:
          - string
          - 'null'
        is_secret:
          type: boolean
        key:
          type: string
        namespace_id:
          type: string
        value:
          type: string
        value_type:
          type: string
    CreateNamespace:
      type: object
      required:
      - app
      - env
      properties:
        app:
          type: string
        description:
          type:
          - string
          - 'null'
        env:
          type: string
        profile:
          type:
          - string
          - 'null'
    MigrationInfo:
      type: object
      description: JSON 内 `available` 数组元素的形态。
      required:
      - version
      - name
      properties:
        name:
          type: string
        version:
          type: string
    MigrationStateResponse:
      type: object
      description: |-
        端点返回 JSON 的序列化结构。

        字段语义见 spec §2.1。
      required:
      - service
      - dialect
      - available
      - applied
      - in_sync
      - missing
      - extra
      properties:
        applied:
          type: array
          items:
            type: string
        available:
          type: array
          items:
            $ref: '#/components/schemas/MigrationInfo'
        current_version:
          type:
          - string
          - 'null'
        dialect:
          type: string
        extra:
          type: array
          items:
            type: string
        in_sync:
          type: boolean
        missing:
          type: array
          items:
            type: string
        service:
          type: string
    Namespace:
      type: object
      required:
      - id
      - tenant_id
      - app
      - env
      - created_at
      - updated_at
      properties:
        app:
          type: string
        created_at:
          type: string
          format: date-time
        description:
          type:
          - string
          - 'null'
        env:
          type: string
        id:
          type: string
        profile:
          type:
          - string
          - 'null'
        tenant_id:
          type: integer
          format: int64
          minimum: 0
        updated_at:
          type: string
          format: date-time
    PagedConfigItems:
      type: object
      required:
      - items
      - total
      - page
      - size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConfigItem'
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 0
        total:
          type: integer
          format: int64
    PagedNamespaces:
      type: object
      required:
      - items
      - total
      - page
      - size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Namespace'
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 0
        total:
          type: integer
          format: int64
    UpdateConfigItem:
      type: object
      properties:
        description:
          type:
          - string
          - 'null'
        is_secret:
          type:
          - boolean
          - 'null'
        value:
          type:
          - string
          - 'null'
        value_type:
          type:
          - string
          - 'null'
    UpdateNamespace:
      type: object
      properties:
        description:
          type:
          - string
          - 'null'
tags:
- name: namespace
  description: Namespace management
- name: config-item
  description: Config item CRUD + export/import
- name: watch
  description: Long-poll watch
