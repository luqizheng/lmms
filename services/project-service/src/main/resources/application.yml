server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: project-service
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/superpowers?useSSL=false&serverTimezone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:rootpass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
      base-path: /project
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui
    operations-sorter: alpha
  api-docs:
    path: /api-docs
  packages-to-scan: com.kudi.coder.pmd.web
  packages-to-serialize: com.kudi.coder.pmd.web

pmd:
  llm:
    provider: ${PMD_LLM_PROVIDER:placeholder}
  outbox:
    exchange: events
