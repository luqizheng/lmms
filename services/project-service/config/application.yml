server:
  port: 8080
  shutdown: graceful

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
      base-path: /project
  endpoint:
    health:
      probes:
        enabled: true

pmd:
  llm:
    provider: ${PMD_LLM_PROVIDER:placeholder}
  outbox:
    exchange: events
