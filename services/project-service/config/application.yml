server:
  port: 8080
  shutdown: graceful

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:rootpass}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
      base-path: /project
  endpoint:
    health:
      probes:
        enabled: true

pmd:
  llm:
    provider: ${PMD_LLM_PROVIDER:placeholder}
  outbox:
    exchange: events
