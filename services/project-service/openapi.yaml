openapi: 3.0.3
info:
  title: project-service
  version: 0.1.0
  description: |
    Software project management domain service (Phase 9 validation MVP).

    All paths below are exposed via the api-gateway at the `/v1/project/*`
    prefix; the gateway strips `/v1/project` before forwarding to this
    service. Tags follow resource type; security is "BearerAuth" inherited
    from the gateway which validates RS256 + exp + blacklist, while this
    service only decodes the payload (tenant_id via `tid`, user via `sub`).
servers:
  - url: http://localhost:3000/v1/project
    description: api-gateway
  - url: http://localhost:8080
    description: project-service direct
security:
  - BearerAuth: []
tags:
  - name: projects
    description: PMD project CRUD
  - name: milestones
    description: PMD milestone CRUD
  - name: tasks
    description: PMD task CRUD
  - name: sprints
    description: PMD sprint CRUD
  - name: llm
    description: PMD LLM-assisted endpoints
paths:
  /health:
    get:
      tags: [projects]
      summary: Liveness + readiness (Actuator)
      operationId: health
      responses:
        '200':
          description: UP
  /metrics:
    get:
      tags: [projects]
      summary: Prometheus scrape endpoint
      operationId: metrics
      responses:
        '200':
          description: Prometheus text exposition format

  /projects:
    post:
      tags: [projects]
      summary: Create project
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/ProjectCodeConflict' }
    get:
      tags: [projects]
      summary: List projects (tenant scoped)
      operationId: listProjects
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: paged list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectPage' }
  /projects/{id}:
    get:
      tags: [projects]
      summary: Get project by id (tenant scoped)
      operationId: getProject
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '404': { $ref: '#/components/responses/ProjectNotFound' }
    patch:
      tags: [projects]
      summary: Update project metadata
      operationId: updateProject
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectUpdate' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '404': { $ref: '#/components/responses/ProjectNotFound' }
    delete:
      tags: [projects]
      summary: Archive project (soft delete, status='archived')
      operationId: archiveProject
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: archived }
        '404': { $ref: '#/components/responses/ProjectNotFound' }

  /projects/{projectId}/milestones:
    post:
      tags: [milestones]
      summary: Create milestone under project
      operationId: createMilestone
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MilestoneCreate' }
      responses:
        '201':
          description: created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Milestone' }
        '404': { $ref: '#/components/responses/ProjectNotFound' }
    get:
      tags: [milestones]
      summary: List milestones under project
      operationId: listMilestones
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: integer, format: int64 }
        - in: query
          name: page
          schema: { type: integer, default: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: paged list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MilestonePage' }

  /milestones/{id}:
    get:
      tags: [milestones]
      summary: Get milestone by id (tenant scoped)
      operationId: getMilestone
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Milestone' }
        '404': { $ref: '#/components/responses/MilestoneNotFound' }
    patch:
      tags: [milestones]
      summary: Update milestone
      operationId: updateMilestone
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MilestoneUpdate' }
      responses:
        '200': { description: ok }
        '404': { $ref: '#/components/responses/MilestoneNotFound' }

  /projects/{projectId}/tasks:
    post:
      tags: [tasks]
      summary: Create task under project
      operationId: createTask
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskCreate' }
      responses:
        '201':
          description: created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '404': { $ref: '#/components/responses/ProjectNotFound' }
  /tasks/{id}:
    get:
      tags: [tasks]
      summary: Get task by id (tenant scoped)
      operationId: getTask
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '404': { $ref: '#/components/responses/TaskNotFound' }
    patch:
      tags: [tasks]
      summary: Update task (status transition via tryTransition when status is present)
      operationId: updateTask
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskUpdate' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '404': { $ref: '#/components/responses/TaskNotFound' }
        '422': { $ref: '#/components/responses/TaskInvalidStateTransition' }

  /sprints:
    post:
      tags: [sprints]
      summary: Create sprint under a project
      operationId: createSprint
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SprintCreate' }
      responses:
        '201':
          description: created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sprint' }
    get:
      tags: [sprints]
      summary: List sprints (optionally filtered by project)
      operationId: listSprints
      parameters:
        - in: query
          name: projectId
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: paged list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SprintPage' }
  /sprints/{id}:
    get:
      tags: [sprints]
      summary: Get sprint by id
      operationId: getSprint
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sprint' }

  /llm/refine:
    post:
      tags: [llm]
      summary: Refine raw requirements text via the active LLM provider
      operationId: llmRefine
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LlmRefineRequest' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LlmRefineResponse' }

  /swagger-ui:
    get:
      tags: [projects]
      summary: SpringDoc OpenAPI UI (SWAGGER_ENABLED=true)
      operationId: swaggerUi
      responses:
        '200': { description: HTML }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Project:
      type: object
      properties:
        id:               { type: integer, format: int64 }
        tenantId:         { type: integer, format: int64 }
        code:             { type: string, maxLength: 64 }
        name:             { type: string, maxLength: 255 }
        description:      { type: string, nullable: true }
        status:           { type: string, enum: [active, archived, cancelled] }
        ownerId:          { type: string }
        startDate:        { type: string, format: date, nullable: true }
        endDate:          { type: string, format: date, nullable: true }
        actorId:          { type: string, nullable: true }
        createdAt:        { type: string, format: date-time }
        updatedAt:        { type: string, format: date-time }
    ProjectCreate:
      type: object
      required: [code, name, ownerId]
      properties:
        code:             { type: string, maxLength: 64 }
        name:             { type: string, maxLength: 255 }
        description:      { type: string, nullable: true }
        ownerId:          { type: string }
        startDate:        { type: string, format: date, nullable: true }
        endDate:          { type: string, format: date, nullable: true }
    ProjectUpdate:
      type: object
      properties:
        name:             { type: string, maxLength: 255 }
        description:      { type: string, nullable: true }
        startDate:        { type: string, format: date, nullable: true }
        endDate:          { type: string, format: date, nullable: true }
    ProjectPage:
      type: object
      properties:
        content:          { type: array, items: { $ref: '#/components/schemas/Project' } }
        page:             { type: integer }
        size:             { type: integer }
        total:            { type: integer, format: int64 }

    Milestone:
      type: object
      properties:
        id:               { type: integer, format: int64 }
        tenantId:         { type: integer, format: int64 }
        projectId:        { type: integer, format: int64 }
        code:             { type: string }
        name:             { type: string }
        dueDate:          { type: string, format: date, nullable: true }
        status:           { type: string, enum: [pending, reached, missed, cancelled] }
        actorId:          { type: string, nullable: true }
        createdAt:        { type: string, format: date-time }
        updatedAt:        { type: string, format: date-time }
    MilestoneCreate:
      type: object
      required: [code, name]
      properties:
        code:             { type: string, maxLength: 64 }
        name:             { type: string, maxLength: 255 }
        dueDate:          { type: string, format: date, nullable: true }
    MilestoneUpdate:
      type: object
      properties:
        name:             { type: string }
        dueDate:          { type: string, format: date, nullable: true }
        status:           { type: string, enum: [pending, reached, missed, cancelled] }
    MilestonePage:
      type: object
      properties:
        content:          { type: array, items: { $ref: '#/components/schemas/Milestone' } }
        page:             { type: integer }
        size:             { type: integer }
        total:            { type: integer, format: int64 }

    Task:
      type: object
      properties:
        id:               { type: integer, format: int64 }
        tenantId:         { type: integer, format: int64 }
        projectId:        { type: integer, format: int64 }
        milestoneId:      { type: integer, format: int64, nullable: true }
        sprintId:         { type: integer, format: int64, nullable: true }
        code:             { type: string, maxLength: 64 }
        title:            { type: string, maxLength: 255 }
        description:      { type: string, nullable: true }
        assigneeId:       { type: string, nullable: true }
        status:           { type: string, enum: [Backlog, Todo, InProgress, Blocked, Review, Done, Cancelled] }
        estimateHours:    { type: number, format: double, nullable: true }
        actorId:          { type: string, nullable: true }
        createdAt:        { type: string, format: date-time }
        updatedAt:        { type: string, format: date-time }
    TaskCreate:
      type: object
      required: [code, title]
      properties:
        milestoneId:      { type: integer, format: int64, nullable: true }
        sprintId:         { type: integer, format: int64, nullable: true }
        code:             { type: string, maxLength: 64 }
        title:            { type: string, maxLength: 255 }
        description:      { type: string, nullable: true }
        assigneeId:       { type: string, nullable: true }
        estimateHours:    { type: number, format: double, nullable: true }
    TaskUpdate:
      type: object
      properties:
        status:           { type: string, enum: [Backlog, Todo, InProgress, Blocked, Review, Done, Cancelled] }
    TaskPage:
      type: object
      properties:
        content:          { type: array, items: { $ref: '#/components/schemas/Task' } }

    Sprint:
      type: object
      properties:
        id:               { type: integer, format: int64 }
        tenantId:         { type: integer, format: int64 }
        projectId:        { type: integer, format: int64 }
        sprintName:       { type: string }
        startsOn:         { type: string, format: date }
        endsOn:           { type: string, format: date }
        actorId:          { type: string, nullable: true }
        createdAt:        { type: string, format: date-time }
        updatedAt:        { type: string, format: date-time }
    SprintCreate:
      type: object
      required: [projectId, sprintName, startsOn, endsOn]
      properties:
        projectId:        { type: integer, format: int64 }
        sprintName:       { type: string, maxLength: 64 }
        startsOn:         { type: string, format: date }
        endsOn:           { type: string, format: date }
    SprintPage:
      type: object
      properties:
        content:          { type: array, items: { $ref: '#/components/schemas/Sprint' } }

    LlmRefineRequest:
      type: object
      required: [prompt]
      properties:
        prompt:           { type: string, minLength: 1, maxLength: 65535 }
        projectId:        { type: integer, format: int64, nullable: true }
    LlmRefineResponse:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/RefinedItem' } }
    RefinedItem:
      type: object
      properties:
        code:             { type: string, example: P-1 }
        summary:          { type: string, maxLength: 120 }

    ErrorBody:
      type: object
      properties:
        code:             { type: string, example: PMD_PROJECT_NOT_FOUND }
        message:          { type: string }
        trace_id:         { type: string }
        ts:               { type: string, format: date-time }
  responses:
    ValidationError:
      description: request validation failed
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' } } }
    ProjectNotFound:
      description: project not found (tenant scoped)
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' } } }
    ProjectCodeConflict:
      description: duplicate project code (tenant scoped)
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' } } }
    MilestoneNotFound:
      description: milestone not found (tenant scoped)
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' } } }
    TaskNotFound:
      description: task not found (tenant scoped)
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' } } }
    TaskInvalidStateTransition:
      description: task status transition rejected by tryTransition state machine
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' } } }
