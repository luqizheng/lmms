[package]
name = "notification-service"
version = "0.1.0"
edition.workspace = true

[dependencies]
consul-registrar = { path = "../../libs/consul-registrar" }
common-telemetry = { path = "../../libs/common-telemetry", features = ["otlp"] }
common-ratelimit = { path = "../../libs/common-ratelimit" }
axum = { workspace = true, features = ["ws", "macros"] }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "mysql", "chrono", "macros"] }
redis = { workspace = true, features = ["connection-manager"] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { version = "0.4", features = ["serde"], default-features = false }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = "1"
async-trait = "0.1"
jwt-ctx = { path = "../../libs/jwt-ctx" }
common-event = { path = "../../libs/common-event" }
uuid = { version = "1", features = ["v7", "serde"] }
futures = "0.3"
config = { workspace = true }
prometheus = "0.13"
prometheus_exporter = "0.1"
utoipa = { version = "5", features = ["axum_extras", "chrono", "yaml"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
opentelemetry = "0.24"
tracing-opentelemetry = "0.25"
rand.workspace = true

[[bin]]
name = "notification-service"
path = "src/main.rs"

[[bin]]
name = "ntf-outbox-publisher"
path = "src/bin/outbox_publisher.rs"

[[bin]]
name = "dump-openapi"
path = "src/bin/dump-openapi.rs"
