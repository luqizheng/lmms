[package]
name = "notification_service"
version = "0.1.0"
edition.workspace = true

[features]
# 方言 feature：default 只含 mysql，postgres 必须显式开启（D-9：postgres 不进 default）。
# 宏 `db_*!` 内部的 #[cfg(feature = ...)] 在**调用方 crate** 求值，因此本 crate
# 必须定义与 libs/common-db 同名的 feature，并把它们转发过去。
# digua_common_event 同名转发（S5c 新增）：AnyTx::Postgres / SqlOutboxRepo 的
# PG 分支都挂在它的 postgres feature 后面。
default = ["mysql"]
mysql = ["sqlx/mysql", "digua_common_db/mysql", "digua_common_event/mysql"]
postgres = ["sqlx/postgres", "digua_common_db/postgres", "digua_common_event/postgres"]
sqlite = ["sqlx/sqlite", "digua_common_db/sqlite"]

[dependencies]
digua_common_consul = { path = "../../libs/common-consul" }
digua_common_telemetry = { path = "../../libs/common-telemetry", features = ["otlp"] }
digua_common_telemetry_axum = { path = "../../libs/common-telemetry-axum", features = ["otlp"] }
digua_common_ratelimit = { path = "../../libs/common-ratelimit" }
axum = { workspace = true, features = ["ws", "macros"] }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "mysql", "chrono", "macros", "json"] }
redis = { workspace = true, features = ["connection-manager"] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { version = "0.4", features = ["serde"], default-features = false }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = "1"
async-trait = "0.1"
digua_jwt_ctx = { path = "../../libs/jwt-ctx" }
digua_common_jwt = { path = "../../libs/common-jwt" }
digua_common_http = { path = "../../libs/common-http" }
reqwest.workspace = true
bytes = "1"
digua_common_event = { path = "../../libs/common-event" }
digua_common_db = { path = "../../libs/common-db", features = ["mysql", "openapi"] }
digua_authz = { path = "../../libs/authz" }
uuid = { version = "1", features = ["v7", "serde"] }
futures = "0.3"
config = { workspace = true }
serde_yaml = "0.9"
prometheus = "0.13"
utoipa = { version = "5", features = ["axum_extras", "chrono", "yaml"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
opentelemetry = "0.24"
tracing-opentelemetry = "0.25"
rand.workspace = true

[dev-dependencies]
testcontainers = "0.20"
testcontainers-modules = { version = "0.8", features = ["mysql", "redis"] }
wiremock = "0.6"
tempfile = "3"

[[bin]]
name = "notification_service"
path = "src/main.rs"

[[bin]]
name = "ntf_outbox_publisher"
path = "src/bin/outbox_publisher.rs"

[[bin]]
name = "dump_openapi"
path = "src/bin/dump-openapi.rs"
