[package]
name = "notification-service"
version = "0.1.0"
edition.workspace = true

[dependencies]
consul-registrar = { path = "../../libs/consul-registrar" }
axum = { workspace = true, features = ["ws", "macros"] }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "mysql", "chrono", "macros"] }
redis = { workspace = true, features = ["connection-manager"] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
config = { workspace = true }
prometheus = "0.13"
prometheus-exporter = "0.1"
utoipa = { version = "4", features = ["axum_extras", "swagger_ui"] }
utoipa-swagger-ui = "4"
