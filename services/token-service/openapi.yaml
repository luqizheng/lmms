openapi: 3.1.0
info:
  title: token-service
  description: Token issuance and OAuth client admin
  license:
    name: ''
  version: 0.1.0
paths:
  /admin/oauth-clients:
    post:
      tags:
      - admin
      operationId: handle_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateResponse'
        '400':
          description: bad request
      security:
      - bearer_auth: []
  /admin/oauth-clients/{client_id}:
    put:
      tags:
      - admin
      operationId: handle_update
      parameters:
      - name: client_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientDto'
        '404':
          description: not found
      security:
      - bearer_auth: []
  /admin/oauth-clients/{client_id}/reset-secret:
    post:
      tags:
      - admin
      operationId: handle_reset_secret
      parameters:
      - name: client_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetSecretResponse'
        '404':
          description: not found
      security:
      - bearer_auth: []
  /api-keys:
    get:
      tags:
      - api-key
      summary: |-
        GET /api-keys — 全量列出所有 oauth-clients（当前未区分 api-key / oauth-client，
        共享 token_oauth_clients 表）。返回结构去掉 client_secret_hash 防止泄露。
      operationId: handle_list_api_keys
      parameters:
      - name: keyword
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: page
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      - name: size
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      responses:
        '200':
          description: Paged api-key list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListApiKeysResponse'
    post:
      tags:
      - api-key
      operationId: handle_create_api_key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
        required: true
      responses:
        '200':
          description: Created api key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreated'
  /api/v1/admin/oauth-clients:
    get:
      tags:
      - admin
      operationId: handle_list
      parameters:
      - name: keyword
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: status
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
      security:
      - bearer_auth: []
  /api/v1/admin/oauth-clients/{client_id}:
    delete:
      tags:
      - admin
      operationId: handle_delete
      parameters:
      - name: client_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: deleted
        '404':
          description: not found
      security:
      - bearer_auth: []
  /token/internal/migrations/state:
    get:
      tags:
      - internal
      operationId: handler
      responses:
        '200':
          description: schema state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationStateResponse'
        '401':
          description: missing or invalid service-jwt
        '503':
          description: db_unreachable
      security:
      - bearer_auth: []
  /tokens/access:
    post:
      tags:
      - tokens
      operationId: handle_access
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessRequest'
        required: true
      responses:
        '200':
          description: issued tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessResponse'
        '400':
          description: bad request
        '401':
          description: invalid client
  /tokens/refresh:
    post:
      tags:
      - tokens
      operationId: handle_refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: refreshed tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          description: invalid or expired
  /tokens/revoke:
    post:
      tags:
      - tokens
      operationId: handle_revoke
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeRequest'
        required: true
      responses:
        '200':
          description: revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeResponse'
  /tokens/user-jwt:
    post:
      tags:
      - tokens
      operationId: handle_user_jwt
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserJwtRequest'
        required: true
      responses:
        '200':
          description: user jwt issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserJwtResponse'
components:
  schemas:
    AccessRequest:
      type: object
      required:
      - grant_type
      - code
      - client_id
      - client_secret
      properties:
        client_id:
          type: string
        client_secret:
          type: string
        code:
          type: string
        grant_type:
          type: string
    AccessResponse:
      type: object
      required:
      - access_token
      - refresh_token
      - token_type
      - expires_in
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
          format: int64
        refresh_token:
          type: string
        token_type:
          type: string
    ApiKeyCreated:
      type: object
      required:
      - api_key_id
      - api_key_secret
      properties:
        api_key_id:
          type: string
        api_key_secret:
          type: string
    ApiKeySummary:
      type: object
      required:
      - id
      - name
      - permissions
      - status
      - created_at
      properties:
        created_at:
          type: string
          format: date-time
        id:
          type: string
        name:
          type: string
        permissions:
          type: array
          items:
            type: string
        status:
          type: string
    ClientDto:
      type: object
      required:
      - client_id
      - name
      - permissions
      - grant_types
      - access_token_ttl_sec
      - refresh_token_ttl_sec
      - status
      - created_at
      - updated_at
      properties:
        access_token_ttl_sec:
          type: integer
          format: int64
        client_id:
          type: string
        created_at:
          type: string
          format: date-time
        grant_types:
          type: array
          items:
            type: string
        name:
          type: string
        permissions:
          type: array
          items:
            type: string
        refresh_token_ttl_sec:
          type: integer
          format: int64
        status:
          type: string
        updated_at:
          type: string
          format: date-time
    CreateApiKeyRequest:
      type: object
      required:
      - name
      properties:
        access_token_ttl_sec:
          type:
          - integer
          - 'null'
          format: int64
        grant_types:
          type: array
          items:
            type: string
        name:
          type: string
        permissions:
          type: array
          items:
            type: string
        refresh_token_ttl_sec:
          type:
          - integer
          - 'null'
          format: int64
    CreateRequest:
      type: object
      required:
      - name
      properties:
        access_token_ttl_sec:
          type: integer
          format: int64
        grant_types:
          type: array
          items:
            type: string
        name:
          type: string
        permissions:
          type: array
          items:
            type: string
        refresh_token_ttl_sec:
          type: integer
          format: int64
        status:
          type: string
    CreateResponse:
      type: object
      required:
      - client_id
      - client_secret
      - client
      properties:
        client:
          $ref: '#/components/schemas/ClientDto'
        client_id:
          type: string
        client_secret:
          type: string
    ListApiKeysResponse:
      type: object
      required:
      - items
      - total
      - page
      - size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApiKeySummary'
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 0
        total:
          type: integer
          format: int64
    ListResponse:
      type: object
      required:
      - list
      - total
      - page
      - size
      properties:
        list:
          type: array
          items:
            $ref: '#/components/schemas/ClientDto'
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 0
        total:
          type: integer
          format: int64
    MigrationInfo:
      type: object
      description: JSON 内 `available` 数组元素的形态。
      required:
      - version
      - name
      properties:
        name:
          type: string
        version:
          type: string
    MigrationStateResponse:
      type: object
      description: |-
        端点返回 JSON 的序列化结构。

        字段语义见 spec §2.1。
      required:
      - service
      - dialect
      - available
      - applied
      - in_sync
      - missing
      - extra
      properties:
        applied:
          type: array
          items:
            type: string
        available:
          type: array
          items:
            $ref: '#/components/schemas/MigrationInfo'
        current_version:
          type:
          - string
          - 'null'
        dialect:
          type: string
        extra:
          type: array
          items:
            type: string
        in_sync:
          type: boolean
        missing:
          type: array
          items:
            type: string
        service:
          type: string
    RefreshRequest:
      type: object
      required:
      - refresh_token
      - client_id
      - client_secret
      properties:
        client_id:
          type: string
        client_secret:
          type: string
        refresh_token:
          type: string
    RefreshResponse:
      type: object
      required:
      - access_token
      - refresh_token
      - token_type
      - expires_in
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
          format: int64
        refresh_token:
          type: string
        token_type:
          type: string
    ResetSecretResponse:
      type: object
      required:
      - client_id
      - client_secret
      properties:
        client_id:
          type: string
        client_secret:
          type: string
    RevokeRequest:
      type: object
      required:
      - token_jti
      - expires_in
      properties:
        expires_in:
          type: integer
          format: int64
        token_jti:
          type: string
    RevokeResponse:
      type: object
      required:
      - success
      properties:
        success:
          type: boolean
    UpdateRequest:
      type: object
      properties:
        access_token_ttl_sec:
          type:
          - integer
          - 'null'
          format: int64
        grant_types:
          type:
          - array
          - 'null'
          items:
            type: string
        name:
          type:
          - string
          - 'null'
        permissions:
          type:
          - array
          - 'null'
          items:
            type: string
        refresh_token_ttl_sec:
          type:
          - integer
          - 'null'
          format: int64
        status:
          type:
          - string
          - 'null'
    UserJwtRequest:
      type: object
      required:
      - user_id
      - user_code
      properties:
        claims: {}
        ttl_secs:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        user_code:
          type: string
        user_id:
          type: string
    UserJwtResponse:
      type: object
      required:
      - access_token
      - expires_in
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
          format: int64
          minimum: 0
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: tokens
  description: Token issuance
- name: admin
  description: OAuth client admin
- name: api-key
  description: Long-lived API key (client_credentials only)
