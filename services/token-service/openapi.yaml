openapi: 3.1.0
info:
  title: token-service
  description: Token issuance and OAuth client admin
  license:
    name: ''
  version: 1.7.0
paths:
  /admin/bootstrap-tokens:
    get:
      tags:
      - admin
      summary: List bootstrap tokens (no plaintext secrets)
      operationId: handle_list
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListBootstrapTokensResponse'
      security:
      - bearer_auth: []
    post:
      tags:
      - admin
      summary: Create a bootstrap token (returns plaintext once)
      operationId: handle_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBootstrapTokenRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapTokenCreated'
        '400':
          description: bad request
        '409':
          description: owner already exists
      security:
      - bearer_auth: []
  /admin/bootstrap-tokens/{owner}:
    get:
      tags:
      - admin
      summary: Get one bootstrap token metadata (no plaintext secret)
      operationId: handle_get
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapTokenDto'
        '404':
          description: not found
      security:
      - bearer_auth: []
    delete:
      tags:
      - admin
      summary: Delete a bootstrap token
      operationId: handle_delete
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: deleted
        '404':
          description: not found
      security:
      - bearer_auth: []
  /admin/bootstrap-tokens/{owner}/rotate:
    post:
      tags:
      - admin
      summary: Rotate a bootstrap token (returns new plaintext once)
      operationId: handle_rotate
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
      - name: grace_period_sec
        in: query
        description: 旧 token 的宽限期（秒）。0 = 立即失效；>0 = 新旧 token 并存到该时刻。
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotateBootstrapTokenResponse'
        '404':
          description: not found
      security:
      - bearer_auth: []
  /admin/bootstrap-tokens/{owner}/status:
    put:
      tags:
      - admin
      summary: Enable or disable a bootstrap token
      operationId: handle_set_status
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetStatusRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapTokenDto'
        '400':
          description: bad request
        '404':
          description: not found
      security:
      - bearer_auth: []
  /admin/oauth-clients:
    post:
      tags:
      - admin
      summary: Create OAuth client (returns plaintext client_secret once)
      operationId: handle_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateResponse'
        '400':
          description: bad request
      security:
      - bearer_auth: []
  /admin/oauth-clients/{client_id}:
    put:
      tags:
      - admin
      summary: Update OAuth client
      operationId: handle_update
      parameters:
      - name: client_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientDto'
        '404':
          description: not found
      security:
      - bearer_auth: []
  /admin/oauth-clients/{client_id}/reset-secret:
    post:
      tags:
      - admin
      summary: Reset OAuth client secret (returns new plaintext)
      operationId: handle_reset_secret
      parameters:
      - name: client_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetSecretResponse'
        '404':
          description: not found
      security:
      - bearer_auth: []
  /api-keys:
    get:
      tags:
      - api-key
      summary: |-
        GET /api-keys — 全量列出所有 oauth-clients（当前未区分 api-key / oauth-client，
        共享 token_oauth_clients 表）。返回结构去掉 client_secret_hash 防止泄露。
      operationId: handle_list_api_keys
      parameters:
      - name: keyword
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: page
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      - name: size
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      responses:
        '200':
          description: Paged api-key list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListApiKeysResponse'
    post:
      tags:
      - api-key
      summary: Create API key (returns plaintext secret once)
      operationId: handle_create_api_key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
        required: true
      responses:
        '200':
          description: Created api key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreated'
  /api/v1/admin/oauth-clients:
    get:
      tags:
      - admin
      summary: List OAuth clients
      operationId: handle_list
      parameters:
      - name: keyword
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: status
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
      security:
      - bearer_auth: []
  /api/v1/admin/oauth-clients/{client_id}:
    delete:
      tags:
      - admin
      summary: Delete OAuth client
      operationId: handle_delete
      parameters:
      - name: client_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: deleted
        '404':
          description: not found
      security:
      - bearer_auth: []
  /token/internal/migrations/state:
    get:
      tags:
      - internal
      summary: Query token-service migration state
      operationId: handler
      responses:
        '200':
          description: schema state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationStateResponse'
        '401':
          description: missing or invalid service-jwt
        '503':
          description: db_unreachable
      security:
      - bearer_auth: []
  /tokens/access:
    post:
      tags:
      - tokens
      summary: Issue access token via authorization_code or client_credentials
      operationId: handle_access
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessRequest'
        required: true
      responses:
        '200':
          description: issued tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessResponse'
        '400':
          description: bad request
        '401':
          description: invalid client
  /tokens/refresh:
    post:
      tags:
      - tokens
      summary: Refresh access token (single-use refresh_token)
      operationId: handle_refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: refreshed tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          description: invalid or expired
  /tokens/revoke:
    post:
      tags:
      - tokens
      summary: Revoke token (add to blacklist)
      operationId: handle_revoke
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeRequest'
        required: true
      responses:
        '200':
          description: revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeResponse'
  /tokens/user-jwt:
    post:
      tags:
      - tokens
      summary: Issue user JWT (service-to-service)
      operationId: handle_user_jwt
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserJwtRequest'
        required: true
      responses:
        '200':
          description: user jwt issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserJwtResponse'
  /v1/admin/bootstrap-tokens:
    get:
      tags:
      - bootstrap-token
      summary: List bootstrap tokens (Web UI, requires TOKEN_BOOTSTRAP_READ)
      operationId: handle_list
      parameters:
      - name: keyword
        in: query
        description: 按 owner 模糊过滤。
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: status
        in: query
        description: '`active` | `disabled`；缺省 = 不过滤。'
        required: false
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListBootstrapTokensResponse'
        '403':
          description: permission denied
      security:
      - bearer_auth: []
    post:
      tags:
      - bootstrap-token
      summary: Create a bootstrap token (Web UI, returns plaintext once)
      operationId: handle_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBootstrapTokenRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapTokenCreated'
        '400':
          description: bad request
        '403':
          description: permission denied
        '409':
          description: owner already exists
      security:
      - bearer_auth: []
  /v1/admin/bootstrap-tokens/{owner}:
    get:
      tags:
      - bootstrap-token
      summary: Get one bootstrap token metadata (Web UI)
      operationId: handle_get
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapTokenDto'
        '403':
          description: permission denied
        '404':
          description: not found
      security:
      - bearer_auth: []
    delete:
      tags:
      - bootstrap-token
      summary: Delete a bootstrap token (Web UI)
      operationId: handle_delete
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: deleted
        '403':
          description: permission denied
        '404':
          description: not found
      security:
      - bearer_auth: []
  /v1/admin/bootstrap-tokens/{owner}/rotate:
    post:
      tags:
      - bootstrap-token
      summary: Rotate a bootstrap token (Web UI, returns new plaintext once)
      operationId: handle_rotate
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotateBootstrapTokenResponse'
        '403':
          description: permission denied
        '404':
          description: not found
      security:
      - bearer_auth: []
  /v1/admin/bootstrap-tokens/{owner}/status:
    put:
      tags:
      - bootstrap-token
      summary: Enable or disable a bootstrap token (Web UI)
      operationId: handle_set_status
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetStatusRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapTokenDto'
        '400':
          description: bad request
        '403':
          description: permission denied
        '404':
          description: not found
      security:
      - bearer_auth: []
components:
  schemas:
    AccessRequest:
      type: object
      description: 既有 OpenAPI schema（JSON 编码的授权码交换）。
      required:
      - grant_type
      - code
      - client_id
      - client_secret
      properties:
        client_id:
          type: string
        client_secret:
          type: string
        code:
          type: string
        grant_type:
          type: string
    AccessResponse:
      type: object
      required:
      - access_token
      - refresh_token
      - token_type
      - expires_in
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
          format: int64
        refresh_token:
          type: string
        token_type:
          type: string
    ApiKeyCreated:
      type: object
      required:
      - api_key_id
      - api_key_secret
      properties:
        api_key_id:
          type: string
        api_key_secret:
          type: string
    ApiKeySummary:
      type: object
      required:
      - id
      - name
      - permissions
      - status
      - created_at
      properties:
        created_at:
          type: string
          format: date-time
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        id:
          type: string
        name:
          type: string
        permissions:
          type: array
          items:
            type: string
        status:
          type: string
        user_id:
          type:
          - string
          - 'null'
    BootstrapTokenCreated:
      type: object
      required:
      - owner
      - token
      properties:
        owner:
          type: string
        token:
          type: string
          description: 明文 token——**仅此一次可见**，调用方需立刻保存。
    BootstrapTokenDto:
      type: object
      description: 列表项：刻意**不含** token 明文。
      required:
      - owner
      - status
      - created_at
      - updated_at
      - is_grace_row
      properties:
        created_at:
          type: string
          format: date-time
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        is_grace_row:
          type: boolean
          description: true 表示这是 rotate 宽限期遗留的旧 token 行。
        last_used_at:
          type:
          - string
          - 'null'
          format: date-time
        owner:
          type: string
        status:
          type: string
        updated_at:
          type: string
          format: date-time
    ClientDto:
      type: object
      required:
      - client_id
      - name
      - permissions
      - grant_types
      - access_token_ttl_sec
      - refresh_token_ttl_sec
      - status
      - created_at
      - updated_at
      properties:
        access_token_ttl_sec:
          type: integer
          format: int64
        client_id:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        grant_types:
          type: array
          items:
            type: string
        name:
          type: string
        permissions:
          type: array
          items:
            type: string
        refresh_token_ttl_sec:
          type: integer
          format: int64
        status:
          type: string
        updated_at:
          type: string
          format: date-time
        user_id:
          type:
          - string
          - 'null'
    CreateApiKeyRequest:
      type: object
      required:
      - name
      properties:
        access_token_ttl_sec:
          type:
          - integer
          - 'null'
          format: int64
        expires_at:
          type:
          - string
          - 'null'
          description: API Key 自身过期时间（RFC3339）；缺省 = 不过期。
        grant_types:
          type: array
          items:
            type: string
        name:
          type: string
        permissions:
          type: array
          items:
            type: string
        refresh_token_ttl_sec:
          type:
          - integer
          - 'null'
          format: int64
        user_id:
          type:
          - string
          - 'null'
          description: 绑定的用户 id；client_credentials 流程用它作为 token 的 sub。
    CreateBootstrapTokenRequest:
      type: object
      required:
      - owner
      properties:
        expires_at:
          type:
          - string
          - 'null'
          description: 过期时间（RFC3339）；缺省 = 不过期。
        owner:
          type: string
          description: 服务名（`iam-service` 等），JWT 的 `sub` 即此值。
    CreateRequest:
      type: object
      required:
      - name
      properties:
        access_token_ttl_sec:
          type: integer
          format: int64
        expires_at:
          type:
          - string
          - 'null'
          description: API Key 自身过期时间（RFC3339）；缺省 = 不过期。
        grant_types:
          type: array
          items:
            type: string
        name:
          type: string
        permissions:
          type: array
          items:
            type: string
        refresh_token_ttl_sec:
          type: integer
          format: int64
        status:
          type: string
        user_id:
          type:
          - string
          - 'null'
          description: 绑定的用户 id；client_credentials 流程用它作为 token 的 sub。
    CreateResponse:
      type: object
      required:
      - client_id
      - client_secret
      - client
      properties:
        client:
          $ref: '#/components/schemas/ClientDto'
        client_id:
          type: string
        client_secret:
          type: string
    ListApiKeysResponse:
      type: object
      required:
      - items
      - total
      - page
      - size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApiKeySummary'
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 0
        total:
          type: integer
          format: int64
    ListBootstrapTokensResponse:
      type: object
      required:
      - items
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BootstrapTokenDto'
        total:
          type: integer
          format: int64
    ListResponse:
      type: object
      required:
      - list
      - total
      - page
      - size
      properties:
        list:
          type: array
          items:
            $ref: '#/components/schemas/ClientDto'
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 0
        total:
          type: integer
          format: int64
    MigrationInfo:
      type: object
      description: JSON 内 `available` 数组元素的形态。
      required:
      - version
      - name
      properties:
        name:
          type: string
        version:
          type: string
    MigrationStateResponse:
      type: object
      description: |-
        端点返回 JSON 的序列化结构。

        字段语义见 spec §2.1。
      required:
      - service
      - dialect
      - available
      - applied
      - in_sync
      - missing
      - extra
      properties:
        applied:
          type: array
          items:
            type: string
        available:
          type: array
          items:
            $ref: '#/components/schemas/MigrationInfo'
        current_version:
          type:
          - string
          - 'null'
        dialect:
          type: string
        extra:
          type: array
          items:
            type: string
        in_sync:
          type: boolean
        missing:
          type: array
          items:
            type: string
        service:
          type: string
    RefreshRequest:
      type: object
      required:
      - refresh_token
      - client_id
      - client_secret
      properties:
        client_id:
          type: string
        client_secret:
          type: string
        refresh_token:
          type: string
    RefreshResponse:
      type: object
      required:
      - access_token
      - refresh_token
      - token_type
      - expires_in
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
          format: int64
        refresh_token:
          type: string
        token_type:
          type: string
    ResetSecretResponse:
      type: object
      required:
      - client_id
      - client_secret
      properties:
        client_id:
          type: string
        client_secret:
          type: string
    RevokeRequest:
      type: object
      required:
      - token_jti
      - expires_in
      properties:
        expires_in:
          type: integer
          format: int64
        token_jti:
          type: string
    RevokeResponse:
      type: object
      required:
      - success
      properties:
        success:
          type: boolean
    RotateBootstrapTokenResponse:
      type: object
      required:
      - owner
      - token
      properties:
        old_token_expires_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 旧 token 的失效时间；None = 旧 token 已立即失效。
        owner:
          type: string
        token:
          type: string
          description: 新 token 明文——**仅此一次可见**。
    RotateRequest:
      type: object
      description: 轮换请求体（Web UI 用 JSON body 而非 query string）。
      properties:
        grace_period_sec:
          type:
          - integer
          - 'null'
          format: int64
          description: 旧 token 的宽限期（秒）。0 = 立即失效；>0 = 新旧 token 并存到该时刻。
    SetStatusRequest:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          description: '`active` | `disabled`。'
    UpdateRequest:
      type: object
      properties:
        access_token_ttl_sec:
          type:
          - integer
          - 'null'
          format: int64
        grant_types:
          type:
          - array
          - 'null'
          items:
            type: string
        name:
          type:
          - string
          - 'null'
        permissions:
          type:
          - array
          - 'null'
          items:
            type: string
        refresh_token_ttl_sec:
          type:
          - integer
          - 'null'
          format: int64
        status:
          type:
          - string
          - 'null'
