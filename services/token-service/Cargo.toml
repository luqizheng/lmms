[package]
name = "token-service"
version = "0.1.0"
edition = "2021"
default-run = "token-service"

[dev-dependencies]
mockall = "0.13"
tokio-test = "0.4"
tower = { version = "0.5", features = ["util"] }
hyper = "1"
testcontainers = "0.20"
testcontainers-modules = { version = "0.8", features = ["mysql"] }
reqwest.workspace = true

[dependencies]
common = { path = "../../libs/common" }
common-telemetry = { path = "../../libs/common-telemetry", features = ["otlp"] }
common-telemetry-axum = { path = "../../libs/common-telemetry-axum", features = ["otlp"] }
common-config = { path = "../../libs/common-config", features = ["config-service"] }
consul-registrar = { path = "../../libs/consul-registrar" }
axum.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
jwt-simple.workspace = true
uuid.workspace = true
argon2.workspace = true
thiserror.workspace = true
opentelemetry = "0.24"
tracing-opentelemetry = "0.25"
rand.workspace = true
base64.workspace = true
rsa.workspace = true
hyper = "1"
hyper-util = { version = "0.1", features = ["client-legacy", "tokio"] }
http-body-util = "0.1"
bytes = "1"
authz = { path = "../../libs/authz" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "mysql", "macros", "chrono", "json"] }
serde_yaml = "0.9"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
prometheus = "0.13"
prometheus_exporter = "0.1"
utoipa = { version = "5", features = ["axum_extras", "chrono", "yaml"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

[[bin]]
name = "dump-openapi"
path = "src/bin/dump-openapi.rs"



