[package]
name = "token_service"
version.workspace = true
edition = "2021"
default-run = "token_service"

[dev-dependencies]
mockall = "0.13"
tokio-test = "0.4"
tower = { version = "0.5", features = ["util"] }
hyper = "1"
testcontainers = "0.20"
testcontainers-modules = { version = "0.8", features = ["mysql"] }
reqwest.workspace = true
tempfile = "3"

[features]
# 方言 feature：default 只含 mysql，postgres 必须显式开启（D-9：postgres 不进 default）。
# 宏 `db_*!` 内部的 #[cfg(feature = ...)] 在**调用方 crate** 求值，因此本 crate
# 必须定义与 libs/common-db 同名的 feature，并把它们转发过去。
default = ["mysql"]
mysql = ["sqlx/mysql", "digua_common_db/mysql", "digua_common/mysql"]
postgres = ["sqlx/postgres", "digua_common_db/postgres", "digua_common/postgres"]
sqlite = ["sqlx/sqlite", "digua_common_db/sqlite", "digua_common/sqlite"]

[dependencies]
digua_common_consul = { path = "../../libs/common-consul" }
digua_common = { path = "../../libs/common" }
digua_common_telemetry = { path = "../../libs/common-telemetry", features = ["otlp"] }
digua_common_telemetry_axum = { path = "../../libs/common-telemetry-axum", features = ["otlp"] }
digua_common_db = { path = "../../libs/common-db", features = ["mysql", "openapi"] }
digua_common_http = { path = "../../libs/common-http" }
digua_common_jwt = { path = "../../libs/common-jwt" }
digua_jwt_ctx = { path = "../../libs/jwt-ctx" }
reqwest.workspace = true
axum.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded = "0.7"
jwt-simple.workspace = true
uuid.workspace = true
argon2.workspace = true
thiserror.workspace = true
opentelemetry = "0.24"
tracing-opentelemetry = "0.25"
rand.workspace = true
base64.workspace = true
rsa.workspace = true
hyper = "1"
hyper-util = { version = "0.1", features = ["client-legacy", "tokio"] }
http-body-util = "0.1"
bytes = "1"
digua_authz = { path = "../../libs/authz" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "mysql", "macros", "chrono", "json"] }
serde_yaml = "0.9"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
prometheus = "0.13"
utoipa = { version = "5", features = ["axum_extras", "chrono", "yaml"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

[[bin]]
name = "dump_openapi_token_service"
path = "src/bin/dump-openapi.rs"



