[package]
name = "prue_backend"
version = "0.1.0"
edition = "2021"
default-run = "prue_backend"

[dependencies]
common-db = { path = "../../libs/common-db", features = ["mysql", "sqlite"] }
common-jwt = { path = "../../libs/common-jwt" }
common-log = { path = "../../libs/common-log" }
common-telemetry = { path = "../../libs/common-telemetry", features = ["otlp"] }
common-telemetry-axum = { path = "../../libs/common-telemetry-axum", features = ["otlp"] }
jwt-ctx = { path = "../../libs/jwt-ctx" }
authz = { path = "../../libs/authz" }

axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "mysql", "sqlite", "chrono", "json"] }
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
nanoid = "0.4"
sha2.workspace = true
prometheus = "0.13"
utoipa = { version = "5", features = ["axum_extras", "chrono", "yaml"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
anyhow = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[bin]]
name = "prue_backend"
path = "src/main.rs"

[[bin]]
name = "dump-openapi"
path = "src/bin/dump-openapi.rs"
