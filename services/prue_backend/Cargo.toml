[package]
name = "prue_backend"
version = "0.1.0"
edition = "2021"
default-run = "prue_backend"

[features]
# 方言 feature：default 只含 mysql，postgres 必须显式开启（D-9：postgres 不进 default）。
# 注意：本 crate 暂不提供 postgres feature —— src/db.rs:10 与 src/routes/migration_state.rs:40
# 是对 digua_common_db::DbPool 的**穷尽 match**（E0004），新增 Postgres 变体即编译失败。
# 修复需改 services/** 的 .rs（设计文档 §2.1.3 明确禁止穷尽 match），属 S3 范围。
# 宏 `db_*!` 内部的 #[cfg(feature = ...)] 在**调用方 crate** 求值，因此本 crate
# 必须定义与 libs/common-db 同名的 feature，并把它们转发过去。
default = ["mysql", "sqlite"]
mysql = ["sqlx/mysql", "digua_common_db/mysql"]
sqlite = ["sqlx/sqlite", "digua_common_db/sqlite"]

[dependencies]
digua_common_db = { path = "../../libs/common-db", features = ["mysql", "sqlite", "openapi"] }
digua_common_jwt = { path = "../../libs/common-jwt" }
digua_common_log = { path = "../../libs/common-log" }
digua_common_telemetry = { path = "../../libs/common-telemetry", features = ["otlp"] }
digua_common_telemetry_axum = { path = "../../libs/common-telemetry-axum", features = ["otlp"] }
digua_jwt_ctx = { path = "../../libs/jwt-ctx" }
digua_authz = { path = "../../libs/authz" }

axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "mysql", "sqlite", "chrono", "json"] }
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest.workspace = true
nanoid = "0.4"
sha2.workspace = true
prometheus = "0.13"
utoipa = { version = "5", features = ["axum_extras", "chrono", "yaml"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
anyhow = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[bin]]
name = "prue_backend"
path = "src/main.rs"

[[bin]]
name = "dump_openapi"
path = "src/bin/dump-openapi.rs"
