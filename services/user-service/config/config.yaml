server:
  host: "127.0.0.1"
  port: 6000

database:
  type: "mysql"
  host: "localhost"
  port: 3306
  user: "root"
  password: "rootpass"
  name: "superpowers"

consul:
  addr: "http://localhost:8500"
  service_name: "user-service"
  service_id_file: "/tmp/user-service-service-id"

