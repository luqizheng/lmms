server:
  host: "0.0.0.0"
  port: 8082
database:
  db_type: mysql
  url: "mysql://user:pass@localhost:3306/kudi"
  max_connections: 16
redis:
  url: "redis://localhost:6379"
auth:
  service_token_issuer: "token-service"
  service_token_audience: "user-service"
consul:
  addr: "http://consul:8500"
  service_name: "user-service"
  service_id_file: "/tmp/user-service-id"

login_security:
  max_failures: 6
  lockout_duration: 5m
  counter_window: 15m
  code_ttl: 5m
  argon2:
    memory_kib: 19456
    iterations: 2
    parallelism: 1
