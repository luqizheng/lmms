[package]
name = "iam_outbox_publisher"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
digua_common_event = { path = "../../libs/common-event" }
digua_common_telemetry = { path = "../../libs/common-telemetry", default-features = false, features = ["otlp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
prometheus = "0.13"
sqlx = { version = "0.8", features = ["runtime-tokio", "mysql", "chrono", "uuid"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
