[package]
name = "iam_outbox_publisher"
version.workspace = true
edition = "2021"

# 方言 feature：default 只含 mysql，postgres 必须显式开启（D-9：postgres 不进 default）。
# 方言 feature 经本段转发到 sqlx/* 与 digua_common_db/*（依赖声明不硬写 postgres）。
[features]
default = ["mysql"]
mysql = ["sqlx/mysql", "digua_common_db/mysql", "digua_common_event/mysql"]
postgres = ["sqlx/postgres", "digua_common_db/postgres", "digua_common_event/postgres"]

[dependencies]
anyhow = "1"
digua_common_db = { path = "../../libs/common-db" }
digua_common_event = { path = "../../libs/common-event" }
digua_common_telemetry = { path = "../../libs/common-telemetry", default-features = false, features = ["otlp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
prometheus = "0.13"
sqlx = { version = "0.8", features = ["runtime-tokio", "chrono", "uuid"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
