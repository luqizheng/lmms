[package]
name = "iam_service"
version.workspace = true
edition = "2021"
default-run = "iam_service"

[features]
# 方言 feature：default 只含 mysql，postgres 必须显式开启（D-9：postgres 不进 default）。
# 宏 `db_*!` 内部的 #[cfg(feature = ...)] 在**调用方 crate** 求值，因此本 crate
# 必须定义与 libs/common-db 同名的 feature，并把它们转发过去。
default = ["mysql"]
# digua_common_event 同名转发（S5d）：AnyTx::Postgres / SqlOutboxRepo 的
# PG 分支都挂在它的 postgres feature 后面。
mysql = ["sqlx/mysql", "digua_common_db/mysql", "digua_common/mysql", "digua_common_event/mysql"]
postgres = ["sqlx/postgres", "digua_common_db/postgres", "digua_common/postgres", "digua_common_event/postgres"]
sqlite = ["sqlx/sqlite", "digua_common_db/sqlite", "digua_common/sqlite"]

[dependencies]
digua_common_consul = { path = "../../libs/common-consul" }
digua_common = { path = "../../libs/common" }
digua_common_error = { path = "../../libs/common-error" }
digua_common_event = { path = "../../libs/common-event" }
digua_common_log = { path = "../../libs/common-log" }
digua_common_telemetry = { path = "../../libs/common-telemetry", features = ["otlp"] }
digua_common_telemetry_axum = { path = "../../libs/common-telemetry-axum", features = ["otlp"] }
digua_common_config = { path = "../../libs/common-config" }
digua_common_db = { path = "../../libs/common-db", features = ["mysql", "sqlite", "openapi"] }
digua_common_cache = { path = "../../libs/common-cache" }
digua_common_crypto = { path = "../../libs/common-crypto" }
digua_common_validator = { path = "../../libs/common-validator" }
digua_jwt_ctx = { path = "../../libs/jwt-ctx" }
digua_authz = { path = "../../libs/authz" }
digua_common_jwt = { path = "../../libs/common-jwt" }
axum.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
argon2.workspace = true
thiserror.workspace = true
rand.workspace = true
reqwest.workspace = true

hyper = "1"
hyper-util = { version = "0.1", features = ["client-legacy", "tokio"] }
http-body-util = "0.1"
bytes = "1"

sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "mysql", "chrono", "json"] }
serde_yaml = "0.9"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
nanoid = "0.4"
validator = { version = "0.18", features = ["derive"] }
prometheus = "0.13"
utoipa = { version = "5", features = ["axum_extras", "chrono", "yaml"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
sha2 = "0.10"
hex = "0.4"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "hostname", "aws-lc-rs", "webpki-roots"] }

[[bin]]
name = "dump_openapi"
path = "src/bin/dump-openapi.rs"

[dev-dependencies]
testcontainers = "0.20"
testcontainers-modules = { version = "0.8", features = ["mysql", "redis"] }
tempfile = "3"
reqwest.workspace = true
mockall = "0.13"
digua_common_jwt = { path = "../../libs/common-jwt" }
jwt-simple.workspace = true
base64 = "0.22"
wiremock = "0.6"

[[bin]]
name = "iam_service"
path = "src/main.rs"
