openapi: 3.1.0
info:
  title: iam-service
  description: Identity, role and user management
  license:
    name: ''
  version: 0.1.0
paths:
  /iam/auth/login:
    post:
      tags:
      - auth
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: invalid credentials
  /iam/auth/logout:
    post:
      tags:
      - auth
      operationId: logout
      responses:
        '204':
          description: logged out
      security:
      - bearer_auth: []
  /iam/auth/password:
    post:
      tags:
      - auth
      operationId: change_password
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      responses:
        '200':
          description: password changed
        '401':
          description: invalid credentials
      security:
      - bearer_auth: []
  /iam/auth/refresh:
    post:
      tags:
      - auth
      operationId: refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: token expired
  /iam/auth/register:
    post:
      tags:
      - auth
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
        required: true
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '403':
          description: registration closed (users already exist)
        '409':
          description: username already exists
  /iam/auth/sessions:
    get:
      tags:
      - auth
      operationId: list_sessions
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionInfo'
      security:
      - bearer_auth: []
  /iam/auth/sessions/{session_id}:
    delete:
      tags:
      - auth
      operationId: revoke_session
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: session revoked
        '404':
          description: session not found
      security:
      - bearer_auth: []
  /iam/auth/setup-status:
    get:
      tags:
      - auth
      operationId: setup_status
      responses:
        '200':
          description: '{ setup_required: bool, user_count: i64 }'
  /iam/internal/users/by-dept/{dept_id}:
    get:
      tags:
      - internal
      operationId: list_users_by_dept
      parameters:
      - name: dept_id
        in: path
        required: true
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: tenant_id
        in: query
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserIdListResponse'
        '400':
          description: missing or invalid tenant_id
        '401':
          description: mesh intention denied
  /iam/internal/users/by-role/{role_id}:
    get:
      tags:
      - internal
      operationId: list_users_by_role
      parameters:
      - name: role_id
        in: path
        required: true
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: tenant_id
        in: query
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserIdListResponse'
        '400':
          description: missing or invalid tenant_id
        '401':
          description: mesh intention denied
  /iam/org-units:
    get:
      tags:
      - org_units
      operationId: list_org_units
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrgUnitResponse'
  /iam/internal/membership-bootstrap:
    get:
      tags:
      - internal
      operationId: membership_bootstrap
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipBootstrap'
        '401':
          description: missing or invalid service-jwt
      security:
      - bearer_auth: []
  /iam/internal/migrations/state:
    get:
      tags:
      - internal
      operationId: migration_state_handler
      responses:
        '200':
          description: schema state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationStateResponse'
        '401':
          description: missing or invalid service-jwt
        '503':
          description: db_unreachable
      security:
      - bearer_auth: []
    post:
      tags:
      - org_units
      operationId: create_org_unit
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrgUnitRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgUnitResponse'
        '409':
          description: duplicate org unit
      security:
      - bearer_auth: []
  /iam/org-units/{org_unit_id}:
    get:
      tags:
      - org_units
      operationId: get_org_unit
      parameters:
      - name: org_unit_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgUnitResponse'
        '404':
          description: org unit not found
      security:
      - bearer_auth: []
    put:
      tags:
      - org_units
      operationId: update_org_unit
      parameters:
      - name: org_unit_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrgUnitRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgUnitResponse'
        '404':
          description: org unit not found
      security:
      - bearer_auth: []
    delete:
      tags:
      - org_units
      operationId: delete_org_unit
      parameters:
      - name: org_unit_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: org unit deleted
        '404':
          description: org unit not found
        '409':
          description: conflict
      security:
      - bearer_auth: []
  /iam/org-units/{org_unit_id}/users:
    put:
      tags:
      - org_units
      operationId: assign_users
      parameters:
      - name: org_unit_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignUsersRequest'
        required: true
      responses:
        '204':
          description: users assigned
      security:
      - bearer_auth: []
  /iam/permissions:
    get:
      tags:
      - permissions
      operationId: list_permissions
      parameters:
      - name: keyword
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: category
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
      - name: page
        in: query
        required: true
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: size
        in: query
        required: true
        schema:
          type: integer
          format: int32
          minimum: 0
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionListResponse'
      security:
      - bearer_auth: []
    post:
      tags:
      - permissions
      operationId: create_permission
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePermissionRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionResponse'
        '409':
          description: duplicate permission
      security:
      - bearer_auth: []
  /iam/permissions/{permission_id}:
    get:
      tags:
      - permissions
      operationId: get_permission
      parameters:
      - name: permission_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionResponse'
        '404':
          description: permission not found
      security:
      - bearer_auth: []
    put:
      tags:
      - permissions
      operationId: update_permission
      parameters:
      - name: permission_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePermissionRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionResponse'
        '404':
          description: permission not found
      security:
      - bearer_auth: []
    delete:
      tags:
      - permissions
      operationId: delete_permission
      parameters:
      - name: permission_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: permission deleted
        '404':
          description: permission not found
      security:
      - bearer_auth: []
  /iam/roles:
    get:
      tags:
      - roles
      operationId: list_roles
      parameters:
      - name: keyword
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: status
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: page
        in: query
        required: true
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: size
        in: query
        required: true
        schema:
          type: integer
          format: int32
          minimum: 0
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListResponse'
      security:
      - bearer_auth: []
    post:
      tags:
      - roles
      operationId: create_role
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '409':
          description: duplicate role
      security:
      - bearer_auth: []
  /iam/roles/{role_id}:
    get:
      tags:
      - roles
      operationId: get_role
      parameters:
      - name: role_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '404':
          description: role not found
      security:
      - bearer_auth: []
    put:
      tags:
      - roles
      operationId: update_role
      parameters:
      - name: role_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '404':
          description: role not found
      security:
      - bearer_auth: []
    delete:
      tags:
      - roles
      operationId: delete_role
      parameters:
      - name: role_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: deleted
        '404':
          description: role not found
      security:
      - bearer_auth: []
  /iam/roles/{role_id}/permissions:
    put:
      tags:
      - roles
      operationId: assign_permissions
      parameters:
      - name: role_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignPermissionsRequest'
        required: true
      responses:
        '204':
          description: permissions assigned
        '404':
          description: role not found
      security:
      - bearer_auth: []
  /iam/tenants:
    post:
      tags:
      - tenants
      operationId: register_tenant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
        required: true
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTenantResponse'
        '400':
          description: invalid request
        '409':
          description: tenant slug already exists
  /iam/users:
    get:
      tags:
      - users
      operationId: list_users
      parameters:
      - name: keyword
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: status
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: org_unit_id
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: page
        in: query
        required: true
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: size
        in: query
        required: true
        schema:
          type: integer
          format: int32
          minimum: 0
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
      security:
      - bearer_auth: []
    post:
      tags:
      - users
      operationId: create_user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '409':
          description: duplicate user
      security:
      - bearer_auth: []
  /iam/users/simple:
    get:
      tags:
      - users
      operationId: list_users_simple
      parameters:
      - name: keyword
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSimpleListResponse'
      security:
      - bearer_auth: []
  /iam/users/{user_id}:
    get:
      tags:
      - users
      operationId: get_user
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: not found
      security:
      - bearer_auth: []
    put:
      tags:
      - users
      operationId: update_user
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: not found
      security:
      - bearer_auth: []
    delete:
      tags:
      - users
      operationId: delete_user
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: deleted
        '404':
          description: not found
      security:
      - bearer_auth: []
  /iam/users/{user_id}/roles:
    put:
      tags:
      - users
      operationId: assign_user_roles
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignUserRolesRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignUserRolesResponse'
        '400':
          description: invalid role ids
        '404':
          description: user not found
      security:
      - bearer_auth: []
  /internal/users/{user_id}/claims:
    get:
      tags:
      - internal
      operationId: get_user_claims
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserClaimsResponse'
        '404':
          description: user not found
      security:
      - bearer_auth: []
components:
  schemas:
    AssignPermissionsRequest:
      type: object
      required:
      - permission_ids
      properties:
        permission_ids:
          type: array
          items:
            type: string
    AssignUserRolesRequest:
      type: object
      required:
      - role_ids
      properties:
        role_ids:
          type: array
          items:
            type: string
    AssignUserRolesResponse:
      type: object
      required:
      - user_id
      - role_ids
      properties:
        role_ids:
          type: array
          items:
            type: string
        user_id:
          type: string
    BatchImportUsersRequest:
      type: object
      required:
      - users
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/CreateUserRequest'
    AssignUsersRequest:
      type: object
      required:
      - user_ids
      properties:
        user_ids:
          type: array
          items:
            type: string
    ChangePasswordRequest:
      type: object
      required:
      - old_password
      - new_password
      properties:
        new_password:
          type: string
        old_password:
          type: string
    CreateOrgUnitRequest:
      type: object
      required:
      - name
      - code
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 50
        name:
          type: string
          minLength: 1
          maxLength: 100
        parent_id:
          type:
          - string
          - 'null'
        sort_order:
          type:
          - integer
          - 'null'
          format: int32
    CreatePermissionRequest:
      type: object
      required:
      - code
      - name
      - category
      properties:
        action:
          type:
          - string
          - 'null'
        category:
          type: integer
          format: int32
          minimum: 0
          maximum: 2
        code:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type:
          - string
          - 'null'
        name:
          type: string
          minLength: 1
          maxLength: 100
        resource:
          type:
          - string
          - 'null'
        sort_order:
          type:
          - integer
          - 'null'
          format: int32
    CreateRoleRequest:
      type: object
      required:
      - name
      - code
      - data_scope
      properties:
        code:
          type: string
        data_scope:
          type: integer
          format: int32
        description:
          type:
          - string
          - 'null'
        name:
          type: string
    CreateTenantRequest:
      type: object
      required:
      - tenant_slug
      - display_name
      - admin_username
      - admin_password
      properties:
        admin_email:
          type:
          - string
          - 'null'
        admin_password:
          type: string
        admin_username:
          type: string
        display_name:
          type: string
        tenant_slug:
          type: string
    CreateTenantResponse:
      type: object
      required:
      - tenant_id
      - admin_user_id
      properties:
        admin_user_id:
          type: string
        tenant_id:
          type: integer
          format: int64
    CreateUserRequest:
      type: object
      required:
      - username
      - password
      - nickname
      properties:
        avatar:
          type:
          - string
          - 'null'
        email:
          type:
          - string
          - 'null'
        nickname:
          type: string
        password:
          type: string
        phone:
          type:
          - string
          - 'null'
        role_ids:
          type:
          - array
          - 'null'
          items:
            type: string
        username:
          type: string
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        password:
          type: string
        tenant_slug:
          type:
          - string
          - 'null'
        username:
          type: string
    LoginResponse:
      type: object
      required:
      - access_token
      - refresh_token
      - token_type
      - expires_in
      - user
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
          format: int64
          minimum: 0
        refresh_token:
          type: string
        token_type:
          type: string
        user:
          $ref: '#/components/schemas/UserInfo'
    OrgUnitResponse:
      type: object
      required:
      - id
      - name
      - code
      - level
      - sort_order
      - status
      - created_at
      - updated_at
      - children
      properties:
        children:
          type: array
          items:
            $ref: '#/components/schemas/OrgUnitResponse'
        code:
          type: string
        created_at:
          type: string
          format: date-time
        id:
          type: string
        level:
          type: integer
          format: int32
        name:
          type: string
        parent_id:
          type:
          - string
          - 'null'
        sort_order:
          type: integer
          format: int32
        status:
          type: string
        updated_at:
          type: string
          format: date-time
    PermissionListResponse:
      type: object
      required:
      - items
      - total
      - page
      - size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PermissionResponse'
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 0
        total:
          type: integer
          format: int64
          minimum: 0
    PermissionQuery:
      type: object
