openapi: 3.1.0
info:
  title: iam-service
  description: Identity, role and user management
  license:
    name: ''
  version: 0.1.0
paths:
  /iam/auth/login:
    post:
      tags:
      - auth
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: invalid credentials
  /iam/auth/logout:
    post:
      tags:
      - auth
      operationId: logout
      responses:
        '204':
          description: logged out
      security:
      - bearer_auth: []
  /iam/auth/password:
    post:
      tags:
      - auth
      operationId: change_password
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      responses:
        '200':
          description: password changed
        '401':
          description: invalid credentials
      security:
      - bearer_auth: []
  /iam/auth/refresh:
    post:
      tags:
      - auth
      operationId: refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: token expired
  /iam/auth/register:
    post:
      tags:
      - auth
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
        required: true
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '403':
          description: registration closed (users already exist)
        '409':
          description: username already exists
  /iam/auth/sessions:
    get:
      tags:
      - auth
      operationId: list_sessions
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionInfo'
      security:
      - bearer_auth: []
  /iam/auth/sessions/{session_id}:
    delete:
      tags:
      - auth
      operationId: revoke_session
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: session revoked
        '404':
          description: session not found
      security:
      - bearer_auth: []
  /iam/auth/setup-status:
    get:
      tags:
      - auth
      operationId: setup_status
      responses:
        '200':
          description: '{ setup_required: bool, user_count: i64 }'
  /iam/internal/users/by-dept/{dept_id}:
    get:
      tags:
      - internal
      operationId: list_users_by_dept
      parameters:
      - name: dept_id
        in: path
        required: true
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: tenant_id
        in: query
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserIdListResponse'
        '400':
          description: missing or invalid tenant_id
        '401':
          description: mesh intention denied
  /iam/internal/users/by-role/{role_id}:
    get:
      tags:
      - internal
      operationId: list_users_by_role
      parameters:
      - name: role_id
        in: path
        required: true
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: tenant_id
        in: query
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserIdListResponse'
        '400':
          description: missing or invalid tenant_id
        '401':
          description: mesh intention denied
  /iam/roles:
    get:
      tags:
      - roles
      operationId: list_roles
      parameters:
      - name: keyword
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: status
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: page
        in: query
        required: true
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: size
        in: query
        required: true
        schema:
          type: integer
          format: int32
          minimum: 0
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListResponse'
      security:
      - bearer_auth: []
    post:
      tags:
      - roles
      operationId: create_role
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '409':
          description: duplicate role
      security:
      - bearer_auth: []
  /iam/roles/{role_id}:
    get:
      tags:
      - roles
      operationId: get_role
      parameters:
      - name: role_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '404':
          description: role not found
      security:
      - bearer_auth: []
    put:
      tags:
      - roles
      operationId: update_role
      parameters:
      - name: role_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '404':
          description: role not found
      security:
      - bearer_auth: []
    delete:
      tags:
      - roles
      operationId: delete_role
      parameters:
      - name: role_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: deleted
        '404':
          description: role not found
      security:
      - bearer_auth: []
  /iam/roles/{role_id}/permissions:
    put:
      tags:
      - roles
      operationId: assign_permissions
      parameters:
      - name: role_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignPermissionsRequest'
        required: true
      responses:
        '204':
          description: permissions assigned
        '404':
          description: role not found
      security:
      - bearer_auth: []
  /iam/tenants:
    post:
      tags:
      - tenants
      operationId: register_tenant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
        required: true
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTenantResponse'
        '400':
          description: invalid request
        '409':
          description: tenant slug already exists
  /iam/users:
    get:
      tags:
      - users
      operationId: list_users
      parameters:
      - name: keyword
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: status
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: org_unit_id
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: page
        in: query
        required: true
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: size
        in: query
        required: true
        schema:
          type: integer
          format: int32
          minimum: 0
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
      security:
      - bearer_auth: []
    post:
      tags:
      - users
      operationId: create_user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '409':
          description: duplicate user
      security:
      - bearer_auth: []
  /iam/users/simple:
    get:
      tags:
      - users
      operationId: list_users_simple
      parameters:
      - name: keyword
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSimpleListResponse'
      security:
      - bearer_auth: []
  /iam/users/{user_id}:
    get:
      tags:
      - users
      operationId: get_user
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: not found
      security:
      - bearer_auth: []
    put:
      tags:
      - users
      operationId: update_user
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: not found
      security:
      - bearer_auth: []
    delete:
      tags:
      - users
      operationId: delete_user
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: deleted
        '404':
          description: not found
      security:
      - bearer_auth: []
  /iam/users/{user_id}/roles:
    put:
      tags:
      - users
      operationId: assign_user_roles
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignUserRolesRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignUserRolesResponse'
        '400':
          description: invalid role ids
        '404':
          description: user not found
      security:
      - bearer_auth: []
  /internal/users/{user_id}/claims:
    get:
      tags:
      - internal
      operationId: get_user_claims
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserClaimsResponse'
        '404':
          description: user not found
      security:
      - bearer_auth: []
components:
  schemas:
    AssignPermissionsRequest:
      type: object
      required:
      - permission_ids
      properties:
        permission_ids:
          type: array
          items:
            type: string
    AssignUserRolesRequest:
      type: object
      required:
      - role_ids
      properties:
        role_ids:
          type: array
          items:
            type: string
    AssignUserRolesResponse:
      type: object
      required:
      - user_id
      - role_ids
      properties:
        role_ids:
          type: array
          items:
            type: string
        user_id:
          type: string
    BatchImportUsersRequest:
      type: object
      required:
      - users
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/CreateUserRequest'
    ChangePasswordRequest:
      type: object
      required:
      - old_password
      - new_password
      properties:
        new_password:
          type: string
        old_password:
          type: string
    CreateRoleRequest:
      type: object
      required:
      - name
      - code
      - data_scope
      properties:
        code:
          type: string
        data_scope:
          type: integer
          format: int32
        description:
          type:
          - string
          - 'null'
        name:
          type: string
    CreateTenantRequest:
      type: object
      required:
      - tenant_slug
      - display_name
      - admin_username
      - admin_password
      properties:
        admin_email:
          type:
          - string
          - 'null'
        admin_password:
          type: string
        admin_username:
          type: string
        display_name:
          type: string
        tenant_slug:
          type: string
    CreateTenantResponse:
      type: object
      required:
      - tenant_id
      - admin_user_id
      properties:
        admin_user_id:
          type: string
        tenant_id:
          type: integer
          format: int64
    CreateUserRequest:
      type: object
      required:
      - username
      - password
      - nickname
      properties:
        avatar:
          type:
          - string
          - 'null'
        email:
          type:
          - string
          - 'null'
        nickname:
          type: string
        password:
          type: string
        phone:
          type:
          - string
          - 'null'
        role_ids:
          type:
          - array
          - 'null'
          items:
            type: string
        username:
          type: string
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        password:
          type: string
        tenant_slug:
          type:
          - string
          - 'null'
        username:
          type: string
    LoginResponse:
      type: object
      required:
      - access_token
      - refresh_token
      - token_type
      - expires_in
      - user
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
          format: int64
          minimum: 0
        refresh_token:
          type: string
        token_type:
          type: string
        user:
          $ref: '#/components/schemas/UserInfo'
    RefreshRequest:
      type: object
      required:
      - refresh_token
      properties:
        refresh_token:
          type: string
    RefreshResponse:
      type: object
      required:
      - access_token
      - refresh_token
      - token_type
      - expires_in
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
          format: int64
          minimum: 0
        refresh_token:
          type: string
        token_type:
          type: string
    ResetPasswordRequest:
      type: object
      required:
      - username
      - code
      - new_password
      properties:
        code:
          type: string
        new_password:
          type: string
        username:
          type: string
    RoleListResponse:
      type: object
      required:
      - items
      - total
      - page
      - size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RoleResponse'
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 0
        total:
          type: integer
          format: int64
          minimum: 0
    RoleResponse:
      type: object
      required:
      - id
      - name
      - code
      - data_scope
      - status
      - created_at
      - updated_at
      properties:
        code:
          type: string
        created_at:
          type: string
          format: date-time
        data_scope:
          type: string
        description:
          type:
          - string
          - 'null'
        id:
          type: string
        name:
          type: string
        status:
          type: string
        updated_at:
          type: string
          format: date-time
    SessionInfo:
      type: object
      required:
      - id
      - user_id
      - client_ip
      - created_at
      - expires_at
      - is_current
      properties:
        client_ip:
          type: string
        created_at:
          type: string
        expires_at:
          type: string
        id:
          type: string
        is_current:
          type: boolean
        user_agent:
          type:
          - string
          - 'null'
        user_id:
          type: string
    UpdateRoleRequest:
      type: object
      properties:
        data_scope:
          type:
          - integer
          - 'null'
          format: int32
        description:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
        status:
          type:
          - string
          - 'null'
    UpdateUserRequest:
      type: object
      properties:
        avatar:
          type:
          - string
          - 'null'
        email:
          type:
          - string
          - 'null'
        nickname:
          type:
          - string
          - 'null'
        phone:
          type:
          - string
          - 'null'
        status:
          type:
          - string
          - 'null'
    UserClaimsResponse:
      type: object
      required:
      - user_id
      - username
      - nickname
      - roles
      - permissions
      - tid
      - ct
      properties:
        ct:
          type: boolean
        email:
          type:
          - string
          - 'null'
        nickname:
          type: string
        permissions:
          type: array
          items:
            type: string
        phone:
          type:
          - string
          - 'null'
        roles:
          type: array
          items:
            type: string
        tid:
          type: integer
          format: int64
        user_id:
          type: string
        username:
          type: string
    UserIdListResponse:
      type: object
      required:
      - items
      - page
      - size
      - total
      - truncated
      properties:
        items:
          type: array
          items:
            type: string
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 0
        total:
          type: integer
          format: int64
        truncated:
          type: boolean
    UserInfo:
      type: object
      required:
      - id
      - username
      - nickname
      - roles
      - permissions
      properties:
        avatar:
          type:
          - string
          - 'null'
        email:
          type:
          - string
          - 'null'
        id:
          type: string
        nickname:
          type: string
        permissions:
          type: array
          items:
            type: string
        phone:
          type:
          - string
          - 'null'
        roles:
          type: array
          items:
            type: string
        username:
          type: string
    UserListResponse:
      type: object
      required:
      - items
      - total
      - page
      - size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 0
        total:
          type: integer
          format: int64
          minimum: 0
    UserResponse:
      type: object
      required:
      - id
      - username
      - nickname
      - status
      - email_verified
      - phone_verified
      - created_at
      - updated_at
      properties:
        avatar:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        email:
          type:
          - string
          - 'null'
        email_verified:
          type: boolean
        id:
          type: string
        last_login_at:
          type:
          - string
          - 'null'
          format: date-time
        last_login_ip:
          type:
          - string
          - 'null'
        nickname:
          type: string
        phone:
          type:
          - string
          - 'null'
        phone_verified:
          type: boolean
        status:
          type: string
        updated_at:
          type: string
          format: date-time
        username:
          type: string
    UserSimpleListResponse:
      type: object
      required:
      - items
      - total
      - page
      - size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserSimpleResponse'
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 0
        total:
          type: integer
          format: int64
          minimum: 0
    UserSimpleResponse:
      type: object
      required:
      - id
      - nickname
      properties:
        id:
          type: string
        nickname:
          type: string
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: auth
  description: Authentication
- name: users
  description: User management
- name: roles
  description: Role management
- name: tenants
  description: Tenant registration
- name: internal
  description: Internal service-to-service endpoints
