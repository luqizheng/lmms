openapi: 3.1.0
info:
  title: file-service
  description: File upload, download and presign
  license:
    name: ''
  version: 1.8.1
paths:
  /file/internal/migrations/state:
    get:
      tags:
      - internal
      summary: Get file-service schema migration state
      operationId: handler
      responses:
        '200':
          description: schema state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationStateResponse'
        '401':
          description: missing or invalid service-jwt
        '503':
          description: db_unreachable
      security:
      - bearer_auth: []
  /file/list:
    get:
      tags:
      - file
      summary: List files
      operationId: query_files
      parameters:
      - name: tenant_id
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: user_id
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: filename
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: page
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      - name: size
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      responses:
        '200':
          description: Paged file list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedFiles'
  /file/presign:
    post:
      tags:
      - presign
      summary: Create presigned URL
      operationId: create_presign
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePresignUrl'
        required: true
      responses:
        '200':
          description: Presigned URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignUrlResponse'
        '401':
          description: Presign expired
        '404':
          description: File not found
  /file/upload:
    post:
      tags:
      - file
      summary: |-
        Multipart upload:
          - `metadata` 字段：JSON 字符串，类型 UploadFileMeta
          - `file` 字段：原始字节（大小受 services/file-service/src/config.rs:max_file_size 限制）
      operationId: upload_file
      requestBody:
        description: 'multipart: ''metadata'' (json UploadFileMeta) + ''file'' (bytes)'
        content:
          multipart/form-data:
            schema:
              type: string
        required: true
      responses:
        '200':
          description: Uploaded file metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileInfo'
        '400':
          description: Invalid multipart body or metadata
        '413':
          description: Payload too large
  /file/{id}:
    get:
      tags:
      - file
      summary: Download file by id
      operationId: download_file
      parameters:
      - name: id
        in: path
        description: File id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: File bytes (octet-stream or content-type)
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Not found
    delete:
      tags:
      - file
      summary: Delete file by id
      operationId: delete_file
      parameters:
      - name: id
        in: path
        description: File id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema: {}
        '404':
          description: Not found
  /file/{id}/info:
    get:
      tags:
      - file
      summary: Get file metadata by id
      operationId: get_file_info
      parameters:
      - name: id
        in: path
        description: File id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: File info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileInfo'
        '404':
          description: Not found
components:
  schemas:
    CreatePresignUrl:
      type: object
      required:
      - file_id
      - operation
      properties:
        expires_in_seconds:
          type:
          - integer
          - 'null'
          format: int64
        file_id:
          type: string
        operation:
          type: string
    FileInfo:
      type: object
      required:
      - id
      - filename
      - size
      - storage_path
      - tenant_id
      - is_temporary
      - created_at
      - updated_at
      properties:
        content_type:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        filename:
          type: string
        hash:
          type:
          - string
          - 'null'
        id:
          type: string
        is_temporary:
          type: boolean
        size:
          type: integer
          format: int64
        storage_path:
          type: string
        tenant_id:
          type: integer
          format: int64
          description: |-
            租户 ID。
            类型为 i64（而非 u64）：sqlx-postgres 无 unsigned 支持，u64 无法 FromRow 解码。
             手工保住 OpenAPI 的 minimum: 0，使 spec 零变更。
          minimum: 0
        updated_at:
          type: string
          format: date-time
        url:
          type: string
          description: |-
            客户端可渲染的下载 URL（相对路径，前端 axios baseURL /api + 此值）。
            由 handlers 在返回前注入；DB 不存（`#[sqlx(skip)]`）。
            2026-11-07 裁决后网关不再暴露 /v1/file/* 用户路由——该字段仅在
            file-service 被业务服务网关化暴露时才有意义；用户下载一律走
            presign 签名 URL（见 contracts/http-conventions.md）。
        user_id:
          type:
          - string
          - 'null'
    MigrationInfo:
      type: object
      description: JSON 内 `available` 数组元素的形态。
      required:
      - version
      - name
      properties:
        name:
          type: string
        version:
          type: string
    MigrationStateResponse:
      type: object
      description: |-
        端点返回 JSON 的序列化结构。

        字段语义见 spec §2.1。
      required:
      - service
      - dialect
      - available
      - applied
      - in_sync
      - missing
      - extra
      properties:
        applied:
          type: array
          items:
            type: string
        available:
          type: array
          items:
            $ref: '#/components/schemas/MigrationInfo'
        current_version:
          type:
          - string
          - 'null'
        dialect:
          type: string
        extra:
          type: array
          items:
            type: string
        in_sync:
          type: boolean
        missing:
          type: array
          items:
            type: string
        service:
          type: string
    PagedFiles:
      type: object
      required:
      - items
      - total
      - page
      - size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FileInfo'
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 0
        total:
          type: integer
          format: int64
    PresignUrlResponse:
      type: object
      required:
      - url
      - expires_at
      - operation
      properties:
        expires_at:
          type: string
          format: date-time
        operation:
          type: string
        url:
          type: string
    UploadFileMeta:
      type: object
      required:
      - filename
      properties:
        content_type:
          type:
          - string
          - 'null'
        expires_in_seconds:
          type:
          - integer
          - 'null'
          format: int64
        filename:
          type: string
        is_temporary:
          type:
          - boolean
          - 'null'
        tenant_id:
          type:
          - integer
          - 'null'
          format: int64
          description: 见 FileInfo::tenant_id 的类型说明。
          minimum: 0
        user_id:
          type:
          - string
          - 'null'
tags:
- name: file
  description: File upload / download / info
- name: presign
  description: Presigned URL
