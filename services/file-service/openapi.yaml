openapi: 3.1.0
info:
  title: file-service
  description: File upload, download and presign
  license:
    name: ''
  version: 0.1.0
paths:
  /file/list:
    get:
      tags:
      - file
      operationId: query_files
      parameters:
      - name: tenant_id
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: user_id
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: filename
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: page
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      - name: size
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      responses:
        '200':
          description: Paged file list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedFiles'
  /file/presign:
    post:
      tags:
      - presign
      operationId: create_presign
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePresignUrl'
        required: true
      responses:
        '200':
          description: Presigned URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignUrlResponse'
        '401':
          description: Presign expired
        '404':
          description: File not found
  /file/upload:
    post:
      tags:
      - file
      operationId: upload_file
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadFileMeta'
        required: true
      responses:
        '200':
          description: Uploaded file metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileInfo'
  /file/{id}:
    get:
      tags:
      - file
      operationId: download_file
      parameters:
      - name: id
        in: path
        description: File id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: File bytes (octet-stream or content-type)
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Not found
    delete:
      tags:
      - file
      operationId: delete_file
      parameters:
      - name: id
        in: path
        description: File id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema: {}
        '404':
          description: Not found
  /file/{id}/info:
    get:
      tags:
      - file
      operationId: get_file_info
      parameters:
      - name: id
        in: path
        description: File id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: File info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileInfo'
        '404':
          description: Not found
components:
  schemas:
    CreatePresignUrl:
      type: object
      required:
      - file_id
      - operation
      properties:
        expires_in_seconds:
          type:
          - integer
          - 'null'
          format: int64
        file_id:
          type: string
        operation:
          type: string
    FileInfo:
      type: object
      required:
      - id
      - filename
      - size
      - storage_path
      - is_temporary
      - created_at
      - updated_at
      properties:
        content_type:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        filename:
          type: string
        hash:
          type:
          - string
          - 'null'
        id:
          type: string
        is_temporary:
          type: boolean
        size:
          type: integer
          format: int64
        storage_path:
          type: string
        tenant_id:
          type:
          - string
          - 'null'
        updated_at:
          type: string
          format: date-time
        user_id:
          type:
          - string
          - 'null'
    PagedFiles:
      type: object
      required:
      - items
      - total
      - page
      - size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FileInfo'
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 0
        total:
          type: integer
          format: int64
    PresignUrlResponse:
      type: object
      required:
      - url
      - expires_at
      - operation
      properties:
        expires_at:
          type: string
          format: date-time
        operation:
          type: string
        url:
          type: string
    UploadFileMeta:
      type: object
      required:
      - filename
      properties:
        content_type:
          type:
          - string
          - 'null'
        expires_in_seconds:
          type:
          - integer
          - 'null'
          format: int64
        filename:
          type: string
        is_temporary:
          type:
          - boolean
          - 'null'
        tenant_id:
          type:
          - string
          - 'null'
        user_id:
          type:
          - string
          - 'null'
tags:
- name: file
  description: File upload / download / info
- name: presign
  description: Presigned URL
