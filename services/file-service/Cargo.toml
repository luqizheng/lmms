[package]
name = "file-service"
version = "0.1.0"
edition = "2021"

[dependencies]
axum.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
bytes.workspace = true
futures.workspace = true
prometheus = "0.13"
utoipa = { version = "5", features = ["axum_extras", "chrono", "yaml"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
tokio-util = { version = "0.7", features = ["io"] }
async-trait = "0.1"
common-error = { path = "../../libs/common-error" }
common-db = { path = "../../libs/common-db", features = ["mysql", "sqlite"] }
common-log = { path = "../../libs/common-log" }
common-cache = { path = "../../libs/common-cache" }
common-telemetry = { path = "../../libs/common-telemetry", features = ["otlp", "axum"] }
anyhow = "1"

[[bin]]
name = "dump-openapi"
path = "src/bin/dump-openapi.rs"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
