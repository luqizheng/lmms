[package]
name = "file_service"
version = "0.1.0"
edition = "2021"

[features]
# 方言 feature：default 只含 mysql，postgres 必须显式开启（D-9：postgres 不进 default）。
# 宏 `db_*!` 内部的 #[cfg(feature = ...)] 在**调用方 crate** 求值，因此本 crate
# 必须定义与 libs/common-db 同名的 feature，并把它们转发过去。
default = ["mysql"]
mysql = ["sqlx/mysql", "digua_common_db/mysql"]
postgres = ["sqlx/postgres", "digua_common_db/postgres"]
sqlite = ["sqlx/sqlite", "digua_common_db/sqlite"]

[dependencies]
axum.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sqlx = { workspace = true, features = ["mysql", "chrono", "macros"] }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
bytes.workspace = true
futures.workspace = true
percent-encoding = "2"
prometheus = "0.13"
utoipa = { version = "5", features = ["axum_extras", "chrono", "yaml"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
tokio-util = { version = "0.7", features = ["io"] }
async-trait = "0.1"
# S3-protocol client (RustFS / AWS S3 / Aliyun OSS / MinIO 等 S3-compatible 后端).
# 默认 features 禁用走 native-tls，配 tokio-rustls-tls + with-tokio 与本仓库 musl + rustls 策略一致。
rust-s3 = { version = "0.37", default-features = false, features = ["tokio-rustls-tls", "with-tokio"] }
hmac = "0.12"
digua_common_error = { path = "../../libs/common-error" }
digua_common_db = { path = "../../libs/common-db", features = ["mysql", "openapi"] }
digua_authz = { path = "../../libs/authz" }
digua_common_log = { path = "../../libs/common-log" }
digua_jwt_ctx = { path = "../../libs/jwt-ctx" }
digua_common_jwt = { path = "../../libs/common-jwt" }
reqwest.workspace = true
digua_common_cache = { path = "../../libs/common-cache" }
digua_common_telemetry = { path = "../../libs/common-telemetry", features = ["otlp"] }
digua_common_telemetry_axum = { path = "../../libs/common-telemetry-axum", features = ["otlp"] }
anyhow = "1"

[[bin]]
name = "dump_openapi"
path = "src/bin/dump-openapi.rs"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
testcontainers = "0.20"
testcontainers-modules = { version = "0.8", features = ["mysql"] }
tower = { workspace = true }
http-body-util = "0.1"
axum = { workspace = true, features = ["multipart"] }
jwt-simple.workspace = true
tempfile = "3"
bytes.workspace = true
