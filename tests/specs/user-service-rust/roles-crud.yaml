name: user-service-rust.roles-crud
base_url: http://user-service-rust:8082
scenarios:
  - name: create role
    request:
      method: POST
      path: /api/roles
      headers:
        Authorization: Bearer ${SERVICE_TOKEN}
        Content-Type: application/json
      body:
        code: editor
        name: Editor
    expect:
      status: 200
      json:
        code: editor
        name: Editor
  - name: list roles
    request:
      method: GET
      path: /api/roles
      headers:
        Authorization: Bearer ${SERVICE_TOKEN}
    expect:
      status: 200
      json:
        - code: admin
        - code: editor
  - name: delete role
    request:
      method: DELETE
      path: /api/roles/2
      headers:
        Authorization: Bearer ${SERVICE_TOKEN}
    expect:
      status: 200
      json:
        ok: true
