group: system-role
cases:
  - caseId: UI-ROLE-001
    desc: 新增角色
    flow: createRole
    smoke: true
    params:
      name: r${rand}
      code: rc${rand}
    expect:
      - toast=已新增角色
  - caseId: UI-ROLE-002
    desc: 编辑角色名称（先建再改）
    flow: editRole
    params:
      name: r${rand}
      code: rc${rand}
      newName: rn${rand}
    expect:
      - toast=已修改角色
  - caseId: UI-ROLE-003
    desc: 删除角色（先建再删）
    flow: deleteRole
    params:
      name: r${rand}
      code: rc${rand}
    expect:
      - toast=已删除角色
  - caseId: UI-ROLE-004
    desc: 给角色分配权限（勾选首个权限保存）
    flow: assignRolePermissions
    params:
      name: r${rand}
      code: rc${rand}
    expect:
      - toast=的权限已更新
