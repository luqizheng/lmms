group: system-permission
cases:
  - caseId: UI-PERM-001
    desc: 权限列表按名称搜索（中文关键字）
    flow: searchPermission
    smoke: true
    params:
      keyword: 用户
    expect:
      - dialog=用户
  - caseId: UI-PERM-002
    desc: 权限列表按编码搜索（英文关键字）
    flow: searchPermission
    params:
      keyword: iam_user
    expect:
      - dialog=iam_user
