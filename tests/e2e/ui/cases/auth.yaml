group: auth
cases:
  - caseId: UI-AUTH-001
    desc: 错误密码登录失败提示（密码需通过前端格式校验：8-18位+两种字符组合）
    flow: loginBadPassword
    params:
      password: WrongPass123
    expect:
      - toast=登录失败

  - caseId: UI-AUTH-002
    desc: 正确账号登录成功并跳转 welcome
    smoke: true
    flow: loginSuccess
    expect:
      - toast=登录成功

  - caseId: UI-AUTH-003
    desc: 登出后回到登录页
    flow: logoutFlow
    expect:
      - toast=登录
