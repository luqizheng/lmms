group: monitor
cases:
  - caseId: UI-MON-001
    desc: 登录日志列表非空并返回首行（页面无过滤 UI，数据源为 demo 种子，不断言具体用户）
    flow: loginLogList

  - caseId: UI-MON-002
    desc: 操作日志-UI 建用户后列表非空（数据源为 demo 种子，不断言关联记录）
    flow: operationLogList
    params:
      username: mon${rand}

  - caseId: UI-MON-003
    desc: 数据保留页渲染 smoke
    smoke: true
    flow: retentionSmoke
    expect:
      - toast=保留策略
