group: token-client
cases:
  - caseId: UI-TOKEN-CLIENT-001
    desc: 创建 OAuth 客户端
    flow: createTokenClient
    params:
      name: e2e-client-${rand}
    expect:
      - toast=新增成功
      - dialog=新建客户端成功

  - caseId: UI-TOKEN-CLIENT-002
    desc: 重置客户端 Secret
    flow: resetTokenClientSecret
    params:
      name: e2e-reset-${rand}
    expect:
      - dialog=Secret 已重置

  - caseId: UI-TOKEN-CLIENT-003
    desc: 禁用客户端
    flow: toggleTokenClient
    params:
      name: e2e-toggle-${rand}
    expect:
      - toast=已禁用

  - caseId: UI-TOKEN-CLIENT-004
    desc: 删除客户端
    flow: deleteTokenClient
    params:
      name: e2e-del-${rand}
    expect:
      - toast=删除成功
