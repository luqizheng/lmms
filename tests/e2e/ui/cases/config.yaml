group: config
cases:
  - caseId: UI-CFG-001
    desc: 新建命名空间（smoke）
    flow: createNamespace
    smoke: true
    params:
      app: e2e-ns-${rand}
    expect:
      - toast=已创建

  - caseId: UI-CFG-002
    desc: 配置项页 smoke——onMounted 自动加载命名空间下拉
    flow: viewConfigItemPage
    expect:
      - toast=config-item-page-open

  - caseId: UI-CFG-003
    desc: 删除命名空间（闭环：先建再删）
    flow: deleteNamespace
    params:
      app: e2e-ns-del-${rand}
    expect:
      - toast=已删除

  - caseId: UI-CFG-004
    desc: 新建配置项（闭环：先建命名空间再建 key，默认选第一个 ns）
    flow: createConfigItem
    params:
      key: e2e-key-${rand}
    expect:
      - toast=已创建
