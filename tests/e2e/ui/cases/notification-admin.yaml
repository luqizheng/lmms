group: notification-admin
cases:
  - caseId: UI-NOTIF-001
    desc: 创建公告-仅标题
    smoke: true
    tags: ['@smoke']
    flow: createAnnouncement
    params:
      title: e2e公告${rand}
    expect:
      - toast=已发布

  - caseId: UI-NOTIF-002
    desc: 创建公告-带正文
    flow: createAnnouncement
    params:
      title: e2e公告${rand}
      body: 这是测试正文内容
    expect:
      - toast=已发布

  - caseId: UI-NOTIF-003
    desc: 创建公告-添加全部用户接收人
    flow: createAnnouncement
    params:
      title: e2e公告${rand}
      recipients:
        - type: user
          pickAll: true
    expect:
      - toast=已发布

  - caseId: UI-NOTIF-004
    desc: 创建公告-添加全部角色接收人
    flow: createAnnouncement
    params:
      title: e2e公告${rand}
      recipients:
        - type: role
          pickAll: true
    expect:
      - toast=已发布

  - caseId: UI-NOTIF-005
    desc: 创建公告-添加全部部门接收人——跳过：ReOrgSelector 的 ElTreeSelect 弹层不渲染任何节点（API 200 有数据、组件逻辑无误，弹层交互/渲染异常），部门接收人 UI 不可选
    flow: createAnnouncement
    skip: true
    params:
      title: e2e公告${rand}
      recipients:
        - type: dept
          pickAll: true
    expect:
      - toast=已发布

  - caseId: UI-NOTIF-006
    desc: 发布公告（行级）——跳过：admin/index.vue 的 PureTableBar 漏传 :columns，dynamicColumns 为空导致表格行零单元格渲染，行内「发布」按钮不在 DOM，行级操作 UI 不可达（inbox/namespace 页同款 bug）
    flow: publishAnnouncement
    skip: true
    params:
      title: e2e待发布公告${rand}
    expect:
      - toast=已发布

  - caseId: UI-NOTIF-007
    desc: 撤销公告（行级）——跳过：同上，行内「撤销」按钮不在 DOM，UI 不可达
    flow: revokeAnnouncement
    skip: true
    params:
      title: e2e待撤销公告${rand}
    expect:
      - toast=已撤销