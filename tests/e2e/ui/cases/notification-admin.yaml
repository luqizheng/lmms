group: notification-admin
cases:
  - caseId: UI-NOTIF-001
    desc: 创建公告-仅标题
    smoke: true
    tags: ['@smoke']
    flow: createAnnouncement
    params:
      title: e2e公告${rand}
    expect:
      - toast=创建成功

  - caseId: UI-NOTIF-002
    desc: 创建公告-带正文
    flow: createAnnouncement
    params:
      title: e2e公告${rand}
      body: 这是测试正文内容
    expect:
      - toast=创建成功

  - caseId: UI-NOTIF-003
    desc: 创建公告-添加全部用户接收人
    flow: createAnnouncement
    params:
      title: e2e公告${rand}
      recipients:
        - type: user
          pickAll: true
    expect:
      - toast=创建成功

  - caseId: UI-NOTIF-004
    desc: 创建公告-添加全部角色接收人
    flow: createAnnouncement
    params:
      title: e2e公告${rand}
      recipients:
        - type: role
          pickAll: true
    expect:
      - toast=创建成功

  - caseId: UI-NOTIF-005
    desc: 创建公告-添加全部部门接收人
    flow: createAnnouncement
    params:
      title: e2e公告${rand}
      recipients:
        - type: dept
          pickAll: true
    expect:
      - toast=创建成功

  - caseId: UI-NOTIF-006
    desc: 发布公告
    flow: publishAnnouncement
    params:
      title: e2e待发布公告${rand}
    expect:
      - toast=已发布

  - caseId: UI-NOTIF-007
    desc: 撤销公告
    flow: revokeAnnouncement
    params:
      title: e2e待撤销公告${rand}
    expect:
      - toast=已撤销