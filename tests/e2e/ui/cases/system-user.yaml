group: system-user
cases:
  - caseId: UI-USER-101
    desc: 编辑用户昵称（先建再改）
    flow: editUser
    smoke: true
    params:
      username: u${rand}
      newNickname: nn${rand}
    expect:
      - toast=已修改用户
  - caseId: UI-USER-102
    desc: 删除用户（先建再删）
    flow: deleteUser
    params:
      username: u${rand}
    expect:
      - toast=已删除用户
  - caseId: UI-USER-103
    desc: 给用户分配角色（先建角色与用户再分配）
    flow: assignUserRole
    params:
      username: u${rand}
      roleName: r${rand}
      roleCode: rc${rand}
    expect:
      - toast=角色已更新
