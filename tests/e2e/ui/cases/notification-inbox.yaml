group: notification-inbox
cases:
  - caseId: UI-INBOX-001
    desc: 创建并发布公告后收件箱按标题可见（未读计数=1）
    smoke: true
    flow: inboxReceiveAnnouncement
    params:
      title: e2e收件${rand}
    expect:
      - toast=未读 (1)

  - caseId: UI-INBOX-002
    desc: 收件箱点开详情抽屉并自动标记已读
    flow: inboxOpenDetail
    params:
      title: e2e详情${rand}
      body: 收件箱详情正文
    expect:
      - toast=e2e详情
