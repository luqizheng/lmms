group: notification-service
cases:
  - caseId: NOTIF-001
    desc: 创建公告
    smoke: true
    method: POST
    path: /v1/notification/announcements
    body:
      title: e2e ann ${rand}
      body: e2e content
      publish_at: 2026-06-25T10:00:00Z
      expire_at: 2026-12-31T23:59:59Z
      pinned: false
      popover: false
      recipients:
        - scope_type: role
          scope_id: "1"
    expectStatus: [200, 201, 204, 502, 503, 404]

  - caseId: NOTIF-002
    desc: 列出我的公告
    method: GET
    path: /v1/notification/announcements
    expectStatus: [200, 502, 503, 404]

  - caseId: NOTIF-003
    desc: 发布公告
    method: POST
    path: /v1/notification/announcements/${NOTIF-001.id}/publish
    body: {}
    expectStatus: [200, 201, 204, 502, 503, 404]

  - caseId: NOTIF-004
    desc: 获取公告详情
    method: GET
    path: /v1/notification/announcements/${NOTIF-001.id}
    expectStatus: [200, 201, 204, 502, 503, 404]

  - caseId: NOTIF-005
    desc: 标记公告已读
    method: POST
    path: /v1/notification/announcements/${NOTIF-001.id}/read
    body: {}
    expectStatus: [200, 201, 204, 502, 503, 404]

  - caseId: NOTIF-006
    desc: 查询未读数
    method: GET
    path: /v1/notification/unread-count
    expectStatus: [200, 502, 503, 404]

  - caseId: NOTIF-007
    desc: 撤回公告
    method: POST
    path: /v1/notification/announcements/${NOTIF-001.id}/revoke
    body: {}
    expectStatus: [200, 201, 204, 502, 503, 404]

  - caseId: NOTIF-100
    desc: 公告列表-带 admin token 必须 200（防 503 回归）
    method: GET
    path: /v1/notification/announcements
    expectStatus: 200
    expect:
      - $. is array

  - caseId: NOTIF-101
    desc: 公告列表-未带 token 必须 401
    method: GET
    path: /v1/notification/announcements
    auth: false
    expectStatus: 401

  - caseId: NOTIF-102
    desc: 未读数-带 admin token 必须 200（防 503 回归）
    method: GET
    path: /v1/notification/unread-count
    expectStatus: 200
    expect:
      - $.count exists

  - caseId: NOTIF-103
    desc: 未读数-未带 token 必须 401
    method: GET
    path: /v1/notification/unread-count
    auth: false
    expectStatus: 401
