group: pm-platform
description: PM Platform full-stack business flow test (through api-gateway /v1/pm/*)
cases:
  # ── Health (existing 4 cases) ──
  - caseId: PM-001
    desc: 健康检查（公开）
    smoke: true
    method: GET
    path: /v1/pm/health
    auth: false
    expectStatus: [200, 502]

  - caseId: PM-002
    desc: 健康检查 readiness（公开）
    smoke: true
    method: GET
    path: /v1/pm/health/ready
    auth: false
    expectStatus: [200, 502, 503]

  - caseId: PM-003
    desc: 未认证调 LLM providers 应拒绝
    smoke: true
    method: GET
    path: /v1/pm/llm/providers
    auth: false
    expectStatus: [401, 403]

  - caseId: PM-004
    desc: 登录后调 LLM providers 返回 provider 列表
    method: GET
    path: /v1/pm/llm/providers
    auth: true
    expectStatus: [200]
    expect:
      - $. is array

  # ── Group 1: Project CRUD ──
  - caseId: PM-010
    desc: 创建项目
    smoke: true
    method: POST
    path: /v1/pm/projects
    body:
      code: pm-e2e-${rand}
      name: E2E Project
      description: PM platform e2e test
      ownerId: 1
    expectStatus: [200, 201]
    expect:
      - $.id exists
      - $.code exists
      - $.status exists

  - caseId: PM-011
    desc: 项目列表
    method: GET
    path: /v1/pm/projects?page=1&size=10
    expectStatus: [200]
    expect:
      - $.items is array
      - $.total exists

  - caseId: PM-012
    desc: 项目详情
    method: GET
    path: /v1/pm/projects/${PM-010.id}
    expectStatus: [200]
    expect:
      - $.id==${PM-010.id}

  - caseId: PM-013
    desc: 更新项目名称
    method: PATCH
    path: /v1/pm/projects/${PM-010.id}
    body:
      name: E2E Project Updated
    expectStatus: [200]
    expect:
      - $.name contains Updated

  - caseId: PM-014
    desc: 归档项目（软删除）
    method: DELETE
    path: /v1/pm/projects/${PM-010.id}
    expectStatus: [200, 204]
    expect:
      - $.id not exists

  # ── Group 2: Requirement CRUD ──
  - caseId: PM-020
    desc: 创建需求
    smoke: true
    method: POST
    path: /v1/pm/projects/${PM-010.id}/requirements
    body:
      title: E2E 用户登录需求
      description: 用户可以用用户名密码登录系统
      type: feature
      priority: p1
      status: open
    expectStatus: [200, 201]
    expect:
      - $.id exists
      - $.projectId==${PM-010.id}
      - $.title exists

  - caseId: PM-021
    desc: 项目下需求列表
    method: GET
    path: /v1/pm/projects/${PM-010.id}/requirements?page=1&size=20
    expectStatus: [200]
    expect:
      - $.items is array
      - $.total exists

  - caseId: PM-022
    desc: 需求详情
    method: GET
    path: /v1/pm/requirements/${PM-020.id}
    expectStatus: [200]
    expect:
      - $.id==${PM-020.id}

  - caseId: PM-023
    desc: 更新需求优先级
    method: PATCH
    path: /v1/pm/requirements/${PM-020.id}
    body:
      priority: p0
      status: in_progress
    expectStatus: [200]
    expect:
      - $.priority==p0

  - caseId: PM-024
    desc: 软删除需求
    method: DELETE
    path: /v1/pm/requirements/${PM-020.id}
    expectStatus: [200, 204]

  # ── Group 3: User Stories ──
  - caseId: PM-030
    desc: 追加用户故事
    method: POST
    path: /v1/pm/requirements/${PM-020.id}/stories
    body:
      asA: 注册用户
      iWant: 用用户名密码登录
      soThat: 能访问受限页面
    expectStatus: [200, 201]
    expect:
      - $.id exists
      - $.requirementId==${PM-020.id}

  - caseId: PM-031
    desc: 需求下故事列表
    method: GET
    path: /v1/pm/requirements/${PM-020.id}/stories
    expectStatus: [200]
    expect:
      - $. is array

  - caseId: PM-032
    desc: 故事详情
    method: GET
    path: /v1/pm/stories/${PM-030.id}
    expectStatus: [200]
    expect:
      - $.id==${PM-030.id}

  - caseId: PM-033
    desc: 更新故事接受标准
    method: PATCH
    path: /v1/pm/stories/${PM-030.id}
    body:
      storyPoints: 3
      status: approved
    expectStatus: [200]
    expect:
      - $.storyPoints==3

  # ── Group 4: Acceptance Criteria ──
  - caseId: PM-040
    desc: 追加验收标准
    method: POST
    path: /v1/pm/stories/${PM-030.id}/criteria
    body:
      givenText: 用户输入正确用户名密码
      whenText: 点击登录
      thenText: 登录成功跳转主页
    expectStatus: [200, 201]
    expect:
      - $.id exists
      - $.storyId==${PM-030.id}

  - caseId: PM-041
    desc: 故事下验收标准列表
    method: GET
    path: /v1/pm/stories/${PM-030.id}/criteria
    expectStatus: [200]
    expect:
      - $. is array

  - caseId: PM-042
    desc: 更新验收标准
    method: PATCH
    path: /v1/pm/criteria/${PM-040.id}
    body:
      thenText: 登录成功并跳转主页
    expectStatus: [200]
    expect:
      - $.thenText contains 跳转主页

  - caseId: PM-043
    desc: 验收标准勾选为通过
    method: POST
    path: /v1/pm/criteria/${PM-040.id}/check
    body:
      checked: true
    expectStatus: [200]
    expect:
      - $.checked==true

  # ── Group 5: KB Space CRUD ──
  - caseId: PM-050
    desc: 创建知识库空间
    smoke: true
    method: POST
    path: /v1/pm/spaces
    body:
      name: E2E Space ${rand}
      slug: e2e-space
      description: E2E test KB space
      projectId: ${PM-010.id}
      visibility: project
    expectStatus: [200, 201]
    expect:
      - $.id exists
      - $.name exists

  - caseId: PM-051
    desc: 空间列表
    method: GET
    path: /v1/pm/spaces?page=1&size=10&projectId=${PM-010.id}
    expectStatus: [200]
    expect:
      - $.items is array
      - $.total exists

  - caseId: PM-052
    desc: 空间详情
    method: GET
    path: /v1/pm/spaces/${PM-050.id}
    expectStatus: [200]
    expect:
      - $.id==${PM-050.id}

  - caseId: PM-053
    desc: 更新空间描述
    method: PATCH
    path: /v1/pm/spaces/${PM-050.id}
    body:
      description: Updated description
    expectStatus: [200]
    expect:
      - $.description contains Updated

  - caseId: PM-054
    desc: 删除空间
    method: DELETE
    path: /v1/pm/spaces/${PM-050.id}
    expectStatus: [200, 204]

  # ── Group 6: KB Document CRUD ──
  - caseId: PM-060
    desc: 创建知识库文档
    smoke: true
    method: POST
    path: /v1/pm/spaces/${PM-050.id}/documents
    body:
      title: E2E Document
      docType: markdown
      spaceId: ${PM-050.id}
      initialMarkdown: "# Hello\nE2E test document content."
    expectStatus: [200, 201]
    expect:
      - $.id exists
      - $.title==E2E Document

  - caseId: PM-061
    desc: 空间下文档列表（树形）
    method: GET
    path: /v1/pm/spaces/${PM-050.id}/documents
    expectStatus: [200]
    expect:
      - $. is array

  - caseId: PM-062
    desc: 文档详情
    method: GET
    path: /v1/pm/documents/${PM-060.id}
    expectStatus: [200]
    expect:
      - $.id==${PM-060.id}
      - $.spaceId==${PM-050.id}

  - caseId: PM-063
    desc: 更新文档元数据
    method: PATCH
    path: /v1/pm/documents/${PM-060.id}
    body:
      title: E2E Document Renamed
    expectStatus: [200]
    expect:
      - $.title contains Renamed

  - caseId: PM-064
    desc: 更新文档内容（产生新版本）
    method: POST
    path: /v1/pm/documents/${PM-060.id}/content
    body:
      markdown: "# Updated\nNew content here."
    expectStatus: [200]
    expect:
      - $.id exists

  - caseId: PM-065
    desc: 删除文档
    method: DELETE
    path: /v1/pm/documents/${PM-060.id}
    expectStatus: [200, 204]

  # ── Group 7: Document Versions ──
  - caseId: PM-070
    desc: 文档版本列表
    method: GET
    path: /v1/pm/documents/${PM-060.id}/versions
    expectStatus: [200]
    expect:
      - $. is array

  - caseId: PM-071
    desc: 文档最新版本
    method: GET
    path: /v1/pm/documents/${PM-060.id}/versions/latest
    expectStatus: [200]
    expect:
      - $.documentId exists
      - $.versionNo exists

  # ── Group 8: Sprint Management (D5) ──
  - caseId: PM-080
    desc: 创建迭代
    method: POST
    path: /v1/pm/projects/${PM-010.id}/sprints
    body:
      name: Sprint 1
      goal: Complete E2E tests
      status: planning
      startDate: "2026-07-13"
      endDate: "2026-07-26"
    expectStatus: [200, 201]
    expect:
      - $.id exists
      - $.projectId==${PM-010.id}

  - caseId: PM-081
    desc: 项目下迭代列表
    method: GET
    path: /v1/pm/projects/${PM-010.id}/sprints?page=1&size=20
    expectStatus: [200]
    expect:
      - $.items is array

  # ── Group 9: Task Management (D4) ──
  - caseId: PM-090
    desc: 创建任务
    method: POST
    path: /v1/pm/projects/${PM-010.id}/tasks
    body:
      title: Implement login
      description: Build login page and API
      status: todo
      priority: high
      assigneeId: 1
    expectStatus: [200, 201]
    expect:
      - $.id exists
      - $.projectId==${PM-010.id}
      - $.status==todo

  - caseId: PM-091
    desc: 项目下任务列表
    method: GET
    path: /v1/pm/projects/${PM-010.id}/tasks?page=1&size=20
    expectStatus: [200]
    expect:
      - $.items is array

  - caseId: PM-092
    desc: 更新任务状态为进行中
    method: PATCH
    path: /v1/pm/tasks/${PM-090.id}
    body:
      status: in_progress
    expectStatus: [200]
    expect:
      - $.status==in_progress

  - caseId: PM-093
    desc: 更新任务优先级
    method: PATCH
    path: /v1/pm/tasks/${PM-090.id}
    body:
      priority: medium
    expectStatus: [200]
    expect:
      - $.priority==medium

  # ── Group 10: Comments (D7) ──
  - caseId: PM-100
    desc: 添加文档评论
    method: POST
    path: /v1/pm/documents/${PM-060.id}/comments
    body:
      content: This is an E2E test comment
      authorId: 1
    expectStatus: [200, 201]
    expect:
      - $.id exists
      - $.documentId==${PM-060.id}

  - caseId: PM-101
    desc: 文档评论列表
    method: GET
    path: /v1/pm/documents/${PM-060.id}/comments
    expectStatus: [200]
    expect:
      - $. is array
