group: auth-lifecycle
cases:
  - caseId: AUTH-REFRESH-LOGIN
    desc: admin 登录（为 refresh 取 refresh_token）
    smoke: true
    method: POST
    path: /v1/iam/auth/login
    auth: false
    body:
      username: e2eadmin
      password: P@ssw0rd!
    expectStatus: 200
    expect:
      - $.refresh_token exists

  - caseId: AUTH-REFRESH-001
    desc: admin 用 refresh_token 换发新 token
    smoke: true
    method: POST
    path: /v1/iam/auth/refresh
    auth: false
    body:
      refresh_token: ${AUTH-REFRESH-LOGIN.refresh_token}
    expectStatus: 200
    expect:
      - $.access_token exists
      - $.refresh_token exists
      - $.token_type==Bearer

  - caseId: AUTH-LIFE-001
    desc: admin 创建临时用户（用于密码/会话/登出测试）
    smoke: true
    method: POST
    path: /v1/iam/users
    body:
      username: lifecycle_${rand}
      password: P@ssw0rd!
      email: lifecycle_${rand}@t.local
      nickname: lifecycle
    expectStatus: 200
    expect:
      - $.id exists

  - caseId: AUTH-LIFE-002
    desc: 临时用户登录拿 access + refresh
    smoke: true
    method: POST
    path: /v1/iam/auth/login
    auth: false
    body:
      username: ${AUTH-LIFE-001.username}
      password: P@ssw0rd!
    expectStatus: 200
    expect:
      - $.access_token exists
      - $.refresh_token exists

  - caseId: AUTH-LIFE-003
    desc: 临时用户改密（headers 覆盖默认 admin token）
    method: POST
    path: /v1/iam/auth/password
    headers:
      Authorization: Bearer ${AUTH-LIFE-002.access_token}
    body:
      old_password: P@ssw0rd!
      new_password: NewP@ssw0rd!1
    expectStatus: 200

  - caseId: AUTH-LIFE-004
    desc: 改密后旧密码登录应失败
    method: POST
    path: /v1/iam/auth/login
    auth: false
    body:
      username: ${AUTH-LIFE-001.username}
      password: P@ssw0rd!
    expectStatus: [400, 401]

  - caseId: AUTH-LIFE-005
    desc: 临时用户查自己的会话列表
    smoke: true
    method: GET
    path: /v1/iam/auth/sessions
    headers:
      Authorization: Bearer ${AUTH-LIFE-002.access_token}
    expectStatus: 200
    expect:
      - $. is array

  - caseId: AUTH-LIFE-008
    desc: 撤销特定会话（DELETE /iam/auth/sessions/:id，session_id 来自 sessions 列表）
    smoke: true
    method: DELETE
    path: /v1/iam/auth/sessions/${AUTH-LIFE-005.0.id}
    headers:
      Authorization: Bearer ${AUTH-LIFE-002.access_token}
    expectStatus: 204

  - caseId: AUTH-LIFE-006
    desc: 临时用户登出
    smoke: true
    method: POST
    path: /v1/iam/auth/logout
    headers:
      Authorization: Bearer ${AUTH-LIFE-002.access_token}
    expectStatus: 204

  - caseId: AUTH-LIFE-007
    desc: 登出后临时 token 调 sessions — 验证 blacklist 生效（应 401）
    smoke: true
    method: GET
    path: /v1/iam/auth/sessions
    headers:
      Authorization: Bearer ${AUTH-LIFE-002.access_token}
    expectStatus: 401