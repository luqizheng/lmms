group: audit-service
cases:
  - caseId: AUDIT-001
    desc: 创建操作日志
    method: POST
    path: /v1/audit/operation
    body:
      user_id: e2e_user_${rand}
      action: e2e_test
      resource: e2e_resource
      resource_id: '${rand}'
      request_id: req_${rand}
      ip_address: 127.0.0.1
      user_agent: e2e/1.0
    expectStatus: [200, 201, 204, 502, 503, 404]

  - caseId: AUDIT-002
    desc: 分页查询操作日志
    method: GET
    path: /v1/audit/operation?page=1&size=10
    expectStatus: [200, 502, 503, 404]

  - caseId: AUDIT-003
    desc: 创建登录日志
    method: POST
    path: /v1/audit/login
    body:
      user_id: e2e_user_${rand}
      username: e2e_user_${rand}
      success: true
      ip_address: 127.0.0.1
      user_agent: e2e/1.0
      request_id: req_${rand}
    expectStatus: [200, 201, 204, 502, 503, 404]

  - caseId: AUDIT-004
    desc: 查询登录日志
    method: GET
    path: /v1/audit/login?page=1&size=10
    expectStatus: [200, 502, 503, 404]

  - caseId: AUDIT-005
    desc: 获取保留策略
    method: GET
    path: /v1/audit/retention/policy
    expectStatus: [200, 502, 503, 404]

  - caseId: AUDIT-006
    desc: 更新保留策略
    method: PUT
    path: /v1/audit/retention/policy
    body:
      hot_days: 90
      warm_days: 365
      cold_days: 2555
      archive_enabled: true
      purge_enabled: true
    expectStatus: [200, 201, 204, 502, 503, 404]

  - caseId: AUDIT-007
    desc: 获取保留统计
    method: GET
    path: /v1/audit/retention/stats
    expectStatus: [200, 502, 503, 404]

  - caseId: AUDIT-008
    desc: 触发保留清理
    method: POST
    path: /v1/audit/retention/cleanup
    body: {}
    expectStatus: [200, 201, 204, 502, 503, 404]
