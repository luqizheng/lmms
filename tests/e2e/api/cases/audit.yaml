group: audit-service
cases:
  # AUDIT-001/003 (POST create operation/login logs) removed in Phase 4: those
  # endpoints are gone — operation and login logs now flow through the event
  # bus (iam-service publishes → audit-service consumer writes audit_events).
  # See: docs/superpowers/specs/2026-06-26-phase4-event-bus-design.md §9.2.

  # ──── 宽松 case（兼容基础设施不完全就绪） ────
  - caseId: AUDIT-002
    desc: 分页查询操作日志
    method: GET
    path: /v1/audit/operation?page=1&size=10
    expectStatus: [200, 502, 503, 404]

  - caseId: AUDIT-004
    desc: 查询登录日志
    method: GET
    path: /v1/audit/login?page=1&size=10
    expectStatus: [200, 502, 503, 404]

  - caseId: AUDIT-005
    desc: 获取保留策略
    method: GET
    path: /v1/audit/retention/policy
    expectStatus: [200, 502, 503, 404]

  - caseId: AUDIT-006
    desc: 更新保留策略
    method: PUT
    path: /v1/audit/retention/policy
    body:
      hot_days: 90
      warm_days: 365
      cold_days: 2555
      archive_enabled: true
      purge_enabled: true
    expectStatus: [200, 201, 204, 502, 503, 404]

  - caseId: AUDIT-007
    desc: 获取保留统计
    method: GET
    path: /v1/audit/retention/stats
    expectStatus: [200, 502, 503, 404]

  - caseId: AUDIT-008
    desc: 触发保留清理
    method: POST
    path: /v1/audit/retention/cleanup
    body: {}
    expectStatus: [200, 201, 204, 502, 503, 404]

  # ──── 严格 case（服务就绪时验证真实响应） ────
  - caseId: AUDIT-100
    desc: '[严格] 操作日志分页返回 200 + 数组结构'
    method: GET
    path: /v1/audit/operation?page=1&size=10
    expectStatus: 200
    expect:
      - $.items exists
      - $.items is array

  - caseId: AUDIT-101
    desc: '[严格] 登录日志分页返回 200 + 数组结构'
    method: GET
    path: /v1/audit/login?page=1&size=10
    expectStatus: 200
    expect:
      - $.items exists
      - $.items is array

  - caseId: AUDIT-102
    desc: '[严格] 保留策略返回完整字段'
    method: GET
    path: /v1/audit/retention/policy
    expectStatus: 200
    expect:
      - $.hot_days exists
      - $.warm_days exists
      - $.cold_days exists

  - caseId: AUDIT-103
    desc: '[严格] 保留统计返回计数'
    method: GET
    path: /v1/audit/retention/stats
    expectStatus: 200
    expect:
      - $.total_size_bytes exists
      - $.hot_count exists
      - $.warm_count exists
      - $.expired_count exists

  - caseId: AUDIT-EXPORT-LOGIN
    desc: admin login 拿 user_id（供 export 用）
    method: POST
    path: /v1/iam/auth/login
    auth: false
    body:
      username: e2eadmin
      password: P@ssw0rd!
    expectStatus: 200
    expect:
      - $.user.id exists

  - caseId: AUDIT-EXPORT-001
    desc: 合规导出登录日志 CSV（GET /audit/export/compliance/login/csv/{user_id}）
    method: GET
    path: /v1/audit/export/compliance/login/csv/${AUDIT-EXPORT-LOGIN.user.id}
    headers:
      Authorization: Bearer ${AUDIT-EXPORT-LOGIN.access_token}
    expectStatus: 200

  - caseId: AUDIT-EXPORT-002
    desc: 合规导出操作日志 CSV（GET /audit/export/compliance/operation/csv/{user_id}）
    method: GET
    path: /v1/audit/export/compliance/operation/csv/${AUDIT-EXPORT-LOGIN.user.id}
    headers:
      Authorization: Bearer ${AUDIT-EXPORT-LOGIN.access_token}
    expectStatus: 200

  - caseId: AUDIT-EXPORT-003
    desc: 合规导出操作日志 JSON（GET /audit/export/compliance/operation/json/{user_id}）
    method: GET
    path: /v1/audit/export/compliance/operation/json/${AUDIT-EXPORT-LOGIN.user.id}
    headers:
      Authorization: Bearer ${AUDIT-EXPORT-LOGIN.access_token}
    expectStatus: 200

  - caseId: AUDIT-RETENTION-001
    desc: 数据留存阶段查询（GET /audit/retention/stage/:created_at）
    method: GET
    path: /v1/audit/retention/stage/2026-01-01T00:00:00Z
    expectStatus: 200
    expect:
      - $.stage exists

  - caseId: AUDIT-RETENTION-002
    desc: 留存阶段查询 — 非法 timestamp 应 400/422
    method: GET
    path: /v1/audit/retention/stage/not-a-timestamp
    expectStatus: [400, 422, 500]
