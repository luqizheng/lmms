group: project-service
cases:
  - caseId: PMD-001
    desc: project 创建（smoke）
    smoke: true
    method: POST
    path: /v1/project/projects
    headers:
      X-Tenant-Id: "1"
    body:
      code: e2e-proj-${rand}
      name: e2e project
      description: project e2e scaffold
      ownerId: e2eadmin
      startDate: "2026-07-01"
      endDate: "2026-12-31"
    expectStatus: [200, 201, 502, 503, 404]
    expect:
      - $.id exists

  - caseId: PMD-002
    desc: project 列表（smoke）
    smoke: true
    method: GET
    path: /v1/project/projects
    headers:
      X-Tenant-Id: "1"
    expectStatus: [200, 502, 503, 404]
    expect:
      - $. is array

  - caseId: PMD-003
    desc: milestone 创建
    method: POST
    path: /v1/project/projects/${PMD-001.id}/milestones
    headers:
      X-Tenant-Id: "1"
    body:
      code: e2e-ms-${rand}
      name: M1
      dueDate: "2026-09-30"
    expectStatus: [200, 201, 502, 503, 404]
    expect:
      - $.id exists

  - caseId: PMD-004
    desc: task 创建
    method: POST
    path: /v1/project/projects/${PMD-001.id}/tasks
    headers:
      X-Tenant-Id: "1"
    body:
      code: e2e-task-${rand}
      title: first task
      description: scaffold
      assigneeId: e2eadmin
    expectStatus: [200, 201, 502, 503, 404]
    expect:
      - $.id exists

  - caseId: PMD-005
    desc: task 列表
    method: GET
    path: /v1/project/tasks
    headers:
      X-Tenant-Id: "1"
    expectStatus: [200, 502, 503, 404]
    expect:
      - $. is array

  - caseId: PMD-006
    desc: task 合法状态转移 Backlog -> InProgress
    method: PATCH
    path: /v1/project/tasks/${PMD-004.id}
    headers:
      X-Tenant-Id: "1"
    body:
      status: InProgress
    expectStatus: 200
    expect:
      - $.status==InProgress

  - caseId: PMD-007
    desc: task 非法状态转移 InProgress -> Backlog 必须 422
    method: PATCH
    path: /v1/project/tasks/${PMD-004.id}
    headers:
      X-Tenant-Id: "1"
    body:
      status: Backlog
    expectStatus: 422
    expect:
      - $.code==PMD_TASK_4001

  - caseId: PMD-008
    desc: llm refine placeholder 应返回 1 个 item（pmd.llm.refinement.requested event 入 audit_events）
    method: POST
    path: /v1/project/llm/refine
    headers:
      X-Tenant-Id: "1"
    body:
      prompt: "梳理项目阶段验收标准"
      projectId: ${PMD-001.id}
    expectStatus: 200
    expect:
      - $.items is array
      - $.items contains e2e
