group: audit-service
cases:
  - caseId: HEALTH
    desc: health
    method: GET
    path: /v1/health
    expectStatus: [200,201,204,502,503,404]

  - caseId: QUERYOPERATIONLOGS
    desc: queryOperationLogs
    method: GET
    path: /v1/audit/operation
    expectStatus: [200,201,204,502,503,404]

  - caseId: CREATEOPERATIONLOG
    desc: createOperationLog
    method: POST
    path: /v1/audit/operation
    expectStatus: [200,201,204,502,503,404]

  - caseId: QUERYLOGINLOGS
    desc: queryLoginLogs
    method: GET
    path: /v1/audit/login
