# ai-pm-web 前端静态伺服 + API 反代（容器内 /etc/nginx/conf.d/default.conf）。
# 2026-11-06 起 ai-pm 与 iam 一致挂 api-gateway 之后：只保留 /api 一个前缀，
# 由网关按路径分流 pm 业务与 lmms 基础服务；不再直连 aipm-bff/pm-api
# （pm-api 只由网关经 egress_map 访问，宿主不发布端口）。
#   /api/v1/pm/*           → 网关 /v1/pm/*（pm.router.toml）
#   /api/v1/iam|auth|...   → 网关同名路径（前端 lmms SDK 的 VITE_IAM_BASE_URL=/api）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback（VITE_ROUTER_HISTORY=h5，深链需回 index.html）
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api-gateway:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE（活动面板 /v1/pm/events/stream）需要关闭缓冲
        proxy_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /health {
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }
}
