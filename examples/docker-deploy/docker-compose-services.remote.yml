# docker-compose-services.remote.yml
# ─────────────────────────────────────────────────────────────────────────────
# 跨主机部署片（模式 C）：services 组独立成机时，以本片叠加 start.sh --remote。
#
# ⚠️ 本片刻意不声明 ports：base 文件已发布全部服务端口（0.0.0.0），多 -f
#    对 ports 是追加合并，重复声明会造成重复发布冲突。prod 片的
#    `ports: !override []` 收口是同机模式的安全设计，跨主机不适用。
#
# 本片职责：
#   1. 补 restart: unless-stopped（base 仅 outbox publishers 有）
#   2. 清空 dev-only bind mounts（../../services/*/config 在远程不存在）
#      → volumes: [] 覆盖 base，让镜像内置 config.yaml 生效
#
# 跨主机 env 契约：
#   CONSUL_ADDR → infra 机；SERVICE_ADDRESS → 本机 LAN IP（consul 健康检查
#   回拨）；REDIS_HOST/RABBITMQ_HOST/DATABASE_URL → infra 机；
#   OTEL_EXPORTER_OTLP_ENDPOINT → obs 机（obs 缺席时留默认，导出失败不阻塞）。
#
# outbox publishers：无监听端口、base 已带 restart、无 dev-only volumes，本片不动。
# ─────────────────────────────────────────────────────────────────────────────
services:
  file-service:
    restart: unless-stopped

  api-gateway:
    restart: unless-stopped

  token-service:
    restart: unless-stopped

  iam-service:
    restart: unless-stopped
    # 清空 dev-only bind mount，让镜像内置 config.yaml 生效
    volumes: []

  prue_backend:
    restart: unless-stopped

  notification-service:
    restart: unless-stopped
    # 清空 dev-only bind mount，让镜像内置 config.yaml 生效
    volumes: []

  audit-service:
    restart: unless-stopped
