groups:
  - name: coder-micro-services
    interval: 30s
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'Service {{ $labels.service }} is down'
          description: '{{ $labels.service }} has been unreachable for more than 1 minute.'

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'High 5xx error rate on {{ $labels.service }}'
          description: '{{ $labels.service }} 5xx error rate is {{ $value | humanizePercentage }} over 5m.'

      - alert: HighLatency
        expr: histogram_quantile(0.99, sum by (le, service) (rate(http_request_duration_seconds_bucket[5m]))) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'High p99 latency on {{ $labels.service }}'
          description: '{{ $labels.service }} p99 latency is {{ $value }}s over 5m.'

      - alert: OutboxBacklog
        expr: outbox_events_pending > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Outbox backlog on {{ $labels.service }}'
          description: '{{ $labels.service }} has {{ $value }} pending outbox events.'

      - alert: HighRateLimit
        expr: rate(gateway_rate_limited_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'High rate limit hits on {{ $labels.route }}'
          description: 'Rate limiting {{ $labels.route }} at {{ $value }} req/s over 5m.'
