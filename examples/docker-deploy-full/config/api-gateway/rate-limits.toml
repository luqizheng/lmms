# API Gateway rate limiting configuration.
# Loaded at gateway startup. Per-route overrides defaults.
#
# Algorithm: token bucket per (route, identity) tuple.
# Identity: user_id (after JWT) > X-Real-IP (nginx-injected) > peer IP.
#
# Format:
#   defaults.* = fallback for any path not matched by routes.*
#   routes.<pattern> = exact match OR prefix match if pattern ends with '*'
#     requests_per_second = sustained rate
#     burst = max burst above sustained rate

[defaults]
requests_per_second = 100
burst = 200

# Auth endpoints — strict
[routes."/v1/iam/auth/login"]
requests_per_second = 5
burst = 10

[routes."/v1/iam/auth/register"]
requests_per_second = 2
burst = 5

[routes."/v1/iam/auth/password"]
requests_per_second = 3
burst = 5

# Self-service mail flows — prevent reset-mail flooding
[routes."/v1/iam/auth/forgot-password"]
requests_per_second = 1
burst = 3

[routes."/v1/iam/auth/reset-password"]
requests_per_second = 3
burst = 5

[routes."/v1/iam/auth/invitations/accept"]
requests_per_second = 3
burst = 5

# WebSocket — keep-alive friendly
[routes."/v1/notification/ws"]
requests_per_second = 2
burst = 5

# Notifications admin — spam prevention
[routes."/v1/notification/announcements"]
requests_per_second = 10
burst = 20

[routes."/v1/notification/announcements/read-all"]
requests_per_second = 5
burst = 10

# Menu config writes — concurrency control is in prue_backend,
# but rate-limit to prevent dashboard thrashing
[routes."/v1/pure/menu-configs"]
requests_per_second = 20
burst = 40

# Config reads — moderate
[routes."/v1/config/item"]
requests_per_second = 20
burst = 40

[routes."/v1/config/namespace"]
requests_per_second = 10
burst = 20

# Config writes — stricter
[routes."/v1/config/export"]
requests_per_second = 5
burst = 10

[routes."/v1/config/import"]
requests_per_second = 5
burst = 10
