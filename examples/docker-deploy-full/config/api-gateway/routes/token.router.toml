[[route]]
upstream   = "/v1/tokens/access"
downstream = "/tokens/access"
service    = "token-service"
public     = true

[[route]]
upstream   = "/v1/tokens/refresh"
downstream = "/tokens/refresh"
service    = "token-service"
public     = true

[[route]]
upstream   = "/v1/tokens/revoke"
downstream = "/tokens/revoke"
service    = "token-service"
public     = true

# WP-LMMS-HARDEN-01-R1：resource token 签发不再公开——网关要求有效 JWT，
# token-service 侧进一步要求 service-jwt（aud=token-service）。
[[route]]
upstream   = "/v1/tokens/resource"
downstream = "/tokens/resource"
service    = "token-service"

[[route]]
upstream   = "/v1/tokens/user-jwt"
downstream = "/tokens/user-jwt"
service    = "token-service"

[[route]]
upstream   = "/v1/tokens/.well-known/jwks.json"
downstream = "/tokens/.well-known/jwks.json"
service    = "token-service"
public     = true

[[route]]
upstream   = "/v1/admin/oauth-clients/{rest}"
downstream = "/admin/oauth-clients/{rest}"
service    = "token-service"

[[route]]
upstream   = "/v1/admin/oauth-clients"
downstream = "/admin/oauth-clients"
service    = "token-service"

[[route]]
upstream   = "/v1/api-keys"
downstream = "/api-keys"
service    = "token-service"

# Web UI 的 bootstrap token 管理面（user-jwt + 权限码鉴权）。
# 与上面的 /v1/admin/oauth-clients*（service-jwt 鉴权）是不同鉴权体系，
# 因此路径前缀用 /v1/admin/bootstrap-tokens 而非复用 oauth-clients 的通配。
[[route]]
upstream   = "/v1/admin/bootstrap-tokens/{rest}"
downstream = "/v1/admin/bootstrap-tokens/{rest}"
service    = "token-service"

[[route]]
upstream   = "/v1/admin/bootstrap-tokens"
downstream = "/v1/admin/bootstrap-tokens"
service    = "token-service"

# WP-LMMS-SERVICE-JWT-AUDIENCE-ADMIN-01：service JWT audience grant 的 Web
# 管理面（user-jwt + TOKEN_SERVICE_JWT_GRANT_* 权限码鉴权）。网关只转发，
# 鉴权在 token-service 侧强制执行。
[[route]]
upstream   = "/v1/admin/service-jwt-grants/{rest}"
downstream = "/v1/admin/service-jwt-grants/{rest}"
service    = "token-service"

[[route]]
upstream   = "/v1/admin/service-jwt-grants"
downstream = "/v1/admin/service-jwt-grants"
service    = "token-service"

[[route]]
upstream   = "/.well-known/{rest}"
downstream = "/.well-known/{rest}"
service    = "token-service"
public     = true
