# ── 服务自注册 + 日志采集公共契约 ─────────────────────────────────────────────
# 注册：libs/common-consul 读 CONSUL_ADDR/SERVICE_NAME/SERVICE_PORT/
#       SERVICE_HEALTH_PATH → 启动注册、SIGTERM 注销、30s 对账重注册。
#       不再使用 Docker labels。
# 跨主机：三组分置多机部署时（模式 C）——
#   CONSUL_ADDR 指 infra 机 IP；SERVICE_ADDRESS 必须设为本机 LAN IP
#   （consul 侧健康检查会向该地址拨号；空值时 libs/common-consul 回退容器
#   hostname，仅同机部署有效）。同机部署两者留默认即可。
#
# ── 镜像引用 ─────────────────────────────────────────────────────────────────
# image: 一律是「整名变量」（${IMAGE_FILE_SERVICE} 等），值由 .image.env 提供
# （发布即固化，node scripts/update-image-env.js -v <ver> 更新）。
# 用 :? 必填语法 —— 变量缺失时 compose 直接报错，不会静默展开成非法镜像名。
# start.sh 会加载 .image.env 并透传 --env-file；手工执行 compose 时请带上：
#   docker compose --env-file .image.env --env-file .env -f docker-compose-services.yml config
#
# ── 关于双模式（仓内开发 vs 远程部署） ────────────────────────────────────────
# 本 compose 同时声明 image 和 build：
#   image: 远程部署时直接 pull（start.sh 传 --no-build）
#   build: 仓内开发时就地构建（start.sh 传 --build）
# dev-only bind mounts（../../services/*/config）在远程机器上不存在，
# 由 docker-compose-services.remote.yml 通过 volumes: [] 覆盖清空。
# ───────────────────────────────────────────────────────────────────────────────
x-consul-env: &consul-env
  CONSUL_ADDR: "${CONSUL_ADDR:-http://consul:8500}"
  SERVICE_ADDRESS: "${SERVICE_ADDRESS:-}"
  SERVICE_HEALTH_PATH: "/health"

x-loki-labels: &loki-labels
  logging: "loki"
  env: "staging"


services:
  file-service:
    image: "${IMAGE_FILE_SERVICE:?IMAGE_FILE_SERVICE 未定义——请加载 .image.env（node scripts/update-image-env.js -v <ver>）}"
    build:
      context: ../..
      dockerfile: services/file-service/Dockerfile
    ports:
      - "8086:8082"
    labels:
      <<: *loki-labels
      service: file-service
    environment:
      <<: *consul-env
      SERVICE_PORT: "8082"
      JWKS_URL: "${JWKS_URL}"
      DATABASE_URL: "${DATABASE_URL}"
      STORAGE_PATH: "/var/lib/file-service/storage"
      RUST_LOG: "info"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}"
      SERVICE_NAME: "file-service"
    volumes:
      - file-storage:/var/lib/file-service/storage
    networks:
      - superpowers

  api-gateway:
    image: "${IMAGE_API_GATEWAY:?IMAGE_API_GATEWAY 未定义——请加载 .image.env（node scripts/update-image-env.js -v <ver>）}"
    build:
      context: ../..
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "3000:3000"
    labels:
      <<: *loki-labels
      service: api-gateway
    environment:
      <<: *consul-env
      SERVICE_PORT: "3000"
      GW_SERVER_HOST: "0.0.0.0"
      GW_SERVER_PORT: "3000"
      GW_REDIS_URL: "redis://redis:6379"
      GW_REDIS_PREFIX: "superpowers:"
      GW_CONSUL_ADDR: "http://consul:8500"
      GW_JWKS_URL: "http://token-service:8082/.well-known/jwks.json"
      GW_ISSUER: "superpowers-token-service"
      GW_ROUTES_DIR: "/app/config/api-gateway/routes"
      GW_EVENT_BUS_URL: "amqp://guest:guest@rabbitmq:5672/%2f"
      RUST_LOG: "api_gateway=trace,info"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}"
      SERVICE_NAME: "api-gateway"
    volumes:
      - ./config/api-gateway/routes:/app/config/api-gateway/routes
      - ./config/api-gateway/api-gateway.toml:/app/config/api-gateway.toml:ro
      - ./config/api-gateway/rate-limits.toml:/app/config/api-gateway/rate-limits.toml:ro
    depends_on:
      token-service:
        condition: service_healthy
    networks:
      - superpowers

  token-service:
    image: "${IMAGE_TOKEN_SERVICE:?IMAGE_TOKEN_SERVICE 未定义——请加载 .image.env（node scripts/update-image-env.js -v <ver>）}"
    build:
      context: ../..
      dockerfile: services/token-service/Dockerfile
    ports:
      - "8082:8082"
    labels:
      <<: *loki-labels
      service: token-service
    environment:
      <<: *consul-env
      SERVICE_PORT: "8082"
      SERVICE_BOOTSTRAP_TOKENS: "${SERVICE_BOOTSTRAP_TOKENS}"
      SERVICE_BOOTSTRAP_OWNERS: "${SERVICE_BOOTSTRAP_OWNERS:-}"
      TENANT_ID: "${TENANT_ID}"
      SWAGGER_ENABLED: "true"
      SERVICE_NAME: "token-service"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}"
      TOKEN_DATABASE_URL: "${DATABASE_URL}"
    networks:
      - superpowers

  iam-service:
    image: "${IMAGE_IAM_SERVICE:?IMAGE_IAM_SERVICE 未定义——请加载 .image.env（node scripts/update-image-env.js -v <ver>）}"
    build:
      context: ../..
      dockerfile: services/iam-service/Dockerfile
    ports:
      - "9081:8081"
    labels:
      <<: *loki-labels
      service: iam-service
    # dev-only bind mount: seed config.yaml from embedded default.
    # Remote deploy (start.sh --remote): remote.yml覆盖 volumes: [] 清空。
    volumes:
      - ../../services/iam-service/config:/etc/iam-service
    environment:
      <<: *consul-env
      SERVICE_PORT: "8081"
      SERVICE_BOOTSTRAP_TOKEN: "${IAM_DEV_BT}"
      TENANT_ID: "${TENANT_ID}"
      TOKEN_SERVICE_URL: "${TOKEN_SERVICE_URL:-http://token-service:8082}"
      JWKS_URL: "${JWKS_URL}"
      DATABASE_URL: "${DATABASE_URL}"
      REDIS_URL: "redis://${REDIS_HOST:-redis}:${REDIS_PORT:-6379}"
      CONFIG_PATH: "/etc/iam-service/config.yaml"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}"
      SERVICE_NAME: "iam-service"
    networks:
      - superpowers

  iam-outbox-publisher:
    image: "${IMAGE_IAM_SERVICE:?IMAGE_IAM_SERVICE 未定义——请加载 .image.env（node scripts/update-image-env.js -v <ver>）}"
    build:
      context: ../..
      dockerfile: services/iam-service/Dockerfile
    command: ["iam_outbox_publisher"]
    restart: unless-stopped
    labels:
      - "logging=loki"
      - "service=iam-outbox-publisher"
      - "env=staging"
    volumes:
      - ../../services/iam-service/config:/etc/iam-service
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      EVENT_BUS_URL: "amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS}@${RABBITMQ_HOST:-rabbitmq}:${RABBITMQ_PORT:-5672}/%2f"
      EVENT_BUS_EXCHANGE: "events"
      OUTBOX_POLL_INTERVAL_MS: "1000"
      OUTBOX_BATCH_SIZE: "100"
      CONFIG_PATH: "/etc/iam-service/config.yaml"
      METRICS_FILE_PATH: "/var/run/prometheus/iam_outbox.prom"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          f="$${METRICS_FILE_PATH:-/var/run/prometheus/iam_outbox.prom}";
          [ -f "$$f" ] && [ $$(( $$(date +%s) - $$(stat -c %Y "$$f") )) -le 60 ]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - superpowers

  prue_backend:
    image: "${IMAGE_PRUE_BACKEND:?IMAGE_PRUE_BACKEND 未定义——请加载 .image.env（node scripts/update-image-env.js -v <ver>）}"
    build:
      context: ../..
      dockerfile: services/prue_backend/Dockerfile
    ports:
      - "8087:8087"
    labels:
      <<: *loki-labels
      service: prue_backend
    environment:
      <<: *consul-env
      SERVICE_PORT: "8087"
      JWKS_URL: "${JWKS_URL}"
      DATABASE_URL: "${DATABASE_URL}"
      RUST_LOG: "info"
      SERVICE_NAME: "prue_backend"
      SERVER_PORT: "8087"
    networks:
      - superpowers

  notification-service:
    image: "${IMAGE_NOTIFICATION_SERVICE:?IMAGE_NOTIFICATION_SERVICE 未定义——请加载 .image.env（node scripts/update-image-env.js -v <ver>）}"
    build:
      context: ../..
      dockerfile: services/notification-service/Dockerfile
    ports:
      - "8083:8083"
    labels:
      <<: *loki-labels
      service: notification-service
    # dev-only bind mount: seed config.yaml from embedded default.
    # Remote deploy (start.sh --remote): remote.yml覆盖 volumes: [] 清空。
    volumes:
      - ../../services/notification-service/config:/etc/notification-service
    environment:
      <<: *consul-env
      SERVICE_PORT: "8083"
      CONFIG_PATH: "/etc/notification-service/config.yaml"
      SERVICE_BOOTSTRAP_TOKEN: "${NOTIFICATION_DEV_BT}"
      TENANT_ID: "${TENANT_ID}"
      TOKEN_SERVICE_URL: "${TOKEN_SERVICE_URL:-http://token-service:8082}"
      JWKS_URL: "${JWKS_URL}"
      EVENT_BUS_URL: "amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS}@${RABBITMQ_HOST:-rabbitmq}:${RABBITMQ_PORT:-5672}/%2f"
      SERVER_PORT: "8083"
      DATABASE_URL: "${DATABASE_URL}"
      REDIS_URL: "redis://${REDIS_HOST:-redis}:${REDIS_PORT:-6379}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}"
      SERVICE_NAME: "notification-service"
    networks:
      - superpowers

  notification-outbox-publisher:
    image: "${IMAGE_NOTIFICATION_SERVICE:?IMAGE_NOTIFICATION_SERVICE 未定义——请加载 .image.env（node scripts/update-image-env.js -v <ver>）}"
    build:
      context: ../..
      dockerfile: services/notification-service/Dockerfile
    command: ["ntf_outbox_publisher"]
    restart: unless-stopped
    labels:
      - "logging=loki"
      - "service=notification-outbox-publisher"
      - "env=staging"
    environment:
      <<: *consul-env
      SERVICE_PORT: "8083"
      DATABASE_URL: "${DATABASE_URL}"
      EVENT_BUS_URL: "amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS}@${RABBITMQ_HOST:-rabbitmq}:${RABBITMQ_PORT:-5672}/%2f"
      EVENT_BUS_EXCHANGE: "events"
      OUTBOX_POLL_INTERVAL_MS: "1000"
      OUTBOX_BATCH_SIZE: "100"
      METRICS_FILE_PATH: "/var/run/prometheus/ntf_outbox.prom"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          f="$${METRICS_FILE_PATH:-/var/run/prometheus/ntf_outbox.prom}";
          [ -f "$$f" ] && [ $$(( $$(date +%s) - $$(stat -c %Y "$$f") )) -le 60 ]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - superpowers

  audit-service:
    image: "${IMAGE_AUDIT_SERVICE:?IMAGE_AUDIT_SERVICE 未定义——请加载 .image.env（node scripts/update-image-env.js -v <ver>）}"
    build:
      context: ../..
      dockerfile: services/audit-service/Dockerfile
    ports:
      - "8084:8084"
    labels:
      <<: *loki-labels
      service: audit-service
    environment:
      <<: *consul-env
      SERVICE_PORT: "8084"
      JWKS_URL: "${JWKS_URL}"
      DATABASE_URL: "${DATABASE_URL}"
      EVENT_BUS_URL: "amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS}@${RABBITMQ_HOST:-rabbitmq}:${RABBITMQ_PORT:-5672}/%2f"
      REDIS_URL: "redis://${REDIS_HOST:-redis}:${REDIS_PORT:-6379}"
      RUST_LOG: "info"
      SERVICE_NAME: "audit-service"
      SERVER_PORT: "8084"
    networks:
      - superpowers


volumes:
  file-storage:
    name: superpowers_file-storage

networks:
  superpowers:
    external: true
