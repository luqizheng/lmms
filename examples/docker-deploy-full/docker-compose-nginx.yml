# ─────────────────────────────────────────────────────────────────────────────
# 前端反代 + 静态伺服片：nginx
#
# 职责：宿主单端口暴露给浏览器，内部反代 api-gateway，同时伺服前端 SPA 静态文件。
#   /api/* → 网关 /v1/*（rewrite 剥前缀，由网关按路径分流业务）
#   /     → /usr/share/nginx/html（VITE build 产物；未挂载时 404，API 反代仍可用）
#
# 镜像引用：整名变量（${IMAGE_NGINX}），值在 .image.env 的「基础镜像」段手工维护。
# compose 用 :? 必填语法，缺失时直接报错。
#
# 注意：nginx 走 superpowers 外部网络，proxy_pass 用容器内域名 api-gateway:3000，
#       不暴露业务端口给宿主。宿主只开 80（或 443）。
# ─────────────────────────────────────────────────────────────────────────────
services:
  nginx:
    image: "${IMAGE_NGINX:?IMAGE_NGINX 未定义——请加载 .image.env}"
    hostname: nginx
    ports:
      - "80:80"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 前端静态文件（可选；未挂载时 / 返回 404，但 /api/* 反代正常）
      # - ./web/dist:/usr/share/nginx/html:ro
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - superpowers

networks:
  superpowers:
    external: true
