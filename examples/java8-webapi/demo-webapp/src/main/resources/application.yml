server:
  port: 7000
spring:
  application:
    name: demo-webapp
  datasource:
    url: jdbc:h2:mem:demo;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate.format_sql: false
  h2:
    console:
      enabled: false
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
kudi:
  gateway:
    base-url: ${KUDI_GATEWAY_URL:http://localhost:3000}
  iam:
    username: ${DEMO_USER:demo-user}
    password: ${DEMO_PASS:demo-pass}
  client:
    api-key: ${DEMO_API_KEY:demo-key}
    api-secret: ${DEMO_API_SECRET:demo-secret}
    code: ${DEMO_API_CODE:demo-code}
logging:
  level:
    com.kudi.coder.demowebapp: INFO
    org.springframework.web: INFO