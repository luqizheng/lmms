# ─────────────────────────────────────────────────────────────────────────────
# coder-micro-services dist — main compose entry point
# Includes: infrastructure (MySQL/Redis/Consul/RabbitMQ/Registrator)
#         + business services (8 Rust + frontend)
#         + observability (Prometheus/Grafana/Jaeger/OTel/Consul-template)
# ─────────────────────────────────────────────────────────────────────────────
# Usage:
#   cp .env.example .env
#   make secrets          # generate JWT keys + replace __CHANGE_ME__ in .env
#   make up              # build frontend + pull all images + start containers
# ─────────────────────────────────────────────────────────────────────────────

include:
  - compose/infra.yml
  - compose/services.yml
  - compose/observability.yml

networks:
  superpowers:
    driver: bridge