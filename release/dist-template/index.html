<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>coder-micro-services v1.0.0 — 文档</title>
  <style>
    :root {
      --bg: #f6f8fa;
      --sidebar-bg: #ffffff;
      --text: #24292f;
      --text-muted: #57606a;
      --accent: #0969da;
      --border: #d0d7de;
      --code-bg: #f6f8fa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; display: flex; height: 100vh; }
    #sidebar { width: 260px; background: var(--sidebar-bg); border-right: 1px solid var(--border); overflow-y: auto; padding: 20px 0; flex-shrink: 0; }
    #sidebar h1 { font-size: 16px; padding: 0 20px 16px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
    #sidebar h2 { font-size: 12px; font-weight: 600; text-transform: uppercase; color: var(--text-muted); padding: 12px 20px 6px; letter-spacing: 0.5px; }
    #sidebar a { display: block; font-size: 14px; color: var(--text); text-decoration: none; padding: 5px 20px; border-radius: 0; }
    #sidebar a:hover { background: var(--bg); color: var(--accent); }
    #sidebar a.active { color: var(--accent); font-weight: 600; background: var(--bg); }
    #content { flex: 1; overflow-y: auto; padding: 32px 48px; max-width: 900px; }
    #search-box { padding: 0 20px 16px; }
    #search-box input { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; outline: none; }
    #search-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(9,105,218,0.15); }
    #search-results { padding: 0 20px 16px; display: none; }
    #search-results .result { padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 6px; cursor: pointer; font-size: 13px; }
    #search-results .result:hover { border-color: var(--accent); background: var(--bg); }
    #search-results .result .title { font-weight: 600; margin-bottom: 2px; }
    #search-results .result .snippet { color: var(--text-muted); font-size: 12px; }
    h1 { font-size: 28px; font-weight: 600; margin-bottom: 16px; }
    h2 { font-size: 20px; font-weight: 600; margin: 28px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    h3 { font-size: 16px; font-weight: 600; margin: 20px 0 8px; }
    p { margin: 10px 0; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    code { background: var(--code-bg); padding: 2px 6px; border-radius: 4px; font-size: 13px; font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
    pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px; padding: 16px; overflow-x: auto; margin: 12px 0; }
    pre code { background: none; padding: 0; font-size: 13px; }
    table { width: 100%; border-collapse: collapse; margin: 12px 0; }
    th, td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; font-size: 14px; }
    th { background: var(--bg); font-weight: 600; }
    tr:nth-child(even) { background: var(--bg); }
    .badge { display: inline-block; padding: 1px 6px; border-radius: 12px; font-size: 11px; font-weight: 600; }
    .badge-new { background: #dafbe1; color: #1a7f37; }
    .warning { background: #fff8c5; border: 1px solid #d4a72c; border-radius: 6px; padding: 12px 16px; margin: 12px 0; }
    blockquote { border-left: 4px solid var(--border); padding-left: 16px; color: var(--text-muted); margin: 12px 0; }
    #mobile-toggle { display: none; position: fixed; top: 12px; left: 12px; z-index: 100; background: var(--accent); color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; }
    @media (max-width: 768px) {
      #sidebar { position: fixed; left: -260px; z-index: 99; transition: left 0.2s; }
      #sidebar.open { left: 0; }
      #mobile-toggle { display: block; }
      #content { padding: 48px 20px 20px; }
    }
  </style>
</head>
<body>
  <button id="mobile-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>

  <nav id="sidebar">
    <h1>coder-micro-services</h1>
    <div id="search-box">
      <input type="text" id="search-input" placeholder="搜索文档..." autocomplete="off">
    </div>
    <div id="search-results"></div>

    <h2>开始使用</h2>
    <a href="#" data-page="getting-started">快速开始</a>
    <a href="#" data-page="configuration">配置参考</a>

    <h2>部署</h2>
    <a href="#" data-page="deployment/air-gap">离线部署</a>
    <a href="#" data-page="deployment/upgrade">升级指南</a>
    <a href="#" data-page="deployment/backup">备份与恢复</a>

    <h2>服务</h2>
    <a href="#" data-page="services/overview">服务概览</a>
    <a href="#" data-page="services/api-gateway">API 网关</a>

    <h2>可观测性</h2>
    <a href="#" data-page="observability/overview">监控与追踪</a>

    <h2>其他</h2>
    <a href="#" data-page="troubleshooting">故障排查</a>
    <a href="#" data-page="changelog">变更日志</a>
  </nav>

  <main id="content">
    <div id="doc-content"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/lunr@2.3.9/lunr.min.js"></script>
  <script>
    const PAGES = {
      'getting-started': 'docs/getting-started.md',
      'configuration': 'docs/configuration.md',
      'deployment/air-gap': 'docs/deployment/air-gap.md',
      'deployment/upgrade': 'docs/deployment/upgrade.md',
      'deployment/backup': 'docs/deployment/backup.md',
      'services/overview': 'docs/services/overview.md',
      'services/api-gateway': 'docs/services/api-gateway.md',
      'observability/overview': 'docs/observability/overview.md',
      'troubleshooting': 'docs/troubleshooting.md',
      'changelog': 'docs/changelog.md',
    };

    let lunrIndex = null;
    let pageTexts = {};
    let currentPage = null;

    async function buildIndex() {
      const keys = Object.keys(PAGES);
      const docs = [];
      for (const key of keys) {
        try {
          const res = await fetch(PAGES[key]);
          const text = await res.text();
          const plain = text.replace(/[#*`\[\]]/g, '').replace(/\n+/g, ' ');
          pageTexts[key] = plain.substring(0, 500);
          docs.push({ id: key, content: plain });
        } catch(e) {}
      }
      lunrIndex = lunr(function() {
        this.ref('id');
        this.field('content', { boost: 10 });
        docs.forEach(d => this.add(d));
      });
    }

    function renderMarkdown(text) {
      let html = text
        .replace(/^#{1}\s+(.+)$/gm, '<h1>$1</h1>')
        .replace(/^#{2}\s+(.+)$/gm, '<h2>$1</h2>')
        .replace(/^#{3}\s+(.+)$/gm, '<h3>$1</h3>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>')
        .replace(/^\|(.+)\|$/gm, (m) => {
          const cells = m.split('|').slice(1,-1).map(c => `<td>${c.trim()}</td>`);
          return `<tr>${cells.join('')}</tr>`;
        })
        .replace(/(<tr>.+<\/tr>)/s, (m) => `<table>${m}</table>`)
        .replace(/^```[\w]*\n([\s\S]+?)```/gm, '<pre><code>$1</code></pre>')
        .replace(/^>\s+(.+)$/gm, '<blockquote>$1</blockquote>')
        .replace(/\n\n/g, '</p><p>')
        .replace(/\n/g, '<br>');
      return `<p>${html}</p>`;
    }

    async function loadPage(key) {
      if (!PAGES[key]) return;
      try {
        const res = await fetch(PAGES[key]);
        const text = await res.text();
        document.getElementById('doc-content').innerHTML = renderMarkdown(text);
        currentPage = key;
        document.querySelectorAll('#sidebar a[data-page]').forEach(a => {
          a.classList.toggle('active', a.dataset.page === key);
        });
        document.getElementById('sidebar').classList.remove('open');
        window.scrollTo(0, 0);
      } catch(e) {
        document.getElementById('doc-content').innerHTML = '<p>加载文档失败：' + e.message + '</p>';
      }
    }

    document.getElementById('search-input').addEventListener('input', function() {
      const q = this.value.trim();
      if (!q || !lunrIndex) {
        document.getElementById('search-results').style.display = 'none';
        return;
      }
      const results = lunrIndex.search(q + '~1').slice(0, 5);
      const el = document.getElementById('search-results');
      if (results.length === 0) {
        el.style.display = 'none';
        return;
      }
      el.innerHTML = results.map(r => {
        const text = (pageTexts[r.ref] || '').substring(0, 120);
        const title = r.ref.replace(/\//g, ' › ');
        return `<div class="result" onclick="loadPage('${r.ref}')"><div class="title">${title}</div><div class="snippet">${text}...</div></div>`;
      }).join('');
      el.style.display = 'block';
    });

    document.querySelectorAll('#sidebar a[data-page]').forEach(a => {
      a.addEventListener('click', e => { e.preventDefault(); loadPage(a.dataset.page); });
    });

    buildIndex().then(() => loadPage('getting-started'));
  </script>
</body>
</html>
