# ─────────────────────────────────────────────────────────────────────────────
# coder-micro-services dist — services compose
# All images pulled from ${REGISTRY}/micro-server/<svc>:${IMAGE_TAG}.
# Frontend is built from ./frontend source.
# Usage:
#   docker compose --env-file .env -f docker-compose.yml up -d
# ─────────────────────────────────────────────────────────────────────────────

services:

  config-service:
    image: ${REGISTRY}/micro-server/config-service:${IMAGE_TAG}
    container_name: coder-micro-services-config-service
    restart: unless-stopped
    ports:
      - "8085:8081"
    labels:
      - "SERVICE_NAME=config-service"
      - "SERVICE_ID=config-service"
      - "SERVICE_PORT=8081"
      - "SERVICE_TAGS=backend,config-service"
      - "SERVICE_8081_CHECK_HTTP=/health"
      - "SERVICE_8081_CHECK_INTERVAL=15s"
      - "SERVICE_8081_CHECK_TIMEOUT=3s"
    environment:
      SERVICE_BOOTSTRAP_TOKEN: "${CONFIG_DEV_BT}"
      TENANT_ID: "${TENANT_ID}"
      TOKEN_SERVICE_URL: "${TOKEN_SERVICE_URL}"
      JWKS_URL: "${JWKS_URL}"
      SERVER_HOST: "0.0.0.0"
      SERVER_ADDR: "0.0.0.0:8081"
      DATABASE_URL: "${DATABASE_URL}"
      RUST_LOG: "info"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      SERVICE_NAME: "config-service"
      SERVICE_ID: "config-service"
      SERVICE_PORT: "8081"
      SERVICE_HEALTH_PATH: "/health"
    depends_on:
      mysql:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - superpowers

  file-service:
    image: ${REGISTRY}/micro-server/file-service:${IMAGE_TAG}
    container_name: coder-micro-services-file-service
    restart: unless-stopped
    ports:
      - "8086:8082"
    labels:
      - "SERVICE_NAME=file-service"
      - "SERVICE_ID=file-service"
      - "SERVICE_PORT=8082"
      - "SERVICE_TAGS=backend,file-service"
      - "SERVICE_8082_CHECK_HTTP=/health"
      - "SERVICE_8082_CHECK_INTERVAL=15s"
      - "SERVICE_8082_CHECK_TIMEOUT=3s"
    environment:
      SERVICE_BOOTSTRAP_TOKEN: "${FILE_DEV_BT}"
      TENANT_ID: "${TENANT_ID}"
      TOKEN_SERVICE_URL: "${TOKEN_SERVICE_URL}"
      JWKS_URL: "${JWKS_URL}"
      SERVER_HOST: "0.0.0.0"
      SERVER_ADDR: "0.0.0.0:8082"
      DATABASE_URL: "${DATABASE_URL}"
      STORAGE_PATH: "/var/lib/file-service/storage"
      RUST_LOG: "info"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      SERVICE_NAME: "file-service"
      SERVICE_ID: "file-service"
      SERVICE_PORT: "8082"
      SERVICE_HEALTH_PATH: "/health"
    volumes:
      - file-storage:/var/lib/file-service/storage
    depends_on:
      mysql:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - superpowers

  api-gateway:
    image: ${REGISTRY}/micro-server/api-gateway:${IMAGE_TAG}
    container_name: coder-micro-services-api-gateway
    restart: unless-stopped
    ports:
      - "${API_GATEWAY_PORT:-3000}:3000"
    labels:
      - "SERVICE_NAME=api-gateway"
      - "SERVICE_ID=api-gateway"
      - "SERVICE_PORT=3000"
      - "SERVICE_TAGS=backend,api-gateway"
      - "SERVICE_3000_CHECK_HTTP=/health"
      - "SERVICE_3000_CHECK_INTERVAL=15s"
      - "SERVICE_3000_CHECK_TIMEOUT=3s"
    environment:
      SERVICE_BOOTSTRAP_TOKEN: "${GATEWAY_DEV_BT}"
      TENANT_ID: "${TENANT_ID}"
      TOKEN_SERVICE_URL: "${TOKEN_SERVICE_URL}"
      JWKS_URL: "${JWKS_URL}"
      RUST_LOG: "api_gateway=trace,info"
      GW_SERVER__HOST: "0.0.0.0"
      GW_SERVER__PORT: "3000"
      GW_REDIS__URL: "redis://redis:6379"
      GW_REDIS__PREFIX: "superpowers:"
      GW_CONSUL_ADDR: "http://consul:8500"
      GW_JWKS_URL: "http://token-service:8082/.well-known/jwks.json"
      GW_ISSUER: "superpowers-token-service"
      GW_ROUTES_DIR: "/app/config/api-gateway/routes"
      GW_EVENT_BUS_URL: "amqp://guest:guest@rabbitmq:5672/%2f"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      SERVICE_NAME: "api-gateway"
      SERVICE_ID: "api-gateway"
      SERVICE_PORT: "3000"
      SERVICE_HEALTH_PATH: "/health"
    volumes:
      - ./config/api-gateway/routes:/app/config/api-gateway/routes:ro
      - ./config/api-gateway/api-gateway.toml:/app/config/api-gateway.toml:ro
      - ./config/api-gateway/rate-limits.toml:/app/config/api-gateway/rate-limits.toml:ro
      - ./secrets:/app/keys:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    depends_on:
      consul:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - superpowers

  token-service:
    image: ${REGISTRY}/micro-server/token-service:${IMAGE_TAG}
    container_name: coder-micro-services-token-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    labels:
      - "SERVICE_NAME=token-service"
      - "SERVICE_ID=token-service"
      - "SERVICE_PORT=8082"
      - "SERVICE_TAGS=backend,token-service"
      - "SERVICE_8082_CHECK_HTTP=/health"
      - "SERVICE_8082_CHECK_INTERVAL=15s"
      - "SERVICE_8082_CHECK_TIMEOUT=3s"
    volumes:
      - ./secrets:/app/keys:ro
    environment:
      SERVICE_BOOTSTRAP_TOKENS: "${SERVICE_BOOTSTRAP_TOKENS}"
      TENANT_ID: "${TENANT_ID}"
      SWAGGER_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      SERVICE_NAME: "token-service"
      SERVICE_ID: "token-service"
      SERVICE_PORT: "8082"
      SERVICE_HEALTH_PATH: "/health"
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - superpowers

  iam-service:
    image: ${REGISTRY}/micro-server/iam-service:${IMAGE_TAG}
    container_name: coder-micro-services-iam-service
    restart: unless-stopped
    ports:
      - "9081:8081"
    labels:
      - "SERVICE_NAME=iam-service"
      - "SERVICE_ID=iam-service"
      - "SERVICE_PORT=8081"
      - "SERVICE_TAGS=backend,iam-service"
      - "SERVICE_8081_CHECK_HTTP=/health"
      - "SERVICE_8081_CHECK_INTERVAL=15s"
      - "SERVICE_8081_CHECK_TIMEOUT=3s"
    volumes:
      - ./secrets:/app/keys:ro
    environment:
      SERVICE_BOOTSTRAP_TOKEN: "${IAM_DEV_BT}"
      TENANT_ID: "${TENANT_ID}"
      TOKEN_SERVICE_URL: "${TOKEN_SERVICE_URL}"
      JWKS_URL: "${JWKS_URL}"
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8081"
      DATABASE_URL: "${DATABASE_URL}"
      CONSUL_ADDR: "http://${CONSUL_HOST}:${CONSUL_HTTP_PORT}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      SERVICE_NAME: "iam-service"
      SERVICE_ID: "iam-service"
      SERVICE_PORT: "8081"
      SERVICE_HEALTH_PATH: "/health"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - superpowers

  iam-outbox-publisher:
    image: ${REGISTRY}/micro-server/iam-service:${IMAGE_TAG}
    container_name: coder-micro-services-iam-outbox-publisher
    command: ["outbox-publisher"]
    restart: unless-stopped
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      EVENT_BUS_URL: "amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@${RABBITMQ_HOST}:${RABBITMQ_PORT}/"
      EVENT_BUS_EXCHANGE: "events"
      OUTBOX_POLL_INTERVAL_MS: "1000"
      OUTBOX_BATCH_SIZE: "100"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - superpowers

  notification-service:
    image: ${REGISTRY}/micro-server/notification-service:${IMAGE_TAG}
    container_name: coder-micro-services-notification-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    labels:
      - "SERVICE_NAME=notification-service"
      - "SERVICE_ID=notification-service"
      - "SERVICE_PORT=8083"
      - "SERVICE_TAGS=backend,notification-service"
      - "SERVICE_8083_CHECK_HTTP=/health"
      - "SERVICE_8083_CHECK_INTERVAL=30s"
      - "SERVICE_8083_CHECK_TIMEOUT=3s"
    environment:
      SERVICE_BOOTSTRAP_TOKEN: "${NOTIFICATION_DEV_BT}"
      TENANT_ID: "${TENANT_ID}"
      TOKEN_SERVICE_URL: "${TOKEN_SERVICE_URL}"
      JWKS_URL: "${JWKS_URL}"
      EVENT_BUS_URL: "amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@${RABBITMQ_HOST}:${RABBITMQ_PORT}/"
      CONSUL_ADDR: "http://${CONSUL_HOST}:${CONSUL_HTTP_PORT}"
      SERVER_PORT: "8083"
      DATABASE_URL: "${DATABASE_URL}"
      REDIS_URL: "redis://${REDIS_HOST}:${REDIS_PORT}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      SERVICE_NAME: "notification-service"
      SERVICE_ID: "notification-service"
      SERVICE_PORT: "8083"
      SERVICE_HEALTH_PATH: "/health"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - superpowers

  notification-outbox-publisher:
    image: ${REGISTRY}/micro-server/notification-service:${IMAGE_TAG}
    container_name: coder-micro-services-notification-outbox-publisher
    command: ["ntf-outbox-publisher"]
    restart: unless-stopped
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      EVENT_BUS_URL: "amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@${RABBITMQ_HOST}:${RABBITMQ_PORT}/"
      EVENT_BUS_EXCHANGE: "events"
      OUTBOX_POLL_INTERVAL_MS: "1000"
      OUTBOX_BATCH_SIZE: "100"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - superpowers

  audit-service:
    image: ${REGISTRY}/micro-server/audit-service:${IMAGE_TAG}
    container_name: coder-micro-services-audit-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    labels:
      - "SERVICE_NAME=audit-service"
      - "SERVICE_ID=audit-service"
      - "SERVICE_PORT=8084"
      - "SERVICE_TAGS=backend,audit-service"
      - "SERVICE_8084_CHECK_HTTP=/health"
      - "SERVICE_8084_CHECK_INTERVAL=30s"
      - "SERVICE_8084_CHECK_TIMEOUT=3s"
    environment:
      SERVICE_BOOTSTRAP_TOKEN: "${AUDIT_DEV_BT}"
      TENANT_ID: "${TENANT_ID}"
      TOKEN_SERVICE_URL: "${TOKEN_SERVICE_URL}"
      JWKS_URL: "${JWKS_URL}"
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8084"
      DATABASE_URL: "${DATABASE_URL}"
      CONSUL_ADDR: "http://${CONSUL_HOST}:${CONSUL_HTTP_PORT}"
      CONSUL_SERVICE_NAME: "audit-service"
      EVENT_BUS_URL: "amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@${RABBITMQ_HOST}:${RABBITMQ_PORT}/"
      REDIS_URL: "redis://${REDIS_HOST}:${REDIS_PORT}"
      RUST_LOG: "info"
      SERVICE_NAME: "audit-service"
      SERVICE_ID: "audit-service"
      SERVICE_PORT: "8084"
      SERVICE_HEALTH_PATH: "/health"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - superpowers

  prue_backend:
    image: ${REGISTRY}/micro-server/prue-backend:${IMAGE_TAG}
    container_name: coder-micro-services-prue-backend
    restart: unless-stopped
    ports:
      - "8087:8087"
    labels:
      - "SERVICE_NAME=prue_backend"
      - "SERVICE_ID=prue_backend"
      - "SERVICE_PORT=8087"
      - "SERVICE_TAGS=backend,prue_backend"
      - "SERVICE_8087_CHECK_HTTP=/health"
      - "SERVICE_8087_CHECK_INTERVAL=15s"
      - "SERVICE_8087_CHECK_TIMEOUT=3s"
    environment:
      SERVICE_BOOTSTRAP_TOKEN: "${PRUE_DEV_BT}"
      TENANT_ID: "${TENANT_ID}"
      TOKEN_SERVICE_URL: "${TOKEN_SERVICE_URL}"
      JWKS_URL: "${JWKS_URL}"
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8087"
      DATABASE_URL: "${DATABASE_URL}"
      RUST_LOG: "info"
      SERVICE_NAME: "prue_backend"
      SERVICE_ID: "prue_backend"
      SERVICE_PORT: "8087"
      SERVICE_HEALTH_PATH: "/health"
    depends_on:
      mysql:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - superpowers

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: "${VITE_API_BASE:-/api}"
        VITE_DISABLE_CAPTCHA: "${VITE_DISABLE_CAPTCHA:-true}"
    image: ${REGISTRY}/micro-server/frontend:${IMAGE_TAG}
    container_name: coder-micro-services-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - superpowers

volumes:
  file-storage:

networks:
  superpowers:
    driver: bridge
