version: "3.8"

services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ../frontend:/usr/share/nginx/html
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - superpowers

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - superpowers

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    hostname: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: superpowers
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - superpowers

  consul:
    image: hashicorp/consul:1.20
    restart: unless-stopped
    ports:
      - "8500:8500"
    command: agent -dev -client=0.0.0.0 -config-dir=/consul/config
    volumes:
      - ./config/consul:/consul/config
    healthcheck:
      test: [ "CMD", "consul", "members" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - superpowers

  token-service:
    image: zhcoder-docker-registry.com:8000/micro-server/token-service
    restart: unless-stopped
    ports:
      - "6001:8080"
    volumes:
      - ./secrets:/app/keys
      - ../services/token-service/config:/app/config
    environment:
      - RUST_LOG=token_service=debug
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - DATABASE_TYPE=mysql
      - DATABASE_HOST=mysql
      - DATABASE_PORT=3306
      - DATABASE_USER=root
      - DATABASE_PASSWORD=rootpass
      - DATABASE_NAME=superpowers
      - TS_JWT_PRIVATE_KEY_PATH=/app/keys/private.pem
      - TS_JWT_PUBLIC_KEY_PATH=/app/keys/public.pem
      - TS_ISSUER=superpowers-token-service
      - TS_CONSUL_ADDR=http://consul:8500
      - TS_DEFAULT_ACCESS_TTL_SEC=3600
      - TS_DEFAULT_REFRESH_TTL_SEC=2592000
      - TS_DEFAULT_RESOURCE_TTL_SEC=300
    depends_on:
      mysql:
        condition: service_healthy
      consul:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - superpowers

  api-gateway:
    image: infrastructure-api-gateway:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./config/api-gateway/routes:/app/config/routes
      - ./secrets:/app/keys
    environment:
      - RUST_LOG=api_gateway=debug
      - GW_SERVER__HOST=0.0.0.0
      - GW_SERVER__PORT=3000
      - GW_REDIS__URL=redis://redis:6379
      - GW_REDIS__PREFIX=superpowers_
      - GW_CONSUL_ADDR=http://consul:8500
      - GW_JWKS_URL=http://token-service:8080/.well-known/jwks.json
      - GW_ISSUER=superpowers-token-service
    depends_on:
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
      token-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - superpowers

  

volumes:
  redis_data:
  mysql_data:

networks:
  superpowers:
    driver: bridge
