[[route]]
match = "/api/v1/auth/login"
service = "iam-service"
public = true
rewrite = [
  { type = "strip_prefix", prefix = "/api/v1" },
  { type = "add_prefix", prefix = "/iam" }
]

[[route]]
match = "/api/v1/auth/register"
service = "iam-service"
public = true
rewrite = [
  { type = "strip_prefix", prefix = "/api/v1" },
  { type = "add_prefix", prefix = "/iam" }
]

[[route]]
match = "/api/v1/auth/refresh"
service = "iam-service"
public = true
rewrite = [
  { type = "strip_prefix", prefix = "/api/v1" },
  { type = "add_prefix", prefix = "/iam" }
]

[[route]]
match = "/api/v1/auth/setup-status"
service = "iam-service"
public = true
rewrite = [
  { type = "strip_prefix", prefix = "/api/v1" },
  { type = "add_prefix", prefix = "/iam" }
]

[[route]]
match = "/api/v1/auth/**"
service = "iam-service"
public = false
rewrite = [
  { type = "strip_prefix", prefix = "/api/v1" },
  { type = "add_prefix", prefix = "/iam" }
]