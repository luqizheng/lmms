[[route]]
upstream   = "/v1/notification/ws"
downstream = "/notification/ws"
service    = "notification-service"
ws         = true

[[route]]
upstream   = "/v1/notification/health"
downstream = "/notification/health"
service    = "notification-service"
public     = true

[[route]]
upstream   = "/v1/notification/{rest}"
downstream = "/notification/{rest}"
service    = "notification-service"
