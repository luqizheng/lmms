# Phase 9: project-service (Java + Spring Boot 3 + JPA + Flyway). Check path
# uses /project/health because the api-gateway routes project under
# upstream /v1/project/* and strips the prefix before forwarding.
x-svc-registrator-labels-project: &svc-reg-labels-project
  - "SERVICE_NAME=project-service"
  - "SERVICE_ID=project-service"
  - "SERVICE_PORT=8080"
  - "SERVICE_TAGS=backend,project-service,java"
  - "SERVICE_8080_CHECK_HTTP=/project/health"
  - "SERVICE_8080_CHECK_INTERVAL=15s"
  - "SERVICE_8080_CHECK_TIMEOUT=3s"

# pmd-outbox-publisher is a CLI binary (no HTTP) — registrator skips it;
# therefore no label anchor is needed.

# pm-platform (Spring Boot, Phase C/B + Phase F1 dev bypass). Health path
# is /pm-api/v1/health/ready so registrator's check doesn't false-positive
# on the bare /pm-api/v1/health which doesn't touch the DB (liveness only).
x-svc-registrator-labels-pm: &svc-reg-labels-pm
  - "SERVICE_NAME=pm-platform"
  - "SERVICE_ID=pm-platform"
  - "SERVICE_PORT=8088"
  - "SERVICE_TAGS=backend,pm-platform,java"
  - "SERVICE_8088_CHECK_HTTP=/pm-api/v1/health/ready"
  - "SERVICE_8088_CHECK_INTERVAL=30s"
  - "SERVICE_8088_CHECK_TIMEOUT=5s"

services:
  config-service:
    build:
      context: ..
      dockerfile: services/config-service/Dockerfile
    ports:
      - "8085:8081"
    labels: *svc-reg-labels-config
    environment:
      SERVICE_BOOTSTRAP_TOKEN: "${CONFIG_DEV_BT}"
      TENANT_ID: "${TENANT_ID}"
      TOKEN_SERVICE_URL: "${TOKEN_SERVICE_URL}"
      JWKS_URL: "${JWKS_URL}"
      SERVER_HOST: "0.0.0.0"
      SERVER_ADDR: "0.0.0.0:8081"
      DATABASE_URL: "${DATABASE_URL}"
      RUST_LOG: "info"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      SERVICE_NAME: "config-service"
      SERVICE_ID: "config-service"
      SERVICE_PORT: "8081"
      SERVICE_HEALTH_PATH: "/health"
    depends_on:
      mysql:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - superpowers

  file-service:
    build:
      context: ..
      dockerfile: services/file-service/Dockerfile
    ports:
      - "8086:8082"
    labels: *svc-reg-labels-file
    environment:
      SERVICE_BOOTSTRAP_TOKEN: "${FILE_DEV_BT}"
      TENANT_ID: "${TENANT_ID}"
      TOKEN_SERVICE_URL: "${TOKEN_SERVICE_URL}"
      JWKS_URL: "${JWKS_URL}"
      SERVER_HOST: "0.0.0.0"
      SERVER_ADDR: "0.0.0.0:8082"
      DATABASE_URL: "${DATABASE_URL}"
      STORAGE_PATH: "/var/lib/file-service/storage"
      RUST_LOG: "info"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      SERVICE_NAME: "file-service"
      SERVICE_ID: "file-service"
      SERVICE_PORT: "8082"
      SERVICE_HEALTH_PATH: "/health"
    volumes:
      - file-storage:/var/lib/file-service/storage
    depends_on:
      mysql:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - superpowers

  # ─────────── api-gateway + sidecar ───────────
  api-gateway:
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "3000:3000"
    labels: *svc-reg-labels-gateway
    environment:
      SERVICE_BOOTSTRAP_TOKEN: "${GATEWAY_DEV_BT}"
      TENANT_ID: "${TENANT_ID}"
      TOKEN_SERVICE_URL: "${TOKEN_SERVICE_URL}"
      JWKS_URL: "${JWKS_URL}"
      RUST_LOG: "api_gateway=trace,info"
      GW_SERVER__HOST: "0.0.0.0"
      GW_SERVER__PORT: "3000"
      GW_REDIS__URL: "redis://redis:6379"
      GW_REDIS__PREFIX: "superpowers:"
      GW_CONSUL_ADDR: "http://consul:8500"
      GW_JWKS_URL: "http://token-service:8082/.well-known/jwks.json"
      GW_ISSUER: "superpowers-token-service"
      GW_ROUTES_DIR: "/app/config/api-gateway/routes"
      GW_EVENT_BUS_URL: "amqp://guest:guest@rabbitmq:5672/%2f"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      SERVICE_NAME: "api-gateway"
      SERVICE_ID: "api-gateway"
      SERVICE_PORT: "3000"
      SERVICE_HEALTH_PATH: "/health"
    volumes:
      - ./config/api-gateway/routes:/app/config/api-gateway/routes
      - ./config/api-gateway/api-gateway.toml:/app/config/api-gateway.toml:ro
      - ./config/api-gateway/rate-limits.toml:/app/config/api-gateway/rate-limits.toml:ro
      - ../docker-example/secrets:/app/keys:ro
    depends_on:
      consul:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - superpowers

  # ─────────── token-service + sidecar ───────────
  token-service:
    build:
      context: ..
      dockerfile: services/token-service/Dockerfile
    ports:
      - "8082:8082"
    labels: *svc-reg-labels-token
    # Phase 5-A-2 dephase: token-service's baked config.yaml
    # had port 18082 (mesh internal). Override at runtime with the
    # post-dephase config so the service binds 8082 without rebuild.
    volumes:
      - ../services/token-service/config:/app/config:ro
      - ../docker-example/secrets:/app/keys:ro
    environment:
      SERVICE_BOOTSTRAP_TOKENS: "${SERVICE_BOOTSTRAP_TOKENS}"
      TENANT_ID: "${TENANT_ID}"
      SWAGGER_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      SERVICE_NAME: "token-service"
      SERVICE_ID: "token-service"
      SERVICE_PORT: "8082"
      SERVICE_HEALTH_PATH: "/health"
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - superpowers

  # ─────────── iam-service + sidecar ───────────
  iam-service:
    build:
      context: ..
      dockerfile: services/iam-service/Dockerfile
    ports:
      - "9081:8081"
    labels: *svc-reg-labels-iam
    volumes:
      - ../docker-example/secrets:/app/keys:ro
      - ../services/iam-service/config:/etc/iam-service:ro
    environment:
      SERVICE_BOOTSTRAP_TOKEN: "${IAM_DEV_BT}"
      TENANT_ID: "${TENANT_ID}"
      TOKEN_SERVICE_URL: "${TOKEN_SERVICE_URL}"
      JWKS_URL: "${JWKS_URL}"
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8081"
      DATABASE_URL: "${DATABASE_URL}"
      CONSUL_ADDR: "http://${CONSUL_HOST}:${CONSUL_HTTP_PORT}"
      CONFIG_PATH: "/etc/iam-service/config.yaml"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      SERVICE_NAME: "iam-service"
      SERVICE_ID: "iam-service"
      SERVICE_PORT: "8081"
      SERVICE_HEALTH_PATH: "/health"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - superpowers

  iam-outbox-publisher:
    build:
      context: ..
      dockerfile: services/iam-service/Dockerfile
    command: ["outbox-publisher"]
    restart: unless-stopped
    volumes:
      - ../services/iam-service/config:/etc/iam-service:ro
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      EVENT_BUS_URL: "amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@${RABBITMQ_HOST}:${RABBITMQ_PORT}/"
      EVENT_BUS_EXCHANGE: "events"
      OUTBOX_POLL_INTERVAL_MS: "1000"
      OUTBOX_BATCH_SIZE: "100"
      CONFIG_PATH: "/etc/iam-service/config.yaml"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - superpowers

  # ─────────── prue_backend + sidecar ───────────
  prue_backend:
    build:
      context: ..
      dockerfile: services/prue_backend/Dockerfile
    ports:
      - "8087:8087"
    labels: *svc-reg-labels-prue
    environment:
      SERVICE_BOOTSTRAP_TOKEN: "${PRUE_DEV_BT}"
      TENANT_ID: "${TENANT_ID}"
      TOKEN_SERVICE_URL: "${TOKEN_SERVICE_URL}"
      JWKS_URL: "${JWKS_URL}"
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8087"
      DATABASE_URL: "${DATABASE_URL}"
      RUST_LOG: "info"
      SERVICE_NAME: "prue_backend"
      SERVICE_ID: "prue_backend"
      SERVICE_PORT: "8087"
      SERVICE_HEALTH_PATH: "/health"
    depends_on:
      mysql:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - superpowers

  # ─────────── notification-service + sidecar ───────────
  notification-service:
    build:
      context: ..
      dockerfile: services/notification-service/Dockerfile
    ports:
      - "8083:8083"
    labels: *svc-reg-labels-notify
    # Phase 5-A-2 dephase: notification-service's baked config.yaml
    # had http_addr 127.0.0.1:18083 (mesh internal). Override at runtime
    # with the post-dephase config so the service binds 0.0.0.0:8083
    # without rebuild.
    volumes:
      - ../services/notification-service/config:/app/config:ro
    environment:
      SERVICE_BOOTSTRAP_TOKEN: "${NOTIFICATION_DEV_BT}"
      TENANT_ID: "${TENANT_ID}"
      TOKEN_SERVICE_URL: "${TOKEN_SERVICE_URL}"
      JWKS_URL: "${JWKS_URL}"
      EVENT_BUS_URL: "amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@${RABBITMQ_HOST}:${RABBITMQ_PORT}/"
      CONSUL_ADDR: "http://${CONSUL_HOST}:${CONSUL_HTTP_PORT}"
      SERVER_PORT: "8083"
      DATABASE_URL: "${DATABASE_URL}"
      REDIS_URL: "redis://${REDIS_HOST}:${REDIS_PORT}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      SERVICE_NAME: "notification-service"
      SERVICE_ID: "notification-service"
      SERVICE_PORT: "8083"
      SERVICE_HEALTH_PATH: "/health"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - superpowers

  notification-outbox-publisher:
    build:
      context: ..
      dockerfile: services/notification-service/Dockerfile
    command: ["ntf-outbox-publisher"]
    restart: unless-stopped
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      EVENT_BUS_URL: "amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@${RABBITMQ_HOST}:${RABBITMQ_PORT}/"
      EVENT_BUS_EXCHANGE: "events"
      OUTBOX_POLL_INTERVAL_MS: "1000"
      OUTBOX_BATCH_SIZE: "100"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - superpowers

  # ─────────── audit-service + sidecar ───────────
  audit-service:
    build:
      context: ..
      dockerfile: services/audit-service/Dockerfile
    ports:
      - "8084:8084"
    labels: *svc-reg-labels-audit
    environment:
      SERVICE_BOOTSTRAP_TOKEN: "${AUDIT_DEV_BT}"
      TENANT_ID: "${TENANT_ID}"
      TOKEN_SERVICE_URL: "${TOKEN_SERVICE_URL}"
      JWKS_URL: "${JWKS_URL}"
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8084"
      DATABASE_URL: "${DATABASE_URL}"
      CONSUL_ADDR: "http://${CONSUL_HOST}:${CONSUL_HTTP_PORT}"
      CONSUL_SERVICE_NAME: "audit-service"
      EVENT_BUS_URL: "amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@${RABBITMQ_HOST}:${RABBITMQ_PORT}/"
      REDIS_URL: "redis://${REDIS_HOST}:${REDIS_PORT}"
      RUST_LOG: "info"
      SERVICE_NAME: "audit-service"
      SERVICE_ID: "audit-service"
      SERVICE_PORT: "8084"
      SERVICE_HEALTH_PATH: "/health"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - superpowers

  # ─────────── Phase 9 / project-service (Java + Spring Boot) ───────────
  # See services/project-service/Dockerfile (multi-stage eclipse-temurin:25-jdk
  # → 25-jre-alpine). Migrations (V001__init.sql) auto-applied via Flyway at
  # startup; service fails boot if the existing pmd_* tables don't match.
  project-service:
    build:
      context: ..
      dockerfile: services/project-service/Dockerfile
    ports:
      - "${PROJECT_SERVICE_PORT_EXPORT:-6008}:8080"
    labels: *svc-reg-labels-project
    environment:
      TENANT_ID: "${TENANT_ID}"
      DATABASE_URL: "${DATABASE_URL}"
      EVENT_BUS_URL: "amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@${RABBITMQ_HOST}:${RABBITMQ_PORT}/"
      CONSUL_ADDR: "http://${CONSUL_HOST}:${CONSUL_HTTP_PORT}"
      SPRING_PROFILES_ACTIVE: "prod"
      SWAGGER_ENABLED: "false"
      PMD_LLM_PROVIDER: "placeholder"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      JAVA_OPTS: "-XX:+UseG1GC -XX:MaxRAMPercentage=75.0"
    depends_on:
      mysql:
        condition: service_healthy
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - superpowers

  # ─────────── Phase 9 / pmd-outbox-publisher (Rust, CLI) ───────────
  # Same workspace cargo-target as notification's family; no Swarm port
  # exposure (CLI), no registrator labels. Mirrors services/pmd-outbox-publisher
  # /src/main.rs: env DATABASE_URL, EVENT_BUS_URL, EVENT_BUS_EXCHANGE.
  pmd-outbox-publisher:
    build:
      context: ..
      dockerfile: services/pmd-outbox-publisher/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      EVENT_BUS_URL: "amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@${RABBITMQ_HOST}:${RABBITMQ_PORT}/"
      EVENT_BUS_EXCHANGE: "events"
      OUTBOX_POLL_INTERVAL_MS: "200"
      OUTBOX_BATCH_SIZE: "100"
      RUST_LOG: "info"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - superpowers

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_DISABLE_CAPTCHA: "true"
    ports:
      - "8080:80"
    depends_on:
      - api-gateway
    networks:
      - superpowers

  # ─────────── pm ───────────
  # Phase C/B + Phase F1: PM service authenticates inbound requests via the
  # same RS256 JWKS as the Rust services (issuer=superpowers-token-service,
  # audience=coder-micro-services, scope=access). Profile defaults to
  # ${PM_SPRING_PROFILE:-prod} — set PM_SPRING_PROFILE=dev in .env to enable
  # the NoOpJwtVerifier dev bypass for local exploration without iam-service.
  pm:
    build:
      context: ..
      dockerfile: apps/pm/Dockerfile
    image: pm-platform:0.1.0
    ports:
      - "8088:8088"
    labels: *svc-reg-labels-pm
    environment:
      SERVER_PORT: "8088"
      SPRING_PROFILES_ACTIVE: "${PM_SPRING_PROFILE:-prod}"
      SPRING_DATASOURCE_URL: "${DATABASE_URL}"
      SPRING_DATASOURCE_USERNAME: "${MYSQL_USER}"
      SPRING_DATASOURCE_PASSWORD: "${MYSQL_PASSWORD}"
      LOWMEM_GATEWAY_BASE: "http://api-gateway:3000"
      PM_JWT_JWKS_URL: "${LOWMEM_GATEWAY_BASE:-http://api-gateway:3000}/v1/tokens/.well-known/jwks.json"
      PM_JWT_MODE: "${PM_JWT_MODE:-jwks}"
      PM_LLM_PROVIDER: "${PM_LLM_PROVIDER:-noop}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:-https://api.deepseek.com}"
      DEEPSEEK_MODEL: "${DEEPSEEK_MODEL:-deepseek-v4-flash}"
      PM_SDK_BEARER: "${PM_SDK_BEARER:-dev-bypass-token}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      JAVA_OPTS: "-XX:+UseG1GC -XX:MaxRAMPercentage=75.0"
    depends_on:
      mysql:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - superpowers

volumes:
  file-storage:

networks:
  superpowers:

