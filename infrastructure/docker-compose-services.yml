services:
  api-gateway:
    image: zhcoder-docker-registry.com:8000/micro-server/api-gateway:latest
    ports:
      - "3000:3000"
    environment:
      RUST_LOG: "api_gateway=trace,info"
      GW_SERVER__HOST: "0.0.0.0"
      GW_SERVER__PORT: "3000"
      GW_REDIS__URL: "redis://redis:6379"
      GW_REDIS__PREFIX: "superpowers:"
      GW_CONSUL_ADDR: "http://consul:8500"
      GW_JWKS_URL: "http://token-service:8080/.well-known/jwks.json"
      GW_ISSUER: "superpowers-token-service"
      GW_ROUTES_DIR: "/app/config/api-gateway/routes"
      GW_JWKS_PUBLIC_KEY_PATH: "/app/keys/public.pem"
      # OTel tracing — enable when observability overlay is up
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    entrypoint: ["sh", "-c"]
    command:
      - |
        i=0
        until getent hosts token-service >/dev/null 2>&1 && wget -q --spider http://token-service:8080/.well-known/jwks.json; do
          i=$$((i+1))
          if [ $$i -ge 60 ]; then echo "token-service jwks not ready, giving up"; exit 1; fi
          echo "waiting token-service jwks... ($$i)"
          sleep 1
        done
        exec /app/api-gateway serve --routes /app/config/api-gateway/routes
    volumes:
      - ./config/api-gateway/routes:/app/config/api-gateway/routes
      - ../docker-example/secrets:/app/keys:ro
    depends_on:
      consul:
        condition: service_healthy
      redis:
        condition: service_healthy
      token-service:
        condition: service_healthy
    networks:
      - superpowers

  token-service:
    build:
      context: ..
      dockerfile: services/token-service/Dockerfile
    ports:
      - "6001:8080"
    volumes:
      - ../docker-example/secrets:/app/keys
      - ../docker-example/config/token-service:/app/config/token-service
      - ../services/token-service/config:/app/config
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8080"
      REDIS_URL: "redis://redis:6379"
      DATABASE_HOST: mysql
      DATABASE_PORT: "3306"
      DATABASE_USER: root
      DATABASE_PASSWORD: rootpass
      DATABASE_NAME: superpowers
      TS_JWT_PRIVATE_KEY_PATH: "/app/keys/private.pem"
      TS_JWT_PUBLIC_KEY_PATH: "/app/keys/public.pem"
      TS_CLIENTS_FILE_PATH: "/app/config/clients.json"
      TS_CONSUL_ADDR: "http://consul:8500"
      CONFIG_FILE: "/config/config.yaml"
      # OTel tracing — enable when observability overlay is up
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    healthcheck:
      test: ["CMD", "busybox", "wget", "-q", "--spider", "http://127.0.0.1:8080/.well-known/jwks.json"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - superpowers

  iam-service:
    build:
      context: ..
      dockerfile: services/iam-service/Dockerfile
    ports:
      - "6002:8080"
    volumes:
      - ../docker-example/secrets:/app/keys:ro
      - ../services/iam-service/config:/etc/iam-service:ro
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8080"
      DATABASE_HOST: mysql
      DATABASE_PORT: "3306"
      DATABASE_USER: root
      DATABASE_PASSWORD: rootpass
      DATABASE_NAME: superpowers
      CONSUL_ADDR: "http://consul:8500"
      CONFIG_PATH: "/etc/iam-service/config.yaml"
      # OTel tracing — enable when observability overlay is up
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - superpowers

  iam-outbox-publisher:
    build:
      context: ..
      dockerfile: services/iam-service/Dockerfile
    command: ["outbox-publisher"]
    volumes:
      - ../services/iam-service/config:/etc/iam-service:ro
    environment:
      DATABASE_URL: "mysql://root:rootpass@mysql:3306/superpowers"
      EVENT_BUS_URL: "amqp://guest:guest@rabbitmq:5672/%2f"
      EVENT_BUS_EXCHANGE: "events"
      OUTBOX_POLL_INTERVAL_MS: "1000"
      OUTBOX_BATCH_SIZE: "100"
      CONFIG_PATH: "/etc/iam-service/config.yaml"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - superpowers

  prue_backend:
    build:
      context: ..
      dockerfile: services/prue_backend/Dockerfile
    ports:
      - "6004:8080"
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8080"
      DATABASE_URL: "mysql://root:rootpass@mysql:3306/superpowers"
      RUST_LOG: "info"
    depends_on:
      mysql:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - superpowers

  notification-service:
    build:
      context: ..
      dockerfile: services/notification-service/Dockerfile
    ports:
      - "6003:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
    environment:
      CONSUL_ADDR: "http://consul:8500"
      SERVER_PORT: "8080"
      DATABASE_HOST: mysql
      DATABASE_PORT: "3306"
      DATABASE_USER: root
      DATABASE_PASSWORD: rootpass
      DATABASE_NAME: superpowers
      REDIS_URL: "redis://redis:6379"
      # OTel tracing — enable when observability overlay is up
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    volumes:
      - ../docker-example/config/notification-service:/app/config:ro
    networks:
      - superpowers

  audit-service:
    build:
      context: ..
      dockerfile: services/audit-service/Dockerfile
    ports:
      - "6005:8080"
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8080"
      DATABASE_HOST: mysql
      DATABASE_PORT: "3306"
      DATABASE_USER: root
      DATABASE_PASSWORD: rootpass
      DATABASE_NAME: superpowers
      CONSUL_ADDR: "http://consul:8500"
      CONSUL_SERVICE_NAME: "audit-service"
      RUST_LOG: "info"
    depends_on:
      mysql:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - superpowers

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # e2e 测试环境禁用登录图形验证码，便于 Playwright 自动化
        VITE_DISABLE_CAPTCHA: "true"
    ports:
      - "8080:80"
    depends_on:
      - api-gateway
    networks:
      - superpowers

