services:
  config-service:
    build:
      context: ..
      dockerfile: services/config-service/Dockerfile
    ports:
      - "8085:8081"
    labels: *svc-reg-labels-config
    environment:
      # ── 直接读取（main.rs 中硬编码读取） ──
      JWKS_URL: "${JWKS_URL}"
      DATABASE_URL: "${DATABASE_URL}"
      RUST_LOG: "info"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      SERVICE_NAME: "config-service"
      # SERVER_ADDR: "0.0.0.0:8081"   # 默认值，取消注释可覆盖

      # ── config.yaml 中的默认值，取消注释可覆盖 ──
      # SWAGGER_ENABLED: "false"
    depends_on:
      mysql:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - superpowers

  file-service:
    build:
      context: ..
      dockerfile: services/file-service/Dockerfile
    ports:
      - "8086:8082"
    labels: *svc-reg-labels-file
    environment:
      # ── 直接读取（main.rs 中硬编码读取） ──
      JWKS_URL: "${JWKS_URL}"
      DATABASE_URL: "${DATABASE_URL}"
      STORAGE_PATH: "/var/lib/file-service/storage"
      RUST_LOG: "info"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      SERVICE_NAME: "file-service"
      # SERVER_ADDR: "0.0.0.0:8082"   # 默认值，取消注释可覆盖

      # ── config.yaml 中的默认值，取消注释可覆盖 ──
      # SWAGGER_ENABLED: "false"
    volumes:
      - file-storage:/var/lib/file-service/storage
    depends_on:
      mysql:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - superpowers

  # ─────────── api-gateway + sidecar ───────────
  api-gateway:
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "3000:3000"
    labels: *svc-reg-labels-gateway
    environment:
      # ── 直接读取（GW_ 前缀，config.rs::apply_env_overrides 手写映射） ──
      GW_SERVER_HOST: "0.0.0.0"
      GW_SERVER_PORT: "3000"
      GW_REDIS_URL: "redis://redis:6379"
      GW_REDIS_PREFIX: "superpowers:"
      GW_CONSUL_ADDR: "http://consul:8500"
      GW_JWKS_URL: "http://token-service:8082/.well-known/jwks.json"
      GW_ISSUER: "superpowers-token-service"
      GW_ROUTES_DIR: "/app/config/api-gateway/routes"
      GW_EVENT_BUS_URL: "amqp://guest:guest@rabbitmq:5672/%2f"
      # GW_PERM_EPOCH_TTL_SEC: "900"   # 默认值，取消注释可覆盖
      RUST_LOG: "api_gateway=trace,info"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      SERVICE_NAME: "api-gateway"
    volumes:
      - ./config/api-gateway/routes:/app/config/api-gateway/routes
      - ./config/api-gateway/api-gateway.toml:/app/config/api-gateway.toml:ro
      - ./config/api-gateway/rate-limits.toml:/app/config/api-gateway/rate-limits.toml:ro
    depends_on:
      consul:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      # JWKS 起动竞态修复：gateway 启动即拉取 JWKS，token-service 未就绪会缓存
      # 空公钥 → 后续一律 "Invalid or expired token"（下游联调实测，须重启 gateway 自愈）
      token-service:
        condition: service_healthy
    networks:
      - superpowers

  # ─────────── token-service + sidecar ───────────
  token-service:
    build:
      context: ..
      dockerfile: services/token-service/Dockerfile
    ports:
      - "8082:8082"
    labels: *svc-reg-labels-token
    # Phase 5-A-2 dephase: token-service's baked config.yaml
    # had port 18082 (mesh internal). Override at runtime with the
    # post-dephase config so the service binds 8082 without rebuild.
    volumes:
      - ../services/token-service/config:/app/config:ro
      # ── secret-key volume 已移除 ──────────────────────────────────
      # 原映射: ../docker-example/secrets:/app/keys:ro
      #
      # 原因: token-service 启动时若 /app/keys/ 下找不到 private.pem /
      # public.pem，main.rs::load_or_generate_keys 会自动生成新的 RSA
      # key pair 并写入 /app/keys/（Dockerfile 已 mkdir -p /app/keys），
      # 服务可自举，无需外部挂载 key 文件。消费方 api-gateway / iam-service
      # 通过 JWKS URL（http://token-service:8082/.well-known/jwks.json）
      # 动态拉取 public key 验签，同样不依赖本地 key 文件。
      #
      # ⚠️ 副作用: 容器每次重启都会重新生成 key pair，此前签发的所有
      #    access / refresh token 立即失效，用户需重新登录。如需 key
      #    跨重启持久化或多实例共享同一 key，恢复本行挂载即可。
      # ──────────────────────────────────────────────────────────
    environment:
      # ── 直接读取（main.rs 中硬编码读取，非 TOKEN_ 前缀） ──
      SERVICE_BOOTSTRAP_TOKENS: "${SERVICE_BOOTSTRAP_TOKENS}"
      TENANT_ID: "${TENANT_ID}"
      SWAGGER_ENABLED: "true"
      SERVICE_NAME: "token-service"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      # CONFIG_SERVICE_URL: ""       # 可选：远程配置中心地址
      # CONFIG_SERVICE_NAMESPACE: "" # 可选：远程配置中心命名空间
      # RUST_LOG: "info"

      # ── 覆盖 config.yaml（TOKEN_ 前缀，由 config.rs::apply_env_overrides 手写映射） ──
      TOKEN_DATABASE_URL: "${DATABASE_URL}"    # 数据库连接
      TOKEN_DATABASE_DB_TYPE: "mysql"
      # ── config.yaml 中的默认值，取消注释可覆盖 ──
      # TOKEN_SERVER_HOST: "0.0.0.0"
      # TOKEN_SERVER_PORT: "8082"
      # TOKEN_DATABASE_MAX_CONNECTIONS: "16"
      # TOKEN_CONSUL_ADDR: "http://consul:8500"
      # TOKEN_CONSUL_SERVICE_NAME: "token-service"
      # TOKEN_CONSUL_SERVICE_ID_FILE: "/tmp/token-service-id"
      # TOKEN_JWT_PRIVATE_KEY_PATH: "/app/keys/private.pem"
      # TOKEN_JWT_PUBLIC_KEY_PATH: "/app/keys/public.pem"
      # TOKEN_ISSUER: "superpowers-token-service"
      # TOKEN_DEFAULT_ACCESS_TTL_SEC: "3600"
      # TOKEN_DEFAULT_REFRESH_TTL_SEC: "2592000"
      # TOKEN_DEFAULT_RESOURCE_TTL_SEC: "300"
      # TOKEN_USER_SERVICE_URL: "http://iam-service:8081"
    depends_on:
      mysql:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - superpowers

  # ─────────── iam-service + sidecar ───────────
  iam-service:
    build:
      context: ..
      dockerfile: services/iam-service/Dockerfile
    ports:
      - "9081:8081"
    labels: *svc-reg-labels-iam
    # dev-only bind mount: iam-service writes config.yaml on first boot from
    # embedded default (see services/iam-service/src/config.rs). Not :ro so
    # seed can succeed; runtime env vars always override the yaml regardless.
    # The seeded yaml is git-ignored (see .gitignore).
    volumes:
      - ../services/iam-service/config:/etc/iam-service
    environment:
      # ── 直接读取（main.rs 中硬编码读取） ──
      SERVICE_BOOTSTRAP_TOKEN: "${IAM_DEV_BT}"
      TENANT_ID: "${TENANT_ID}"
      TOKEN_SERVICE_URL: "${TOKEN_SERVICE_URL}"
      JWKS_URL: "${JWKS_URL}"
      # IAM_PRIVATE_KEY_PEM_PATH: "" # 可选：私钥 PEM 文件路径（当前未使用）
      DATABASE_URL: "${DATABASE_URL}"
      REDIS_URL: "redis://${REDIS_HOST}:${REDIS_PORT}"
      CONFIG_PATH: "/etc/iam-service/config.yaml"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      SERVICE_NAME: "iam-service"

      # ── config.yaml 中的默认值，取消注释可覆盖 ──
      # SERVER_HOST: "0.0.0.0"
      # SERVER_PORT: "8081"
      # SWAGGER_ENABLED: "true"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - superpowers

  iam-outbox-publisher:
    build:
      context: ..
      dockerfile: services/iam-service/Dockerfile
    # Cargo bin target → on-disk binary is `iam_outbox_publisher`
    # (kebab-case `iam-outbox-publisher` declared in
    # services/iam-outbox-publisher/Cargo.toml; cargo rewrites bin names
    # to underscores on disk). Compose `command:` must reference the
    # on-disk name — bare `outbox-publisher` fails OCI runtime with
    # `executable file not found in $PATH`.
    command: ["iam_outbox_publisher"]
    restart: unless-stopped
    labels:
      - "logging=loki"
      - "service=iam-outbox-publisher"
      - "env=staging"
    # dev-only bind mount: shares the seeded config.yaml with iam-service.
    # Not :ro — both processes race to seed; create_new picks one winner
    # (see services/iam-outbox-publisher/src/main.rs::seed_if_absent).
    volumes:
      - ../services/iam-service/config:/etc/iam-service
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      EVENT_BUS_URL: "amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@${RABBITMQ_HOST}:${RABBITMQ_PORT}/%2f"
      EVENT_BUS_EXCHANGE: "events"
      OUTBOX_POLL_INTERVAL_MS: "1000"
      OUTBOX_BATCH_SIZE: "100"
      CONFIG_PATH: "/etc/iam-service/config.yaml"
      METRICS_FILE_PATH: "/var/run/prometheus/iam_outbox.prom"
    healthcheck:
      # publisher 是无监听端口的 worker，而镜像内置的 HEALTHCHECK 探的是服务端端口
      # （同一张镜像按 command: 切角色，HEALTHCHECK 却是镜像级的）→ 恒 unhealthy。
      # 这里改查 Prometheus 指标文件的新鲜度：publisher 每轮轮询原子写一次该文件，
      # mtime 新鲜即轮询循环存活，卡死则停更。
      test:
        - CMD-SHELL
        - >-
          f="$${METRICS_FILE_PATH:-/var/run/prometheus/iam_outbox.prom}";
          [ -f "$$f" ] && [ $$(( $$(date +%s) - $$(stat -c %Y "$$f") )) -le 60 ]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - superpowers

  # ─────────── prue_backend + sidecar ───────────
  prue_backend:
    build:
      context: ..
      dockerfile: services/prue_backend/Dockerfile
    ports:
      - "8087:8087"
    labels: *svc-reg-labels-prue
    environment:
      # ── 直接读取（main.rs 中硬编码读取） ──
      JWKS_URL: "${JWKS_URL}"
      DATABASE_URL: "${DATABASE_URL}"
      RUST_LOG: "info"
      # CONSUL_ADDR: "http://consul:8500"  # 默认值，取消注释可覆盖
      SERVICE_NAME: "prue_backend"

      SERVER_PORT: "8087"         # 非默认值（代码默认 8080），必须显式设置

      # ── 代码默认值，取消注释可覆盖 ──
      # SERVER_HOST: "0.0.0.0"
      # SWAGGER_ENABLED: "false"
    depends_on:
      mysql:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - superpowers

  # ─────────── notification-service + sidecar ───────────
  notification-service:
    build:
      context: ..
      dockerfile: services/notification-service/Dockerfile
    ports:
      - "8083:8083"
    labels: *svc-reg-labels-notify
    # dev-only bind mount: notification-service writes config.yaml on first
    # boot from embedded default (see services/notification-service/src/config.rs).
    # Not :ro so seed can succeed; env always wins over the yaml regardless.
    # The seeded yaml is git-ignored.
    volumes:
      - ../services/notification-service/config:/etc/notification-service
    environment:
      # ── 直接读取（main.rs 中硬编码读取） ──
      CONFIG_PATH: "/etc/notification-service/config.yaml"
      SERVICE_BOOTSTRAP_TOKEN: "${NOTIFICATION_DEV_BT}"
      TENANT_ID: "${TENANT_ID}"
      TOKEN_SERVICE_URL: "${TOKEN_SERVICE_URL}"
      JWKS_URL: "${JWKS_URL}"
      EVENT_BUS_URL: "amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@${RABBITMQ_HOST}:${RABBITMQ_PORT}/%2f"
      SERVER_PORT: "8083"
      DATABASE_URL: "${DATABASE_URL}"
      REDIS_URL: "redis://${REDIS_HOST}:${REDIS_PORT}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      SERVICE_NAME: "notification-service"

      # ── config.yaml 中的默认值，取消注释可覆盖 ──
      # SWAGGER_ENABLED: "true"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - superpowers

  notification-outbox-publisher:
    build:
      context: ..
      dockerfile: services/notification-service/Dockerfile
    # Cargo bin target → on-disk binary is `ntf_outbox_publisher`
    # (kebab-case `ntf-outbox-publisher` declared in
    # services/notification-service/Cargo.toml; cargo rewrites bin names
    # to underscores on disk). Compose `command:` must reference the
    # on-disk name — kebab-case here fails OCI runtime with
    # `executable file not found in $PATH`.
    command: ["ntf_outbox_publisher"]
    restart: unless-stopped
    labels:
      - "logging=loki"
      - "service=notification-outbox-publisher"
      - "env=staging"
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      EVENT_BUS_URL: "amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@${RABBITMQ_HOST}:${RABBITMQ_PORT}/%2f"
      EVENT_BUS_EXCHANGE: "events"
      OUTBOX_POLL_INTERVAL_MS: "1000"
      OUTBOX_BATCH_SIZE: "100"
      METRICS_FILE_PATH: "/var/run/prometheus/ntf_outbox.prom"
    healthcheck:
      # publisher 是无监听端口的 worker，而镜像内置的 HEALTHCHECK 探的是服务端端口
      # （同一张镜像按 command: 切角色，HEALTHCHECK 却是镜像级的）→ 恒 unhealthy。
      # 这里改查 Prometheus 指标文件的新鲜度：publisher 每轮轮询原子写一次该文件，
      # mtime 新鲜即轮询循环存活，卡死则停更。
      test:
        - CMD-SHELL
        - >-
          f="$${METRICS_FILE_PATH:-/var/run/prometheus/ntf_outbox.prom}";
          [ -f "$$f" ] && [ $$(( $$(date +%s) - $$(stat -c %Y "$$f") )) -le 60 ]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - superpowers

  # ─────────── audit-service + sidecar ───────────
  audit-service:
    build:
      context: ..
      dockerfile: services/audit-service/Dockerfile
    ports:
      - "8084:8084"
    labels: *svc-reg-labels-audit
    environment:
      # ── 直接读取（main.rs 中硬编码读取） ──
      JWKS_URL: "${JWKS_URL}"
      DATABASE_URL: "${DATABASE_URL}"
      EVENT_BUS_URL: "amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@${RABBITMQ_HOST}:${RABBITMQ_PORT}/%2f"
      REDIS_URL: "redis://${REDIS_HOST}:${REDIS_PORT}"
      # CONSUL_ADDR: "http://consul:8500"   # 默认值，取消注释可覆盖
      # CONSUL_SERVICE_NAME: "audit-service"  # 默认值，取消注释可覆盖
      RUST_LOG: "info"
      SERVICE_NAME: "audit-service"

      SERVER_PORT: "8084"         # 非默认值（代码默认 8080），必须显式设置

      # ── 代码默认值，取消注释可覆盖 ──
      # SERVER_HOST: "0.0.0.0"
      # SWAGGER_ENABLED: "false"
      # LOGIN_RISK_THRESHOLD: "5"       # 风控：窗口内登录失败次数告警阈值
      # LOGIN_RISK_WINDOW_SECS: "300"   # 风控：滑动窗口秒数
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - superpowers


volumes:
  file-storage:

networks:
  superpowers:

