x-svc-registrator-labels-config: &svc-reg-labels-config
  - "SERVICE_NAME=config-service"
  - "SERVICE_ID=config-service"
  - "SERVICE_PORT=8081"
  - "SERVICE_TAGS=backend,config-service"
  - "SERVICE_8081_CHECK_HTTP=/health"
  - "SERVICE_8081_CHECK_INTERVAL=15s"
  - "SERVICE_8081_CHECK_TIMEOUT=3s"

x-svc-registrator-labels-file: &svc-reg-labels-file
  - "SERVICE_NAME=file-service"
  - "SERVICE_ID=file-service"
  - "SERVICE_PORT=8082"
  - "SERVICE_TAGS=backend,file-service"
  - "SERVICE_8082_CHECK_HTTP=/health"
  - "SERVICE_8082_CHECK_INTERVAL=15s"
  - "SERVICE_8082_CHECK_TIMEOUT=3s"

x-svc-registrator-labels-gateway: &svc-reg-labels-gateway
  - "SERVICE_NAME=api-gateway"
  - "SERVICE_ID=api-gateway"
  - "SERVICE_PORT=3000"
  - "SERVICE_TAGS=backend,api-gateway"
  - "SERVICE_3000_CHECK_HTTP=/health"
  - "SERVICE_3000_CHECK_INTERVAL=15s"
  - "SERVICE_3000_CHECK_TIMEOUT=3s"

x-svc-registrator-labels-token: &svc-reg-labels-token
  - "SERVICE_NAME=token-service"
  - "SERVICE_ID=token-service"
  - "SERVICE_PORT=8082"
  - "SERVICE_TAGS=backend,token-service"
  - "SERVICE_8082_CHECK_HTTP=/health"
  - "SERVICE_8082_CHECK_INTERVAL=15s"
  - "SERVICE_8082_CHECK_TIMEOUT=3s"

x-svc-registrator-labels-iam: &svc-reg-labels-iam
  - "SERVICE_NAME=iam-service"
  - "SERVICE_ID=iam-service"
  - "SERVICE_PORT=8081"
  - "SERVICE_TAGS=backend,iam-service"
  - "SERVICE_8081_CHECK_HTTP=/health"
  - "SERVICE_8081_CHECK_INTERVAL=15s"
  - "SERVICE_8081_CHECK_TIMEOUT=3s"

x-svc-registrator-labels-prue: &svc-reg-labels-prue
  - "SERVICE_NAME=prue_backend"
  - "SERVICE_ID=prue_backend"
  - "SERVICE_PORT=8087"
  - "SERVICE_TAGS=backend,prue_backend"
  - "SERVICE_8087_CHECK_HTTP=/health"
  - "SERVICE_8087_CHECK_INTERVAL=15s"
  - "SERVICE_8087_CHECK_TIMEOUT=3s"

x-svc-registrator-labels-notify: &svc-reg-labels-notify
  - "SERVICE_NAME=notification-service"
  - "SERVICE_ID=notification-service"
  - "SERVICE_PORT=8083"
  - "SERVICE_TAGS=backend,notification-service"
  - "SERVICE_8083_CHECK_HTTP=/health"
  - "SERVICE_8083_CHECK_INTERVAL=30s"
  - "SERVICE_8083_CHECK_TIMEOUT=3s"

x-svc-registrator-labels-audit: &svc-reg-labels-audit
  - "SERVICE_NAME=audit-service"
  - "SERVICE_ID=audit-service"
  - "SERVICE_PORT=8084"
  - "SERVICE_TAGS=backend,audit-service"
  - "SERVICE_8084_CHECK_HTTP=/health"
  - "SERVICE_8084_CHECK_INTERVAL=30s"
  - "SERVICE_8084_CHECK_TIMEOUT=3s"

services:
  config-service:
    build:
      context: ..
      dockerfile: services/config-service/Dockerfile
    ports:
      - "8085:8081"
    labels: *svc-reg-labels-config
    environment:
      SERVICE_BOOTSTRAP_TOKEN: "${CONFIG_DEV_BT}"
      TENANT_ID: "${TENANT_ID}"
      TOKEN_SERVICE_URL: "${TOKEN_SERVICE_URL}"
      JWKS_URL: "${JWKS_URL}"
      SERVER_HOST: "0.0.0.0"
      SERVER_ADDR: "0.0.0.0:8081"
      DATABASE_URL: "${DATABASE_URL}"
      RUST_LOG: "info"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      SERVICE_NAME: "config-service"
      SERVICE_ID: "config-service"
      SERVICE_PORT: "8081"
      SERVICE_HEALTH_PATH: "/health"
    depends_on:
      mysql:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - superpowers

  file-service:
    build:
      context: ..
      dockerfile: services/file-service/Dockerfile
    ports:
      - "8086:8082"
    labels: *svc-reg-labels-file
    environment:
      SERVICE_BOOTSTRAP_TOKEN: "${FILE_DEV_BT}"
      TENANT_ID: "${TENANT_ID}"
      TOKEN_SERVICE_URL: "${TOKEN_SERVICE_URL}"
      JWKS_URL: "${JWKS_URL}"
      SERVER_HOST: "0.0.0.0"
      SERVER_ADDR: "0.0.0.0:8082"
      DATABASE_URL: "${DATABASE_URL}"
      STORAGE_PATH: "/var/lib/file-service/storage"
      RUST_LOG: "info"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      SERVICE_NAME: "file-service"
      SERVICE_ID: "file-service"
      SERVICE_PORT: "8082"
      SERVICE_HEALTH_PATH: "/health"
    volumes:
      - file-storage:/var/lib/file-service/storage
    depends_on:
      mysql:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - superpowers

  # ─────────── api-gateway + sidecar ───────────
  api-gateway:
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "3000:3000"
    labels: *svc-reg-labels-gateway
    environment:
      SERVICE_BOOTSTRAP_TOKEN: "${GATEWAY_DEV_BT}"
      TENANT_ID: "${TENANT_ID}"
      TOKEN_SERVICE_URL: "${TOKEN_SERVICE_URL}"
      JWKS_URL: "${JWKS_URL}"
      RUST_LOG: "api_gateway=trace,info"
      GW_SERVER__HOST: "0.0.0.0"
      GW_SERVER__PORT: "3000"
      GW_REDIS__URL: "redis://redis:6379"
      GW_REDIS__PREFIX: "superpowers:"
      GW_CONSUL_ADDR: "http://consul:8500"
      GW_JWKS_URL: "http://token-service:8082/.well-known/jwks.json"
      GW_ISSUER: "superpowers-token-service"
      GW_ROUTES_DIR: "/app/config/api-gateway/routes"
      GW_JWKS_PUBLIC_KEY_PATH: "/app/keys/public.pem"
      GW_EVENT_BUS_URL: "amqp://guest:guest@rabbitmq:5672/"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      SERVICE_NAME: "api-gateway"
      SERVICE_ID: "api-gateway"
      SERVICE_PORT: "3000"
      SERVICE_HEALTH_PATH: "/health"
    volumes:
      - ./config/api-gateway/routes:/app/config/api-gateway/routes
      - ./config/api-gateway/api-gateway.toml:/app/config/api-gateway.toml:ro
      - ./config/api-gateway/rate-limits.toml:/app/config/api-gateway/rate-limits.toml:ro
      - ../docker-example/secrets:/app/keys:ro
    depends_on:
      consul:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - superpowers

  # ─────────── token-service + sidecar ───────────
  token-service:
    build:
      context: ..
      dockerfile: services/token-service/Dockerfile
    ports:
      - "8082:8082"
    labels: *svc-reg-labels-token
    # Phase 5-A-2 dephase: token-service's baked config.yaml
    # had port 18082 (mesh internal). Override at runtime with the
    # post-dephase config so the service binds 8082 without rebuild.
    volumes:
      - ../services/token-service/config:/app/config:ro
      - ../docker-example/secrets:/app/keys:ro
    environment:
      SERVICE_BOOTSTRAP_TOKENS: "${SERVICE_BOOTSTRAP_TOKENS}"
      TENANT_ID: "${TENANT_ID}"
      SWAGGER_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      SERVICE_NAME: "token-service"
      SERVICE_ID: "token-service"
      SERVICE_PORT: "8082"
      SERVICE_HEALTH_PATH: "/health"
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - superpowers

  # ─────────── iam-service + sidecar ───────────
  iam-service:
    build:
      context: ..
      dockerfile: services/iam-service/Dockerfile
    ports:
      - "9081:8081"
    labels: *svc-reg-labels-iam
    volumes:
      - ../docker-example/secrets:/app/keys:ro
      - ../services/iam-service/config:/etc/iam-service:ro
    environment:
      SERVICE_BOOTSTRAP_TOKEN: "${IAM_DEV_BT}"
      TENANT_ID: "${TENANT_ID}"
      TOKEN_SERVICE_URL: "${TOKEN_SERVICE_URL}"
      JWKS_URL: "${JWKS_URL}"
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8081"
      DATABASE_URL: "${DATABASE_URL}"
      CONSUL_ADDR: "http://${CONSUL_HOST}:${CONSUL_HTTP_PORT}"
      CONFIG_PATH: "/etc/iam-service/config.yaml"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      SERVICE_NAME: "iam-service"
      SERVICE_ID: "iam-service"
      SERVICE_PORT: "8081"
      SERVICE_HEALTH_PATH: "/health"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - superpowers

  iam-outbox-publisher:
    build:
      context: ..
      dockerfile: services/iam-service/Dockerfile
    command: ["outbox-publisher"]
    restart: unless-stopped
    volumes:
      - ../services/iam-service/config:/etc/iam-service:ro
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      EVENT_BUS_URL: "amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@${RABBITMQ_HOST}:${RABBITMQ_PORT}/"
      EVENT_BUS_EXCHANGE: "events"
      OUTBOX_POLL_INTERVAL_MS: "1000"
      OUTBOX_BATCH_SIZE: "100"
      CONFIG_PATH: "/etc/iam-service/config.yaml"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - superpowers

  # ─────────── prue_backend + sidecar ───────────
  prue_backend:
    build:
      context: ..
      dockerfile: services/prue_backend/Dockerfile
    ports:
      - "8087:8087"
    labels: *svc-reg-labels-prue
    environment:
      SERVICE_BOOTSTRAP_TOKEN: "${PRUE_DEV_BT}"
      TENANT_ID: "${TENANT_ID}"
      TOKEN_SERVICE_URL: "${TOKEN_SERVICE_URL}"
      JWKS_URL: "${JWKS_URL}"
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8087"
      DATABASE_URL: "${DATABASE_URL}"
      RUST_LOG: "info"
      SERVICE_NAME: "prue_backend"
      SERVICE_ID: "prue_backend"
      SERVICE_PORT: "8087"
      SERVICE_HEALTH_PATH: "/health"
    depends_on:
      mysql:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - superpowers

  # ─────────── notification-service + sidecar ───────────
  notification-service:
    build:
      context: ..
      dockerfile: services/notification-service/Dockerfile
    ports:
      - "8083:8083"
    labels: *svc-reg-labels-notify
    # Phase 5-A-2 dephase: notification-service's baked config.yaml
    # had http_addr 127.0.0.1:18083 (mesh internal). Override at runtime
    # with the post-dephase config so the service binds 0.0.0.0:8083
    # without rebuild.
    volumes:
      - ../services/notification-service/config:/app/config:ro
    environment:
      SERVICE_BOOTSTRAP_TOKEN: "${NOTIFICATION_DEV_BT}"
      TENANT_ID: "${TENANT_ID}"
      TOKEN_SERVICE_URL: "${TOKEN_SERVICE_URL}"
      JWKS_URL: "${JWKS_URL}"
      EVENT_BUS_URL: "amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@${RABBITMQ_HOST}:${RABBITMQ_PORT}/"
      CONSUL_ADDR: "http://${CONSUL_HOST}:${CONSUL_HTTP_PORT}"
      SERVER_PORT: "8083"
      DATABASE_URL: "${DATABASE_URL}"
      REDIS_URL: "redis://${REDIS_HOST}:${REDIS_PORT}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      SERVICE_NAME: "notification-service"
      SERVICE_ID: "notification-service"
      SERVICE_PORT: "8083"
      SERVICE_HEALTH_PATH: "/health"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - superpowers

  notification-outbox-publisher:
    build:
      context: ..
      dockerfile: services/notification-service/Dockerfile
    command: ["ntf-outbox-publisher"]
    restart: unless-stopped
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      EVENT_BUS_URL: "amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@${RABBITMQ_HOST}:${RABBITMQ_PORT}/"
      EVENT_BUS_EXCHANGE: "events"
      OUTBOX_POLL_INTERVAL_MS: "1000"
      OUTBOX_BATCH_SIZE: "100"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - superpowers

  # ─────────── audit-service + sidecar ───────────
  audit-service:
    build:
      context: ..
      dockerfile: services/audit-service/Dockerfile
    ports:
      - "8084:8084"
    labels: *svc-reg-labels-audit
    environment:
      SERVICE_BOOTSTRAP_TOKEN: "${AUDIT_DEV_BT}"
      TENANT_ID: "${TENANT_ID}"
      TOKEN_SERVICE_URL: "${TOKEN_SERVICE_URL}"
      JWKS_URL: "${JWKS_URL}"
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8084"
      DATABASE_URL: "${DATABASE_URL}"
      CONSUL_ADDR: "http://${CONSUL_HOST}:${CONSUL_HTTP_PORT}"
      CONSUL_SERVICE_NAME: "audit-service"
      EVENT_BUS_URL: "amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@${RABBITMQ_HOST}:${RABBITMQ_PORT}/"
      REDIS_URL: "redis://${REDIS_HOST}:${REDIS_PORT}"
      RUST_LOG: "info"
      SERVICE_NAME: "audit-service"
      SERVICE_ID: "audit-service"
      SERVICE_PORT: "8084"
      SERVICE_HEALTH_PATH: "/health"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - superpowers

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_DISABLE_CAPTCHA: "true"
    ports:
      - "8080:80"
    depends_on:
      - api-gateway
    networks:
      - superpowers

volumes:
  file-storage:

networks:
  superpowers:

