services:
  file-service-sidecar:
    image: consul:1.15
    ports:
      - "9086:9086"
    command: >
      sh -c "until consul catalog services 2>/dev/null | grep -q file-service; do echo 'waiting for file-service registration...'; sleep 1; done
      && timeout 120 consul connect envoy -sidecar-for file-service -grpc-addr=consul:8502 -admin-bind=0.0.0.0:19000"
    depends_on:
      consul:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - superpowers

  file-service:
    build:
      context: ..
      dockerfile: services/file-service/Dockerfile
    network_mode: "service:file-service-sidecar"
    environment:
      SERVER_HOST: "127.0.0.1"
      SERVER_ADDR: "127.0.0.1:9086"
      DATABASE_URL: "mysql://root:rootpass@mysql:3306/superpowers"
      STORAGE_PATH: "/var/lib/file-service/storage"
      RUST_LOG: "info"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    volumes:
      - file-storage:/var/lib/file-service/storage
    depends_on:
      file-service-sidecar:
        condition: service_started
      mysql:
        condition: service_healthy
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "busybox", "wget", "-q", "--spider", "http://127.0.0.1:9086/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "9086"

  config-service-sidecar:
    image: consul:1.15
    ports:
      - "9085:9085"
    command: >
      sh -c "until consul catalog services 2>/dev/null | grep -q config-service; do echo 'waiting for config-service registration...'; sleep 1; done
      && timeout 120 consul connect envoy -sidecar-for config-service -grpc-addr=consul:8502 -admin-bind=0.0.0.0:19000"
    depends_on:
      consul:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - superpowers

  config-service:
    build:
      context: ..
      dockerfile: services/config-service/Dockerfile
    network_mode: "service:config-service-sidecar"
    environment:
      SERVER_HOST: "127.0.0.1"
      SERVER_ADDR: "127.0.0.1:9085"
      DATABASE_URL: "mysql://root:rootpass@mysql:3306/superpowers"
      RUST_LOG: "info"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    depends_on:
      config-service-sidecar:
        condition: service_started
      mysql:
        condition: service_healthy
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "busybox", "wget", "-q", "--spider", "http://127.0.0.1:9085/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "9085"

  api-gateway-sidecar:
    image: consul:1.15
    ports:
      - "3000:3000"
    command: >
      sh -c "until consul catalog services 2>/dev/null | grep -q api-gateway; do echo 'waiting for api-gateway registration...'; sleep 1; done
      && timeout 120 consul connect envoy -sidecar-for api-gateway -grpc-addr=consul:8502 -admin-bind=0.0.0.0:19000"
    depends_on:
      consul:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - superpowers

  api-gateway:
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    network_mode: "service:api-gateway-sidecar"
    environment:
      RUST_LOG: "api_gateway=trace,info"
      GW_SERVER__HOST: "127.0.0.1"
      GW_SERVER__PORT: "3000"
      GW_REDIS__URL: "redis://redis:6379"
      GW_REDIS__PREFIX: "superpowers:"
      GW_CONSUL_ADDR: "http://consul:8500"
      GW_JWKS_URL: "http://127.0.0.1:9082/.well-known/jwks.json"
      GW_ISSUER: "superpowers-token-service"
      GW_ROUTES_DIR: "/app/config/api-gateway/routes"
      GW_JWKS_PUBLIC_KEY_PATH: "/app/keys/public.pem"
      GW_EVENT_BUS_URL: "amqp://guest:guest@rabbitmq:5672/%2f/"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    entrypoint: ["sh", "-c"]
    command:
      - |
        i=0
        until consul catalog services 2>/dev/null | grep -q api-gateway; do
          i=$$((i+1))
          if [ $$i -ge 60 ]; then echo "api-gateway not registered in Consul, giving up"; exit 1; fi
          echo "waiting for api-gateway Consul registration... ($$i)"
          sleep 1
        done
        exec /app/api-gateway serve --routes /app/config/api-gateway/routes
    volumes:
      - ./config/api-gateway/routes:/app/config/api-gateway/routes
      - ./config/api-gateway/api-gateway.toml:/app/config/api-gateway.toml:ro
      - ./config/api-gateway/rate-limits.toml:/app/config/api-gateway/rate-limits.toml:ro
      - ../docker-example/secrets:/app/keys:ro
    depends_on:
      api-gateway-sidecar:
        condition: service_started
      consul:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    expose:
      - "3000"

  token-service-sidecar:
    image: consul:1.15
    ports:
      - "9082:9082"
    command: >
      sh -c "until consul catalog services 2>/dev/null | grep -q token-service; do echo 'waiting for token-service registration...'; sleep 1; done
      && timeout 120 consul connect envoy -sidecar-for token-service -grpc-addr=consul:8502 -admin-bind=0.0.0.0:19000"
    depends_on:
      consul:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - superpowers

  token-service:
    build:
      context: ..
      dockerfile: services/token-service/Dockerfile
    network_mode: "service:token-service-sidecar"
    volumes:
      - ../docker-example/secrets:/app/keys
      - ../docker-example/config/token-service:/app/config/token-service
      - ../services/token-service/config:/app/config
    environment:
      SERVER_HOST: "127.0.0.1"
      SERVER_PORT: "9082"
      REDIS_URL: "redis://redis:6379"
      DATABASE_HOST: mysql
      DATABASE_PORT: "3306"
      DATABASE_USER: root
      DATABASE_PASSWORD: rootpass
      DATABASE_NAME: superpowers
      TS_JWT_PRIVATE_KEY_PATH: "/app/keys/private.pem"
      TS_JWT_PUBLIC_KEY_PATH: "/app/keys/public.pem"
      TS_CLIENTS_FILE_PATH: "/app/config/clients.json"
      TS_CONSUL_ADDR: "http://consul:8500"
      CONFIG_FILE: "/config/config.yaml"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    healthcheck:
      test: ["CMD", "busybox", "wget", "-q", "--spider", "http://127.0.0.1:9082/.well-known/jwks.json"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      token-service-sidecar:
        condition: service_started
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      consul:
        condition: service_healthy
    expose:
      - "9082"

  iam-service-sidecar:
    image: consul:1.15
    ports:
      - "9081:9081"
    command: >
      sh -c "until consul catalog services 2>/dev/null | grep -q iam-service; do echo 'waiting for iam-service registration...'; sleep 1; done
      && timeout 120 consul connect envoy -sidecar-for iam-service -grpc-addr=consul:8502 -admin-bind=0.0.0.0:19000"
    depends_on:
      consul:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - superpowers

  iam-service:
    build:
      context: ..
      dockerfile: services/iam-service/Dockerfile
    network_mode: "service:iam-service-sidecar"
    volumes:
      - ../docker-example/secrets:/app/keys:ro
      - ../services/iam-service/config:/etc/iam-service:ro
    environment:
      SERVER_HOST: "127.0.0.1"
      SERVER_PORT: "9081"
      DATABASE_HOST: mysql
      DATABASE_PORT: "3306"
      DATABASE_USER: root
      DATABASE_PASSWORD: rootpass
      DATABASE_NAME: superpowers
      CONSUL_ADDR: "http://consul:8500"
      CONFIG_PATH: "/etc/iam-service/config.yaml"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    depends_on:
      iam-service-sidecar:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "busybox", "wget", "-q", "--spider", "http://127.0.0.1:9081/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "9081"

  iam-outbox-publisher:
    build:
      context: ..
      dockerfile: services/iam-service/Dockerfile
    command: ["outbox-publisher"]
    restart: unless-stopped
    volumes:
      - ../services/iam-service/config:/etc/iam-service:ro
    environment:
      DATABASE_URL: "mysql://root:rootpass@mysql:3306/superpowers"
      EVENT_BUS_URL: "amqp://guest:guest@rabbitmq:5672/%2f/"
      EVENT_BUS_EXCHANGE: "events"
      OUTBOX_POLL_INTERVAL_MS: "1000"
      OUTBOX_BATCH_SIZE: "100"
      CONFIG_PATH: "/etc/iam-service/config.yaml"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - superpowers

  prue_backend-sidecar:
    image: consul:1.15
    ports:
      - "9087:9087"
    command: >
      sh -c "until consul catalog services 2>/dev/null | grep -q prue_backend; do echo 'waiting for prue_backend registration...'; sleep 1; done
      && timeout 120 consul connect envoy -sidecar-for prue_backend -grpc-addr=consul:8502 -admin-bind=0.0.0.0:19000"
    depends_on:
      consul:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - superpowers

  prue_backend:
    build:
      context: ..
      dockerfile: services/prue_backend/Dockerfile
    network_mode: "service:prue_backend-sidecar"
    environment:
      SERVER_HOST: "127.0.0.1"
      SERVER_PORT: "9087"
      DATABASE_URL: "mysql://root:rootpass@mysql:3306/superpowers"
      RUST_LOG: "info"
    depends_on:
      prue_backend-sidecar:
        condition: service_started
      mysql:
        condition: service_healthy
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "busybox", "wget", "-q", "--spider", "http://127.0.0.1:9087/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "9087"

  notification-service-sidecar:
    image: consul:1.15
    ports:
      - "9083:9083"
    command: >
      sh -c "until consul catalog services 2>/dev/null | grep -q notification-service; do echo 'waiting for notification-service registration...'; sleep 1; done
      && timeout 120 consul connect envoy -sidecar-for notification-service -grpc-addr=consul:8502 -admin-bind=0.0.0.0:19000"
    depends_on:
      consul:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - superpowers

  notification-service:
    build:
      context: ..
      dockerfile: services/notification-service/Dockerfile
    network_mode: "service:notification-service-sidecar"
    environment:
      EVENT_BUS_URL: "amqp://guest:guest@rabbitmq:5672/%2f/"
      CONSUL_ADDR: "http://consul:8500"
      SERVER_PORT: "9083"
      DATABASE_HOST: mysql
      DATABASE_PORT: "3306"
      DATABASE_USER: root
      DATABASE_PASSWORD: rootpass
      DATABASE_NAME: superpowers
      REDIS_URL: "redis://redis:6379"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    depends_on:
      notification-service-sidecar:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ../docker-example/config/notification-service:/app/config:ro
    healthcheck:
      test: ["CMD", "busybox", "wget", "-q", "--spider", "http://127.0.0.1:9083/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "9083"

  notification-outbox-publisher:
    build:
      context: ..
      dockerfile: services/notification-service/Dockerfile
    command: ["ntf-outbox-publisher"]
    restart: unless-stopped
    environment:
      DATABASE_HOST: mysql
      DATABASE_PORT: "3306"
      DATABASE_USER: root
      DATABASE_PASSWORD: rootpass
      DATABASE_NAME: superpowers
      EVENT_BUS_URL: "amqp://guest:guest@rabbitmq:5672/%2f/"
      EVENT_BUS_EXCHANGE: "events"
      OUTBOX_POLL_INTERVAL_MS: "1000"
      OUTBOX_BATCH_SIZE: "100"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - superpowers

  audit-service-sidecar:
    image: consul:1.15
    ports:
      - "9084:9084"
    command: >
      sh -c "until consul catalog services 2>/dev/null | grep -q audit-service; do echo 'waiting for audit-service registration...'; sleep 1; done
      && timeout 120 consul connect envoy -sidecar-for audit-service -grpc-addr=consul:8502 -admin-bind=0.0.0.0:19000"
    depends_on:
      consul:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - superpowers

  audit-service:
    build:
      context: ..
      dockerfile: services/audit-service/Dockerfile
    network_mode: "service:audit-service-sidecar"
    environment:
      SERVER_HOST: "127.0.0.1"
      SERVER_PORT: "9084"
      DATABASE_HOST: mysql
      DATABASE_PORT: "3306"
      DATABASE_USER: root
      DATABASE_PASSWORD: rootpass
      DATABASE_NAME: superpowers
      CONSUL_ADDR: "http://consul:8500"
      CONSUL_SERVICE_NAME: "audit-service"
      EVENT_BUS_URL: "amqp://guest:guest@rabbitmq:5672/%2f/"
      REDIS_URL: "redis://redis:6379"
      RUST_LOG: "info"
    depends_on:
      audit-service-sidecar:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "busybox", "wget", "-q", "--spider", "http://127.0.0.1:9084/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "9084"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_DISABLE_CAPTCHA: "true"
    ports:
      - "8080:80"
    depends_on:
      - api-gateway
    networks:
      - superpowers

volumes:
  file-storage:

networks:
  superpowers:
    name: superpowers
    driver: bridge
