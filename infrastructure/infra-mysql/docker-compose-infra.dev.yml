# Infrastructure services - dev override
# Port publishing for local development; applied on top of docker-compose-infra.yml
services:
  consul:
    ports:
      - "${CONSUL_HTTP_PORT:-8500}:8500"
      - "${CONSUL_GRPC_PORT:-8502}:8502"

  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"

  mysql:
    ports:
      - "${MYSQL_PORT_EXPORT:-3306}:3306"

  rabbitmq:
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"