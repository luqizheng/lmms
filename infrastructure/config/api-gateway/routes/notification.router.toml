[[route]]
match = "/v1/notification/ws"
service = "notification-service"
public = false
ws = true
rewrite = [
  { type = "strip_prefix", prefix = "/v1" }
]

[[route]]
match = "/v1/notification/**"
service = "notification-service"
public = false
rewrite = [
  { type = "strip_prefix", prefix = "/v1" }
]

[[route]]
match = "/v1/notification/health"
service = "notification-service"
public = true
rewrite = [
  { type = "strip_prefix", prefix = "/v1" }
]