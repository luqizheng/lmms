[[route]]
upstream   = "/v1/project/health"
downstream = "/project/health"
service    = "project-service"
public     = true

[[route]]
upstream   = "/v1/project/projects"
downstream = "/projects"
service    = "project-service"

[[route]]
upstream   = "/v1/project/projects/{rest}"
downstream = "/projects/{rest}"
service    = "project-service"

[[route]]
upstream   = "/v1/project/milestones/{rest}"
downstream = "/milestones/{rest}"
service    = "project-service"

[[route]]
upstream   = "/v1/project/tasks/{rest}"
downstream = "/tasks/{rest}"
service    = "project-service"

[[route]]
upstream   = "/v1/project/sprints/{rest}"
downstream = "/sprints/{rest}"
service    = "project-service"

[[route]]
upstream   = "/v1/project/llm/refine"
downstream = "/llm/refine"
service    = "project-service"
