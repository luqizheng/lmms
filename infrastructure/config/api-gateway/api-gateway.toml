[server]
host = "0.0.0.0"
port = 3000

[redis]
url = "redis://redis:6379"
prefix = "superpowers:"

consul_addr = "http://consul:8500"
jwks_url = "http://127.0.0.1:9082/.well-known/jwks.json"
issuer = "superpowers-token-server"

# egress_map: route.service 名 → 后端 host:port。
# 注意：#[serde(default = "default_egress_map")] 在 TOML 含 [egress_map] 时不会触发，
# TOML 的值会**整体替换**默认 map。改动时必须列出所有 7 个服务（含 5 个默认）。
# 默认列表见 services/api-gateway/src/config.rs:94-103。
# Phase 5-A: all backends now use localhost sidecar upstream ports.
[egress_map]
"iam-service"           = { host = "iam-service",           port = 9081 }
"token-service"         = { host = "token-service",         port = 9082 }
"notification-service"  = { host = "notification-service",  port = 9083 }
"audit-service"        = { host = "audit-service",         port = 9084 }
"prue_backend"          = { host = "prue_backend",          port = 9087 }
"file-service"          = { host = "file-service",          port = 8082 }
"config-service"        = { host = "config-service",        port = 8081 }
