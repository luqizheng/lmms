[server]
host = "0.0.0.0"
port = 3000

[redis]
url = "redis://redis:6379"
prefix = "superpowers:"

consul_addr = "http://consul:8500"
jwks_url = "http://token-service-sidecar:18082/.well-known/jwks.json"
issuer = "superpowers-token-server"

# egress_map: route.service 名 → 后端 host:port。
# Phase 5-A: api-gateway 通过 sidecar 的 upstream proxy 出站 (mTLS)。
# upstream listener 绑定在 127.0.0.1:<port>，对应下游服务的侧车外端口。
[egress_map]
"iam-service"           = { host = "127.0.0.1", port = 9081 }
"token-service"         = { host = "127.0.0.1", port = 9082 }
"notification-service"  = { host = "127.0.0.1", port = 9083 }
"audit-service"        = { host = "127.0.0.1", port = 9084 }
"prue_backend"          = { host = "127.0.0.1", port = 9087 }
"file-service"          = { host = "127.0.0.1", port = 8082 }
"config-service"        = { host = "127.0.0.1", port = 8081 }
