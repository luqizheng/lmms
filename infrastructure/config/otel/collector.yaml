# OpenTelemetry Collector configuration.
# Receives OTLP gRPC from services on :4317 and OTLP HTTP on :4318.
# Exports traces to Jaeger (in-memory) and Prometheus-style metrics to
# the same Prometheus instance.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1000

  # Add deployment.environment attribute to every span
  resource:
    attributes:
      - key: deployment.environment
        value: dev
        action: upsert

exporters:
  # Jaeger as the primary trace UI backend
  jaeger:
    endpoint: jaeger:14250
    tls:
      insecure: true

  # Also expose metrics generated from traces (RED: rate / errors / duration)
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

  debug:
    verbosity: basic
    sampling_initial: 5
    sampling_thereafter: 200

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [jaeger, debug]
    metrics:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [prometheus]

  telemetry:
    logs:
      level: info