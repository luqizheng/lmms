# Loki + Promtail logs overlay —— 日志栈片（2026-11-06 由 staging 片更名：内容是「日志栈」，与 staging 部署环境无关）
# Brings up a single-binary Loki (filesystem backend, 14d retention) and a
# Promtail that scrapes any container carrying the `logging=loki` label
# (added in docker-compose-services.yml). No S3/GCS, no microservices mode —
# single-node scope; production scale-out would replace this with the chunked
# distributor/querier/ingester split.
#
# Bring everything up with:
#   ./start.sh --logs          # 组目录内（自包含部署单元）
#   或：docker compose -f docker-compose-observability.yml \
#                      -f docker-compose-observability.logs.yml up -d
#
# Then:
#   Loki HTTP API:     http://localhost:3100
#   Promtail targets:  http://localhost:9080/targets
#   Grafana datasource: add Loki URL http://loki:3100 (already inside the
#   `superpowers` network via the base compose; Grafana sidecar provisioning
#   added in T3 will wire it from the UI side).

services:
  loki:
    image: ${loki:-grafana/loki:3.3.2}
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yaml
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
      - ./config/loki/loki.yaml:/etc/loki/loki.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "-O", "/dev/null", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - superpowers

  promtail:
    image: ${promtail:-grafana/promtail:3.3.2}
    container_name: promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail.yaml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/loki/promtail.yaml:/etc/promtail/promtail.yaml:ro
      - promtail-positions:/tmp/promtail
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - superpowers

volumes:
  loki-data:
    name: superpowers_loki-data
  promtail-positions:
    name: superpowers_promtail-positions

networks:
  # Reuses the shared `superpowers` network (pre-created, external) so
  # Promtail (this file) + the business services (docker-compose-services.yml)
  # all share one DNS namespace and Loki is reachable at `loki:3100`.
  superpowers:
    external: true