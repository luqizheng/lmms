# Loki single-binary mode — 14-day retention（logs 片用）
# See ADR-007 D1/D4
#
# Staging uses filesystem storage + single binary (no microservices mode,
# no S3/GCS backend). Keeps the overlay light: only loki + promtail.
# Production would add schema_config backends (S3/GCS) and the distributor/querier/ingester split.

auth_enabled: false  # 单租户内网栈；loki 3.x 默认 true（要求 X-Scope-OrgID，401 no org id）

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory  # 单二进制模式；默认 consul@localhost:8500 在容器内不可达
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  instance_addr: 127.0.0.1

limits_config:
  retention_period: 336h  # 14 days
  max_global_streams_per_user: 0

compactor:
  retention_enabled: true
  delete_request_store: filesystem  # loki 3.x: retention_enabled 时必填
  working_directory: /loki/compactor

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
