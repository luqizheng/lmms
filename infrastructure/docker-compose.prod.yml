# infrastructure/docker-compose.prod.yml
# ─────────────────────────────────────────────────────────────────────────────
# Production overlay — 单机合体模式（docker-compose.yml 入口 include 三块）使用。
# 差异内容按组拆在三份片里（独立部署模式 start-prod.sh 三段式直接引用同名片），
# 本文件只负责把它们重新聚合成一个 overlay —— prod 差异只写一处。
# 设计依据：docs/superpowers/specs/2026-07-06-prod-compose-overlay-design.md
#
# ⚠️  需要 docker compose v2.20+（!override 标签与 include 合并依赖）。由
#    start-prod.sh 在启动时 self-check 版本，版本不达标 fail-fast。
#
# ⚠️  本文件不包含 secrets 覆写：所有敏感变量从 `.env.prod` 加载。
#     start-prod.sh 在加载完 env 后会显式校验关键变量非空且非默认值。
#
# 用法：
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml config   # 校验
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d   # 起 prod
#   或直接：./start-prod.sh
# ─────────────────────────────────────────────────────────────────────────────

include:
  - docker-compose-infra.prod.yml
  - docker-compose-services.prod.yml
  - docker-compose-observability.prod.yml
