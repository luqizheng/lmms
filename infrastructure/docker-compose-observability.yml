# Observability stack — included into docker-compose.yml; do not run standalone.
# Bring everything up with:
#   docker compose -f infrastructure/docker-compose.yml up -d
#
# Then access:
#   Prometheus:  http://localhost:9090
#   Grafana:     http://localhost:3001  (admin / admin, change after first login)
#   Jaeger:      http://localhost:16686

services:
  prometheus:
    image: ${BASE_REGISTRY}prom/prometheus:v2.51.0
    container_name: observability-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - superpowers
    restart: unless-stopped

  alertmanager:
    # 有意走公网镜像代理（quay.io/prometheus 是 alertmanager 官方发布渠道），
    # 与同文件其他组件走 ${BASE_REGISTRY} 不同：内网 registry 不同步该镜像，
    # airgap tar 有网环境 pull/save、离线 load，勿改回内网 official/ 路径。
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/quay.io/prometheus/alertmanager:v0.27.0
    container_name: observability-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
      - '--log.level=info'
    networks:
      - superpowers
    restart: unless-stopped

  grafana:
    image: ${BASE_REGISTRY}grafana/grafana:10.4.0
    container_name: observability-grafana
    ports:
      - "3001:3000"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    networks:
      - superpowers
    depends_on:
      - prometheus
    restart: unless-stopped

  # Canary routing: watches Consul for service tag changes
  # and re-renders nginx config to split traffic stable/canary
  consul-template:
    image: ${BASE_REGISTRY}hashicorp/consul-template:0.32.0
    container_name: observability-consul-template
    user: "0:0"
    volumes:
      - ./config/nginx/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - ./config/nginx/consul-template.hcl:/etc/consul-template/config.hcl:ro
      - nginx_rendered:/etc/nginx
    command:
      - "-config=/etc/consul-template/config.hcl"
    networks:
      - superpowers
    restart: unless-stopped

  # OpenTelemetry Collector — receives OTLP from services,
  # exports traces to Jaeger (UI at :16686) and metrics to Prometheus
  otel-collector:
    image: ${BASE_REGISTRY}otel/opentelemetry-collector-contrib:0.96.0
    container_name: observability-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./config/otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus exporter
    networks:
      - superpowers
    depends_on:
      - jaeger
      - prometheus
    restart: unless-stopped

  # Jaeger — distributed tracing UI
  # All-in-one image: agent + collector + query + UI
  # SPM (Service Performance Monitoring) on the Monitor tab is wired to
  # Prometheus, which is fed by the spanmetrics connector in otel-collector.
  jaeger:
    image: ${BASE_REGISTRY}jaegertracing/all-in-one:1.55
    container_name: observability-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - METRICS_STORAGE_TYPE=prometheus
      - PROMETHEUS_SERVER_URL=http://prometheus:9090
      - PROMETHEUS_QUERY_SUPPORT_SPANMETRICS_CONNECTOR=true
      - PROMETHEUS_QUERY_NAMESPACE=traces.spanmetrics
      - PROMETHEUS_QUERY_NORMALIZE_CALLS=true
      - PROMETHEUS_QUERY_NORMALIZE_DURATION=true
    ports:
      - "16686:16686"   # Jaeger UI
      - "14250:14250"   # gRPC OTLP receiver (for collector → jaeger)
      - "14268:14268"   # HTTP collector (legacy)
    networks:
      - superpowers
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  nginx_rendered:

networks:
  superpowers:
