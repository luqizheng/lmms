services:
  consul:
    image: consul:1.15
    ports:
      - "8500:8500"
    volumes:
      - ../docker/config/consul/config.docker.json:/consul/config/services.json:ro
    command: agent -dev -config-dir=/consul/config -bind=0.0.0.0 -client=0.0.0.0
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - superpowers

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - superpowers

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: superpowers
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - superpowers

  api-gateway:
    image: zhcoder-docker-registry.com:8000/micro-server/api-gateway:latest
    ports:
      - "3000:3000"
    environment:
      GW_SERVER__HOST: "0.0.0.0"
      GW_SERVER__PORT: "3000"
      GW_REDIS__URL: "redis://redis:6379"
      GW_REDIS__PREFIX: "superpowers:"
      GW_CONSUL_ADDR: "http://consul:8500"
      GW_JWKS_URL: "http://token-server:8080/.well-known/jwks.json"
      GW_ISSUER: "superpowers-token-server"
      GW_ROUTES_DIR: "/app/config/api-gateway/routes"
      GW_JWKS_PUBLIC_KEY_PATH: "/app/keys/public.pem"
    volumes:
      - ../docker/config:/app/config:ro
      - ../docker/secrets:/app/keys:ro
    depends_on:
      consul:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - superpowers

  token-server:
    image: zhcoder-docker-registry.com:8000/micro-server/token-service:latest
    ports:
      - "6001:8080"
    volumes:
      - ../docker/secrets:/app/keys
      - ../docker/config/token-service:/app/config/token-service
      - ../services/token-service/config:/app/config
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8080"
      REDIS_URL: "redis://redis:6379"
      DATABASE_HOST: mysql
      DATABASE_PORT: "3306"
      DATABASE_USER: root
      DATABASE_PASSWORD: rootpass
      DATABASE_NAME: superpowers
      TS_JWT_PRIVATE_KEY_PATH: "/app/keys/private.pem"
      TS_JWT_PUBLIC_KEY_PATH: "/app/keys/public.pem"
      TS_CLIENTS_FILE_PATH: "/app/config/clients.json"
      TS_CONSUL_ADDR: "http://consul:8500"
      CONFIG_FILE: "/config/config.yaml"
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - superpowers

  iam-service:
    image: zhcoder-docker-registry.com:8000/micro-server/iam-service:latest
    ports:
      - "6002:8080"
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8080"
      DATABASE_HOST: mysql
      DATABASE_PORT: "3306"
      DATABASE_USER: root
      DATABASE_PASSWORD: rootpass
      DATABASE_NAME: superpowers
      CONSUL_ADDR: "http://consul:8500"
    depends_on:
      mysql:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - superpowers

  notification-service:
    image: zhcoder-docker-registry.com:8000/micro-server/notification-service:latest
    ports:
      - "6003:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
    environment:
      CONSUL_ADDR: "http://consul:8500"
      SERVER_PORT: "8080"
      DATABASE_HOST: mysql
      DATABASE_PORT: "3306"
      DATABASE_USER: root
      DATABASE_PASSWORD: rootpass
      DATABASE_NAME: superpowers
      REDIS_URL: "redis://redis:6379"
    volumes:
      - ../docker/config/notification-service:/app/config:ro
    networks:
      - superpowers

volumes:
  redis_data:
  mysql_data:

networks:
  superpowers:
    driver: bridge
