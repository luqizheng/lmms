# Infrastructure services - shared base (dev & prod)
# Consul mode (dev -dev vs prod server), port publishing, restart policy,
# and resource limits are applied via override/prod compose files.
services:
  consul:
    image: hashicorp/consul:2.0.1
    hostname: consul
    ports:
      - "8500:8500"
      - "8502:8502"
    volumes:
      - ./config/consul/connect.hcl:/consul/config/connect.hcl:ro
    command: agent -dev -node=consul-server -bind=0.0.0.0 -client=0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "consul members && nc -z 127.0.0.1 8502"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - superpowers

  registrator:
    image: gliderlabs/registrator:master
    depends_on:
      consul:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock
    environment:
      DOCKER_HOST: unix:///tmp/docker.sock
      REGISTRATOR_RESYNC: "30s"
    command: ["consul://consul:8500"]
    restart: unless-stopped
    networks:
      - superpowers

  redis:
    image: redis:7-alpine
    hostname: ${REDIS_HOST}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_DATABASES: ${REDIS_DATABASES}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - superpowers

  mysql:
    image: mysql:8.0
    hostname: ${MYSQL_HOST}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_HOST_AUTH_METHOD: ${MYSQL_HOST_AUTH_METHOD}
    volumes:
      - mysql_data:/var/lib/mysql
      # Bootstrap SQL runs once on first init (empty data dir only; run `down -v` to re-apply).
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # Replication prerequisites (binary log + GTID). Required by mysql-replica.
      # Removing these after replica is provisioned breaks replication — revert
      # via mysqldump-restore cycle if needed (see docs-site/runbooks/mysql-replication.md).
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - superpowers

  # MySQL replica — read-only hot standby of the primary.
  # Provisioned via GTID auto-positioning: starts with empty data dir, the
  # custom entrypoint configures CHANGE MASTER TO and START SLAVE, then MySQL
  # clones the missing transactions automatically. No mysqldump bootstrap.
  #
  # Horizontally scalable: add more replicas by appending `mysql-replica-2`,
  # `mysql-replica-3` etc. Each gets a unique server-id from the hostname.
  # See docs-site/runbooks/mysql-replication.md for failover / promote procedure.
  mysql-replica:
    build:
      context: ./mysql-replica
      dockerfile: Dockerfile
    image: coder/mysql-replica:8.0
    hostname: mysql-replica
    # Do NOT publish 3306 externally — replica is internal. Override in
    # docker-compose-infra.dev.yml or a manual override for ad-hoc debugging.
    expose:
      - "3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_PRIMARY_HOST: ${MYSQL_PRIMARY_HOST:-mysql}
      MYSQL_PRIMARY_PORT: ${MYSQL_PRIMARY_PORT:-3306}
      MYSQL_REPL_USER: ${MYSQL_REPL_USER:-repl}
      MYSQL_REPL_PASSWORD: ${MYSQL_REPL_PASSWORD:-replpass}
    volumes:
      - mysql_replica_data:/var/lib/mysql
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD-SHELL"
        - "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" \
           && mysql -uroot -p\"$$MYSQL_ROOT_PASSWORD\" -e \"SHOW SLAVE STATUS\\G\" \
           | grep -E 'Slave_IO_Running: Yes|Slave_SQL_Running: Yes'"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    networks:
      - superpowers

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./config/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./config/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - superpowers

volumes:
  consul_data:
  redis_data:
  mysql_data:
  mysql_replica_data:
  rabbitmq_data:

networks:
  superpowers:
    driver: bridge
