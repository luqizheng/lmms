[workspace]
members = [
    "libs/common",
    "libs/common-error",
    "libs/common-event",
    "libs/common-log",
    "libs/common-telemetry",
    "libs/common-telemetry-axum",
    "libs/common-ratelimit",
    "libs/common-config",
    "libs/common-db",
    "libs/common-cache",
    "libs/common-http",
    "libs/common-crypto",
    "libs/common-validator",
    "libs/jwt-ctx",
    "libs/authz",
    "libs/common-jwt",
    "libs/common-health",
    "services/token-service",
    "services/api-gateway",
    "services/notification-service",
    "services/iam-service",
    "services/iam-outbox-publisher",
    "services/pmd-outbox-publisher",
    "services/audit-service",
    "services/config-service",
    "services/file-service",
    "services/prue_backend",
    "sdk/rust/kudi-http-client",
]
resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
jwt-simple = { version = "0.12", default-features = false, features = ["pure-rust"] }
jsonwebtoken = { version = "9", default-features = false, features = ["pem", "use_pem"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
uuid = { version = "1", features = ["v4"] }
argon2 = "0.5"
thiserror = "2"
config = "0.14"
dotenvy = "0.15"
rand = "0.8"
base64 = "0.22"
rsa = "0.9"
rustls = { version = "0.23", default-features = false, features = ["logging", "std", "tls12", "aws_lc_rs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
hyper = "1"
hyper-util = { version = "0.1", features = ["client-legacy", "tokio"] }
http-body-util = "0.1"
bytes = "1"
dashmap = "6"
moka = { version = "0.12", features = ["future"] }
tempfile = "3"
validator = { version = "0.18", features = ["derive"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
aes-gcm = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs"] }
sha2 = "0.10"
csv = "1.3"
futures = "0.3"
wiremock = "0.6"
