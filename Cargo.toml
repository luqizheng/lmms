[workspace]
members = [
    "libs/common",
    "libs/common-error",
    "libs/common-event",
    "libs/common-log",
    "libs/common-telemetry",
    "libs/common-telemetry-axum",
    "libs/common-ratelimit",
    "libs/common-config",
    "libs/common-db",
    "libs/common-cache",
    "libs/common-http",
    "libs/common-crypto",
    "libs/common-validator",
    "libs/jwt-ctx",
    "libs/authz",
    "libs/common-jwt",
    "libs/common-health",
    "libs/common-consul",
    "services/token-service",
    "services/api-gateway",
    "services/notification-service",
    "services/iam-service",
    "services/iam-outbox-publisher",
    "services/audit-service",
    "services/file-service",
    "services/prue_backend",
    "sdk/rust/digua-http-client",
    "sdk/rust/audit-service-sdk",
    "sdk/rust/iam-service-sdk",
    "sdk/rust/token-service-sdk",
    "sdk/rust/file-service-sdk",
    "sdk/rust/notification-service-sdk",
]
resolver = "2"

[workspace.package]
edition = "2021"
# 平台发布版本 —— 服务镜像 tag 的直接来源（`coder release images` 读这里）。
# 8 个 services/* 用 `version.workspace = true` 继承，因此只需改这一处。
# 任一服务单独写死版本 → `coder release images` 报 VERSION_SPLIT 并拒绝发布
# （避免同一批镜像里出现两个版本 tag）。
# 发布流程：改这里 → `coder release images --push` → 自动更新 .image.env → 打 git tag v<version>
version = "1.8.3"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
jwt-simple = { version = "0.12", default-features = false, features = ["pure-rust"] }
jsonwebtoken = { version = "9", default-features = false, features = ["pem", "use_pem"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
uuid = { version = "1", features = ["v4"] }
argon2 = "0.5"
thiserror = "2"
config = "0.14"
dotenvy = "0.15"
rand = "0.8"
base64 = "0.22"
rsa = "0.9"
rustls = { version = "0.23", default-features = false, features = ["logging", "std", "tls12", "aws_lc_rs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
bytes = "1"
dashmap = "6"
moka = { version = "0.12", features = ["future"] }
tempfile = "3"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
aes-gcm = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs"] }
sha2 = "0.10"
csv = "1.3"
futures = "0.3"
wiremock = "0.6"
