[workspace]
members = [
    "libs/common",
    "libs/jwt-ctx",
    "libs/authz",
    "services/token-service",
    "services/api-gateway",
    "services/credential-login-service",
    "services/user-service",
    "services/notification-service",
]
resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
jwt-simple = { version = "0.12", default-features = false, features = ["pure-rust"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
uuid = { version = "1", features = ["v4"] }
argon2 = "0.5"
thiserror = "2"
config = "0.14"
dotenvy = "0.15"
rand = "0.8"
base64 = "0.22"
rsa = "0.9"
rustls = { version = "0.23", default-features = false, features = ["logging", "std", "tls12", "aws_lc_rs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-no-provider"] }
