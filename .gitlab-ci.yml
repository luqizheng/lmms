stages:
  - test
  - build
  - deploy
  - publish

variables:
  DOCKER_REGISTRY: zhcoder-docker-registry.com:8000
  DOCKER_REPO: micro-server
  DEPLOY_SERVER: 192.168.2.128
  DEPLOY_USER: kudi
  DEPLOY_PASSWORD: Ewq321#@!
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  MAVEN_REPO_URL: http://mvn.kudi.repos/repository/maven-releases/
  NUGET_REPO_URL: http://nuget.kudi.repos/v3/index.json
  E2E_BASE_URL: http://localhost:3000
  E2E_DB_HOST: localhost
  E2E_DB_USER: root
  E2E_DB_PASSWORD: rootpass
  E2E_DB_NAME: superpowers

rust_test:
  stage: test
  tags:
    - docker
  image: zhcoder-docker-registry.com:8000/official/rust:1.96-slim
  variables:
    REDIS_URL: redis://192.168.2.130:6379
  before_script:
    - export RUSTUP_DIST_SERVER=http://crates.kudi.repos
    - export RUSTUP_UPDATE_ROOT=http://crates.kudi.reposrustup
    - apt-get update && apt-get install -y pkg-config libssl-dev
  script:
    - cargo test --workspace --all-targets --verbose

service_standard_check:
  stage: test
  tags: [docker]
  image: node:20
  script:
    - node scripts/check-service-standard.js

spec_check:
  stage: test
  tags: [docker]
  image: node:20
  script:
    - node scripts/check-spec.js

contracts_check:
  stage: test
  tags: [docker]
  image: node:20
  script:
    - node scripts/contracts-gen.js --check

e2e_api_test:
  stage: test
  tags: [docker]
  image: node:20
  before_script:
    - cd tests/e2e && npm install
    - npm install -g pnpm && pnpm install
  script:
    - cd tests/e2e && pnpm run test:api

e2e_ui_test:
  stage: test
  tags: [docker]
  image: mcr.microsoft.com/playwright:v1.48.0-jammy
  before_script:
    - cd tests/e2e && npm install
    - npm install -g pnpm && pnpm install
    - npx playwright install chromium
  script:
    - cd tests/e2e && pnpm run test:ui

build_api_gateway:
  stage: build
  tags: [shell]
  script:
    - sudo docker build -f Dockerfile.api-gateway -t $DOCKER_REGISTRY/$DOCKER_REPO/api-gateway:$IMAGE_TAG .
    - sudo docker push $DOCKER_REGISTRY/$DOCKER_REPO/api-gateway:$IMAGE_TAG
    - sudo docker tag $DOCKER_REGISTRY/$DOCKER_REPO/api-gateway:$IMAGE_TAG $DOCKER_REGISTRY/$DOCKER_REPO/api-gateway:latest
    - sudo docker push $DOCKER_REGISTRY/$DOCKER_REPO/api-gateway:latest

build_token_service:
  stage: build
  tags: [shell]
  script:
    - sudo docker build -f Dockerfile.token-service -t $DOCKER_REGISTRY/$DOCKER_REPO/token-service:$IMAGE_TAG .
    - sudo docker push $DOCKER_REGISTRY/$DOCKER_REPO/token-service:$IMAGE_TAG
    - sudo docker tag $DOCKER_REGISTRY/$DOCKER_REPO/token-service:$IMAGE_TAG $DOCKER_REGISTRY/$DOCKER_REPO/token-service:latest
    - sudo docker push $DOCKER_REGISTRY/$DOCKER_REPO/token-service:latest

build_credential_login_service:
  stage: build
  tags: [shell]
  script:
    - sudo docker build -f Dockerfile.credential-login-service -t $DOCKER_REGISTRY/$DOCKER_REPO/credential-login-service:$IMAGE_TAG .
    - sudo docker push $DOCKER_REGISTRY/$DOCKER_REPO/credential-login-service:$IMAGE_TAG
    - sudo docker tag $DOCKER_REGISTRY/$DOCKER_REPO/credential-login-service:$IMAGE_TAG $DOCKER_REGISTRY/$DOCKER_REPO/credential-login-service:latest
    - sudo docker push $DOCKER_REGISTRY/$DOCKER_REPO/credential-login-service:latest

build_user_service:
  stage: build
  tags: [shell]
  script:
    - sudo docker build -f Dockerfile.user-service -t $DOCKER_REGISTRY/$DOCKER_REPO/user-service:$IMAGE_TAG .
    - sudo docker push $DOCKER_REGISTRY/$DOCKER_REPO/user-service:$IMAGE_TAG
    - sudo docker tag $DOCKER_REGISTRY/$DOCKER_REPO/user-service:$IMAGE_TAG $DOCKER_REGISTRY/$DOCKER_REPO/user-service:latest
    - sudo docker push $DOCKER_REGISTRY/$DOCKER_REPO/user-service:latest

deploy:
  stage: deploy
  tags: [micro-service-runner]
  before_script:
    - mkdir -p ~/coder-micro-services
  script:
    - rm -rf ~/coder-micro-services
    - cp -r . ~/coder-micro-services
    - rm -rf ~/coder-micro-services/.git
    - cd ~/coder-micro-services

    - sudo /bin/docker-compose -f docker-compose.yml down
    - sudo /bin/docker-compose -f docker-compose.yml pull
    - sudo /bin/docker-compose -f docker-compose.yml up -d
  only:
    - master

java_sdk_test:
  stage: test
  tags: [docker]
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd sdk/java && mvn -B verify
  rules:
    - changes:
        - sdk/java/**

dotnet_sdk_test:
  stage: test
  tags: [docker]
  image: mcr.microsoft.com/dotnet/sdk:10.0
  script:
    - cd sdk/dotnet && dotnet test --nologo --verbosity minimal
  rules:
    - changes:
        - sdk/dotnet/**

sdk_publish:
  stage: publish
  tags: [docker]
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd sdk/java && mvn -B deploy -DskipTests
      -DaltDeploymentRepository=kudi-maven::default::${MAVEN_REPO_URL}
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  environment:
    name: maven-releases

sdk_publish_dotnet:
  stage: publish
  tags: [docker]
  image: mcr.microsoft.com/dotnet/sdk:10.0
  script:
    - cd sdk/dotnet
    - dotnet nuget push "**/*.nupkg" -s ${NUGET_REPO_URL} -k ${NUGET_API_KEY} --skip-duplicate
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  environment:
    name: nuget-releases
