stages:
  - test
  - build
  - deploy
  - e2e
  - publish
  - release

variables:
  DOCKER_REGISTRY: zhcoder-docker-registry.com:8000
  DOCKER_REPO: micro-server
  BASE_REGISTRY: zhcoder-docker-registry.com:8000/official
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  MAVEN_REPO_URL: http://mvn.kudi.repos/repository/maven-releases/
  NUGET_REPO_URL: http://nuget.kudi.repos/v3/index.json

  # ─── 部署目标服务器 ───
  # 部署走 SSH 到 192.168.2.127（kudi 用户）。SSH key 在 GitLab Variables 配置。
  # 这些变量有合理 default，可在 GitLab Project → Settings → CI/CD → Variables
  # 覆盖（不需要 masked，因为不含密钥本身；密钥在 SSH_PRIVATE_KEY 单独配）。
  STAGING_HOST: "${STAGING_HOST:-192.168.2.127}"
  STAGING_DEPLOY_USER: "${STAGING_DEPLOY_USER:-kudi}"
  STAGING_PROJECT_DIR: "${STAGING_PROJECT_DIR:-/home/kudi/coder-micro-services}"
  STAGING_SSH_PORT: "${STAGING_SSH_PORT:-22}"

  # 公共入口由 frontend:8080 提供（前端 nginx 反代到容器网络内的 api-gateway:3000）。
  # api-gateway:3000 在 prod 下不再暴露到 host。详见 infrastructure/docker-compose.prod.yml。
  STAGING_BASE_URL: "${STAGING_BASE_URL:-http://${STAGING_HOST}:8080}"

  # E2E 默认走 frontend(STAGING_BASE_URL)，不再依赖 3000 暴露。
  E2E_BASE_URL: $STAGING_BASE_URL
  E2E_DB_HOST: $STAGING_HOST
  E2E_DB_USER: root
  # E2E_DB_PASSWORD 通过 GitLab CI/CD Variables 注入（type: env_var, masked）
  E2E_DB_NAME: superpowers

  # ─── utoipa-swagger-ui build.rs 拉 zip：CI runner 直连 GitHub 不通，
  #     走 gh-proxy.org 代理（项目网络规则 AGENTS.md「网络规则」节）。
  #     本地开发改用 `pnpm run assets:download` 把 zip 下到
  #     infrastructure/vendor/，再传 SWAGGER_UI_DOWNLOAD_URL=file://...。
  #     在 GitLab Project 配同名 CI Variable 可覆盖此 default。──
  SWAGGER_UI_DOWNLOAD_URL: "https://gh-proxy.org/https://github.com/swagger-api/swagger-ui/archive/refs/tags/v5.17.14.zip"

  # --- setup-wizard 同步（敏感值引用 GitLab CI Variables）---
  CODER_BASE_REGISTRY: "zhcoder-docker-registry.com:8000/official"
  CODER_BUILDER_REGISTRY: "zhcoder-docker-registry.com:8000/builder"
  CODER_CRATE_REGISTRY: "https://rsproxy.cn/index/"
  CODER_CRATE_TOKEN: "$CRATE_TOKEN"
  CODER_PRIVATE_CRATE_REGISTRY: "http://192.168.2.12:16444"
  CODER_PRIVATE_CRATE_REGISTRY_TOKEN: "$PRIVATE_CRATE_REGISTRY_TOKEN"
  CODER_MAVEN_REGISTRY: "http://mvn.kudi.repos"
  CODER_MAVEN_AUTH_MODE: "userpass"
  CODER_MAVEN_USERNAME: "$MAVEN_USERNAME"
  CODER_MAVEN_PASSWORD: "$MAVEN_PASSWORD"
  CODER_NPM_REGISTRY: "http://npm.kudi.repos"
  CODER_NPM_TOKEN: "$NPM_TOKEN"
rust_test:
  stage: test
  tags:
    - docker
  image: $BASE_REGISTRY/rust:1.96-slim
  variables:
    REDIS_URL: redis://192.168.2.130:6379
  before_script:
    - export RUSTUP_DIST_SERVER=http://crates.kudi.repos
    - export RUSTUP_UPDATE_ROOT=http://crates.kudi.reposrustup
    - apt-get update && apt-get install -y pkg-config libssl-dev
  script:
    - cargo test --workspace --lib --verbose

service_standard_check:
  stage: test
  tags: [docker]
  image: $BASE_REGISTRY/node:20
  script:
    - node scripts/check-service-standard.js

spec_check:
  stage: test
  tags: [docker]
  image: $BASE_REGISTRY/node:20
  before_script:
    - npm config set registry https://registry.npmmirror.com/
    - npm install --prefix /tmp/deps js-yaml@^5.2.1
  script:
    - NODE_PATH=/tmp/deps/node_modules node scripts/check-spec.js

contracts_check:
  stage: test
  tags: [docker]
  image: $BASE_REGISTRY/node:20
  before_script:
    - npm config set registry https://registry.npmmirror.com/
    - npm install --prefix /tmp/deps js-yaml@^5.2.1
  script:
    - NODE_PATH=/tmp/deps/node_modules node scripts/contracts-gen.js --check

spec_generate:
  stage: test
  tags: [docker]
  image: $BASE_REGISTRY/rust:1.96-slim
  before_script:
    - export RUSTUP_DIST_SERVER=http://crates.kudi.repos
    - export RUSTUP_UPDATE_ROOT=http://crates.kudi.reposrustup
    - apt-get update && apt-get install -y pkg-config libssl-dev
  script:
    - node scripts/dump-openapi-specs.js
    - git diff --exit-code -- 'services/*/openapi.yaml'
  dependencies:
    - spec_check

doc_links_check:
  stage: test
  tags: [docker]
  image: $BASE_REGISTRY/node:20
  script:
    - node scripts/check-doc-links.js

i18n_namespace_check:
  stage: test
  tags: [docker]
  image: $BASE_REGISTRY/node:20
  script:
    - node scripts/check-i18n-namespace.js
  rules:
    - changes:
        - frontend/src/**/*.{vue,ts}
        - frontend/locales/**/*.yaml
      when: on_success
    - when: never

java_sdk_drift_check:
  stage: test
  tags: [docker]
  image: $BASE_REGISTRY/node:20
  allow_failure: false
  script:
    - node scripts/check-java-sdk-drift.js
  rules:
    - changes:
        - sdk/java/**/*
        - services/*/openapi.yaml
      when: on_success
    - when: never

cargo_clippy:
  stage: test
  tags: [docker]
  image: $BASE_REGISTRY/rust:1.96-slim
  variables:
    REDIS_URL: redis://192.168.2.130:6379
  before_script:
    - export RUSTUP_DIST_SERVER=http://crates.kudi.repos
    - export RUSTUP_UPDATE_ROOT=http://crates.kudi.reposrustup
    - apt-get update && apt-get install -y pkg-config libssl-dev
  script:
    - cargo clippy --workspace --all-targets -- -D warnings
  allow_failure: false

cargo_fmt_check:
  stage: test
  tags: [docker]
  image: $BASE_REGISTRY/rust:1.96-slim
  before_script:
    - export RUSTUP_DIST_SERVER=http://crates.kudi.repos
    - export RUSTUP_UPDATE_ROOT=http://crates.kudi.reposrustup
  script:
    - cargo fmt --check
  allow_failure: false

e2e_api_test:
  stage: e2e
  tags: [docker]
  image: $BASE_REGISTRY/node:20
  variables:
    E2E_BASE_URL: $STAGING_BASE_URL
  before_script:
    - npm install -g pnpm
    - pnpm -C tests/e2e install
  script:
    - pnpm -C tests/e2e run test:api
  rules:
    # e2e 只在 main / 手动触发时跑 —— MR pipeline 上 staging 还没 deploy，必然 fail
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - when: manual
      allow_failure: true

e2e_ui_test:
  stage: e2e
  tags: [docker]
  image: mcr.microsoft.com/playwright:v1.48.0-jammy
  variables:
    E2E_BASE_URL: $STAGING_BASE_URL
  before_script:
    - npm install -g pnpm
    - pnpm -C tests/e2e install
    - pnpm -C tests/e2e exec playwright install chromium
  script:
    - pnpm -C tests/e2e run test:ui
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - when: manual
      allow_failure: true

e2e_migration_state_test:
  stage: e2e
  tags: [docker]
  image: $BASE_REGISTRY/node:20
  variables:
    # 在 prod 模式下，业务后端端口（8081 / 8082 / ...）不再 publish 到 host；
    # 通过 SSH 反向隧道把每个业务端口从 staging 拉到 runner 本地
    # （端口 19xxx 仅 runner 容器内部使用，不冲突）。
    TUNNEL_TOKEN_PORT: "19000"     # → token-service:8082
    TUNNEL_IAM_PORT:   "19001"     # → iam-service:8081
    TUNNEL_NTF_PORT:   "19003"     # → notification-service:8083
    TUNNEL_AUDIT_PORT: "19004"     # → audit-service:8084
    TUNNEL_CONFIG_PORT: "19005"     # → config-service:8081
    TUNNEL_FILE_PORT:  "19006"     # → file-service:8082
    TUNNEL_PRUE_PORT:  "19007"     # → prue_backend:8087
    SERVICE_HOST: "127.0.0.1"
    TOKEN_SERVICE_URL: "http://127.0.0.1:${TUNNEL_TOKEN_PORT}"
    IAM_DEV_BT: "${IAM_DEV_BT}"
    NOTIFICATION_DEV_BT: "${NOTIFICATION_DEV_BT}"
    TOKEN_DEV_BT: "${TOKEN_DEV_BT}"
    AUDIT_DEV_BT: "${AUDIT_DEV_BT}"
    CONFIG_DEV_BT: "${CONFIG_DEV_BT}"
    FILE_DEV_BT: "${FILE_DEV_BT}"
    PRUE_DEV_BT: "${PRUE_DEV_BT}"
  before_script:
    - 'which ssh || (apt-get update && apt-get install -y --no-install-recommends openssh-client)'
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - if [ -n "$SSH_PRIVATE_KEY" ]; then printf "%s\n" "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key; fi
    - ssh-keyscan -H -p "$STAGING_SSH_PORT" "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
    # 启动后台 tunnel：每个 service 一个本地端口，转发到远端容器名
    - '[[ -n "$SSH_PRIVATE_KEY" ]] || { echo "SSH_PRIVATE_KEY required for e2e_migration_state_test"; exit 1; }'
    - |
      setsid ssh -N \
        -i ~/.ssh/deploy_key \
        -p "$STAGING_SSH_PORT" \
        -o StrictHostKeyChecking=accept-new \
        -o ExitOnForwardFailure=yes \
        -L "127.0.0.1:${TUNNEL_TOKEN_PORT}:token-service:8082" \
        -L "127.0.0.1:${TUNNEL_IAM_PORT}:iam-service:8081" \
        -L "127.0.0.1:${TUNNEL_NTF_PORT}:notification-service:8083" \
        -L "127.0.0.1:${TUNNEL_AUDIT_PORT}:audit-service:8084" \
        -L "127.0.0.1:${TUNNEL_CONFIG_PORT}:config-service:8081" \
        -L "127.0.0.1:${TUNNEL_FILE_PORT}:file-service:8082" \
        -L "127.0.0.1:${TUNNEL_PRUE_PORT}:prue_backend:8087" \
        "$STAGING_DEPLOY_USER@$STAGING_HOST" \
        >/tmp/tunnel.log 2>&1 &
      echo "$!" > /tmp/tunnel.pid
      # 等 tunnel 端口监听
      for i in $(seq 1 15); do
        sleep 1
        nc -z 127.0.0.1 "$TUNNEL_TOKEN_PORT" 2>/dev/null && nc -z 127.0.0.1 "$TUNNEL_IAM_PORT" 2>/dev/null && break
      done
      nc -z 127.0.0.1 "$TUNNEL_TOKEN_PORT" || { echo "tunnel not listening"; cat /tmp/tunnel.log; exit 1; }
    - npm install -g pnpm
    - pnpm -C tests/e2e install
  script:
    - |
      IAM_BOOTSTRAP_TOKEN="${IAM_DEV_BT}" \
      NTF_BOOTSTRAP_TOKEN="${NOTIFICATION_DEV_BT}" \
      TOKEN_BOOTSTRAP_TOKEN="${TOKEN_DEV_BT}" \
      AUDIT_BOOTSTRAP_TOKEN="${AUDIT_DEV_BT}" \
      CONFIG_BOOTSTRAP_TOKEN="${CONFIG_DEV_BT}" \
      FILE_BOOTSTRAP_TOKEN="${FILE_DEV_BT}" \
      PRUE_BOOTSTRAP_TOKEN="${PRUE_DEV_BT}" \
      TID="${TENANT_ID:-1}" \
      node scripts/e2e-migration-state.js
  after_script:
    - '[[ -s /tmp/tunnel.pid ]] && kill "$(cat /tmp/tunnel.pid)" 2>/dev/null || true'
  allow_failure: false
  rules:
    # needs: [deploy] 在 MR 上 deploy 不跑会 fail；e2e_migration 同样要在有 staging 时才跑
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - when: manual
      allow_failure: true

# ── Build caching ──
# Docker build / cache 配置均在各服务的 Dockerfile 中（dependencies → builder → runner），
# 不同阶段由 .dockerignore / Dockerfile 的层缓存控制。多服务共享 builder 基础镜像，
# 因此 build stage 中所有 .rust_svc_build 的 Dockerfile 内层缓存依赖 $BASE_REGISTRY/rust:1.96-slim。
# 实际构建时 Docker BuildKit 层缓存落在 docker 宿主端，GitLab CI 不做额外缓存卷挂载。

frontend_lint:
  stage: test
  tags: [docker]
  image: $BASE_REGISTRY/node:20
  before_script:
    - npm install -g pnpm
    - pnpm -C frontend install --no-frozen-lockfile
  script:
    - pnpm -C frontend run lint:eslint
  rules:
    - changes:
        - frontend/**/*
      when: on_success
    - when: never
  allow_failure: true

# ── Build anchor: 复用 docker build + push 模式 ──
.svc_build:
  stage: build
  tags: [shell]
  script:
    - sudo docker build -f "$SVC_DOCKERFILE" -t "$DOCKER_REGISTRY/$DOCKER_REPO/$SVC_NAME:$IMAGE_TAG" .
    - sudo docker push "$DOCKER_REGISTRY/$DOCKER_REPO/$SVC_NAME:$IMAGE_TAG"
    - sudo docker tag "$DOCKER_REGISTRY/$DOCKER_REPO/$SVC_NAME:$IMAGE_TAG" "$DOCKER_REGISTRY/$DOCKER_REPO/$SVC_NAME:latest"
    - sudo docker push "$DOCKER_REGISTRY/$DOCKER_REPO/$SVC_NAME:latest"

# ── Rust 服务 build helper ──
.rust_svc_build:
  extends: .svc_build
  variables:
    SVC_DOCKERFILE: "services/${SVC_NAME}/Dockerfile"
  rules:
    - changes:
        - "services/${SVC_NAME}/**/*"
        - "libs/**/*"
        - "Cargo.toml"
        - "Cargo.lock"
      when: on_success
    - when: never

# ── 9 个服务 build job ──
build_api-gateway:
  extends: .rust_svc_build
  variables:
    SVC_NAME: "api-gateway"

build_token-service:
  extends: .rust_svc_build
  variables:
    SVC_NAME: "token-service"

build_iam-service:
  extends: .rust_svc_build
  variables:
    SVC_NAME: "iam-service"

build_notification-service:
  extends: .rust_svc_build
  variables:
    SVC_NAME: "notification-service"

build_audit-service:
  extends: .rust_svc_build
  variables:
    SVC_NAME: "audit-service"

build_config-service:
  extends: .rust_svc_build
  variables:
    SVC_NAME: "config-service"

build_file-service:
  extends: .rust_svc_build
  variables:
    SVC_NAME: "file-service"

build_prue_backend:
  extends: .rust_svc_build
  variables:
    SVC_NAME: "prue_backend"

build_frontend:
  stage: build
  tags: [shell]
  variables:
    SVC_NAME: "frontend"
  script:
    - sudo docker build -f frontend/Dockerfile -t "$DOCKER_REGISTRY/$DOCKER_REPO/frontend:$IMAGE_TAG" frontend/
    - sudo docker push "$DOCKER_REGISTRY/$DOCKER_REPO/frontend:$IMAGE_TAG"
    - sudo docker tag "$DOCKER_REGISTRY/$DOCKER_REPO/frontend:$IMAGE_TAG" "$DOCKER_REGISTRY/$DOCKER_REPO/frontend:latest"
    - sudo docker push "$DOCKER_REGISTRY/$DOCKER_REPO/frontend:latest"
  rules:
    - changes:
        - "frontend/**/*"
      when: on_success
    - when: never

# ─────────── Rolling deploy via SSH ───────────
# 工作流（runner 在 gitlab 上，部署机在 192.168.2.127）：
#   1. runner 拿到 SSH_PRIVATE_KEY / SSH_KNOWN_HOSTS，写到 ~/.ssh/（不打印）
#   2. rsync 同步仓库源码到部署机 STAGING_PROJECT_DIR（排除 .git / target / node_modules）
#   3. ssh 到部署机运行 infrastructure/scripts/deploy-remote.sh：
#        - preflight 检查（compose v2.20+、关键 vars 非空）
#        - docker compose pull
#        - 滚动 up + healthcheck 门禁
#        - frontend:8080/health 端点级验证
#        - docker image prune
#   4. runner 自己再 curl 一次 frontend:8080/health 验证整体可访问
#
# 关键设计：
#   - api-gateway:3000 在 prod 下不暴露到 host（被 docker-compose.prod.yml 的 !override [] 清掉）；
#     唯一公共入口是 frontend:8080，e2e 自动路由。
#   - 不依赖 `micro-service-runner` 这种专属 shell runner tag，跟 build/e2e 一样用 [docker] tag，
#     通过 SSH key 透明连到目标机。
#   - DEPLOY_PASSWORD 旧变量已废弃（不再引用）；如需 sshpass 兜底，见下面 SSH_OPTIONS 的 DEPLOY_PASSWORD 分支。
deploy:
  stage: deploy
  tags: [docker]
  image: $BASE_REGISTRY/node:20
  environment:
    name: staging
    url: $STAGING_BASE_URL
  before_script:
    # node:20 自带 ssh client（libssl 由 openssl 包兜底），无需额外 apt
    - 'which ssh-agent || (apt-get update && apt-get install -y --no-install-recommends openssh-client rsync)'
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    # SSH 主机指纹（GitLab Variables 注入；不存在则 ssh-keyscan 兜底）
    - if [ -n "$SSH_KNOWN_HOSTS" ]; then printf "%s\n" "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; fi
    - ssh-keyscan -H -p "$STAGING_SSH_PORT" "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
    - chmod 644 ~/.ssh/known_hosts
    # 写入 SSH 私钥（GitLab Variables → masked+protected）
    - if [ -n "$SSH_PRIVATE_KEY" ]; then printf "%s\n" "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key; chmod 600 ~/.ssh/deploy_key; fi
    # sshpass 兜底：当只有 DEPLOY_PASSWORD（无 SSH_PRIVATE_KEY）时改用密码登录
    - 'if [ -z "$SSH_PRIVATE_KEY" ] && [ -n "$DEPLOY_PASSWORD" ]; then apt-get update && apt-get install -y --no-install-recommends sshpass; export SSHPASS="$DEPLOY_PASSWORD"; SSH_OPTS="-o StrictHostKeyChecking=accept-new"; echo "[deploy] warning: using DEPLOY_PASSWORD fallback (recommend switching to SSH_PRIVATE_KEY)"; fi'
    # 先 ping 一遍，确认 SSH 通路 + 目标机有 docker（首次部署可能需要拉 compose 文件）
    - 'if [ -n "$SSH_PRIVATE_KEY" ]; then SSH_CMD="ssh -i ~/.ssh/deploy_key -p $STAGING_SSH_PORT -o StrictHostKeyChecking=accept-new $STAGING_DEPLOY_USER@$STAGING_HOST"; else SSH_CMD="sshpass -e ssh -p $STAGING_SSH_PORT -o StrictHostKeyChecking=accept-new $STAGING_DEPLOY_USER@$STAGING_HOST"; fi'
    - 'eval "$SSH_CMD" "docker --version && ls -d $STAGING_PROJECT_DIR 2>/dev/null || mkdir -p $STAGING_PROJECT_DIR"'
  script:
    # 1. 同步源码（排除 .git / target / node_modules / 前端 dist）
    - 'eval "$SSH_CMD" "mkdir -p $STAGING_PROJECT_DIR"'
    # rsync 多行写法在 GitLab Runner 把整段交给 `bash -c` 时会因为换行被当作
    # 语句分隔符、导致 --exclude 被当成独立命令。这里强制单行 + \ 续行。
    - |
      rsync -az --delete \
        --exclude=.git \
        --exclude=target \
        --exclude=node_modules \
        --exclude=frontend/node_modules \
        --exclude=frontend/dist \
        --exclude=.mvn \
        --exclude=Cargo.lock.bak \
        -e "ssh -i ~/.ssh/deploy_key -p $STAGING_SSH_PORT -o StrictHostKeyChecking=accept-new" \
        ./ "$STAGING_DEPLOY_USER@$STAGING_HOST:$STAGING_PROJECT_DIR/"
    # 2. 远程跑 deploy 脚本（自动检测 prod overlay，启用 prod mode 校验）
    - 'eval "$SSH_CMD" "cd $STAGING_PROJECT_DIR && bash infrastructure/scripts/deploy-remote.sh"'
    # 3. runner 端 post-deploy：frontend:8080/health 必须是 200
    - 'curl -fsS --max-time 10 "$STAGING_BASE_URL/health" | tee /tmp/post-deploy-health.txt'
    - '[ "$(cat /tmp/post-deploy-health.txt)" = "{\"status\":\"ok\"}" ] || { echo "frontend health body mismatch"; exit 1; }'
  only:
    - main
  when: on_success
  allow_failure: false
  retry: 1

# 与 deploy 配套：每次部署后快速 smoke 验证（deploy_smoke 仅当 deploy 跑了才存在）
# 同 stage 内 needs 要求对方存在；用 optional: true 让 MR pipeline 上 deploy 不跑时跳过此 job。
deploy_smoke:
  stage: deploy
  tags: [docker]
  image: $BASE_REGISTRY/node:20
  needs:
    - job: deploy
      optional: true
  variables:
    PROBE_URL: $STAGING_BASE_URL
  script:
    - 'for i in 1 2 3 4 5; do
        if curl -fsS --max-time 5 "$PROBE_URL/health" >/dev/null 2>&1; then
          echo "smoke ok on attempt $i"; exit 0;
        fi;
        sleep 5;
      done;
      echo "smoke failed"; exit 1'
  allow_failure: true

java_sdk_test:
  stage: test
  tags: [docker]
  image: $BASE_REGISTRY/maven:3.9-eclipse-temurin-21
  script:
    - cd sdk/java && mvn -B verify
  rules:
    - changes:
        - sdk/java/**

sdk_publish:
  stage: publish
  tags: [docker]
  image: $BASE_REGISTRY/maven:3.9-eclipse-temurin-21
  variables:
    SDK_VERSION: "${CI_COMMIT_TAG#v}"
  script:
    - node scripts/publish-maven-release.js --version "${SDK_VERSION}"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  environment:
    name: maven-releases

# Rust libs/* + sdk/rust/* 发布到私有 kellnr registry (http://192.168.2.12:16444)
# libs/ 17 个 crate（common-error / common-db / common-jwt / authz 等）按拓扑顺序发布
# sdk/rust/ 7 个 crate（digua-http-client + 6 个 service SDK）按依赖顺序发布
# 发布顺序由各自脚本内部处理（path 依赖临时替换为 version 依赖，发布完恢复）
# VERSION 由 ${CI_COMMIT_TAG#v} 注入（与 sdk_publish 共享同一 VERSION 语义）
rust_publish:
  stage: publish
  tags: [docker]
  image: $BASE_REGISTRY/rust:1.96-slim
  variables:
    CARGO_REGISTRIES_KELLNR_TOKEN: "${KELLNR_TOKEN}"
    CARGO_REGISTRIES_KELLNR_INDEX: "sparse+http://192.168.2.12:16444/api/v1/crates/"
    SDK_VERSION: "${CI_COMMIT_TAG#v}"
  before_script:
    - export RUSTUP_DIST_SERVER=http://crates.kudi.repos
    - export RUSTUP_UPDATE_ROOT=http://crates.kudi.reposrustup
    - apt-get update && apt-get install -y pkg-config libssl-dev
  script:
    - node scripts/publish-libs.js "${SDK_VERSION}" --registry kellnr
    - node scripts/publish-rust-sdks.js "${SDK_VERSION}" --registry kellnr
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  environment:
    name: kellnr-releases

# ─── Docker images with version tag ───
# tag 触发时按版本号（如 1.3.0）构建并 push 全部 9 个服务 + frontend
# 到 zhcoder-docker-registry.com:8000/micro-server/<svc>:<ver> + :latest。
# 用 scripts/build-docker.js（与本地 build 命令一致），pushMode=push 不留本地。
build_images:tagged:
  stage: publish
  tags: [shell]
  script:
    - export VERSION="${CI_COMMIT_TAG#v}"
    - echo "=== build_images:tagged — VERSION=${VERSION} ==="
    # 确保 buildx 就绪（首次需创建）
    - sudo docker buildx create --name xbuilder --use 2>/dev/null || sudo docker buildx use xbuilder
    - sudo docker buildx inspect --bootstrap
    - node scripts/build-docker.js -v "${VERSION}" --push
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  environment:
    name: image-releases

# ─── npm package (@digua/dist-tools) ───
# 把 release/dist-tools 包发到内网 npm registry（http://npm.kudi.repos/）。
# 凭证由 NPM_TOKEN CI Variable 注入；目标 registry 在 dist-tools/package.json 的
# publishConfig.registry 已写好。
publish_npm:
  stage: publish
  tags: [docker]
  image: $BASE_REGISTRY/node:20
  variables:
    NPM_REGISTRY_HOST: "${NPM_REGISTRY_HOST:-npm.kudi.repos}"
    DIST_TOOLS_VERSION: "${CI_COMMIT_TAG#v}"
  before_script:
    - 'echo "//${NPM_REGISTRY_HOST}/:_authToken=${NPM_TOKEN}" > ~/.npmrc'
    - npm config set registry "http://${NPM_REGISTRY_HOST}"
  script:
    - cd release/dist-tools
    - npm version "${DIST_TOOLS_VERSION}" --no-git-tag-version --allow-same-version
    - npm publish --access public
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  environment:
    name: npm-releases

# ─────────────────────────────────────────────────────────────────────────────
# Release stage — 打包离线分发包（仅 tag 触发）
# 输出：release/coder-micro-services-${VERSION}/
#       release/coder-micro-services-${VERSION}-airgap.tar.gz
# 依赖：上面的 publish stage 全部成功（4 个 job 跑完 = sdk + rust + images + npm 都完成）
# ─────────────────────────────────────────────────────────────────────────────
release:dist:
  stage: release
  tags: [shell]
  needs:
    - sdk_publish
    - rust_publish
    - build_images:tagged
    - publish_npm
  script:
    - export VERSION="${CI_COMMIT_TAG#v}"
    - echo "=== release:dist — VERSION=${VERSION} ==="
    - cd release/dist-template
    # 生成 dist 包（不重新拉镜像：前面 build_images:tagged 已经按版本号推完了）
    - node scripts/release.js "${VERSION}" --no-images
    - 'echo "[release:dist] 离线分发包已就绪（不含镜像，由 build_images:tagged 单独推送）"'
    - ls -la release/dist-template/
  artifacts:
    name: "dist-${CI_COMMIT_TAG}"
    paths:
      - release/dist-template/
    expire_in: 7 days
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  environment:
    name: dist-releases

# ─────────────────────────────────────────────────────────────────────────────
# Security audit — 每周 scheduled pipeline + 手动触发
# ─────────────────────────────────────────────────────────────────────────────
cargo_audit:
  stage: test
  tags: [docker]
  image: $BASE_REGISTRY/rust:1.96-slim
  before_script:
    - export RUSTUP_DIST_SERVER=http://crates.kudi.repos
    - export RUSTUP_UPDATE_ROOT=http://crates.kudi.reposrustup
    - apt-get update && apt-get install -y pkg-config libssl-dev
    - cargo install cargo-audit --locked
  script:
    - cargo audit
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: on_success
    - when: manual
      allow_failure: true

cargo_deny:
  stage: test
  tags: [docker]
  image: $BASE_REGISTRY/rust:1.96-slim
  before_script:
    - export RUSTUP_DIST_SERVER=http://crates.kudi.repos
    - export RUSTUP_UPDATE_ROOT=http://crates.kudi.reposrustup
    - apt-get update && apt-get install -y pkg-config libssl-dev
    - cargo install cargo-deny --locked
  script:
    - cargo deny check
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: on_success
    - when: manual
      allow_failure: true

