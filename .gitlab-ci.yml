stages:
  - cleanup
  - test
  - build
  - deploy
  - e2e
  - perf
  - publish
  - release

variables:
  DOCKER_REGISTRY: zhcoder-docker-registry.com:8000
  DOCKER_REPO: micro-server
  BASE_REGISTRY: zhcoder-docker-registry.com:8000/official
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  MAVEN_REPO_URL: http://192.168.2.12:18181/releases
  NUGET_REPO_URL: http://nuget.kudi.repos/v3/index.json

  # ─── 部署目标服务器 ───
  # 部署走 SSH 到 192.168.2.127（kudi 用户）。SSH key 在 GitLab Variables 配置。
  # 这些变量有合理 default，可在 GitLab Project → Settings → CI/CD → Variables
  # 默认值直接写字面值，不用 ${VAR:-default}（在 GitLab CI 变量段里
  # 这种语法在某些 runner 上展开不正确，trace 显示 STAGING_SSH_PORT 等
  # var 没拿到 default 而被空字符串覆盖，导致 sshpass 拼出 '"'"'ssh -p  -o'"'"' 报错。
  # user 在 GitLab Project 配同名 var 仍可覆盖。
  # 默认 IP 来自 GitLab Project 中 SSH_PRIVATE_KEY 的 description
  # ('"'"'192.168.2.31 私有'"'"')，不是 user 原话里说的 192.168.2.127——
  # SSH key 与 host 必须匹配才能成功认证。
  STAGING_HOST: "192.168.2.31"
  STAGING_DEPLOY_USER: "kudi"
  STAGING_PROJECT_DIR: "/home/kudi/coder-micro-services"
  STAGING_SSH_PORT: "22"

  # 公共入口由 frontend:8080 提供（前端 nginx 反代到容器网络内的 api-gateway:3000）。
  # api-gateway:3000 在 prod 下不再暴露到 host。详见 infrastructure/docker-compose.prod.yml。
  STAGING_BASE_URL: "http://192.168.2.31:8080"

  # E2E 默认走 frontend(STAGING_BASE_URL)，不再依赖 3000 暴露。
  E2E_BASE_URL: $STAGING_BASE_URL
  E2E_DB_HOST: $STAGING_HOST
  E2E_DB_USER: root
  # E2E_DB_PASSWORD 通过 GitLab CI/CD Variables 注入（type: env_var, masked）
  E2E_DB_NAME: superpowers

  # ─── CI 镜像：项目 builder 镜像（与 services/<svc>/Dockerfile 一致）──
  # zhcoder-docker-registry.com:8000/builder/rust:1.96-slim-musl-v3 镜像预装
  # 了 rustfmt + clippy + node 20.x + c build deps，CI 不再 apt-get 装。
  # 命名约定：见 .gitlab-ci.yml 顶部 CODER_BUILDER_REGISTRY。
  BUILDER_RUST_IMAGE: "${CODER_BUILDER_REGISTRY}/rust:1.96-slim-musl-v3"

  # ─── utoipa-swagger-ui build.rs 拉 zip：CI runner 直连 GitHub 不通，
  #     走 gh-proxy.org 代理（项目网络规则 AGENTS.md「网络规则」节）。
  #     本地开发改用 `pnpm run assets:download` 把 zip 下到
  #     infrastructure/vendor/，再传 SWAGGER_UI_DOWNLOAD_URL=file://...。
  #     在 GitLab Project 配同名 CI Variable 可覆盖此 default。──
  SWAGGER_UI_DOWNLOAD_URL: "https://gh-proxy.org/https://github.com/swagger-api/swagger-ui/archive/refs/tags/v5.17.14.zip"

  # --- setup-wizard 同步（敏感值引用 GitLab CI Variables）---
  CODER_BASE_REGISTRY: "zhcoder-docker-registry.com:8000/official"
  CODER_BUILDER_REGISTRY: "zhcoder-docker-registry.com:8000/builder"
  CODER_CRATE_REGISTRY: "https://rsproxy.cn/index/"
  CODER_CRATE_TOKEN: "$CRATE_TOKEN"
  CODER_PRIVATE_CRATE_REGISTRY: "http://192.168.2.12:16444"
  CODER_PRIVATE_CRATE_REGISTRY_TOKEN: "$PRIVATE_CRATE_REGISTRY_TOKEN"
  CODER_MAVEN_REGISTRY: "http://mvn.kudi.repos"
  CODER_MAVEN_AUTH_MODE: "userpass"
  CODER_MAVEN_USERNAME: "$MAVEN_USERNAME"
  CODER_MAVEN_PASSWORD: "$MAVEN_PASSWORD"
  CODER_NPM_REGISTRY: "http://npm.kudi.repos"
  CODER_NPM_TOKEN: "$NPM_TOKEN"
# ─── cleanup：shell executor 在 test 前清理 runner 主机磁盘 ───
# build_images 空转（ENOTFOUND 重试循环）会堆积 buildx 缓存撑满 runner 磁盘
# （pipeline 6307 实证：rust_test 连续 No space left on device）。pipelineDestroy
# 只删 GitLab 记录，不清理 runner 主机实际缓存，故在此显式 prune。
# parallel: 2 —— 两台 shell runner（192.168.2.69 / 192.168.2.31）都可能被
# build_images 或 rust_test(docker volume) 撑满；单实例只清被调度到的那台
# （pipeline 6319 实证：cleanup 清了 69，rust_test 在 31 仍 No space）。
# 两个实例并行分到两台，各 prune 一次。
cleanup:buildx:
  stage: cleanup
  tags: [shell]
  parallel: 2
  before_script:
    - 'if [ -n "$DOCKER_REGISTRY_USER" ]; then sudo -E docker login zhcoder-docker-registry.com:8000 -u "$DOCKER_REGISTRY_USER" -p "$DOCKER_REGISTRY_PASSWORD" >/dev/null 2>&1; fi'
  script:
    - sudo docker buildx prune -af 2>/dev/null || true
    - sudo docker system prune -af --volumes 2>/dev/null || true
    - df -h / | tail -1
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
  allow_failure: false

# ─── Rust CI：合并 rust_test + cargo_clippy + cargo_fmt_check + spec_generate ───
# 单 job 内顺序跑 fmt check → clippy → dump_openapi → test，共享同一个 target/。
# 节省：3 次 workspace 完整编译 → 1 次（critical path 砍掉 ~10-15min）。
#
# builder 镜像（zhcoder-docker-registry.com:8000/builder/rust:1.96-slim-musl）
# 缺 rustfmt/clippy components，mirror crates.kudi.repos 上 404。
# 绕过 mirror 走默认 upstream（static.rust-lang.org，runner 出网可达）
# 临时装上两 component；后续 ops 把组件 bake 进镜像后可去掉这两行。
#
# OpenAPI drift 检查现在是阻断式：历史的 iam/api-gateway openapi.yaml 行尾差异已解决，
# 重新生成后 8 个服务 spec 与代码完全一致，`git diff --exit-code` 恢复拦截漂移。
rust_ci:
  stage: test
  tags: [docker]
  image: $BUILDER_RUST_IMAGE
  variables:
    REDIS_URL: redis://192.168.2.130:6379
  script:
    - cargo fmt --check --all 2>&1 | tee cargo-fmt.log
    # clippy 编出 workspace 全量；dump_openapi / test 都复用其 artifact
    - cargo clippy --workspace --all-targets -- -D warnings
    # dump_openapi bin target 在 clippy --all-targets 时已编过，增量 0 成本
    - node scripts/dump-openapi-specs.js
    # openapi drift 阻断式：spec 与代码不一致时 job 失败
    - git diff --exit-code -- 'services/*/openapi.yaml'
    # test 增量复用 clippy 编过的 lib
    - cargo test --workspace --lib --verbose
  artifacts:
    when: always
    name: "rust-ci-$CI_COMMIT_SHORT_SHA"
    paths:
      - cargo-fmt.log
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: on_success
  allow_failure: false

service_standard_check:
  stage: test
  tags: [docker]
  image: $BASE_REGISTRY/node:20
  script:
    - node scripts/check-service-standard.js 2>&1 | tee service-standard.log
  artifacts:
    when: always
    name: "service-standard-check-$CI_COMMIT_SHORT_SHA"
    paths:
      - service-standard.log
    expire_in: 1 day

spec_check:
  stage: test
  tags: [docker]
  image: $BASE_REGISTRY/node:20
  before_script:
    - npm config set registry https://registry.npmmirror.com/
    - npm install --prefix /tmp/deps js-yaml@^5.2.1
  script:
    - NODE_PATH=/tmp/deps/node_modules node scripts/check-spec.js 2>&1 | tee spec-check.log
  artifacts:
    when: always
    name: "spec-check-$CI_COMMIT_SHORT_SHA"
    paths:
      - spec-check.log
    expire_in: 1 day

contracts_check:
  stage: test
  tags: [docker]
  image: $BASE_REGISTRY/node:20
  before_script:
    - npm config set registry https://registry.npmmirror.com/
    - npm install --prefix /tmp/deps js-yaml@^5.2.1
  script:
    - NODE_PATH=/tmp/deps/node_modules node scripts/contracts-gen.js --check

doc_links_check:
  stage: test
  tags: [docker]
  image: $BASE_REGISTRY/node:20
  script:
    - node scripts/check-doc-links.js

reconcile_todo_docs_check:
  stage: test
  tags: [docker]
  image: $BASE_REGISTRY/node:20
  # TODO.md ↔ docs-site/guides/* ↔ docs-site/decisions/* ↔ docs-site/runbooks/* 状态行漂移检测。
  # R1（HARD）：TODO.md 父行末尾含"待..."但全部子项已 [x]。
  # R2（HARD）：关联 guide / decision / runbook 顶部状态行已标记落地（v\d+ / 可执行 / 落地 /
  #              approved / 已采纳 / closed），但 TODO.md 对应项仍 [ ]。
  # 退出码：0=clean/advisory，1=至少一条 HARD drift；MR 阻断。
  # 仅 Node 内置依赖（fs / path），无需 npm install；与 check-doc-links.js 同一执行环境。
  script:
    - node scripts/reconcile-todo-docs.js
  rules:
    - changes:
        - TODO.md
        - docs-site/**/*.{md,vue}
        - scripts/reconcile-todo-docs.js
      when: on_success
    - when: never

i18n_namespace_check:
  stage: test
  tags: [docker]
  image: $BASE_REGISTRY/node:20
  script:
    - node scripts/check-i18n-namespace.js
  rules:
    - changes:
        - frontend/src/**/*.{vue,ts}
        - frontend/locales/**/*.yaml
      when: on_success
    - when: never

java_sdk_drift_check:
  stage: test
  tags: [docker]
  image: $BASE_REGISTRY/node:20
  allow_failure: false
  script:
    - node scripts/check-java-sdk-drift.js
  rules:
    - changes:
        - sdk/java/**/*
        - services/*/openapi.yaml
      when: on_success
    - when: never

e2e_api_test:
  stage: e2e
  tags: [docker]
  image: $BASE_REGISTRY/node:20
  variables:
    E2E_BASE_URL: $STAGING_BASE_URL
  before_script:
    - npm install -g pnpm
    - pnpm -C tests/e2e install
  script:
    - pnpm -C tests/e2e run test:api
  rules:
    # e2e 只在 main / 手动触发时跑 —— MR pipeline 上 staging 还没 deploy，必然 fail
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - when: manual
      allow_failure: true

e2e_ui_test:
  stage: e2e
  tags: [docker]
  image: mcr.microsoft.com/playwright:v1.48.0-jammy
  variables:
    E2E_BASE_URL: $STAGING_BASE_URL
  before_script:
    - npm install -g pnpm
    - pnpm -C tests/e2e install
    - pnpm -C tests/e2e exec playwright install chromium
  script:
    - pnpm -C tests/e2e run test:ui
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - when: manual
      allow_failure: true

e2e_migration_state_test:
  stage: e2e
  tags: [docker]
  image: $BASE_REGISTRY/node:20
  variables:
    # 在 prod 模式下，业务后端端口（8081 / 8082 / ...）不再 publish 到 host；
    # 通过 SSH 反向隧道把每个业务端口从 staging 拉到 runner 本地
    # （端口 19xxx 仅 runner 容器内部使用，不冲突）。
    TUNNEL_TOKEN_PORT: "19000"     # → token-service:8082
    TUNNEL_IAM_PORT:   "19001"     # → iam-service:8081
    TUNNEL_NTF_PORT:   "19003"     # → notification-service:8083
    TUNNEL_AUDIT_PORT: "19004"     # → audit-service:8084
    TUNNEL_CONFIG_PORT: "19005"     # → config-service:8081
    TUNNEL_FILE_PORT:  "19006"     # → file-service:8082
    TUNNEL_PRUE_PORT:  "19007"     # → prue_backend:8087
    SERVICE_HOST: "127.0.0.1"
    TOKEN_SERVICE_URL: "http://127.0.0.1:${TUNNEL_TOKEN_PORT}"
    IAM_DEV_BT: "${IAM_DEV_BT}"
    NOTIFICATION_DEV_BT: "${NOTIFICATION_DEV_BT}"
    TOKEN_DEV_BT: "${TOKEN_DEV_BT}"
    AUDIT_DEV_BT: "${AUDIT_DEV_BT}"
    CONFIG_DEV_BT: "${CONFIG_DEV_BT}"
    FILE_DEV_BT: "${FILE_DEV_BT}"
    PRUE_DEV_BT: "${PRUE_DEV_BT}"
  before_script:
    - 'which ssh || (apt-get update && apt-get install -y --no-install-recommends openssh-client)'
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - if [ -n "$SSH_PRIVATE_KEY" ]; then printf "%s\n" "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key; fi
    - ssh-keyscan -H -p "$STAGING_SSH_PORT" "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
    # 启动后台 tunnel：每个 service 一个本地端口，转发到远端容器名
    - '[[ -n "$SSH_PRIVATE_KEY" ]] || { echo "SSH_PRIVATE_KEY required for e2e_migration_state_test"; exit 1; }'
    - |
      setsid ssh -N \
        -i ~/.ssh/deploy_key \
        -p "$STAGING_SSH_PORT" \
        -o StrictHostKeyChecking=accept-new \
        -o ExitOnForwardFailure=yes \
        -L "127.0.0.1:${TUNNEL_TOKEN_PORT}:token-service:8082" \
        -L "127.0.0.1:${TUNNEL_IAM_PORT}:iam-service:8081" \
        -L "127.0.0.1:${TUNNEL_NTF_PORT}:notification-service:8083" \
        -L "127.0.0.1:${TUNNEL_AUDIT_PORT}:audit-service:8084" \
        -L "127.0.0.1:${TUNNEL_CONFIG_PORT}:config-service:8081" \
        -L "127.0.0.1:${TUNNEL_FILE_PORT}:file-service:8082" \
        -L "127.0.0.1:${TUNNEL_PRUE_PORT}:prue_backend:8087" \
        "$STAGING_DEPLOY_USER@$STAGING_HOST" \
        >/tmp/tunnel.log 2>&1 &
      echo "$!" > /tmp/tunnel.pid
      # 等 tunnel 端口监听
      for i in $(seq 1 15); do
        sleep 1
        nc -z 127.0.0.1 "$TUNNEL_TOKEN_PORT" 2>/dev/null && nc -z 127.0.0.1 "$TUNNEL_IAM_PORT" 2>/dev/null && break
      done
      nc -z 127.0.0.1 "$TUNNEL_TOKEN_PORT" || { echo "tunnel not listening"; cat /tmp/tunnel.log; exit 1; }
    - npm install -g pnpm
    - pnpm -C tests/e2e install
  script:
    - |
      IAM_BOOTSTRAP_TOKEN="${IAM_DEV_BT}" \
      NTF_BOOTSTRAP_TOKEN="${NOTIFICATION_DEV_BT}" \
      TOKEN_BOOTSTRAP_TOKEN="${TOKEN_DEV_BT}" \
      AUDIT_BOOTSTRAP_TOKEN="${AUDIT_DEV_BT}" \
      CONFIG_BOOTSTRAP_TOKEN="${CONFIG_DEV_BT}" \
      FILE_BOOTSTRAP_TOKEN="${FILE_DEV_BT}" \
      PRUE_BOOTSTRAP_TOKEN="${PRUE_DEV_BT}" \
      TID="${TENANT_ID:-1}" \
      node scripts/e2e-migration-state.js
  after_script:
    - '[[ -s /tmp/tunnel.pid ]] && kill "$(cat /tmp/tunnel.pid)" 2>/dev/null || true'
  allow_failure: false
  rules:
    # needs: [deploy] 在 MR 上 deploy 不跑会 fail；e2e_migration 同样要在有 staging 时才跑
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - when: manual
      allow_failure: true

# ── Build caching ──
# Docker build / cache 配置均在各服务的 Dockerfile 中（dependencies → builder → runner），
# 不同阶段由 .dockerignore / Dockerfile 的层缓存控制。多服务共享 builder 基础镜像，
# 因此 build stage 中所有 .rust_svc_build 的 Dockerfile 内层缓存依赖 $BASE_REGISTRY/rust:1.96-slim。
# 实际构建时 Docker BuildKit 层缓存落在 docker 宿主端，GitLab CI 不做额外缓存卷挂载。

frontend_lint:
  stage: test
  tags: [docker]
  image: $BASE_REGISTRY/node:20
  before_script:
    - npm install -g pnpm
    - pnpm -C frontend install --no-frozen-lockfile
  script:
    - pnpm -C frontend run lint:eslint
  rules:
    - changes:
        - frontend/**/*
      when: on_success
    - when: never
  allow_failure: true

# ═════════════════════════════════════════════════════════════════════════════
# Continuous staging flow（per-commit SHA + atomic symlink swap）
# ═════════════════════════════════════════════════════════════════════════════

# ═════════════════════════════════════════════════════════════════════════════
# Continuous staging flow（per-commit SHA + atomic symlink swap）
# ═════════════════════════════════════════════════════════════════════════════
# 关键设计：
#   - 只跑 main branch（不在 MR pipeline 上跑，省 build 时间）
#   - 用 release-deploy.js --no-images 产骨架（artifact ~1MB，镜像不打包）
#   - 镜像由 staging server 走 docker pull（registry 直拉，免 tar 体积）
#   - 部署走 atomic symlink swap：staging-active -> staging-<sha>，无 race
#   - resource_group: staging 串行化（保护 symlink swap 原子性）
#   - e2e:staging 失败自动 rollback 到 staging-prev
#
# staging server 目录结构（192.168.2.31）：
#   /home/kudi/coder-micro-services/
#     staging-active -> staging-<current-sha>     # 原子软链，唯一可变状态
#     staging-prev   -> staging-<previous-sha>    # rollback 锚点
#     staging-<sha>/                              # immutable per-SHA 目录
#
# 关键文件：
#   - infrastructure/scripts/swap-staging-active.sh — 原子 swap（deploy:staging / e2e:staging rollback）
#   - infrastructure/scripts/staging-gc.sh — 清理老 staging-<sha>（cron.daily）
#   - release/dist-template/scripts/release-deploy.js --no-images — 产骨架
#   - release/dist-template/bin/load-images.js --mode=pull — 从 registry 拉镜像

build_images:staging:
  stage: build
  tags: [shell]
  resource_group: staging
  before_script:
    - npm ci --silent --no-audit --no-fund
    # .npmrc 与 infrastructure/vendor/ 由 setup-wizard 生成且 gitignore，CI checkout 后缺失。
    # 重建根 .npmrc（build-docker.js 会自动复制到 frontend/），让 Docker build 里
    # frontend 的 pnpm install 走内网 npm 镜像，避免外网 npmjs.org 慢速超时。
    # 用 IP 直连而非 ${CODER_NPM_REGISTRY}（域名 npm.kudi.repos）：buildx 容器内该
    # 域名 DNS 解析失败（ENOTFOUND，pipeline 6307 实证），IP 直连不受 DNS 影响。
    - |
      echo "registry=http://192.168.2.12:14873" > .npmrc
      echo "strict-ssl=false" >> .npmrc
      if [ -n "$CODER_NPM_TOKEN" ]; then
        echo "//192.168.2.12:14873/:_authToken=${CODER_NPM_TOKEN}" >> .npmrc
      fi
    # 下载 swagger-ui zip 到 infrastructure/vendor/（prue_backend Dockerfile COPY 依赖）
    - node scripts/download-swagger-ui.js
    - 'if [ -n "$DOCKER_REGISTRY_USER" ]; then sudo -E docker login zhcoder-docker-registry.com:8000 -u "$DOCKER_REGISTRY_USER" -p "$DOCKER_REGISTRY_PASSWORD" >/dev/null 2>&1; fi'
    # buildkit 跑在 docker-container driver 的独立容器里，registry 协议决策独立于 host daemon 的
    # /etc/docker/daemon.json。把内网 HTTP registry 显式标记 http = true，否则 buildkit 默认 HTTPS
    # → 撞内网明文 registry 会报 'http: server gave HTTP response to HTTPS client'
    #（pipeline 23541 实证：FROM ${BASE_REGISTRY}/mysql:8.0 metadata HEAD 失败）。
    - |
      echo '[registry."zhcoder-docker-registry.com:8000"]' > /tmp/buildkitd.toml
      echo '  http = true' >> /tmp/buildkitd.toml
  script:
    - export VERSION="${CI_COMMIT_SHORT_SHA}"
    - echo "=== build_images:staging — VERSION=${VERSION} ==="
    # 先 rm：避免上一次 runner 残留的 xbuilder 持旧 config（--config 只在 create 时生效，update 子命令不存在）。
    # --config 注入 buildkitd 协议白名单，让 buildkit 把 zhcoder-docker-registry.com:8000 当 HTTP 走。
    - sudo docker buildx rm xbuilder 2>/dev/null || true
    - sudo docker buildx create --name xbuilder --driver docker-container --config /tmp/buildkitd.toml --use
    - sudo docker buildx inspect --bootstrap
    # --load-and-push：本地留镜像（staging server pull 需要）+ 推 registry（备份 / 跨环境可拉）
    # 用变量传递避免 YAML 多行 `\<newline>` + 缩进导致 bash 把缩进当作 arg 前缀
    - export BUILD_SERVICES="api-gateway token-service iam-service notification-service audit-service config-service file-service prue-admin-backend frontend"
    # sudo -E：gitlab-runner user 不在 docker group，sudoers 配了 NOPASSWD: ALL
    - sudo -E node scripts/build-docker.js -v "${VERSION}" --load-and-push $BUILD_SERVICES
    # mysql-replica 位于 infrastructure/mysql-replica/，不在 build-docker.js 服务清单里，单独 buildx --push。
    # 它在 docker-compose.yml（非 infra.yml）中，release 时 transform-compose 转成
    # micro-server/mysql-replica:<sha>，load-images --mode=pull 会拉它，必须在此构建推送。
    - export MYSQL_REPLICA_IMAGE="zhcoder-docker-registry.com:8000/micro-server/mysql-replica:${VERSION}"
    - export MYSQL_REPLICA_CTX="infrastructure/mysql-replica/"
    - sudo docker buildx build --platform linux/amd64 --tag "${MYSQL_REPLICA_IMAGE}" --push "${MYSQL_REPLICA_CTX}"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
  allow_failure: false


release:staging:
  stage: build
  tags: [docker]
  image: $BASE_REGISTRY/node:20
  resource_group: staging
  needs:
    - job: build_images:staging
  script:
    - export VERSION="${CI_COMMIT_SHORT_SHA}"
    # --no-images：只产骨架（artifact ~1MB），镜像由 staging server pull
    - node release/dist-template/scripts/release-deploy.js "${VERSION}" --no-images
    - export DIST_DIR="release/dist-template/release/coder-micro-services-${VERSION}-deploy"
    - "[[ -d \"$DIST_DIR\" ]] || { echo \"staging deploy skeleton missing: $DIST_DIR\"; exit 1; }"
    - "[[ -f \"$DIST_DIR/MANIFEST.json\" ]] || { echo \"MANIFEST.json missing\"; exit 1; }"
  artifacts:
    name: "staging-deploy-${CI_COMMIT_SHORT_SHA}"
    paths:
      - release/dist-template/release/coder-micro-services-${CI_COMMIT_SHORT_SHA}-deploy/
    expire_in: 3 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
  allow_failure: false

deploy:staging:
  stage: deploy
  tags: [docker]
  image: $BASE_REGISTRY/node:20
  resource_group: staging
  needs:
    - job: release:staging
  environment:
    name: staging
    url: $STAGING_BASE_URL
  before_script:
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - '[[ -n "$SSH_PRIVATE_KEY" ]] || { echo "SSH_PRIVATE_KEY required for deploy:staging"; exit 1; }'
    - printf "%s\n" "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
    - ssh-keyscan -H -p "$STAGING_SSH_PORT" "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
  script:
    - export STAGING_SHA="${CI_COMMIT_SHORT_SHA}"
    - export DIST_DIR="release/dist-template/release/coder-micro-services-${STAGING_SHA}-deploy"
    - export REMOTE_DIR="${STAGING_PROJECT_DIR}/staging-${STAGING_SHA}"
    # 从 MANIFEST.json 读 staging_swap_target 字段（release-deploy.js 写入）
    # 用 node 解析而非 jq（避免 runner 缺 jq）
    - export SWAP_TARGET="$(node -e "console.log(JSON.parse(require('fs').readFileSync('${DIST_DIR}/MANIFEST.json')).staging_swap_target)")"
    - '[[ "${SWAP_TARGET}" == "${STAGING_SHA}" ]] || { echo "MANIFEST staging_swap_target=${SWAP_TARGET} != ${STAGING_SHA}"; exit 1; }'
    # tar over ssh 传输（远端无需 rsync；MR !37 修了 runner 端但 192.168.2.31 没 rsync）
    - ssh -i ~/.ssh/deploy_key -p "$STAGING_SSH_PORT" -o StrictHostKeyChecking=accept-new
        "$STAGING_DEPLOY_USER@$STAGING_HOST" "mkdir -p '$REMOTE_DIR'"
    - tar -C "$DIST_DIR" -cf - . | ssh -i ~/.ssh/deploy_key -p "$STAGING_SSH_PORT" -o StrictHostKeyChecking=accept-new
        "$STAGING_DEPLOY_USER@$STAGING_HOST" "tar -C '$REMOTE_DIR' -xf -"
    # 拉镜像：远端宿主机已装 nodejs，直接在 REMOTE_DIR 跑 load-images.js --mode=pull，
    # 脚本内 `docker pull` 直连宿主机 daemon（无 DooD，无需挂 socket/CLI）。
    - ssh -i ~/.ssh/deploy_key -p "$STAGING_SSH_PORT" -o StrictHostKeyChecking=accept-new
        "$STAGING_DEPLOY_USER@$STAGING_HOST"
        "cd '${REMOTE_DIR}' && IMAGE_TAG='${STAGING_SHA}' REGISTRY='${DOCKER_REGISTRY}' BASE_REGISTRY='${BASE_REGISTRY}' node bin/load-images.js --mode=pull"
    # atomic swap staging-active 软链到 staging-<sha>（同时把旧 active 退到 staging-prev）
    - ssh -i ~/.ssh/deploy_key -p "$STAGING_SSH_PORT" -o StrictHostKeyChecking=accept-new
        "$STAGING_DEPLOY_USER@$STAGING_HOST"
        "STAGING_BASE_DIR='${STAGING_PROJECT_DIR}' bash '${REMOTE_DIR}/infrastructure/scripts/swap-staging-active.sh' '${STAGING_SHA}'"
    # post-deploy health gate
    - 'curl -fsS --max-time 10 "http://${STAGING_HOST}:3000/health" | tee /tmp/post-deploy-health.txt'
    - '[ "$(cat /tmp/post-deploy-health.txt)" = "{\"status\":\"ok\"}" ] || { echo "api-gateway health body mismatch"; exit 1; }'
    - echo "[deploy:staging] done — sha=${STAGING_SHA} active=staging-${STAGING_SHA}"
    # 抓 MySQL root 密码生成 dotenv artifact（make secrets 每次 deploy 重生成）。
    # SSH 远端只 cat + 管道 awk（避开远端 bash 引号嵌套坑）。
    - ssh -i ~/.ssh/deploy_key -p "$STAGING_SSH_PORT" -o StrictHostKeyChecking=accept-new
        "$STAGING_DEPLOY_USER@$STAGING_HOST" "cat '${REMOTE_DIR}/.env'"
        | awk -F= '/^MYSQL_ROOT_PASSWORD=/ {print "E2E_DB_PASSWORD=" $2}' > .staging-secrets
  artifacts:
    reports:
      dotenv: .staging-secrets
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
  allow_failure: false
  retry: 1

e2e:staging:
  stage: e2e
  tags: [docker]
  image: $BASE_REGISTRY/node:20
  resource_group: staging
  needs:
    - job: deploy:staging
      artifacts: true
  variables:
    STAGING_SHA: $CI_COMMIT_SHORT_SHA
  before_script:
    - 'which ssh || (apt-get update && apt-get install -y --no-install-recommends openssh-client)'
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - '[[ -n "$SSH_PRIVATE_KEY" ]] || { echo "SSH_PRIVATE_KEY required for e2e:staging"; exit 1; }'
    - printf "%s\n" "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
    - ssh-keyscan -H -p "$STAGING_SSH_PORT" "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
    # SSH 反向隧道：把 staging 的端口拉到 runner 本地（与现有 e2e 模式一致）
    - ssh -i ~/.ssh/deploy_key -p "$STAGING_SSH_PORT" -o StrictHostKeyChecking=accept-new -N -f
        -R 3000:localhost:3000 -R 8080:localhost:8080 -R 8500:localhost:8500
        "$STAGING_DEPLOY_USER@$STAGING_HOST"
    # node:20 镜像不自带 pnpm；corepack 激活 pnpm@9（对齐 lockfileVersion 9.0）
    - corepack enable
    - corepack prepare pnpm@9 --activate
    - cd tests/e2e && pnpm install --frozen-lockfile
  script:
    # e2e 跑刚部署的 SHA（active 已 swap 到 ${STAGING_SHA}，staging server 上跑的就是它）
    # before_script 已 cd tests/e2e + pnpm install --frozen-lockfile，所以 pnpm 在当前目录
    # 的 package.json 找 scripts；tests/e2e/package.json 只有 test:api / test:ui，没有
    # test:e2e:api（那是 root package.json 里的 alias，定义是 pnpm -C tests/e2e test:api，
    # 在 tests/e2e 子目录跑会报 ERR_PNPM_NO_SCRIPT）。
    - pnpm run test:api -- --base-url=http://localhost:8080
    - pnpm run test:ui  -- --base-url=http://localhost:8080
  # 失败时 rollback：swap 回 staging-prev（deploy:staging 已把旧版退到 prev）
  after_script:
    - |
      if [ "$CI_JOB_STATUS" == "failed" ]; then
        echo "[e2e:staging] FAILED — rolling back via staging-prev"
        ssh -i ~/.ssh/deploy_key -p "$STAGING_SSH_PORT" -o StrictHostKeyChecking=accept-new \
          "$STAGING_DEPLOY_USER@$STAGING_HOST" \
          "PREV_LINK='${STAGING_PROJECT_DIR}/staging-prev'
           if [ -L \"\$PREV_LINK\" ]; then
             PREV_SHA=\$(basename \$(readlink -f \"\$PREV_LINK\") | sed 's/^staging-//')
             echo \"[rollback] swap 回 staging-\$PREV_SHA\"
             STAGING_BASE_DIR='${STAGING_PROJECT_DIR}' bash '${STAGING_PROJECT_DIR}/staging-'\"\$PREV_SHA\"'/infrastructure/scripts/swap-staging-active.sh' \"\$PREV_SHA\" || true
             echo '[e2e:staging] rolled back'
           else
             echo '[e2e:staging] no staging-prev link, leaving active as-is'
           fi"
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
  allow_failure: false

java_sdk_test:
  stage: test
  tags: [docker]
  image: $BASE_REGISTRY/maven:3.9-eclipse-temurin-21
  before_script:
    - mkdir -p ~/.m2
    - cp .gitlab/ci-maven-settings.xml ~/.m2/settings.xml
  script:
    - cd sdk/java && mvn -B verify
  rules:
    - changes:
        - sdk/java/**

sdk_publish:
  stage: publish
  tags: [docker]
  image: $BASE_REGISTRY/maven:3.9-eclipse-temurin-21
  variables:
    SDK_VERSION: "${CI_COMMIT_TAG#v}"
  before_script:
    - mkdir -p ~/.m2
    - cp .gitlab/ci-maven-settings.xml ~/.m2/settings.xml
  script:
    - node scripts/publish-maven-release.js --version "${SDK_VERSION}"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  environment:
    name: maven-releases

# Rust libs/* + sdk/rust/* 发布到私有 kellnr registry (http://192.168.2.12:16444)
# libs/ 17 个 crate（common-error / common-db / common-jwt / authz 等）按拓扑顺序发布
# sdk/rust/ 7 个 crate（digua-http-client + 6 个 service SDK）按依赖顺序发布
# 发布顺序由各自脚本内部处理（path 依赖临时替换为 version 依赖，发布完恢复）
# VERSION 由 ${CI_COMMIT_TAG#v} 注入（与 sdk_publish 共享同一 VERSION 语义）
rust_publish:
  stage: publish
  tags: [docker]
  image: $BUILDER_RUST_IMAGE
  variables:
    CARGO_REGISTRIES_KELLNR_TOKEN: "${KELLNR_TOKEN}"
    CARGO_REGISTRIES_KELLNR_INDEX: "sparse+http://192.168.2.12:16444/api/v1/crates/"
    SDK_VERSION: "${CI_COMMIT_TAG#v}"
  script:
    - node scripts/publish-libs.js "${SDK_VERSION}" --registry kellnr
    - node scripts/publish-rust-sdks.js "${SDK_VERSION}" --registry kellnr
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  environment:
    name: kellnr-releases

# ─── Docker images with version tag ───
# tag 触发时按版本号（如 1.3.0）构建并 push 全部 9 个服务 + frontend
# 到 zhcoder-docker-registry.com:8000/micro-server/<svc>:<ver> + :latest。
# 用 scripts/build-docker.js（与本地 build 命令一致），pushMode=push 不留本地。
build_images:tagged:
  stage: publish
  tags: [shell]
  # [shell] runner 没有 node_modules，需 npm ci
  before_script:
    - npm ci --silent --no-audit --no-fund
    # .npmrc 与 infrastructure/vendor/ 由 setup-wizard 生成且 gitignore，CI checkout 后缺失。
    # 重建根 .npmrc（build-docker.js 会自动复制到 frontend/），让 Docker build 里
    # frontend 的 pnpm install 走内网 npm 镜像，避免外网 npmjs.org 慢速超时。
    # 用 IP 直连而非 ${CODER_NPM_REGISTRY}（域名 npm.kudi.repos）：buildx 容器内该
    # 域名 DNS 解析失败（ENOTFOUND，pipeline 6307 实证），IP 直连不受 DNS 影响。
    - |
      echo "registry=http://192.168.2.12:14873" > .npmrc
      echo "strict-ssl=false" >> .npmrc
      if [ -n "$CODER_NPM_TOKEN" ]; then
        echo "//192.168.2.12:14873/:_authToken=${CODER_NPM_TOKEN}" >> .npmrc
      fi
    # 下载 swagger-ui zip 到 infrastructure/vendor/（prue_backend Dockerfile COPY 依赖）
    - node scripts/download-swagger-ui.js
    - 'if [ -n "$DOCKER_REGISTRY_USER" ]; then sudo -E docker login zhcoder-docker-registry.com:8000 -u "$DOCKER_REGISTRY_USER" -p "$DOCKER_REGISTRY_PASSWORD" >/dev/null 2>&1; fi'
    # buildkit 跑在 docker-container driver 的独立容器里，registry 协议决策独立于 host daemon 的
    # /etc/docker/daemon.json。把内网 HTTP registry 显式标记 http = true，否则 buildkit 默认 HTTPS
    # → 撞内网明文 registry 会报 'http: server gave HTTP response to HTTPS client'
    #（pipeline 23541 实证：FROM ${BASE_REGISTRY}/mysql:8.0 metadata HEAD 失败）。
    - |
      echo '[registry."zhcoder-docker-registry.com:8000"]' > /tmp/buildkitd.toml
      echo '  http = true' >> /tmp/buildkitd.toml
  script:
    - export VERSION="${CI_COMMIT_TAG#v}"
    - echo "=== build_images:tagged — VERSION=${VERSION} ==="
    # 先 rm：避免上一次 runner 残留的 xbuilder 持旧 config（--config 只在 create 时生效，update 子命令不存在）。
    # --config 注入 buildkitd 协议白名单，让 buildkit 把 zhcoder-docker-registry.com:8000 当 HTTP 走。
    - sudo docker buildx rm xbuilder 2>/dev/null || true
    - sudo docker buildx create --name xbuilder --driver docker-container --config /tmp/buildkitd.toml --use
    - sudo docker buildx inspect --bootstrap
    # sudo -E：gitlab-runner user 不在 docker group，sudoers 配了 NOPASSWD: ALL
    - sudo -E node scripts/build-docker.js -v "${VERSION}" --push
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  environment:
    name: image-releases

# ─── npm package (@digua/dist-tools) ───
# 把 release/dist-tools 包发到内网 npm registry（http://npm.kudi.repos/）。
# 凭证由 NPM_TOKEN CI Variable 注入；目标 registry 在 dist-tools/package.json 的
# publishConfig.registry 已写好。
publish_npm:
  stage: publish
  tags: [docker]
  image: $BASE_REGISTRY/node:20
  variables:
    NPM_REGISTRY_HOST: "${NPM_REGISTRY_HOST:-npm.kudi.repos}"
    DIST_TOOLS_VERSION: "${CI_COMMIT_TAG#v}"
  before_script:
    - 'echo "//${NPM_REGISTRY_HOST}/:_authToken=${NPM_TOKEN}" > ~/.npmrc'
    - npm config set registry "http://${NPM_REGISTRY_HOST}"
  script:
    - cd release/dist-tools
    - npm version "${DIST_TOOLS_VERSION}" --no-git-tag-version --allow-same-version
    - npm publish --access public
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  environment:
    name: npm-releases

# ─────────────────────────────────────────────────────────────────────────────
# Release stage — 打包离线分发包（仅 tag 触发）
# 输出：release/coder-micro-services-${VERSION}/
#       release/coder-micro-services-${VERSION}-airgap.tar.gz
# 依赖：上面的 publish stage 全部成功（4 个 job 跑完 = sdk + rust + images + npm 都完成）
# ─────────────────────────────────────────────────────────────────────────────
release:dist:
  stage: release
  tags: [shell]
  needs:
    - sdk_publish
    - rust_publish
    - build_images:tagged
    - publish_npm
  script:
    - export VERSION="${CI_COMMIT_TAG#v}"
    - echo "=== release:dist — VERSION=${VERSION} ==="
    - cd release/dist-template
    # 生成 dist 包（不重新拉镜像：前面 build_images:tagged 已经按版本号推完了）
    - node scripts/release.js "${VERSION}" --no-images
    - 'echo "[release:dist] 离线分发包已就绪（不含镜像，由 build_images:tagged 单独推送）"'
    - ls -la release/dist-template/
  artifacts:
    name: "dist-${CI_COMMIT_TAG}"
    paths:
      - release/dist-template/
    expire_in: 7 days
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  environment:
    name: dist-releases

# ─────────────────────────────────────────────────────────────────────────────
# Security audit — 每周 scheduled pipeline + 手动触发
# ─────────────────────────────────────────────────────────────────────────────
cargo_audit:
  stage: test
  tags: [docker]
  image: $BUILDER_RUST_IMAGE
  before_script:
    - export RUSTUP_DIST_SERVER=http://crates.kudi.repos
    - export RUSTUP_UPDATE_ROOT=http://crates.kudi.reposrustup
    # BUILDER_RUST_IMAGE 是 Rust builder，没有 git；但下面要用 `git config --global`
    # 改写 GitHub URL（配合 .cargo/config.toml 的 git-fetch-with-cli=true，让
    # cargo-audit 拉 RustSec/advisory-db 走 gh-proxy）。
    - apt-get update && apt-get install -y --no-install-recommends git ca-certificates
    # 国内无法直连 github.com：把 GitHub 拉取改写到 gh-proxy（AGENTS.md「网络规则」）。
    # 配合 .cargo/config.toml 的 `git-fetch-with-cli = true`，cargo-audit 拉
    # RustSec/advisory-db 时会经此重写走 gh-proxy。
    - git config --global url."https://gh-proxy.org/https://github.com/".insteadOf "https://github.com/"
    - cargo install cargo-audit --locked
  script:
    - cargo audit 2>&1 | tee cargo-audit.log
  # RUSTSEC advisories are reported as vulnerabilities and the job is set
  # allow_failure=true: known transitive CVE backlog (event-listener 5.4.1,
  # hyper 0.12.36, spin 0.9.8, lock_api, memoffset, etc.) is owned by ops
  # to triage. Lint-style gate runs without blocking pipeline.
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: on_success
    - when: manual
      allow_failure: true
  allow_failure: true
  artifacts:
    when: always
    name: "cargo-audit-$CI_COMMIT_SHORT_SHA"
    paths:
      - cargo-audit.log
    expire_in: 1 day

cargo_deny:
  stage: test
  tags: [docker]
  image: $BUILDER_RUST_IMAGE
  before_script:
    - export RUSTUP_DIST_SERVER=http://crates.kudi.repos
    - export RUSTUP_UPDATE_ROOT=http://crates.kudi.reposrustup
    # 同 cargo_audit：BUILDER_RUST_IMAGE 没有 git，要先装好才能用 `git config --global`。
    - apt-get update && apt-get install -y --no-install-recommends git ca-certificates
    # 同 cargo_audit：国内无法直连 github.com，改写 GitHub 拉取走 gh-proxy。
    - git config --global url."https://gh-proxy.org/https://github.com/".insteadOf "https://github.com/"
    - cargo install cargo-deny --locked
  script:
    - set -o pipefail && cargo deny check 2>&1 | tee cargo-deny.log
  # deny.toml 已在 commit 746600d 迁移到 cargo-deny 0.20.x schema，本地 `cargo deny check`
  # 全绿（advisories/bans/licenses/sources 均 ok），门禁恢复阻断。
  # 注意：cargo_audit 仍 allow_failure=true（RustSec advisory-db 依赖 gh-proxy 联网拉取，
  # 网络抖动会误挂）；cargo_deny 用本地 Cargo.lock + 打包进镜像的离线 db，无此问题。
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: on_success
    - when: manual
      allow_failure: true
  allow_failure: false
  artifacts:
    when: always
    name: "cargo-deny-$CI_COMMIT_SHORT_SHA"
    paths:
      - cargo-deny.log
    expire_in: 1 day


# ─── perf baseline ──────────────────────────────────────────────────────
# 在 staging 部署 + e2e 跑通后，采集 k6 baseline 存档 90 天。
# Perf diff 工作流见 docs-site/perf-baseline.md §10。
k6_baseline:
  stage: perf
  tags: [docker]
  image: grafana/k6:0.57.0
  resource_group: perf
  # e2e:staging 只在 main 分支跑；非 main 分支 manual 触发时该 job 不存在
  # optional: true 让 needs 不强依赖；staging 不存在时 SSH 隧道会失败
  # 但 allow_failure: true 保证不阻断 pipeline
  needs:
    - job: e2e:staging
      artifacts: false
      optional: true
  variables:
    BASE_URL: $STAGING_BASE_URL
  before_script:
    - 'which ssh || (apt-get update && apt-get install -y --no-install-recommends openssh-client)'
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - '[[ -n "$SSH_PRIVATE_KEY" ]] || { echo "SSH_PRIVATE_KEY required for k6_baseline"; exit 1; }'
    - printf "%s\n" "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
    - ssh-keyscan -H -p "$STAGING_SSH_PORT" "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
    # 反向隧道把 staging 端口拉到 runner 本地（与 e2e:staging 一致）
    - ssh -i ~/.ssh/deploy_key -p "$STAGING_SSH_PORT" -o StrictHostKeyChecking=accept-new -N -f
        -R 3000:localhost:3000 -R 8080:localhost:8080
        "$STAGING_DEPLOY_USER@$STAGING_HOST"
    # k6 镜像内 Node 不一定可用，shell 循环跑即可
  script:
    - mkdir -p /tmp/perf-data
    - |
      DATE=$(date +%Y%m%d)
      cd /home/kudi/coder-micro-services
      for f in tests/load/s{2..7}-*.js; do
        name=$(basename "$f" .js)
        echo "=== running $name ==="
        k6 run --quiet --summary-export "/tmp/perf-data/main-${name}-${DATE}.json" "$f" || true
      done
    - ls -la /tmp/perf-data/
  artifacts:
    when: always
    paths:
      - /tmp/perf-data/
    expire_in: 90 days
    name: k6-baseline-$CI_COMMIT_SHORT_SHA
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true
    - when: manual
      allow_failure: true


