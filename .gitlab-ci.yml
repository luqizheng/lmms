stages:
  - test
  - build
  - deploy
  - publish
  - release

variables:
  DOCKER_REGISTRY: zhcoder-docker-registry.com:8000
  DOCKER_REPO: micro-server
  BASE_REGISTRY: zhcoder-docker-registry.com:8000/official
  # ── 以下 3 个变量在 GitLab Project → Settings → CI/CD → Variables
  #    设 masked + protected。此处只声明引用，不包含实际值。
  DEPLOY_SERVER: "${DEPLOY_SERVER}"
  DEPLOY_USER: "${DEPLOY_USER}"
  DEPLOY_PASSWORD: "${DEPLOY_PASSWORD}"
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  MAVEN_REPO_URL: http://mvn.kudi.repos/repository/maven-releases/
  NUGET_REPO_URL: http://nuget.kudi.repos/v3/index.json
  E2E_BASE_URL: http://localhost:3000
  E2E_DB_HOST: localhost
  E2E_DB_USER: root
  # E2E_DB_PASSWORD 通过 GitLab CI/CD Variables 注入（type: env_var, masked）
  E2E_DB_NAME: superpowers

rust_test:
  stage: test
  tags:
    - docker
  image: $BASE_REGISTRY/rust:1.96-slim
  variables:
    REDIS_URL: redis://192.168.2.130:6379
  before_script:
    - export RUSTUP_DIST_SERVER=http://crates.kudi.repos
    - export RUSTUP_UPDATE_ROOT=http://crates.kudi.reposrustup
    - apt-get update && apt-get install -y pkg-config libssl-dev
  script:
    - cargo test --workspace --lib --verbose

service_standard_check:
  stage: test
  tags: [docker]
  image: $BASE_REGISTRY/node:20
  script:
    - node scripts/check-service-standard.js

spec_check:
  stage: test
  tags: [docker]
  image: $BASE_REGISTRY/node:20
  before_script:
    - npm config set registry https://registry.npmmirror.com/
    - npm install --prefix /tmp/deps js-yaml@^5.2.1
  script:
    - NODE_PATH=/tmp/deps/node_modules node scripts/check-spec.js

contracts_check:
  stage: test
  tags: [docker]
  image: $BASE_REGISTRY/node:20
  before_script:
    - npm config set registry https://registry.npmmirror.com/
    - npm install --prefix /tmp/deps js-yaml@^5.2.1
  script:
    - NODE_PATH=/tmp/deps/node_modules node scripts/contracts-gen.js --check

spec_generate:
  stage: test
  tags: [docker]
  image: $BASE_REGISTRY/rust:1.96-slim
  before_script:
    - export RUSTUP_DIST_SERVER=http://crates.kudi.repos
    - export RUSTUP_UPDATE_ROOT=http://crates.kudi.reposrustup
    - apt-get update && apt-get install -y pkg-config libssl-dev
  script:
    - chmod +x scripts/dump-openapi-specs.sh
    - scripts/dump-openapi-specs.sh
    - git diff --exit-code -- 'services/*/openapi.yaml'
  dependencies:
    - spec_check

doc_links_check:
  stage: test
  tags: [docker]
  image: $BASE_REGISTRY/node:20
  script:
    - node scripts/check-doc-links.js

java_sdk_drift_check:
  stage: test
  tags: [docker]
  image: $BASE_REGISTRY/node:20
  script:
    - node scripts/check-java-sdk-drift.js
  rules:
    - changes:
        - sdk/java/**/*
        - services/*/openapi.yaml
      when: on_success
    - when: never

cargo_clippy:
  stage: test
  tags: [docker]
  image: $BASE_REGISTRY/rust:1.96-slim
  variables:
    REDIS_URL: redis://192.168.2.130:6379
  before_script:
    - export RUSTUP_DIST_SERVER=http://crates.kudi.repos
    - export RUSTUP_UPDATE_ROOT=http://crates.kudi.reposrustup
    - apt-get update && apt-get install -y pkg-config libssl-dev
  script:
    - cargo clippy --workspace --all-targets -- -D warnings
  allow_failure: false

cargo_fmt_check:
  stage: test
  tags: [docker]
  image: $BASE_REGISTRY/rust:1.96-slim
  before_script:
    - export RUSTUP_DIST_SERVER=http://crates.kudi.repos
    - export RUSTUP_UPDATE_ROOT=http://crates.kudi.reposrustup
  script:
    - cargo fmt --check
  allow_failure: false

e2e_api_test:
  stage: test
  tags: [docker]
  image: $BASE_REGISTRY/node:20
  before_script:
    - npm install -g pnpm
    - pnpm -C tests/e2e install
  script:
    - pnpm -C tests/e2e run test:api

e2e_ui_test:
  stage: test
  tags: [shell]
  image: mcr.microsoft.com/playwright:v1.48.0-jammy
  before_script:
    - npm install -g pnpm
    - pnpm -C tests/e2e install
    - pnpm -C tests/e2e exec playwright install chromium
  script:
    - pnpm -C tests/e2e run test:ui

e2e_migration_state_test:
  stage: test
  tags: [docker]
  image: $BASE_REGISTRY/node:20
  before_script:
    - npm install -g pnpm
    - pnpm -C tests/e2e install
  script:
    - docker compose -f infrastructure/docker-compose.yml up -d
    - |
      for i in $(seq 1 24); do
        ready=$(docker compose -f infrastructure/docker-compose.yml ps --format json 2>/dev/null | \
          node -e "const d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const r=JSON.parse('['+d.trim().split('\n').join(',')+']');const u=r.filter(s=>/^u/.test(s.Health));console.log(u.length===0?'ok':'not_ready');})" 2>/dev/null || echo "not_ready")
        [ "$ready" = "ok" ] && break
        sleep 5
      done
    - |
      IAM_BOOTSTRAP_TOKEN="${IAM_DEV_BT}" \
      NTF_BOOTSTRAP_TOKEN="${NOTIFICATION_DEV_BT}" \
      TOKEN_BOOTSTRAP_TOKEN="${TOKEN_DEV_BT}" \
      AUDIT_BOOTSTRAP_TOKEN="${AUDIT_DEV_BT}" \
      CONFIG_BOOTSTRAP_TOKEN="${CONFIG_DEV_BT}" \
      FILE_BOOTSTRAP_TOKEN="${FILE_DEV_BT}" \
      PRUE_BOOTSTRAP_TOKEN="${PRUE_DEV_BT}" \
      node scripts/e2e-migration-state.js
  variables:
    IAM_DEV_BT: "${IAM_DEV_BT}"
    NOTIFICATION_DEV_BT: "${NOTIFICATION_DEV_BT}"
    TOKEN_DEV_BT: "${TOKEN_DEV_BT}"
    AUDIT_DEV_BT: "${AUDIT_DEV_BT}"
    CONFIG_DEV_BT: "${CONFIG_DEV_BT}"
    FILE_DEV_BT: "${FILE_DEV_BT}"
    PRUE_DEV_BT: "${PRUE_DEV_BT}"
  allow_failure: false

# ── Build caching ──
# Docker build / cache 配置均在各服务的 Dockerfile 中（dependencies → builder → runner），
# 不同阶段由 .dockerignore / Dockerfile 的层缓存控制。多服务共享 builder 基础镜像，
# 因此 build stage 中所有 .rust_svc_build 的 Dockerfile 内层缓存依赖 $BASE_REGISTRY/rust:1.96-slim。
# 实际构建时 Docker BuildKit 层缓存落在 docker 宿主端，GitLab CI 不做额外缓存卷挂载。

frontend_lint:
  stage: test
  tags: [docker]
  image: $BASE_REGISTRY/node:20
  before_script:
    - npm install -g pnpm
    - pnpm -C frontend install --no-frozen-lockfile
  script:
    - pnpm -C frontend run lint:eslint
  rules:
    - changes:
        - frontend/**/*
      when: on_success
    - when: never
  allow_failure: true

# ── Build anchor: 复用 docker build + push 模式 ──
.svc_build:
  stage: build
  tags: [shell]
  script:
    - sudo docker build -f "$SVC_DOCKERFILE" -t "$DOCKER_REGISTRY/$DOCKER_REPO/$SVC_NAME:$IMAGE_TAG" .
    - sudo docker push "$DOCKER_REGISTRY/$DOCKER_REPO/$SVC_NAME:$IMAGE_TAG"
    - sudo docker tag "$DOCKER_REGISTRY/$DOCKER_REPO/$SVC_NAME:$IMAGE_TAG" "$DOCKER_REGISTRY/$DOCKER_REPO/$SVC_NAME:latest"
    - sudo docker push "$DOCKER_REGISTRY/$DOCKER_REPO/$SVC_NAME:latest"

# ── Rust 服务 build helper ──
.rust_svc_build:
  extends: .svc_build
  variables:
    SVC_DOCKERFILE: "services/${SVC_NAME}/Dockerfile"
  rules:
    - changes:
        - "services/${SVC_NAME}/**/*"
        - "libs/**/*"
        - "Cargo.toml"
        - "Cargo.lock"
      when: on_success
    - when: never

# ── 9 个服务 build job ──
build_api-gateway:
  extends: .rust_svc_build
  variables:
    SVC_NAME: "api-gateway"

build_token-service:
  extends: .rust_svc_build
  variables:
    SVC_NAME: "token-service"

build_iam-service:
  extends: .rust_svc_build
  variables:
    SVC_NAME: "iam-service"

build_notification-service:
  extends: .rust_svc_build
  variables:
    SVC_NAME: "notification-service"

build_audit-service:
  extends: .rust_svc_build
  variables:
    SVC_NAME: "audit-service"

build_config-service:
  extends: .rust_svc_build
  variables:
    SVC_NAME: "config-service"

build_file-service:
  extends: .rust_svc_build
  variables:
    SVC_NAME: "file-service"

build_prue_backend:
  extends: .rust_svc_build
  variables:
    SVC_NAME: "prue_backend"

build_frontend:
  stage: build
  tags: [shell]
  variables:
    SVC_NAME: "frontend"
  script:
    - sudo docker build -f frontend/Dockerfile -t "$DOCKER_REGISTRY/$DOCKER_REPO/frontend:$IMAGE_TAG" frontend/
    - sudo docker push "$DOCKER_REGISTRY/$DOCKER_REPO/frontend:$IMAGE_TAG"
    - sudo docker tag "$DOCKER_REGISTRY/$DOCKER_REPO/frontend:$IMAGE_TAG" "$DOCKER_REGISTRY/$DOCKER_REPO/frontend:latest"
    - sudo docker push "$DOCKER_REGISTRY/$DOCKER_REPO/frontend:latest"
  rules:
    - changes:
        - "frontend/**/*"
      when: on_success
    - when: never

# ─────────── 滚动更新 deploy ───────────
# 按服务逐个重启，基础设施（mysql/redis/consul/rabbitmq）全程不 down。
# 每个服务启动后等待 /health 通过再走下一个。
#
# 更新顺序：先更新基础设施依赖（config/token），再更新业务服务（iam/...），
# outbox publisher 和 frontend 最后更新。
deploy:
  stage: deploy
  tags: [micro-service-runner]
  before_script:
    - mkdir -p ~/coder-micro-services
  script:
    # 1. 同步代码
    - rm -rf ~/coder-micro-services
    - cp -r . ~/coder-micro-services
    - rm -rf ~/coder-micro-services/.git
    - cd ~/coder-micro-services

    # 2. 拉取最新镜像（所有服务）
    - sudo /bin/docker-compose -f infrastructure/docker-compose.yml pull

    # 3. 逐服务滚动重启 + healthcheck 门禁
    #    定义更新顺序（基础设施不动，只重启业务服务）
    - |
      for svc in \
        config-service file-service \
        token-service iam-service iam-outbox-publisher \
        notification-service notification-outbox-publisher \
        audit-service prue_backend \
        api-gateway frontend; \
      do
        echo "=== Rolling: $svc ==="
        sudo /bin/docker-compose -f infrastructure/docker-compose.yml up -d --no-deps "$svc"

        # 健康检查门禁（最长等 60s）
        ok=0
        for i in $(seq 1 12); do
          sleep 5
          # 取容器的健康状态
          health=$(sudo /bin/docker inspect --format='{{.State.Health.Status}}' "$svc" 2>/dev/null || echo "starting")
          echo "  $svc health: $health (attempt $i/12)"
          if [ "$health" = "healthy" ]; then
            ok=1
            break
          fi
          # 没有 HEALTHCHECK 的服务（如 outbox-publisher），等启动后用端口连通性代替
          if [ "$health" = "none" ]; then
            # 给 10s 启动窗口
            sleep 10
            ok=1
            break
          fi
        done
        if [ "$ok" -eq 0 ]; then
          echo "!!! $svc 未通过健康检查，中止部署"
          exit 1
        fi
      done

    # 4. 清理旧镜像
    - sudo /bin/docker image prune -f || true
  only:
    - main

java_sdk_test:
  stage: test
  tags: [docker]
  image: $BASE_REGISTRY/maven:3.9-eclipse-temurin-21
  script:
    - cd sdk/java && mvn -B verify
  rules:
    - changes:
        - sdk/java/**

sdk_publish:
  stage: publish
  tags: [docker]
  image: $BASE_REGISTRY/maven:3.9-eclipse-temurin-21
  script:
    - cd sdk/java && mvn -B deploy -DskipTests
      -DaltDeploymentRepository=kudi-maven::default::${MAVEN_REPO_URL}
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  environment:
    name: maven-releases

# Rust libs/* + sdk/rust/* 发布到私有 kellnr registry (http://192.168.2.12:16444)
# libs/ 17 个 crate（common-error / common-db / common-jwt / authz 等）按拓扑顺序发布
# sdk/rust/ 7 个 crate（kudi-http-client + 6 个 service SDK）按依赖顺序发布
# 发布顺序由各自脚本内部处理（path 依赖临时替换为 version 依赖，发布完恢复）
rust_publish:
  stage: publish
  tags: [docker]
  image: $BASE_REGISTRY/rust:1.96-slim
  variables:
    CARGO_REGISTRIES_KELLNR_TOKEN: "${KELLNR_TOKEN}"
    CARGO_REGISTRIES_KELLNR_INDEX: "sparse+http://192.168.2.12:16444/api/v1/crates/"
  before_script:
    - export RUSTUP_DIST_SERVER=http://crates.kudi.repos
    - export RUSTUP_UPDATE_ROOT=http://crates.kudi.reposrustup
    - apt-get update && apt-get install -y pkg-config libssl-dev
  script:
    - chmod +x libs/scripts/publish-libs.sh sdk/scripts/publish-rust-sdks.sh
    - bash libs/scripts/publish-libs.sh --registry kellnr
    - bash sdk/scripts/publish-rust-sdks.sh --registry kellnr
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  environment:
    name: kellnr-releases

# ─────────────────────────────────────────────────────────────────────────────
# Release stage — 打包离线分发包（仅 tag 触发）
# 输出：release/coder-micro-services-${VERSION}/
#       release/coder-micro-services-${VERSION}-airgap.tar.gz
# ─────────────────────────────────────────────────────────────────────────────
release:dist:
  stage: release
  tags: [docker]
  image: $BASE_REGISTRY/docker:24-cli
  variables:
    DOCKER_HOST: tcp://localhost:2376
    DOCKER_TLS_CERTDIR: /certs
  before_script:
    - docker info
  script:
    - echo "=== release:dist job ==="
    - echo "VERSION=${CI_COMMIT_TAG#v}"
    - cd release/dist-template
    - chmod +x bin/*.sh scripts/release.sh
    # 构建前端镜像（作为当前版本镜像）
    - bash bin/build-frontend.sh
    # 打包 release 脚本放在 dist-template/scripts/release.sh，
    # 实际 release 由运维在有网环境执行
    - 'echo "[release:dist] 离线分发包已就绪: release/dist-template/"'
    - ls -la release/dist-template/
  artifacts:
    paths:
      - release/dist-template/
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

# ─────────────────────────────────────────────────────────────────────────────
# Security audit — 每周 scheduled pipeline + 手动触发
# ─────────────────────────────────────────────────────────────────────────────
cargo_audit:
  stage: test
  tags: [docker]
  image: $BASE_REGISTRY/rust:1.96-slim
  before_script:
    - export RUSTUP_DIST_SERVER=http://crates.kudi.repos
    - export RUSTUP_UPDATE_ROOT=http://crates.kudi.reposrustup
    - apt-get update && apt-get install -y pkg-config libssl-dev
    - cargo install cargo-audit --locked
  script:
    - cargo audit
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: on_success
    - when: manual
      allow_failure: true

cargo_deny:
  stage: test
  tags: [docker]
  image: $BASE_REGISTRY/rust:1.96-slim
  before_script:
    - export RUSTUP_DIST_SERVER=http://crates.kudi.repos
    - export RUSTUP_UPDATE_ROOT=http://crates.kudi.reposrustup
    - apt-get update && apt-get install -y pkg-config libssl-dev
    - cargo install cargo-deny --locked
  script:
    - cargo deny check
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: on_success
    - when: manual
      allow_failure: true
