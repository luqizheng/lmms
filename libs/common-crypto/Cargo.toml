[package]
name = "digua_common_crypto"
version = "1.6.0"
license = "Apache-2.0"
description = "Crypto utilities (Argon2 password hashing, AES-256-GCM encryption) for KudiCoder services"
edition = "2021"

[dependencies]
argon2 = { workspace = true, features = ["std", "password-hash"] }
rand.workspace = true
aes-gcm = { workspace = true }
rsa = { version = "0.9", features = ["sha2"] }
sha2.workspace = true
hmac = "0.12"
blake3 = "1.5"
hex = "0.4"
digua_common_error = { path = "../common-error", version = "1.6.0" }
async-trait.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }