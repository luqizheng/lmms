[package]
name = "digua_common_telemetry"
version = "0.1.0"
license = "Apache-2.0"
description = "OpenTelemetry tracing setup for KudiCoder services"
edition = "2021"

[dependencies]
tracing.workspace = true
tracing-subscriber.workspace = true

# OpenTelemetry — opt-in, only enabled when otlp feature is on.
# The axum HTTP middleware lives in the separate `digua_common-telemetry-axum`
# crate so that CLI binaries (outbox-publisher etc.) can depend on
# `digua_common-telemetry` alone without pulling in axum/hyper/tower.
opentelemetry = { version = "0.24", optional = true }
opentelemetry-otlp = { version = "0.17", optional = true, default-features = false, features = ["grpc-tonic", "trace"] }
opentelemetry_sdk = { version = "0.24", optional = true, features = ["rt-tokio"] }
tracing-opentelemetry = { version = "0.25", optional = true }

[features]
default = []
otlp = ["dep:opentelemetry", "dep:opentelemetry-otlp", "dep:opentelemetry_sdk", "dep:tracing-opentelemetry"]

[dev-dependencies]
# Testing TracerProvider in unit tests needs the `testing` feature flag.
opentelemetry = { version = "0.24", features = ["trace"] }
opentelemetry_sdk = { version = "0.24", features = ["rt-tokio", "testing"] }
tracing-opentelemetry = "0.25"
