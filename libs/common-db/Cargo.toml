[package]
name = "digua_common_db"
version = "1.0.0"
license = "Apache-2.0"
description = "Multi-dialect sqlx wrapper (MySQL/SQLite/Dameng/MSSQL) with test fixtures for KudiCoder services"
edition = "2021"

[features]
default = ["sqlite"]
mysql = ["sqlx/mysql"]
dameng = ["sqlx/mysql"]
sqlite = ["sqlx/sqlite"]
test-kit = ["sqlite", "dep:tempfile"]
openapi = ["dep:utoipa"]

[dependencies]
sqlx = { workspace = true, features = ["macros", "chrono", "tls-rustls"] }
tokio = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
digua_common_error = { path = "../common-error" }
digua_jwt_ctx = { path = "../jwt-ctx" }
async-trait.workspace = true
tempfile = { workspace = true, optional = true }
utoipa = { version = "5", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }