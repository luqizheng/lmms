[package]
name = "digua_common_cache"
version = "1.8.2"
license = "Apache-2.0"
description = "Cache abstraction with Memory (Moka) and Redis backends for KudiCoder services"
edition = "2021"

[features]
default = ["memory"]
memory = []
redis = ["dep:redis"]

[dependencies]
async-trait.workspace = true
moka = { workspace = true }
digua_common_error = { path = "../common-error", version = "1.8.2" }
redis = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }