[package]
name = "digua_common"
version = "1.6.0"
license = "Apache-2.0"
description = "Facade crate re-exporting digua_common-error/digua_common-db/digua_common-crypto for KudiCoder services"
edition = "2021"

[features]
default = ["mysql"]
mysql = ["sqlx/mysql", "digua_common_db/mysql"]
postgres = ["sqlx/postgres", "digua_common_db/postgres"]
sqlite = ["sqlx/sqlite", "digua_common_db/sqlite"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
argon2.workspace = true
anyhow = "1"
sqlx = { workspace = true }
redis.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["sync"] }

digua_common_error = { path = "../common-error", version = "1.6.0" }
digua_common_db = { path = "../common-db", version = "1.6.0" }
digua_common_crypto = { path = "../common-crypto", version = "1.6.0" }
