[package]
name = "digua_common"
version = "1.1.0"
license = "Apache-2.0"
description = "Facade crate re-exporting digua_common-error/digua_common-db/digua_common-crypto for KudiCoder services"
edition = "2021"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
argon2.workspace = true
anyhow = "1"
sqlx = { workspace = true, features = ["mysql"] }
redis.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["sync"] }

digua_common_error = { path = "../common-error" }
digua_common_db = { path = "../common-db", features = ["mysql"] }
digua_common_crypto = { path = "../common-crypto" }