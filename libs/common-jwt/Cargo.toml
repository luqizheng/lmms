[package]
name = "digua_common_jwt"
version = "1.8.1"
license = "Apache-2.0"
description = "JWT signing and verification utilities for KudiCoder services"
edition.workspace = true

[features]
# TLS 后端轴（见 sdk/rust/digua-http-client/Cargo.toml 的同款说明）：默认
# rustls；下游 native-tls 消费方用 default-features = false + ["tls-native"]。
default = ["tls-rustls"]
tls-rustls = ["reqwest/rustls-tls-webpki-roots"]
tls-native = ["reqwest/native-tls"]

[dependencies]
jsonwebtoken = { workspace = true }
# 不走 workspace 的 reqwest：workspace 版钉死 rustls 特征，只能加不能减，
# native-tls 消费方会被动拖进 aws-lc-sys（C 工具链）。
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
chrono = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
wiremock = "0.6"
jwt-simple = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
