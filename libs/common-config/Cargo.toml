[package]
name = "digua_common_config"
version = "1.6.0"
license = "Apache-2.0"
description = "Configuration loading from env and files for KudiCoder services"
edition = "2021"

[features]
default = []
consul = ["dep:reqwest", "dep:base64"]
config-service = ["dep:reqwest"]

[dependencies]
config.workspace = true
serde.workspace = true
serde_json.workspace = true
digua_common_error = { path = "../common-error" }
reqwest = { workspace = true, optional = true, default-features = false }
base64 = { workspace = true, optional = true }
tokio = { workspace = true }
tracing.workspace = true

[dev-dependencies]
wiremock = "0.6"
[[test]]
name = "provider_test"
required-features = ["config-service"]
