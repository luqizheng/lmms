[package]
name = "authz"
version = "0.1.0"
license = "Apache-2.0"
description = "RBAC authorization primitives and axum middleware for KudiCoder services"
edition = "2021"

[dependencies]
axum.workspace = true
jwt-ctx = { path = "../jwt-ctx" }
common-jwt = { path = "../common-jwt" }
tower = "0.5"
thiserror.workspace = true
futures = "0.3"
jwt-simple.workspace = true
base64.workspace = true
serde_json.workspace = true

[dev-dependencies]
tokio.workspace = true
tower = { version = "0.5", features = ["util"] }
common-jwt = { path = "../common-jwt" }
