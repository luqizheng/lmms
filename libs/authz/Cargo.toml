[package]
name = "digua_authz"
version = "1.8.3"
license = "Apache-2.0"
description = "RBAC authorization primitives and axum middleware for KudiCoder services"
edition = "2021"

[dependencies]
axum.workspace = true
digua_jwt_ctx = { path = "../jwt-ctx", version = "1.8.3" }
digua_common_jwt = { path = "../common-jwt", version = "1.8.3" }
tower = "0.5"
thiserror.workspace = true
futures = "0.3"
base64.workspace = true
serde_json.workspace = true

[dev-dependencies]
tokio.workspace = true
tower = { version = "0.5", features = ["util"] }
digua_common_jwt = { path = "../common-jwt", version = "1.8.3" }
