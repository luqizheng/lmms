[package]
name = "digua_common_http"
version = "0.1.0"
license = "Apache-2.0"
description = "Resilient reqwest HTTP client wrapper with request ID propagation for KudiCoder services"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-webpki-roots"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
digua_common_error = { path = "../common-error" }
dashmap = { workspace = true }
bytes = { workspace = true }
rand = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
axum = { workspace = true }
futures = "0.3"