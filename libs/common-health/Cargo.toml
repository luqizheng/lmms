[package]
name = "digua_common_health"
version = "1.0.0"
license = "Apache-2.0"
description = "Health check endpoint types for KudiCoder services"
edition = "2021"

[dependencies]
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
sqlx = { workspace = true, features = ["any", "runtime-tokio-rustls", "macros", "mysql", "sqlite"] }
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "aio", "connection-manager"] }
prometheus = "0.13"
tracing.workspace = true
once_cell = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
