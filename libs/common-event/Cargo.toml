[package]
name = "digua_common_event"
version = "0.1.0"
license = "Apache-2.0"
description = "Transactional outbox and event envelope types for KudiCoder services"
edition = "2021"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
lapin = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "macros", "json", "chrono", "uuid", "mysql"] }
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
prometheus = "0.13"
redis = { workspace = true }
opentelemetry = "0.24"
tracing-opentelemetry = "0.25"
digua_common_telemetry = { path = "../common-telemetry", default-features = false }

[dev-dependencies]
testcontainers = "0.20"
testcontainers-modules = { version = "0.8", features = ["rabbitmq", "mysql", "redis"] }