[package]
name = "digua_common_telemetry_axum"
version = "1.8.3"
license = "Apache-2.0"
description = "Axum middleware for OpenTelemetry tracing in KudiCoder services"
edition = "2021"

[dependencies]
axum.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rand = "0.8"

# OpenTelemetry — opt-in, only enabled when otlp feature is on.
# Mirrors the `otlp` feature on digua_common-telemetry: when a service enables
# `otlp` on both crates, the middleware reads from the real OTel span
# context. Without `otlp`, falls back to a random 128-bit hex id.
opentelemetry = { version = "0.24", optional = true }
opentelemetry_sdk = { version = "0.24", optional = true, features = ["rt-tokio"] }
tracing-opentelemetry = { version = "0.25", optional = true }
# 本 crate 代码不直接使用 opentelemetry-otlp（exporter 由 digua_common-telemetry
# 的 otlp feature 负责），故不再在此声明。
hex = { version = "0.4", optional = true }

[features]
default = []
otlp = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:tracing-opentelemetry"]

[dev-dependencies]
# Used by tests/access_log_trace_id.rs to spin up a minimal axum router
# and capture JSON log output via a custom MakeWriter.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
regex = "1"
