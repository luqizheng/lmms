[package]
name = "digua_file_sdk"
version = "1.6.0"
edition.workspace = true
description = "Rust client SDK for the KudiCoder file-service"
license = "Apache-2.0"

[dependencies]
digua_http_client = { path = "../digua-http-client" }
# multipart/bytes paths (upload_file / download_file) need reqwest directly:
# digua-http-client's transport is String-body only.
reqwest = { workspace = true, features = ["multipart"] }
serde.workspace = true
serde_json.workspace = true
chrono = { workspace = true }
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
wiremock = "0.6"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }