[package]
name = "digua_file_sdk"
version = "0.1.0"
edition.workspace = true
description = "Rust client SDK for the KudiCoder file-service"
license = "Apache-2.0"

[dependencies]
digua_http_client = { path = "../kudi-http-client" }
serde.workspace = true
serde_json.workspace = true
chrono = { workspace = true }
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
wiremock = "0.6"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }