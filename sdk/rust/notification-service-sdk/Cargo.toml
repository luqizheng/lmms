[package]
name = "digua_notification_sdk"
version = "1.8.1"
edition.workspace = true
description = "Rust client SDK for the KudiCoder notification-service"
license = "Apache-2.0"

[dependencies]
digua_http_client = { path = "../digua-http-client", version = "1.8.1" }
serde.workspace = true
serde_json.workspace = true
chrono = { workspace = true }
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
wiremock = "0.6"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }