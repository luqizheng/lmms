[package]
name = "digua_http_client"
version = "1.8.2"
edition.workspace = true
description = "Shared HTTP client with token cache for KudiCoder Rust SDKs"
license = "Apache-2.0"

[features]
# TLS 后端做成可选轴：默认 rustls（本仓基线，reqwest 走 rustls-tls-webpki-roots）。
# 下游用 native-tls 的业务仓（下游仓 reqwest 钉 native-tls/schannel）关掉
# default features 后本 crate 零 rustls 依赖——否则 aws_lc_rs 会把 C 工具链
# （cmake + C 编译器）拖进下游的构建机与容器镜像。
default = ["tls-rustls"]
tls-rustls = ["reqwest/rustls-tls-webpki-roots", "dep:rustls"]
tls-native = ["reqwest/native-tls"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
# 不用 workspace 的 reqwest：workspace 版钉死了 rustls-tls-webpki-roots，而
# cargo 的依赖特征只能加不能减——native-tls 消费方会被动吃进 aws-lc-sys。
# 这里显式声明无 TLS 基座，由上面的 feature 轴决定后端。
reqwest = { version = "0.12", default-features = false, features = ["json"] }
thiserror.workspace = true
tracing.workspace = true
sha2 = "0.10"
hex = "0.4"
async-trait = "0.1"
# rustls crypto provider 只在 tls-rustls 轴开启时才存在（optional 依赖）
rustls = { workspace = true, optional = true }

[dev-dependencies]
wiremock = "0.6"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
