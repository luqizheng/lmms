# Pre-commit framework config for coder-micro-services
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks
        args: ["--verbose"]

  - repo: local
    hooks:
      - id: service-standard-check
        name: Service Standard Check
        entry: node scripts/check-service-standard.js
        language: node
        pass_filenames: false
        files: ^services/

      - id: spec-check
        name: Spec Check (openapi.yaml)
        entry: node scripts/check-spec.js
        language: node
        pass_filenames: false
        files: ^services/.*/openapi\.yaml$

      - id: contracts-check
        name: Contracts Drift Check
        entry: node scripts/contracts-gen.js --check
        language: node
        pass_filenames: false
        files: ^contracts/

      - id: openapi-drift-check
        name: OpenAPI Drift Check
        entry: bash -c 'scripts/dump-openapi-specs.sh && git diff --exit-code -- services/*/openapi.yaml'
        language: system
        pass_filenames: false
        files: ^services/.*(Cargo\.toml|src/routes/.*\.rs|src/openapi\.rs)$

      - id: doc-links-check
        name: Doc Links Check
        entry: node scripts/check-doc-links.js
        language: node
        pass_filenames: false

      - id: i18n-namespace-check
        name: i18n Namespace Check (menus.* ↔ menus:)
        entry: node scripts/check-i18n-namespace.js
        language: node
        pass_filenames: false
        files: ^(frontend/src/.*\.(vue|ts)|frontend/locales/.*\.yaml)$

      - id: cargo-clippy
        name: Cargo Clippy
        entry: bash -c 'cargo clippy --workspace --all-targets -- -D warnings'
        language: system
        pass_filenames: false
        files: \.rs$

      - id: cargo-fmt-check
        name: Cargo Format Check
        entry: bash -c 'cargo fmt --check'
        language: system
        pass_filenames: false
        files: \.rs$

      - id: cargo-deny
        name: Cargo Deny
        entry: bash -c 'cargo deny check'
        language: system
        pass_filenames: false
        files: ^Cargo\.(toml|lock)$